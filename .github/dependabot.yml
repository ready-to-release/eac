version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"

  # Go modules - go/r2r/cli
  - package-ecosystem: "gomod"
    directory: "/go/r2r/cli"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"

  # Go modules - go/eac/commands
  - package-ecosystem: "gomod"
    directory: "/go/eac/commands"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"

  # Go modules - go/eac/core
  - package-ecosystem: "gomod"
    directory: "/go/eac/core"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"

  # Go modules - go/eac/ai
  - package-ecosystem: "gomod"
    directory: "/go/eac/ai"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"

  # Go modules - go/eac/specs
  - package-ecosystem: "gomod"
    directory: "/go/eac/specs"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"

  # ext-eac is a Docker-based extension (no Go module to track)

  # Go modules - go/eac/mcp/commands
  - package-ecosystem: "gomod"
    directory: "/go/eac/mcp/commands"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"

  # Python - mkdocs container
  - package-ecosystem: "pip"
    directory: "/containers/mkdocs"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
