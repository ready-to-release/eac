version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"

  # Go modules - go/r2r/cli
  - package-ecosystem: "gomod"
    directory: "/go/r2r/cli"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"

  # Go modules - go/eac/commands
  - package-ecosystem: "gomod"
    directory: "/go/eac/commands"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"

  # Go modules - go/eac/core
  - package-ecosystem: "gomod"
    directory: "/go/eac/core"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"

  # Go modules - go/eac/specs
  - package-ecosystem: "gomod"
    directory: "/go/eac/specs"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"

  # ext-eac is a Docker-based extension (no Go module to track)

  # Go modules - go/eac/mcp/commands
  - package-ecosystem: "gomod"
    directory: "/go/eac/mcp/commands"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"

  # npm - VSCode extension
  - package-ecosystem: "npm"
    directory: "/typescript/vscode-ext-commit"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"

  # ============================================================================
  # Containers - Docker base images
  # ============================================================================

  # Docker - ext-eac container (golang base image)
  - package-ecosystem: "docker"
    directory: "/containers/ext-eac"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"

  # Docker - mkdocs-site container (python base image)
  - package-ecosystem: "docker"
    directory: "/containers/mkdocs-site"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"

  # Docker - mkdocs-pdf container (python base image)
  - package-ecosystem: "docker"
    directory: "/containers/mkdocs-pdf"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"

  # Docker - mermaid-cli container (node base image)
  - package-ecosystem: "docker"
    directory: "/containers/mermaid-cli"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"

  # npm - mermaid-cli container
  - package-ecosystem: "npm"
    directory: "/containers/mermaid-cli"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"

  # ============================================================================
  # Containers - Python dependencies (pip)
  # ============================================================================

  # Python - mkdocs-site container
  - package-ecosystem: "pip"
    directory: "/containers/mkdocs-site"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"

  # Python - mkdocs-pdf container
  - package-ecosystem: "pip"
    directory: "/containers/mkdocs-pdf"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
