version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"

  # Go modules - all workspace modules (consolidated)
  - package-ecosystem: "gomod"
    directories:
      - "/contracts/ai-provider/0.1.0"
      - "/contracts/clie/0.1.0"
      - "/contracts/container-runtime/0.1.0"
      - "/contracts/core/0.1.0"
      - "/contracts/docs/0.1.0"
      - "/contracts/runner/0.1.0"
      - "/contracts/scanner/0.1.0"
      - "/contracts/tui/0.1.0"
      - "/go/adapters/ai-test"
      - "/go/adapters/behave"
      - "/go/adapters/claude"
      - "/go/adapters/claude-cli"
      - "/go/adapters/cucumber"
      - "/go/adapters/docker"
      - "/go/adapters/dotnet"
      - "/go/adapters/eac"
      - "/go/adapters/gemini"
      - "/go/adapters/gh"
      - "/go/adapters/godog"
      - "/go/adapters/gotest"
      - "/go/adapters/mocha"
      - "/go/adapters/npm"
      - "/go/adapters/nuget"
      - "/go/adapters/openai"
      - "/go/adapters/pip"
      - "/go/adapters/pytest"
      - "/go/adapters/reqnroll"
      - "/go/adapters/tui"
      - "/go/cli/clie"
      - "/go/cli/eac"
      - "/go/clibase"
      - "/go/commands/base"
      - "/go/commands/build"
      - "/go/commands/deploy"
      - "/go/commands/lint"
      - "/go/commands/repository"
      - "/go/commands/scan"
      - "/go/commands/test"
      - "/go/commands/update"
      - "/go/core"
      - "/go/mcp/commands"
      - "/go/specs/repository"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
      all-go-deps:
        group-by: "dependency-name"

  # npm - containers/mermaid-oci
  - package-ecosystem: "npm"
    directory: "/containers/mermaid-oci"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"
  # npm - typescript/vscode-commit
  - package-ecosystem: "npm"
    directory: "/typescript/vscode-commit"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    groups:
      eslint-ecosystem:
        patterns:
          - "eslint"
          - "@typescript-eslint/*"

