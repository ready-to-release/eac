      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"

  # Docker - site-render-tool container (python base image)
  - package-ecosystem: "docker"
    directory: "/containers/site-render-tool"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"

  # Docker - pdf-tool container (python base image)
  - package-ecosystem: "docker"
    directory: "/containers/pdf-tool"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"

  # Docker - mermaid-tool container (node base image)
  - package-ecosystem: "docker"
    directory: "/containers/mermaid-tool"
