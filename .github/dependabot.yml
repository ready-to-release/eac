    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"

  # ============================================================================
  # Containers - Python dependencies (pip)
  # ============================================================================

  # Python - site-render-tool container
  - package-ecosystem: "pip"
    directory: "/containers/site-render-tool"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"

  # Python - pdf-tool container
  - package-ecosystem: "pip"
    directory: "/containers/pdf-tool"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
