# Approve Release Action
#
# Gates release workflows by validating:
# 1. CI has passed for the exact commit being released (strict mode)
# 2. Version is valid format (semver or calver)
# 3. No existing GitHub release for this version
# 4. Changelog has version entry (semver only)
#
# Usage:
#   jobs:
#     approve:
#       runs-on: ubuntu-latest
#       outputs:
#         version: ${{ steps.gate.outputs.version }}
#         tag_name: ${{ steps.gate.outputs.tag_name }}
#       steps:
#         - uses: actions/checkout@v6
#           with:
#             fetch-depth: 0
#         - uses: ./.github/actions/approve-release
#           id: gate
#           with:
#             module: r2r-cli
#             version-type: semver  # or calver for docs/books
#
#     release:
#       needs: approve
#       ...

name: Approve Release
description: Validate CI passed and release preconditions are met

inputs:
  module:
    description: 'Module name (e.g., r2r-cli, ext-eac, docs, books)'
    required: true
  version-type:
    description: 'Version format: semver (x.y.z) or calver (YYYY.MMDD.HHMM)'
    required: false
    default: 'semver'
  skip-ci-check:
    description: 'Skip CI verification (dangerous - for hotfixes only)'
    required: false
    default: 'false'
  timeout:
    description: 'Maximum time to wait for CI in seconds'
    required: false
    default: '300'

outputs:
  version:
    description: 'Validated version (e.g., 1.0.0)'
    value: ${{ steps.version.outputs.version }}
  tag_name:
    description: 'Full tag name (e.g., r2r-cli/1.0.0)'
    value: ${{ steps.version.outputs.tag_name }}
  ci_sha:
    description: 'SHA of the commit that passed CI (may differ from release commit if inherited)'
    value: ${{ steps.set_ci_sha.outputs.ci_sha || steps.ci_check_skip.outputs.ci_sha }}

runs:
  using: composite
  steps:
    - name: Setup Commands Binary
      id: commands
      uses: ./.github/actions/setup-commands

    - name: Extract and validate version
      id: version
      uses: ./.github/actions/extract-release-version
      with:
        module-prefix: ${{ inputs.module }}
        version-type: ${{ inputs.version-type }}
        commands-path: ${{ steps.commands.outputs.commands-path }}

    - name: Validate version format
      shell: bash
      env:
        VERSION_TYPE: ${{ inputs.version-type }}
      run: |
        if [ "${{ steps.version.outputs.is_valid }}" != "true" ]; then
          echo "::error::Invalid version format: ${{ steps.version.outputs.version }}"
          if [ "$VERSION_TYPE" = "calver" ]; then
            echo "Expected calver format: YYYY.MMDD.HHMM (e.g., 2025.1214.1630)"
          else
            echo "Expected semver format: x.y.z (e.g., 1.0.0)"
          fi
          exit 1
        fi
        echo "Version ${{ steps.version.outputs.version }} is valid $VERSION_TYPE"

    - name: Validate changelog has version entry
      if: inputs.version-type == 'semver'
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        COMMANDS="${{ steps.commands.outputs.commands-path }}"

        # Get the latest version from changelog
        CHANGELOG_VERSION=$($COMMANDS release get-version "$MODULE" 2>/dev/null || echo "")

        if [ -z "$CHANGELOG_VERSION" ]; then
          echo "::error::No changelog found for module $MODULE"
          echo ""
          echo "Create changelog at: release/$MODULE/CHANGELOG.md"
          exit 1
        fi

        if [ "$CHANGELOG_VERSION" != "$VERSION" ]; then
          echo "::error::Changelog not updated for version $VERSION"
          echo ""
          echo "Changelog shows: $CHANGELOG_VERSION"
          echo "Releasing:       $VERSION"
          echo ""
          echo "Run first: commands release this $MODULE"
          echo "This will update the changelog with version $VERSION"
          exit 1
        fi

        echo "Changelog verified: $VERSION"

    - name: Check for existing release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG_NAME="${{ steps.version.outputs.tag_name }}"

        if gh release view "$TAG_NAME" 2>/dev/null; then
          echo ""
          echo "::error::Release already exists for tag $TAG_NAME"
          echo ""
          echo "A GitHub release has already been created for this version."
          echo "To re-release:"
          echo "  1. Delete release: gh release delete $TAG_NAME"
          echo "  2. Delete tag: git push --delete origin $TAG_NAME"
          echo "  3. Re-run workflow"
          exit 1
        fi

        echo "No existing release for $TAG_NAME"

    - name: Wait for CI (strict mode)
      id: ci_check
      if: inputs.skip-ci-check != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        COMMANDS="${{ steps.commands.outputs.commands-path }}"
        MODULE="${{ inputs.module }}"
        COMMIT="${{ github.sha }}"
        TIMEOUT="${{ inputs.timeout }}"
        WORKFLOW="ci-${MODULE}.yaml"

        echo "Waiting for CI on exact commit ${COMMIT:0:7}..."
        echo ""

        # Verify CI passed for this commit (or inherit from previous if only changelog changed)
        # On success, may set INHERITED_CI_SHA in GITHUB_ENV for next step
        $COMMANDS release check-ci \
          --workflow "$WORKFLOW" \
          --commit "$COMMIT" \
          --timeout "$TIMEOUT" \
          --strict

    - name: Set CI SHA output
      id: set_ci_sha
      if: inputs.skip-ci-check != 'true'
      shell: bash
      run: |
        # Use inherited SHA if CI was inherited from previous run, otherwise current commit
        echo "ci_sha=${INHERITED_CI_SHA:-${{ github.sha }}}" >> $GITHUB_OUTPUT

    - name: Skip CI check warning
      id: ci_check_skip
      if: inputs.skip-ci-check == 'true'
      shell: bash
      run: |
        echo "::warning::CI check skipped - releasing without CI verification"
        echo ""
        echo "⚠️  DANGER: Releasing without CI verification"
        echo "   Module: ${{ inputs.module }}"
        echo "   Commit: ${{ github.sha }}"
        echo ""
        echo "   This should only be used for critical hotfixes."
        # When skipping CI, use current commit SHA
        echo "ci_sha=${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: Summary
      if: always()
      shell: bash
      env:
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
        RUN_ID: ${{ github.run_id }}
      run: |
        MODULE="${{ inputs.module }}"
        VERSION="${{ steps.version.outputs.version }}"
        TAG_NAME="${{ steps.version.outputs.tag_name }}"
        COMMIT="${{ github.sha }}"
        SKIP_CI="${{ inputs.skip-ci-check }}"
        VERSION_TYPE="${{ inputs.version-type }}"
        WORKFLOW="ci-${MODULE}.yaml"

        echo "## Release Approval: $MODULE" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Version | \`$VERSION\` ($VERSION_TYPE) |" >> $GITHUB_STEP_SUMMARY
        echo "| Tag | \`$TAG_NAME\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Commit | \`${COMMIT:0:7}\` |" >> $GITHUB_STEP_SUMMARY

        # Show success status only if job succeeded
        if [ "${{ job.status }}" != "failure" ]; then
          if [ "$VERSION_TYPE" = "semver" ]; then
            echo "| Changelog | :white_check_mark: Updated |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Changelog | :white_check_mark: N/A (calver) |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Existing Release | :white_check_mark: None |" >> $GITHUB_STEP_SUMMARY

          if [ "$SKIP_CI" = "true" ]; then
            echo "| CI Check | :warning: Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| CI Check | :white_check_mark: Passed (strict) |" >> $GITHUB_STEP_SUMMARY
          fi
        else
          # On failure, add diagnostic link
          echo "" >> $GITHUB_STEP_SUMMARY
          $COMMANDS pipeline ci summary-link $RUN_ID --type release --workflow "$WORKFLOW" --commit "$COMMIT" >> $GITHUB_STEP_SUMMARY
        fi
