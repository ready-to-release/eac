# Approve Release Action
#
# Gates release workflows by validating:
# 1. Release type is published or bundle (not internal)
# 2. CI has passed for the exact commit being released (strict mode)
# 3. Version is valid format (semver or calver)
# 4. No existing GitHub release for this version
# 5. Changelog has version entry (semver only)
#
# Usage:
#   jobs:
#     approve:
#       runs-on: ubuntu-latest
#       outputs:
#         version: ${{ steps.gate.outputs.version }}
#         tag_name: ${{ steps.gate.outputs.tag_name }}
#       steps:
#         - uses: actions/checkout@v6
#           with:
#             fetch-depth: 0
#         - uses: ./.github/actions/approve-release
#           id: gate
#           with:
#             module: clie-cli
#             version-type: semver  # or calver for docs/books
#
#     release:
#       needs: approve
#       ...

name: Approve Release
description: Validate CI passed and release preconditions are met

inputs:
  module:
    description: 'Module name (e.g., clie-cli, eac-ext, docs, books)'
    required: true
  version-type:
    description: 'Version format: semver (x.y.z) or calver (YYYY.MMDD.HHMM)'
    required: false
    default: 'semver'
  skip-ci-check:
    description: 'Skip CI verification (for modules without CI or hotfixes)'
    required: false
    default: 'false'
  timeout:
    description: 'Maximum time to wait for CI in seconds'
    required: false
    default: '300'

outputs:
  version:
    description: 'Validated version (e.g., 1.0.0)'
    value: ${{ steps.version.outputs.version }}
  tag_name:
    description: 'Full tag name (e.g., clie-cli/1.0.0)'
    value: ${{ steps.version.outputs.tag_name }}
  ci_sha:
    description: 'SHA of the commit that passed CI (may differ from release commit if inherited)'
    value: ${{ steps.set_ci_sha.outputs.ci_sha || steps.ci_check_skip.outputs.ci_sha }}

runs:
  using: composite
  steps:
    - name: Setup Commands Binary
      id: commands
      uses: ./.github/actions/setup-commands

    - name: Extract and validate version
      id: version
      uses: ./.github/actions/extract-release-version
      with:
        module-prefix: ${{ inputs.module }}
        version-type: ${{ inputs.version-type }}
        commands-path: ${{ steps.commands.outputs.commands-path }}

    - name: Validate version format
      shell: bash
      env:
        VERSION_TYPE: ${{ inputs.version-type }}
      run: |
        if [ "${{ steps.version.outputs.is_valid }}" != "true" ]; then
          echo "::error::Invalid version format: ${{ steps.version.outputs.version }}"
          if [ "$VERSION_TYPE" = "calver" ]; then
            echo "Expected calver format: YYYY.MMDD.HHMM (e.g., 2025.1214.1630)"
          else
            echo "Expected semver format: x.y.z (e.g., 1.0.0)"
          fi
          exit 1
        fi
        echo "Version ${{ steps.version.outputs.version }} is valid $VERSION_TYPE"

    - name: Validate release type
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
      run: |
        # Extract release_type from repository.yml
        REPO_YML=".eac/repository.yml"

        if [ ! -f "$REPO_YML" ]; then
          echo "::error::Repository configuration not found: $REPO_YML"
          exit 1
        fi

        # Extract release_type for this module using awk
        # This reads the YAML and finds the module's release_type value
        RELEASE_TYPE=$(awk '
          /^  - moniker: '"$MODULE"'$/ { found=1; next }
          found && /^  - moniker:/ { found=0 }
          found && /release_type:/ {
            sub(/.*release_type: */, "");
            print;
            exit
          }
        ' "$REPO_YML")

        echo "Module: $MODULE"
        echo "Release type: ${RELEASE_TYPE:-<not set>}"
        echo ""

        # Validate release type
        case "$RELEASE_TYPE" in
          published|bundle)
            echo "✓ Release type '$RELEASE_TYPE' is valid for GitHub releases"
            ;;
          internal)
            echo "::error::Cannot create GitHub release for internal module '$MODULE'"
            echo ""
            echo "This module has release_type: internal, which means:"
            echo "  - Changelog tracks version changes for internal dependencies"
            echo "  - No public GitHub release is created"
            echo "  - No downloadable artifacts are published"
            echo ""
            echo "Internal modules are versioned for dependency tracking only."
            echo "They should not trigger release workflows."
            echo ""
            echo "If you intended to release this module publicly:"
            echo "  1. Update release_type to 'published' in $REPO_YML"
            echo "  2. Move changelog to release/$MODULE/CHANGELOG.md"
            echo "  3. Create a release workflow in .github/workflows/"
            exit 1
            ;;
          none|"")
            echo "::error::Module '$MODULE' has no release configuration"
            echo ""
            echo "This module has release_type: ${RELEASE_TYPE:-none}, which means:"
            echo "  - No versioning or changelog tracking"
            echo "  - No releases (public or internal)"
            echo ""
            echo "Modules with release_type: none cannot be released."
            echo ""
            echo "If you intended to release this module:"
            echo "  1. Add release_type: 'published' in $REPO_YML"
            echo "  2. Add changelog path in versioning section"
            echo "  3. Create CHANGELOG.md in release/$MODULE/"
            exit 1
            ;;
          *)
            echo "::error::Invalid release_type '$RELEASE_TYPE' for module '$MODULE'"
            echo ""
            echo "Valid release types:"
            echo "  - published: Creates public GitHub releases"
            echo "  - bundle: Aggregates multiple module releases"
            echo "  - internal: Version tracking only (no public release)"
            echo "  - none: No versioning or releases"
            exit 1
            ;;
        esac

    - name: Validate changelog has version entry
      if: inputs.version-type == 'semver'
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        COMMANDS="${{ steps.commands.outputs.commands-path }}"

        # Get the latest version from changelog
        CHANGELOG_VERSION=$(${COMMANDS:?COMMANDS not set} release get-version "$MODULE" 2>/dev/null || echo "")

        if [ -z "$CHANGELOG_VERSION" ]; then
          echo "::error::No changelog found for module $MODULE"
          echo ""
          echo "Create changelog at: release/$MODULE/CHANGELOG.md"
          exit 1
        fi

        if [ "$CHANGELOG_VERSION" != "$VERSION" ]; then
          echo "::error::Changelog not updated for version $VERSION"
          echo ""
          echo "Changelog shows: $CHANGELOG_VERSION"
          echo "Releasing:       $VERSION"
          echo ""
          echo "Run first: commands release this $MODULE"
          echo "This will update the changelog with version $VERSION"
          exit 1
        fi

        echo "Changelog verified: $VERSION"

    - name: Check for existing release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG_NAME="${{ steps.version.outputs.tag_name }}"

        if gh release view "$TAG_NAME" 2>/dev/null; then
          echo ""
          echo "::error::Release already exists for tag $TAG_NAME"
          echo ""
          echo "A GitHub release has already been created for this version."
          echo "To re-release:"
          echo "  1. Delete release: gh release delete $TAG_NAME"
          echo "  2. Delete tag: git push --delete origin $TAG_NAME"
          echo "  3. Re-run workflow"
          exit 1
        fi

        echo "No existing release for $TAG_NAME"

    - name: Wait for CI (strict mode)
      id: ci_check
      if: inputs.skip-ci-check != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        COMMANDS="${{ steps.commands.outputs.commands-path }}"
        MODULE="${{ inputs.module }}"
        COMMIT="${{ github.sha }}"
        TIMEOUT="${{ inputs.timeout }}"
        WORKFLOW="ci-${MODULE}.yaml"

        echo "Waiting for CI on exact commit ${COMMIT:0:7}..."
        echo ""

        # Verify CI passed for this commit (or inherit from previous if only changelog changed)
        # On success, may set INHERITED_CI_SHA in GITHUB_ENV for next step
        ${COMMANDS:?COMMANDS not set} release check-ci \
          --workflow "$WORKFLOW" \
          --commit "$COMMIT" \
          --timeout "$TIMEOUT" \
          --strict

    - name: Set CI SHA output
      id: set_ci_sha
      if: inputs.skip-ci-check != 'true'
      shell: bash
      run: |
        # Use inherited SHA if CI was inherited from previous run, otherwise current commit
        echo "ci_sha=${INHERITED_CI_SHA:-${{ github.sha }}}" >> $GITHUB_OUTPUT

    - name: Set CI SHA (skip mode)
      id: ci_check_skip
      if: inputs.skip-ci-check == 'true'
      shell: bash
      run: |
        # When skipping CI check, use current commit SHA
        echo "ci_sha=${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: Summary
      if: always()
      shell: bash
      env:
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
        RUN_ID: ${{ github.run_id }}
      run: |
        MODULE="${{ inputs.module }}"
        VERSION="${{ steps.version.outputs.version }}"
        TAG_NAME="${{ steps.version.outputs.tag_name }}"
        COMMIT="${{ github.sha }}"
        SKIP_CI="${{ inputs.skip-ci-check }}"
        VERSION_TYPE="${{ inputs.version-type }}"
        WORKFLOW="ci-${MODULE}.yaml"

        # Determine status
        if [ "${{ job.status }}" != "failure" ]; then
          STATUS="success"
        else
          STATUS="failure"
        fi

        # Build CI skipped flag
        CI_SKIPPED_FLAG=""
        if [ "$SKIP_CI" = "true" ]; then
          CI_SKIPPED_FLAG="--ci-skipped"
        fi

        # Generate summary using Go command
        ${COMMANDS:?COMMANDS not set} show approve-summary \
          --module="$MODULE" \
          --version="$VERSION" \
          --tag="$TAG_NAME" \
          --commit="$COMMIT" \
          --version-type="$VERSION_TYPE" \
          --status="$STATUS" \
          --run-id="$RUN_ID" \
          $CI_SKIPPED_FLAG >> $GITHUB_STEP_SUMMARY

        # On failure, add diagnostic link
        if [ "$STATUS" = "failure" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          ${COMMANDS:?COMMANDS not set} pipeline ci summary-link $RUN_ID --type release --workflow "$WORKFLOW" --commit "$COMMIT" >> $GITHUB_STEP_SUMMARY
        fi
