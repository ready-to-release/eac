# Cleanup Pre-Releases Action
#
# Cleans up old pre-releases and their tags, keeping only the newest N releases.
# Call this after a successful release to maintain a clean release history.
#
# Usage:
#   cleanup:
#     name: Cleanup Old Releases
#     needs: [approve, release]
#     if: needs.release.result == 'success'
#     runs-on: ubuntu-latest
#     permissions:
#       contents: write
#     steps:
#       - uses: actions/checkout@v6
#       - uses: ./.github/actions/cleanup-pre-releases
#         with:
#           module: docs
#           keep-count: 3

name: Cleanup Pre-Releases
description: Remove old pre-releases and their tags, keeping only the newest N

inputs:
  module:
    description: 'Module prefix for releases (e.g., docs, books)'
    required: true
  keep-count:
    description: 'Number of releases to keep (default: 1 = latest only)'
    required: false
    default: '1'

runs:
  using: composite
  steps:
    - name: Setup Commands Binary
      id: commands
      uses: ./.github/actions/setup-commands

    - name: Cleanup old releases and tags
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        COMMANDS="${{ steps.commands.outputs.commands-path }}"
        $COMMANDS release prune "${{ inputs.module }}" --keep "${{ inputs.keep-count }}"
