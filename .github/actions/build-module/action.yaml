name: Build Module
description: Build any module using the EAC commands binary

inputs:
  module:
    description: Module moniker to build
    required: true
  trigger-run-id:
    description: 'Run ID of trigger workflow (for artifact download). If empty, builds from source.'
    required: false
    default: ''
  commit-sha:
    description: 'Commit SHA for artifact lookup. Use when github.sha might differ (workflow_dispatch). Falls back to github.sha if empty.'
    required: false
    default: ''
  go-version:
    description: 'Go version for building commands from source'
    required: false
    default: '1.24.4'
  setup-deps:
    description: |
      Setup system dependencies before build:
      - auto: Auto-detect from module type (default)
      - none: Skip (assumes deps already setup)
      - Explicit: go, node, docker (comma-separated)
    required: false
    default: 'auto'
  artifact-name:
    description: 'Name for the build artifact. If empty, uses build-artifacts-{module}'
    required: false
    default: ''
  artifact-path:
    description: 'Path pattern for artifacts to upload. If empty, uses out/build/{module}/**'
    required: false
    default: ''
  upload-artifact:
    description: Whether to upload build artifacts
    required: false
    default: 'true'
  extra-args:
    description: Additional arguments to pass to the build command
    required: false
    default: ''

outputs:
  artifact-name:
    description: Name of the uploaded artifact
    value: ${{ steps.vars.outputs.artifact-name }}
  commands-path:
    description: Path to the commands binary used
    value: ${{ steps.commands.outputs.commands-path }}

runs:
  using: composite
  steps:
    - name: Setup Commands Binary
      id: commands
      uses: ./.github/actions/setup-commands
      with:
        go-version: ${{ inputs.go-version }}
        trigger-run-id: ${{ inputs.trigger-run-id }}

    - name: Setup Module Dependencies
      if: inputs.setup-deps != 'none'
      uses: ./.github/actions/setup-module-deps
      with:
        module: ${{ inputs.module }}
        commands-path: ${{ steps.commands.outputs.commands-path }}
        deps: ${{ inputs.setup-deps }}

    - name: Set variables
      id: vars
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        INPUT_ARTIFACT_PATH: ${{ inputs.artifact-path }}
      run: |
        # Use provided values or defaults
        if [ -n "$INPUT_ARTIFACT_NAME" ]; then
          echo "artifact-name=$INPUT_ARTIFACT_NAME" >> $GITHUB_OUTPUT
        else
          echo "artifact-name=build-artifacts-${MODULE}" >> $GITHUB_OUTPUT
        fi

        if [ -n "$INPUT_ARTIFACT_PATH" ]; then
          echo "artifact-path=$INPUT_ARTIFACT_PATH" >> $GITHUB_OUTPUT
        else
          echo "artifact-path=out/build/${MODULE}/**" >> $GITHUB_OUTPUT
        fi

    - name: Download Dependency Artifacts
      shell: bash
      env:
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
        MODULE: ${{ inputs.module }}
        GH_TOKEN: ${{ github.token }}
        # Use explicit commit-sha if provided (for workflow_dispatch where github.sha can drift)
        # Falls back to github.sha for direct triggers (push, pull_request)
        ARTIFACT_SHA: ${{ inputs.commit-sha || github.sha }}
      run: |
        # Get module dependencies from contract
        DEPS=$($COMMANDS get modules --as-json | jq -r ".[] | select(.moniker == \"$MODULE\") | .depends_on[]" 2>/dev/null || echo "")

        if [ -z "$DEPS" ]; then
          echo "No module dependencies to download"
          exit 0
        fi

        echo "Artifact lookup SHA: $ARTIFACT_SHA"
        echo "Downloading dependency artifacts..."
        mkdir -p out/build

        for dep in $DEPS; do
          # Skip if already exists
          if [ -d "out/build/$dep" ]; then
            echo "  ✓ $dep: already exists"
            continue
          fi

          # Find successful run from current trigger chain (same SHA)
          # trigger-ci dispatches in layers and waits, so deps should be complete
          CURRENT_RUN=$(gh run list -w "ci-$dep" -s success -L 5 --json databaseId,headSha \
            | jq -r ".[] | select(.headSha == \"$ARTIFACT_SHA\") | .databaseId" | head -1 2>/dev/null || echo "")

          if [ -n "$CURRENT_RUN" ]; then
            echo "  ↓ $dep: downloading from current trigger (run $CURRENT_RUN)"
            if gh run download "$CURRENT_RUN" -n "build-artifacts-$dep" -D out/build/ 2>/dev/null; then
              continue
            fi
          fi

          # Fallback: Use last successful run from any commit (incremental CI)
          # Valid when dependency module hasn't changed (no CI triggered for it)
          LAST_SUCCESS=$(gh run list -w "ci-$dep" -s success -L 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo "")

          if [ -n "$LAST_SUCCESS" ]; then
            echo "  ↓ $dep: downloading from previous CI (run $LAST_SUCCESS)"
            gh run download "$LAST_SUCCESS" -n "build-artifacts-$dep" -D out/build/ 2>/dev/null || echo "    ⚠ download failed"
          else
            echo "  ⚠ $dep: no successful CI run found (will build from source if needed)"
          fi
        done

    - name: Build Module
      id: build
      shell: bash
      env:
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
        MODULE: ${{ inputs.module }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        # CI builds THIS module only:
        # --rebuild: force full build (CI was triggered, so build fresh)
        # --use-existing-depm: use dependency artifacts from previous/current CI runs
        if $COMMANDS build $MODULE --rebuild --use-existing-depm $EXTRA_ARGS; then
          echo "build-failed=0" >> $GITHUB_OUTPUT
        else
          echo "build-failed=1" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Pre-Upload Diagnostics
      if: inputs.upload-artifact == 'true'
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
      run: |
        echo "=== Pre-Upload Artifact Diagnostics ==="
        echo "Module: $MODULE"
        echo "Upload path: out/build/"
        echo ""

        if [ ! -d "out/build" ]; then
          echo "❌ ERROR: out/build directory does not exist!"
          ls -la out/ 2>/dev/null || echo "out/ directory also missing"
          exit 1
        fi

        echo "Directory structure:"
        find out/build -type d 2>/dev/null | head -20 || true
        echo ""

        echo "All files to upload:"
        find out/build -type f 2>/dev/null | head -50 || true
        echo ""

        echo "Total files: $(find out/build -type f | wc -l)"
        echo "Total size: $(du -sh out/build | cut -f1)"
        echo ""

        # Check for manifest files specifically
        echo "Manifest files:"
        find out/build -name "build.manifest.json" -type f
        MANIFEST_COUNT=$(find out/build -name "build.manifest.json" -type f | wc -l)
        echo "Found $MANIFEST_COUNT manifest file(s)"

        # Verify module manifest exists
        if [ -f "out/build/$MODULE/build.manifest.json" ]; then
          echo "✓ Module manifest exists: out/build/$MODULE/build.manifest.json"
          echo "  Size: $(stat -c%s "out/build/$MODULE/build.manifest.json" 2>/dev/null || stat -f%z "out/build/$MODULE/build.manifest.json" 2>/dev/null) bytes"
        else
          echo "❌ ERROR: Module manifest missing: out/build/$MODULE/build.manifest.json"
          echo "Contents of out/build/$MODULE/:"
          ls -la "out/build/$MODULE/" 2>/dev/null || echo "  Directory does not exist"
        fi

    - name: Upload Build Artifacts (including dependencies)
      id: upload
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v5
      with:
        name: ${{ steps.vars.outputs.artifact-name }}
        path: out/build/
        if-no-files-found: error

    - name: Post-Upload Diagnostics
      if: inputs.upload-artifact == 'true'
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        ARTIFACT_NAME: ${{ steps.vars.outputs.artifact-name }}
      run: |
        echo "=== Post-Upload Diagnostics ==="
        echo "Artifact name: $ARTIFACT_NAME"
        echo "Upload completed successfully"

    - name: Build Summary
      if: always()
      shell: bash
      env:
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
        MODULE: ${{ inputs.module }}
        RUN_ID: ${{ github.run_id }}
        BUILD_FAILED: ${{ steps.build.outputs.build-failed }}
        GH_TOKEN: ${{ github.token }}
      run: |
        # Determine status from build result
        if [ "$BUILD_FAILED" = "0" ]; then
          STATUS="success"
        else
          STATUS="failure"
        fi

        # Generate comprehensive summary using Go command
        $COMMANDS show build-summary $MODULE --status=$STATUS --run-id=$RUN_ID >> $GITHUB_STEP_SUMMARY

        # Add diagnostic link on failure
        if [ "$STATUS" = "failure" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          $COMMANDS pipeline ci summary-link $RUN_ID --type build >> $GITHUB_STEP_SUMMARY
        fi
