name: Build Module
description: Build any module using the EAC commands binary

inputs:
  module:
    description: Module moniker to build
    required: true
  trigger-run-id:
    description: 'Run ID of trigger workflow (for artifact download). If empty, builds from source.'
    required: false
    default: ''
  go-version:
    description: 'Go version for building commands from source'
    required: false
    default: '1.24.4'
  setup-deps:
    description: |
      Setup system dependencies before build:
      - auto: Auto-detect from module type (default)
      - none: Skip (assumes deps already setup)
      - Explicit: go, node, docker (comma-separated)
    required: false
    default: 'auto'
  artifact-name:
    description: 'Name for the build artifact. If empty, uses build-artifacts-{module}'
    required: false
    default: ''
  artifact-path:
    description: 'Path pattern for artifacts to upload. If empty, uses out/build/{module}/**'
    required: false
    default: ''
  upload-artifact:
    description: Whether to upload build artifacts
    required: false
    default: 'true'
  extra-args:
    description: Additional arguments to pass to the build command
    required: false
    default: ''

outputs:
  artifact-name:
    description: Name of the uploaded artifact
    value: ${{ steps.vars.outputs.artifact-name }}
  commands-path:
    description: Path to the commands binary used
    value: ${{ steps.commands.outputs.commands-path }}

runs:
  using: composite
  steps:
    - name: Setup Commands Binary
      id: commands
      uses: ./.github/actions/setup-commands
      with:
        go-version: ${{ inputs.go-version }}
        trigger-run-id: ${{ inputs.trigger-run-id }}

    - name: Setup Module Dependencies
      if: inputs.setup-deps != 'none'
      uses: ./.github/actions/setup-module-deps
      with:
        module: ${{ inputs.module }}
        commands-path: ${{ steps.commands.outputs.commands-path }}
        deps: ${{ inputs.setup-deps }}

    - name: Set variables
      id: vars
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        INPUT_ARTIFACT_PATH: ${{ inputs.artifact-path }}
      run: |
        # Use provided values or defaults
        if [ -n "$INPUT_ARTIFACT_NAME" ]; then
          echo "artifact-name=$INPUT_ARTIFACT_NAME" >> $GITHUB_OUTPUT
        else
          echo "artifact-name=build-artifacts-${MODULE}" >> $GITHUB_OUTPUT
        fi

        if [ -n "$INPUT_ARTIFACT_PATH" ]; then
          echo "artifact-path=$INPUT_ARTIFACT_PATH" >> $GITHUB_OUTPUT
        else
          echo "artifact-path=out/build/${MODULE}/**" >> $GITHUB_OUTPUT
        fi

    - name: Build Module
      id: build
      shell: bash
      env:
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
        MODULE: ${{ inputs.module }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        if $COMMANDS build $MODULE $EXTRA_ARGS; then
          echo "build-failed=0" >> $GITHUB_OUTPUT
        else
          echo "build-failed=1" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Upload Build Artifacts (including dependencies)
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v5
      with:
        name: ${{ steps.vars.outputs.artifact-name }}
        path: out/build/
        if-no-files-found: warn

    - name: Build Summary
      if: always()
      shell: bash
      env:
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
        MODULE: ${{ inputs.module }}
        RUN_ID: ${{ github.run_id }}
        BUILD_FAILED: ${{ steps.build.outputs.build-failed }}
      run: |
        # Determine status from build result
        if [ "$BUILD_FAILED" = "0" ]; then
          STATUS="success"
        else
          STATUS="failure"
        fi

        # Generate comprehensive summary using Go command
        $COMMANDS show build-summary $MODULE --status=$STATUS --run-id=$RUN_ID >> $GITHUB_STEP_SUMMARY
