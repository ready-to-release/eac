name: Build Module
description: Build a single module in isolation using the EAC commands binary

inputs:
  module:
    description: Module moniker to build
    required: true
  trigger-run-id:
    description: 'Run ID of trigger workflow (for commands binary download). If empty, builds from source.'
    required: false
    default: ''
  setup-deps:
    description: |
      Setup system dependencies before build:
      - auto: Auto-detect from module type (default)
      - none: Skip (assumes deps already setup)
      - Explicit: go, node, docker (comma-separated)
    required: false
    default: 'auto'
  artifact-name:
    description: 'Name for the build artifact. If empty, uses build-artifacts-{module}'
    required: false
    default: ''
  upload-artifact:
    description: Whether to upload build artifacts
    required: false
    default: 'true'
  extra-args:
    description: Additional arguments to pass to the build command
    required: false
    default: ''
  cross-compile-windows:
    description: |
      Cross-compile for Windows when building on Linux. Default: false.
      Set to true only for workflows that have Windows test jobs (clie, scripts-*).
    required: false
    default: 'false'

outputs:
  artifact-name:
    description: Name of the uploaded artifact
    value: ${{ steps.vars.outputs.artifact-name }}
  commands-path:
    description: Path to the commands binary used
    value: ${{ steps.commands.outputs.commands-path }}
  build-failed:
    description: Whether the build failed (0 or 1)
    value: ${{ steps.build.outputs.build-failed }}

runs:
  using: composite
  steps:
    - name: Setup Commands Binary
      id: commands
      uses: ./.github/actions/setup-commands
      with:
        trigger-run-id: ${{ inputs.trigger-run-id }}
        cross-compile-windows: ${{ inputs.cross-compile-windows }}

    - name: Setup Module Dependencies
      if: inputs.setup-deps != 'none'
      uses: ./.github/actions/setup-module-deps
      with:
        module: ${{ inputs.module }}
        commands-path: ${{ steps.commands.outputs.commands-path }}
        deps: ${{ inputs.setup-deps }}

    - name: Set variables
      id: vars
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        if [ -n "$INPUT_ARTIFACT_NAME" ]; then
          echo "artifact-name=$INPUT_ARTIFACT_NAME" >> $GITHUB_OUTPUT
        else
          echo "artifact-name=build-artifacts-${MODULE}" >> $GITHUB_OUTPUT
        fi

    - name: Build Module
      id: build
      shell: bash
      env:
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
        MODULE: ${{ inputs.module }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        # Build in isolation: --skip-cache forces fresh build, --skip-depm skips module dependency resolution
        if ${COMMANDS:?COMMANDS not set} build $MODULE --skip-cache --skip-depm $EXTRA_ARGS; then
          echo "build-failed=0" >> $GITHUB_OUTPUT
        else
          echo "build-failed=1" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Upload Build Artifacts
      id: upload
      if: inputs.upload-artifact == 'true'
      uses: ./.github/actions/upload-artifact-retry
      with:
        name: ${{ steps.vars.outputs.artifact-name }}
        path: out/build/${{ inputs.module }}/
        if-no-files-found: error

