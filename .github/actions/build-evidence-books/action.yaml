# Build Evidence Books Action
#
# Builds evidence PDFs for a module by:
# 1. Downloading test results and scan artifacts from the current workflow
# 2. Downloading dependency artifacts (awaits CI completion automatically)
# 3. Running 'update evidence <module>' to generate PDFs
#
# The evidence books aggregate CI artifacts (test results, security scans, etc.)
# as compliance documentation.
#
# By default, automatically downloads artifacts matching:
# - test-results-{module}*  (test results from all platforms)
# - scan-results-{module}   (security scan results)
#
# Usage:
#   - uses: ./.github/actions/build-evidence-books
#     with:
#       module: r2r-cli

name: Build Evidence Books
description: Build evidence PDFs for a module, collecting CI artifacts as evidence

inputs:
  module:
    description: 'Module moniker to build evidence for'
    required: true
  trigger-run-id:
    description: 'Trigger workflow run ID (for commands binary download)'
    required: false
    default: ''
  timeout:
    description: 'Timeout in seconds for awaiting dependency CI'
    required: false
    default: '600'
  upload-artifact:
    description: 'Whether to upload evidence artifacts'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name for the evidence artifact. If empty, uses evidence-artifacts-{module}'
    required: false
    default: ''

outputs:
  artifact-name:
    description: 'Name of the uploaded evidence artifact'
    value: ${{ steps.vars.outputs.artifact-name }}

runs:
  using: composite
  steps:
    - name: Setup Commands Binary
      id: commands
      uses: ./.github/actions/setup-commands
      with:
        trigger-run-id: ${{ inputs.trigger-run-id }}

    - name: Set variables
      id: vars
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        if [ -n "$INPUT_ARTIFACT_NAME" ]; then
          echo "artifact-name=$INPUT_ARTIFACT_NAME" >> $GITHUB_OUTPUT
        else
          echo "artifact-name=evidence-artifacts-${MODULE}" >> $GITHUB_OUTPUT
        fi

    # Download test and scan results from the current workflow run
    - name: Download CI artifacts
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "Downloading CI artifacts for module: $MODULE"

        # List all artifacts from this run
        ARTIFACTS=$(gh run view ${{ github.run_id }} --json artifacts -q '.artifacts[].name' 2>/dev/null || echo "")

        if [ -z "$ARTIFACTS" ]; then
          echo "No artifacts found in this workflow run"
          exit 0
        fi

        echo "Available artifacts:"
        echo "$ARTIFACTS" | sed 's/^/  /'
        echo ""

        # Download test results matching test-results-{module}*
        echo "Downloading test artifacts (test-results-${MODULE}*)..."
        for artifact in $ARTIFACTS; do
          if [[ "$artifact" == test-results-${MODULE}* ]]; then
            echo "  Downloading: $artifact"
            gh run download ${{ github.run_id }} --name "$artifact" --dir out/test/ || echo "  Warning: Failed to download $artifact"
          fi
        done

        # Download scan results matching scan-results-{module}
        echo "Downloading scan artifacts (scan-results-${MODULE})..."
        for artifact in $ARTIFACTS; do
          if [[ "$artifact" == "scan-results-${MODULE}" ]]; then
            echo "  Downloading: $artifact"
            gh run download ${{ github.run_id }} --name "$artifact" --dir out/scan/ || echo "  Warning: Failed to download $artifact"
          fi
        done

        echo ""
        echo "Downloaded artifacts:"
        ls -la out/test/ 2>/dev/null || echo "  (no test artifacts)"
        ls -la out/scan/ 2>/dev/null || echo "  (no scan artifacts)"

    # Download all dependency artifacts (awaits CI completion automatically)
    - name: Download dependency artifacts
      uses: ./.github/actions/download-module-deps
      with:
        module: ${{ inputs.module }}
        include-transitive: 'true'
        trigger-run-id: ${{ inputs.trigger-run-id }}
        await-timeout: ${{ inputs.timeout }}

    - name: Setup Docker
      uses: docker/setup-buildx-action@v3

    - name: Build evidence
      id: build
      shell: bash
      env:
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
        MODULE: ${{ inputs.module }}
      run: |
        echo "Building evidence for $MODULE..."

        if ${COMMANDS:?COMMANDS not set} update evidence $MODULE; then
          echo "build-failed=false" >> $GITHUB_OUTPUT
          echo ""
          echo "✓ Evidence build complete"
        else
          echo "build-failed=true" >> $GITHUB_OUTPUT
          echo ""
          echo "::error::Evidence build failed for $MODULE"
          exit 1
        fi

    - name: Upload evidence artifacts
      if: inputs.upload-artifact == 'true'
      uses: ./.github/actions/upload-artifact-retry
      with:
        name: ${{ steps.vars.outputs.artifact-name }}
        path: out/evidence/
        if-no-files-found: error

    - name: Summary
      if: always()
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        BUILD_FAILED: ${{ steps.build.outputs.build-failed }}
        ARTIFACT_NAME: ${{ steps.vars.outputs.artifact-name }}
      run: |
        echo "## 📚 Evidence Build: $MODULE" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "$BUILD_FAILED" = "true" ]; then
          echo "❌ **Build failed**" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ **Build successful**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact**: \`$ARTIFACT_NAME\`" >> $GITHUB_STEP_SUMMARY

          # List generated PDFs
          if [ -d "out/evidence/$MODULE" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
            for pdf in out/evidence/$MODULE/*.pdf; do
              if [ -f "$pdf" ]; then
                echo "- \`$(basename $pdf)\`" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi
        fi
