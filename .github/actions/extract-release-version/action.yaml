name: Extract Release Version
description: Extract version from tag trigger or workflow dispatch input

inputs:
  module-prefix:
    description: 'Module prefix in tag (e.g., r2r-cli, ext-eac, docs, books)'
    required: true
  version-type:
    description: 'Version format: semver (x.y.z) or calver (YYYY.MMDD.HHMM)'
    required: false
    default: 'semver'
  commands-path:
    description: 'Path to commands binary for validation (optional, skips validation if not provided)'
    required: false
    default: ''

outputs:
  version:
    description: 'Extracted version without prefix (e.g., 1.2.3 or 2025.1214.1630)'
    value: ${{ steps.extract.outputs.version }}
  tag_name:
    description: 'Full tag name (e.g., r2r-cli/1.2.3 or docs/2025.1214.1630)'
    value: ${{ steps.extract.outputs.tag_name }}
  is_valid:
    description: 'Whether version is valid for its type (true/false)'
    value: ${{ steps.extract.outputs.is_valid }}

runs:
  using: composite
  steps:
    - name: Setup Commands Binary
      if: inputs.commands-path == ''
      id: commands
      uses: ./.github/actions/setup-commands

    - name: Extract version
      id: extract
      shell: bash
      env:
        MODULE_PREFIX: ${{ inputs.module-prefix }}
        VERSION_TYPE: ${{ inputs.version-type }}
        EVENT_NAME: ${{ github.event_name }}
        DISPATCH_VERSION: ${{ github.event.inputs.version }}
        GITHUB_REF: ${{ github.ref }}
        COMMANDS_PATH: ${{ inputs.commands-path || steps.commands.outputs.commands-path }}
      run: |
        # Use Go command for version extraction and validation
        # Shell format outputs: VERSION, TAG_NAME, IS_VALID, MESSAGE

        # Build arguments
        ARGS="--module=$MODULE_PREFIX --type=$VERSION_TYPE --format=shell"

        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          # For workflow_dispatch, use explicit version (or empty for calver auto-generation)
          ARGS="$ARGS --version=${DISPATCH_VERSION:-}"
        else
          # For tag triggers, use the ref
          ARGS="$ARGS --ref=$GITHUB_REF"
        fi

        echo "Running: release extract-version $ARGS"

        # Execute and eval the shell output
        SHELL_OUTPUT=$("$COMMANDS_PATH" release extract-version $ARGS)
        echo "$SHELL_OUTPUT"
        eval "$SHELL_OUTPUT"

        # Set GitHub outputs from shell variables
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "is_valid=$IS_VALID" >> $GITHUB_OUTPUT

        # Log validation result
        if [ "$IS_VALID" = "true" ]; then
          echo "Version $VERSION is valid $VERSION_TYPE"
        else
          echo "::warning::$MESSAGE"
        fi
