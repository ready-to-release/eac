name: Test Module
description: Test any module using the EAC commands binary

inputs:
  module:
    description: Module moniker to test
    required: true
  trigger-run-id:
    description: 'Run ID of trigger workflow (for artifact download). If empty, builds from source.'
    required: false
    default: ''
  setup-deps:
    description: |
      Setup system dependencies before test:
      - auto: Auto-detect from module type (default)
      - none: Skip (assumes deps already setup)
      - Explicit: go, node, docker (comma-separated)
    required: false
    default: 'auto'
  suites:
    description: |
      Comma-separated list of test suites to run.
      Recommended: 'unit,integration' for PRs, 'unit,integration,acceptance' for main/release.
    required: false
    default: 'unit,integration'
  download-artifact:
    description: Whether to download build artifacts first
    required: false
    default: 'true'
  build-artifact-name:
    description: 'Name of build artifact to download. If empty, uses build-artifacts-{module}'
    required: false
    default: ''
  build-artifact-path:
    description: 'Path to download build artifacts to. If empty, uses out/build/ (includes all dependencies)'
    required: false
    default: ''
  results-artifact-name:
    description: 'Name for test results artifact. If empty, uses test-results-{module}'
    required: false
    default: ''
  results-artifact-path:
    description: 'Path pattern for test results to upload. If empty, uses out/test/'
    required: false
    default: ''
  extra-args:
    description: Additional arguments to pass to the test command
    required: false
    default: ''
  skip-depm:
    description: 'Skip module dependency build artifact validation (use when deps are compiled from source)'
    required: false
    default: 'false'

outputs:
  artifact-name:
    description: Name of the uploaded test results artifact
    value: ${{ steps.vars.outputs.results-artifact-name }}
  results-artifact-path:
    description: Path pattern for test results to upload
    value: ${{ steps.vars.outputs.results-artifact-path }}
  commands-path:
    description: Path to the commands binary used
    value: ${{ steps.commands.outputs.commands-path }}
  test-failed:
    description: Whether the test failed (0 or 1)
    value: ${{ steps.test.outputs.test-failed }}

runs:
  using: composite
  steps:
    - name: Setup Commands Binary
      id: commands
      uses: ./.github/actions/setup-commands
      with:
        trigger-run-id: ${{ inputs.trigger-run-id }}

    - name: Setup Module Dependencies
      if: inputs.setup-deps != 'none'
      uses: ./.github/actions/setup-module-deps
      with:
        module: ${{ inputs.module }}
        commands-path: ${{ steps.commands.outputs.commands-path }}
        deps: ${{ inputs.setup-deps }}

    - name: Set variables
      id: vars
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        INPUT_BUILD_ARTIFACT_NAME: ${{ inputs.build-artifact-name }}
        INPUT_BUILD_ARTIFACT_PATH: ${{ inputs.build-artifact-path }}
        INPUT_RESULTS_ARTIFACT_NAME: ${{ inputs.results-artifact-name }}
        INPUT_RESULTS_ARTIFACT_PATH: ${{ inputs.results-artifact-path }}
      run: |
        # Build artifact settings
        if [ -n "$INPUT_BUILD_ARTIFACT_NAME" ]; then
          echo "build-artifact-name=$INPUT_BUILD_ARTIFACT_NAME" >> $GITHUB_OUTPUT
        else
          echo "build-artifact-name=build-artifacts-${MODULE}" >> $GITHUB_OUTPUT
        fi

        if [ -n "$INPUT_BUILD_ARTIFACT_PATH" ]; then
          echo "build-artifact-path=$INPUT_BUILD_ARTIFACT_PATH" >> $GITHUB_OUTPUT
        else
          # Download to out/build/<module>/ to match build-module upload path
          echo "build-artifact-path=out/build/${MODULE}/" >> $GITHUB_OUTPUT
        fi

        # Results artifact settings
        if [ -n "$INPUT_RESULTS_ARTIFACT_NAME" ]; then
          echo "results-artifact-name=$INPUT_RESULTS_ARTIFACT_NAME" >> $GITHUB_OUTPUT
        else
          echo "results-artifact-name=test-results-${MODULE}" >> $GITHUB_OUTPUT
        fi

        if [ -n "$INPUT_RESULTS_ARTIFACT_PATH" ]; then
          echo "results-artifact-path=$INPUT_RESULTS_ARTIFACT_PATH" >> $GITHUB_OUTPUT
        else
          # Upload all test output - structured as out/test/<module>/packages/<package>/
          echo "results-artifact-path=out/test/" >> $GITHUB_OUTPUT
        fi

    - name: Download Build Artifacts
      id: download
      if: inputs.download-artifact == 'true'
      uses: ./.github/actions/download-artifact-retry
      with:
        name: ${{ steps.vars.outputs.build-artifact-name }}
        path: ${{ steps.vars.outputs.build-artifact-path }}

    - name: Log in to GitHub Container Registry
      # Login to GHCR for L2/integration tests that need to pull container images
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Run Test Suites
      id: test
      shell: bash
      env:
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
        MODULE: ${{ inputs.module }}
        SUITES: ${{ inputs.suites }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        SKIP_DEPM: ${{ inputs.skip-depm }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # CI tests THIS module only:
        # --skip-cache: force full test run (no incremental detection, CI handles orchestration)
        # --skip-depm: skip module dependency build artifact validation (deps compiled from source)
        test_failed=0
        SKIP_DEPM_FLAG=""
        if [ "$SKIP_DEPM" = "true" ]; then
          SKIP_DEPM_FLAG="--skip-depm"
        fi
        IFS=',' read -ra SUITE_ARRAY <<< "$SUITES"
        for suite in "${SUITE_ARRAY[@]}"; do
          suite=$(echo "$suite" | xargs)  # trim whitespace
          echo "Running test suite: $suite"
          if ! ${COMMANDS:?COMMANDS not set} test $MODULE --suite $suite --skip-cache $SKIP_DEPM_FLAG $EXTRA_ARGS; then
            test_failed=1
          fi
        done
        echo "test-failed=$test_failed" >> $GITHUB_OUTPUT
        if [ "$test_failed" -eq 1 ]; then
          exit 1
        fi
