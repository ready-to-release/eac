# Await Module Releases Action
#
# Waits for all in-flight module release workflows to complete before proceeding.
# Used by release-r2r-eac-bundle to ensure the bundle contains all current releases.
#
# This action:
# 1. Gets the list of modules in the release bundle
# 2. Waits for any in-progress release workflows to complete
# 3. Collects the latest release tags for each module
#
# Usage:
#   - uses: ./.github/actions/await-module-releases
#     with:
#       timeout: '600'

name: Await Module Releases
description: Wait for all module release workflows to complete

inputs:
  timeout:
    description: 'Maximum wait time in seconds'
    required: false
    default: '600'

outputs:
  releases:
    description: 'JSON object mapping module monikers to their release tags'
    value: ${{ steps.collect.outputs.releases }}
  all_released:
    description: 'true if all bundle modules have releases'
    value: ${{ steps.collect.outputs.all_released }}

runs:
  using: composite
  steps:
    - name: Setup Commands Binary
      id: commands
      uses: ./.github/actions/setup-commands

    - name: Wait for in-flight releases
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        # Wait for all release workflows except our own (r2r-eac-bundle)
        $COMMANDS pipeline await-release --timeout $TIMEOUT --exclude r2r-eac-bundle

    - name: Collect module releases
      id: collect
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
      run: |
        echo "Collecting release information for bundle modules..."

        # Get release bundle status using shell format (no jq needed)
        # Shell format outputs: RELEASE_MAP, ALL_RELEASED
        eval $($COMMANDS get release-bundle --format shell)

        echo ""
        echo "All released: $ALL_RELEASED"

        # Output
        echo "releases=$RELEASE_MAP" >> $GITHUB_OUTPUT
        echo "all_released=$ALL_RELEASED" >> $GITHUB_OUTPUT

    - name: Summary
      shell: bash
      env:
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        ALL_RELEASED="${{ steps.collect.outputs.all_released }}"

        echo "## Module Releases" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Use table format for summary (no jq needed)
        $COMMANDS get release-bundle --format table >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "$ALL_RELEASED" = "true" ]; then
          echo ":white_check_mark: All bundle modules have releases" >> $GITHUB_STEP_SUMMARY
        else
          echo ":warning: Some modules have not been released yet" >> $GITHUB_STEP_SUMMARY
        fi
