# Scan Module Action
#
# Runs security scans on a module using the EAC scan commands.
# Similar pattern to build-module and test-module.
#
# Available scans:
#   - sbom: Software Bill of Materials (Trivy)
#   - vuln: Vulnerability scanning (Trivy)
#   - secrets: Secrets detection (Trivy)
#   - compliance: CIS compliance checking (Trivy)
#   - iac: Infrastructure as Code scanning (Trivy)
#   - sast: Static Application Security Testing (Semgrep)
#   - zap: Dynamic Application Security Testing (OWASP ZAP)
#
# Output structure: out/scan/<module>/<scanner>/
#
# Usage:
#   - uses: ./.github/actions/scan-module
#     with:
#       module: eac-core
#       scans: sbom,vuln,secrets

name: Scan Module
description: Run security scans on a module

inputs:
  module:
    description: 'Module moniker to scan'
    required: true
  scans:
    description: |
      Comma-separated list of scans to run.
      Available: sbom, vuln, secrets, compliance, iac, sast, zap
    required: false
    default: 'sbom,vuln,secrets'
  trigger-run-id:
    description: 'Run ID of trigger workflow (for artifact download)'
    required: false
    default: ''
  download-artifact:
    description: 'Whether to download build artifacts first'
    required: false
    default: 'true'
  build-artifact-name:
    description: 'Name of build artifact to download. If empty, uses build-artifacts-{module}'
    required: false
    default: ''
  upload-artifact:
    description: 'Whether to upload scan results'
    required: false
    default: 'true'
  fail-on-error:
    description: |
      How to handle scan failures:
      - error: Exit with error code (default)
      - warn: Log warning but continue
      - ignore: Silently continue
    required: false
    default: 'error'
  extra-args:
    description: 'Additional arguments to pass to scan commands'
    required: false
    default: ''

outputs:
  artifact-name:
    description: 'Name of the uploaded scan results artifact'
    value: ${{ steps.vars.outputs.scan-artifact-name }}
  scan-failed:
    description: 'true if any scan failed'
    value: ${{ steps.scan.outputs.scan-failed }}
  scans-run:
    description: 'Comma-separated list of scans that were executed'
    value: ${{ steps.scan.outputs.scans-run }}

runs:
  using: composite
  steps:
    - name: Setup Commands Binary
      id: commands
      uses: ./.github/actions/setup-commands
      with:
        trigger-run-id: ${{ inputs.trigger-run-id }}

    - name: Setup Docker
      uses: docker/setup-buildx-action@v3

    - name: Set variables
      id: vars
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        INPUT_BUILD_ARTIFACT_NAME: ${{ inputs.build-artifact-name }}
      run: |
        # Build artifact name
        if [ -n "$INPUT_BUILD_ARTIFACT_NAME" ]; then
          echo "build-artifact-name=$INPUT_BUILD_ARTIFACT_NAME" >> $GITHUB_OUTPUT
        else
          echo "build-artifact-name=build-artifacts-${MODULE}" >> $GITHUB_OUTPUT
        fi

        # Build artifact path - download to out/build/<module>/ to match build-module upload
        echo "build-artifact-path=out/build/${MODULE}/" >> $GITHUB_OUTPUT

        # Scan results artifact name
        echo "scan-artifact-name=scan-results-${MODULE}" >> $GITHUB_OUTPUT

    - name: Download Build Artifacts
      id: download
      if: inputs.download-artifact == 'true'
      uses: actions/download-artifact@v7
      with:
        name: ${{ steps.vars.outputs.build-artifact-name }}
        path: ${{ steps.vars.outputs.build-artifact-path }}

    - name: Run Scans
      id: scan
      shell: bash
      env:
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
        MODULE: ${{ inputs.module }}
        SCANS: ${{ inputs.scans }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        echo "Running security scans for $MODULE..."
        echo "Scans: $SCANS"
        echo "Failure mode: $FAIL_ON_ERROR"
        echo ""

        mkdir -p out/scan/$MODULE

        scan_failed=false
        scans_run=""
        failed_scans=""

        # Run scan command with module and all scanners
        # Usage: scan <module> --scanner <types>
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Running scans: $SCANS"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        if $COMMANDS scan $MODULE --scanner "$SCANS" --no-tui $EXTRA_ARGS; then
          echo "✓ scans completed"
          scans_run="$SCANS"
        else
          echo "✗ scans failed"
          scan_failed=true
          failed_scans="$SCANS"

          case "$FAIL_ON_ERROR" in
            error)
              echo "::error::Scans failed for $MODULE"
              ;;
            warn)
              echo "::warning::Scans failed for $MODULE"
              ;;
            ignore)
              # Silent
              ;;
          esac
        fi
        echo ""

        # Remove leading comma
        scans_run="${scans_run#,}"

        echo "scan-failed=$scan_failed" >> $GITHUB_OUTPUT
        echo "scans-run=$scans_run" >> $GITHUB_OUTPUT
        echo "failed-scans=$failed_scans" >> $GITHUB_OUTPUT

        # Exit based on failure mode
        if [ "$scan_failed" = "true" ] && [ "$FAIL_ON_ERROR" = "error" ]; then
          echo ""
          echo "::error::One or more scans failed:$failed_scans"
          exit 1
        fi

    - name: Upload Scan Results
      if: inputs.upload-artifact == 'true' && always()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.vars.outputs.scan-artifact-name }}
        path: out/scan/
        if-no-files-found: warn

    - name: Scan Summary
      if: always()
      shell: bash
      env:
        COMMANDS: ${{ steps.commands.outputs.commands-path }}
        MODULE: ${{ inputs.module }}
        ARTIFACT_NAME: ${{ steps.vars.outputs.scan-artifact-name }}
      run: |
        # Generate summary using Go command
        # Status is derived from scan manifest (success if all scans passed)
        # Note: Diagnostic links are handled centrally by _module-ci.yaml on failure
        $COMMANDS show scan-summary "$MODULE" --artifact-name="$ARTIFACT_NAME" >> $GITHUB_STEP_SUMMARY
