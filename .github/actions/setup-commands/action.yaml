name: Setup EAC Commands
description: Get the EAC commands binary - download from trigger workflow or build from source

inputs:
  go-version:
    description: Go version to use if building from source
    default: '1.24.4'
  trigger-run-id:
    description: |
      Run ID of the trigger workflow to download artifact from.
      On Linux/macOS: artifact MUST exist (fails if not found).
      On Windows: tries Windows artifact first, falls back to building from source
      if only Linux artifact exists (cross-platform CI support).
      If empty, builds from source.
    default: ''

outputs:
  commands-path:
    description: Absolute path to the commands binary
    value: ${{ steps.setup.outputs.path || steps.setup-windows.outputs.path }}
  source:
    description: How the binary was obtained (artifact or built)
    value: ${{ steps.setup.outputs.source || steps.setup-windows.outputs.source }}

# NOTE: Commands binary is stored in out/tools/ (not out/build/) because it's a
# CI tool used to create builds, not a build output itself. This separation ensures
# the tool binary isn't confused with or overwritten by module build outputs.

runs:
  using: composite
  steps:
    # When trigger-run-id is provided, download from that specific run
    # On Windows, check if Windows-specific artifact exists before attempting download
    - name: Check if Windows artifact exists in trigger workflow
      id: check-trigger-windows
      if: inputs.trigger-run-id != '' && runner.os == 'Windows'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Check if commands-binary-windows exists in trigger run
        set +e
        RESULT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.trigger-run-id }}/artifacts" \
          --jq '.artifacts[] | select(.name == "commands-binary-windows") | .id' 2>&1)
        EXIT_CODE=$?
        set -e

        if [ $EXIT_CODE -eq 0 ] && [ -n "$RESULT" ] && ! echo "$RESULT" | grep -qi "error"; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "✓ Windows artifact found in trigger run"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "No Windows artifact in trigger run - will build from source"
        fi

    - name: Download from trigger workflow (Windows)
      id: download-trigger-windows
      if: inputs.trigger-run-id != '' && runner.os == 'Windows' && steps.check-trigger-windows.outputs.exists == 'true'
      uses: actions/download-artifact@v6
      with:
        name: commands-binary-windows
        path: out/tools
        github-token: ${{ github.token }}
        run-id: ${{ inputs.trigger-run-id }}

    # On Linux/macOS only - download standard artifact from trigger workflow
    # NOTE: We intentionally skip this on Windows because the Linux binary cannot execute on Windows.
    # Windows will fall through to build from source or use cached artifact from current run.
    - name: Download from trigger workflow (Linux/macOS)
      id: download-trigger
      if: inputs.trigger-run-id != '' && runner.os != 'Windows'
      uses: actions/download-artifact@v6
      with:
        name: commands-binary
        path: out/tools
        github-token: ${{ github.token }}
        run-id: ${{ inputs.trigger-run-id }}

    # Check if artifact exists in current run before attempting download
    # This runs when: no trigger-run-id provided, OR on Windows when trigger artifact wasn't available
    # This avoids noisy error messages when artifact doesn't exist yet
    - name: Check if artifact exists (current run)
      id: artifact-check
      if: inputs.trigger-run-id == '' || (runner.os == 'Windows' && steps.check-trigger-windows.outputs.exists != 'true')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Check if commands-binary artifact exists in current run
        ARTIFACT_NAME="commands-binary"
        if [ "$RUNNER_OS" = "Windows" ]; then
          ARTIFACT_NAME="commands-binary-windows"
        fi

        # Use gh api to check for artifact
        # If API call fails (permissions, network, etc.), treat as "not found" and build from source
        set +e
        RESULT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
           --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .id" 2>&1)
        EXIT_CODE=$?
        set -e

        if [ $EXIT_CODE -eq 0 ] && [ -n "$RESULT" ] && ! echo "$RESULT" | grep -qi "error\|denied\|forbidden"; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "✓ Artifact '$ARTIFACT_NAME' found"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "No artifact available - will build from source"
        fi

    # Only download if artifact exists in current run
    - name: Download from current run
      id: download-current
      if: (inputs.trigger-run-id == '' || (runner.os == 'Windows' && steps.check-trigger-windows.outputs.exists != 'true')) && steps.artifact-check.outputs.exists == 'true'
      uses: actions/download-artifact@v6
      with:
        name: ${{ steps.artifact-check.outputs.artifact_name }}
        path: out/tools

    - name: Check binary availability (Linux/macOS)
      id: check
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if [ -f "out/tools/commands" ]; then
          echo "available=true" >> $GITHUB_OUTPUT
          echo "✓ Commands binary downloaded from artifact"
        else
          echo "available=false" >> $GITHUB_OUTPUT

          # If trigger-run-id was provided, artifact MUST exist
          if [ -n "${{ inputs.trigger-run-id }}" ]; then
            echo "::error::Commands artifact not found in trigger workflow run ${{ inputs.trigger-run-id }}"
            exit 1
          fi

          echo "Building commands binary from source"
        fi

    - name: Check binary availability (Windows)
      id: check-windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (Test-Path "out/tools/commands.exe") {
          echo "available=true" >> $env:GITHUB_OUTPUT
          Write-Host "✓ Commands binary downloaded from artifact"
        } else {
          echo "available=false" >> $env:GITHUB_OUTPUT
          Write-Host "Building commands binary from source"
        }

    - name: Setup Go
      if: (runner.os != 'Windows' && steps.check.outputs.available != 'true') || (runner.os == 'Windows' && steps.check-windows.outputs.available != 'true')
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: |
          go/eac/commands/go.sum
          go/eac/core/go.sum
          go/eac/specs/go.sum
          go/eac/mcp/commands/go.sum

    - name: Build from source (Linux/macOS)
      if: runner.os != 'Windows' && steps.check.outputs.available != 'true'
      shell: bash
      run: |
        echo "Building commands binary from source..."
        mkdir -p out/tools
        cd go/eac/commands
        go build -o ../../../out/tools/commands .
        echo "✓ Commands binary built"

    - name: Build from source (Windows)
      if: runner.os == 'Windows' && steps.check-windows.outputs.available != 'true'
      shell: pwsh
      run: |
        Write-Host "Building commands binary from source..."
        New-Item -ItemType Directory -Force -Path out/tools | Out-Null
        Set-Location go/eac/commands
        go build -o ../../../out/tools/commands.exe .
        Write-Host "✓ Commands binary built"

    - name: Upload artifact (for downstream jobs, Linux/macOS)
      if: runner.os != 'Windows' && steps.check.outputs.available != 'true'
      uses: actions/upload-artifact@v5
      with:
        name: commands-binary
        path: out/tools/commands
        if-no-files-found: error

    - name: Upload artifact (for downstream jobs, Windows)
      if: runner.os == 'Windows' && steps.check-windows.outputs.available != 'true'
      uses: actions/upload-artifact@v5
      with:
        name: commands-binary-windows
        path: out/tools/commands.exe
        if-no-files-found: error

    - name: Set output (Linux/macOS)
      id: setup
      if: runner.os != 'Windows'
      shell: bash
      run: |
        BINARY_PATH="out/tools/commands"

        if [ ! -f "$BINARY_PATH" ]; then
          echo "::error::Commands binary not found at $BINARY_PATH"
          exit 1
        fi

        chmod +x "$BINARY_PATH"
        echo "path=$GITHUB_WORKSPACE/$BINARY_PATH" >> $GITHUB_OUTPUT

        if [ "${{ steps.check.outputs.available }}" = "true" ]; then
          echo "source=artifact" >> $GITHUB_OUTPUT
        else
          echo "source=built" >> $GITHUB_OUTPUT
        fi

    - name: Set output (Windows)
      id: setup-windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $BINARY_PATH = "out\tools\commands.exe"

        if (-not (Test-Path $BINARY_PATH)) {
          Write-Host "::error::Commands binary not found at $BINARY_PATH"
          exit 1
        }

        echo "path=$env:GITHUB_WORKSPACE\$BINARY_PATH" >> $env:GITHUB_OUTPUT

        if ("${{ steps.check-windows.outputs.available }}" -eq "true") {
          echo "source=artifact" >> $env:GITHUB_OUTPUT
        } else {
          echo "source=built" >> $env:GITHUB_OUTPUT
        }
