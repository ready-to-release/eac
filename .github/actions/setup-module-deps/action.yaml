name: Setup Module Dependencies
description: Setup system dependencies required for building/testing a module

inputs:
  module:
    description: Module moniker
    required: true
  commands-path:
    description: Path to the commands binary
    required: true
  deps:
    description: |
      Dependencies to setup:
      - auto: Infer from module type (default)
      - none: Skip dependency setup
      - Comma-separated list: go, npm, docker, node
    required: false
    default: 'auto'
  go-version:
    description: Go version to use
    required: false
    default: '1.24.4'
  node-version:
    description: Node.js version to use
    required: false
    default: '22'

outputs:
  deps:
    description: Dependencies that were set up
    value: ${{ steps.resolve.outputs.deps }}

runs:
  using: composite
  steps:
    - name: Resolve dependencies
      id: resolve
      shell: bash
      env:
        COMMANDS: ${{ inputs.commands-path }}
        MODULE: ${{ inputs.module }}
        INPUT_DEPS: ${{ inputs.deps }}
      run: |
        if [ "$INPUT_DEPS" = "none" ]; then
          echo "deps=" >> $GITHUB_OUTPUT
          echo "Skipping dependency setup"
          exit 0
        fi

        if [ "$INPUT_DEPS" = "auto" ]; then
          # Get build dependencies directly from the commands binary
          # This queries module-types.yml configuration - the source of truth
          RESULT=$($COMMANDS get build-deps "$MODULE" --as-json)
          MODULE_TYPE=$(echo "$RESULT" | jq -r '.type')
          DEPS=$(echo "$RESULT" | jq -r '.build_deps | join(",")')

          echo "Module: $MODULE"
          echo "Type: $MODULE_TYPE"
          echo "Build deps: $DEPS"
        else
          # Use explicit deps
          DEPS="$INPUT_DEPS"
        fi

        echo "deps=$DEPS" >> $GITHUB_OUTPUT
        echo "Dependencies to setup: $DEPS"

    - name: Check if Go is already available
      id: go-check
      if: contains(steps.resolve.outputs.deps, 'go')
      shell: bash
      run: |
        if command -v go &> /dev/null; then
          echo "available=true" >> $GITHUB_OUTPUT
          echo "✓ Go already installed: $(go version)"
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "Go not found - will install"
        fi

    - name: Setup Go
      if: contains(steps.resolve.outputs.deps, 'go') && steps.go-check.outputs.available != 'true'
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: |
          go/eac/commands/go.sum
          go/eac/core/go.sum
          go/eac/specs/go.sum
          go/eac/ai/go.sum
          go/eac/mcp/commands/go.sum

    - name: Check if Node.js is already available
      id: node-check
      if: contains(steps.resolve.outputs.deps, 'node') || contains(steps.resolve.outputs.deps, 'npm')
      shell: bash
      run: |
        if command -v node &> /dev/null; then
          echo "available=true" >> $GITHUB_OUTPUT
          echo "✓ Node.js already installed: $(node --version)"
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "Node.js not found - will install"
        fi

    - name: Setup Node.js
      if: (contains(steps.resolve.outputs.deps, 'node') || contains(steps.resolve.outputs.deps, 'npm')) && steps.node-check.outputs.available != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install npm dependencies
      if: contains(steps.resolve.outputs.deps, 'node') || contains(steps.resolve.outputs.deps, 'npm')
      shell: bash
      env:
        COMMANDS: ${{ inputs.commands-path }}
        MODULE: ${{ inputs.module }}
      run: |
        # Get module root from commands binary
        MODULE_ROOT=$($COMMANDS get modules --as-json | jq -r --arg m "$MODULE" '.[] | select(.moniker == $m) | .files.root')

        if [ -n "$MODULE_ROOT" ] && [ -f "$MODULE_ROOT/package.json" ]; then
          echo "Installing npm dependencies in $MODULE_ROOT"
          cd "$MODULE_ROOT"
          npm install
        else
          echo "No package.json found for module $MODULE"
        fi

    - name: Check if Docker Buildx is already available
      id: docker-check
      if: contains(steps.resolve.outputs.deps, 'docker')
      shell: bash
      run: |
        if command -v docker &> /dev/null && docker buildx version &> /dev/null; then
          echo "available=true" >> $GITHUB_OUTPUT
          echo "✓ Docker Buildx already available: $(docker buildx version)"
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "Docker Buildx not found - will set up"
        fi

    - name: Setup Docker Buildx
      if: contains(steps.resolve.outputs.deps, 'docker') && steps.docker-check.outputs.available != 'true'
      uses: docker/setup-buildx-action@v3

    - name: Summary
      if: steps.resolve.outputs.deps != ''
      shell: bash
      env:
        DEPS: ${{ steps.resolve.outputs.deps }}
        MODULE: ${{ inputs.module }}
        GO_AVAILABLE: ${{ steps.go-check.outputs.available }}
        NODE_AVAILABLE: ${{ steps.node-check.outputs.available }}
        DOCKER_AVAILABLE: ${{ steps.docker-check.outputs.available }}
      run: |
        echo "### Dependencies Setup for \`${MODULE}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY

        if [[ "$DEPS" == *"go"* ]]; then
          if [ "$GO_AVAILABLE" = "true" ]; then
            echo "| Go | Already available |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Go | Installed |" >> $GITHUB_STEP_SUMMARY
          fi
        fi
        if [[ "$DEPS" == *"node"* ]] || [[ "$DEPS" == *"npm"* ]]; then
          if [ "$NODE_AVAILABLE" = "true" ]; then
            echo "| Node.js | Already available |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Node.js | Installed |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| npm packages | Installed |" >> $GITHUB_STEP_SUMMARY
        fi
        if [[ "$DEPS" == *"docker"* ]]; then
          if [ "$DOCKER_AVAILABLE" = "true" ]; then
            echo "| Docker Buildx | Already available |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Docker Buildx | Configured |" >> $GITHUB_STEP_SUMMARY
          fi
        fi
