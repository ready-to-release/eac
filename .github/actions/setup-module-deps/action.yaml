name: Setup Module Dependencies
description: Setup system dependencies required for building/testing a module

inputs:
  module:
    description: Module moniker
    required: true
  commands-path:
    description: Path to the commands binary
    required: true
  deps:
    description: |
      Dependencies to setup:
      - auto: Infer from module type (default)
      - none: Skip dependency setup
      - Comma-separated list: go, npm, docker, node
    required: false
    default: 'auto'
  go-version:
    description: Go version to use
    required: false
    default: '1.24.4'
  node-version:
    description: Node.js version to use
    required: false
    default: '20'

outputs:
  deps:
    description: Dependencies that were set up
    value: ${{ steps.resolve.outputs.deps }}

runs:
  using: composite
  steps:
    - name: Resolve dependencies
      id: resolve
      shell: bash
      env:
        COMMANDS: ${{ inputs.commands-path }}
        MODULE: ${{ inputs.module }}
        INPUT_DEPS: ${{ inputs.deps }}
      run: |
        if [ "$INPUT_DEPS" = "none" ]; then
          echo "deps=" >> $GITHUB_OUTPUT
          echo "Skipping dependency setup"
          exit 0
        fi

        if [ "$INPUT_DEPS" = "auto" ]; then
          # Get build dependencies directly from the commands binary (shell format)
          # This queries module-types.yml configuration - the source of truth
          eval $(${COMMANDS:?COMMANDS not set} get build-deps "$MODULE" --format shell)
          # Shell format sets: MODULE_TYPE, BUILD_DEPS
          DEPS="$BUILD_DEPS"

          echo "Module: $MODULE"
          echo "Type: $MODULE_TYPE"
          echo "Build deps: $DEPS"
        else
          # Use explicit deps
          DEPS="$INPUT_DEPS"
        fi

        echo "deps=$DEPS" >> $GITHUB_OUTPUT
        echo "Dependencies to setup: $DEPS"

    - name: Check if Go is already available
      id: go-check
      if: contains(steps.resolve.outputs.deps, 'go')
      shell: bash
      run: |
        if command -v go &> /dev/null; then
          echo "available=true" >> $GITHUB_OUTPUT
          echo "✓ Go already installed: $(go version)"
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "Go not found - will install"
        fi

    - name: Setup Go
      if: contains(steps.resolve.outputs.deps, 'go') && steps.go-check.outputs.available != 'true'
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: |
          go/eac/commands/go.sum
          go/eac/core/go.sum
          go/eac/specs/go.sum
          go/eac/mcp/commands/go.sum

    - name: Check if Node.js is already available
      id: node-check
      if: contains(steps.resolve.outputs.deps, 'node') || contains(steps.resolve.outputs.deps, 'npm') || contains(steps.resolve.outputs.deps, 'markdownlint-cli2')
      shell: bash
      run: |
        if command -v node &> /dev/null; then
          echo "available=true" >> $GITHUB_OUTPUT
          echo "✓ Node.js already installed: $(node --version)"
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "Node.js not found - will install"
        fi

    - name: Setup Node.js
      if: (contains(steps.resolve.outputs.deps, 'node') || contains(steps.resolve.outputs.deps, 'npm') || contains(steps.resolve.outputs.deps, 'markdownlint-cli2')) && steps.node-check.outputs.available != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Check if markdownlint-cli2 is available
      id: markdownlint-check
      if: contains(steps.resolve.outputs.deps, 'markdownlint-cli2')
      shell: bash
      run: |
        if command -v markdownlint-cli2 &> /dev/null; then
          echo "available=true" >> $GITHUB_OUTPUT
          echo "✓ markdownlint-cli2 already installed"
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "markdownlint-cli2 not found - will install"
        fi

    - name: Install markdownlint-cli2
      if: contains(steps.resolve.outputs.deps, 'markdownlint-cli2') && steps.markdownlint-check.outputs.available != 'true'
      shell: bash
      run: |
        echo "Installing markdownlint-cli2..."
        npm install -g markdownlint-cli2
        echo "✓ markdownlint-cli2 installed"

    - name: Check if Docker Buildx is available
      id: buildx-check
      if: contains(steps.resolve.outputs.deps, 'docker') || contains(steps.resolve.outputs.deps, 'buildx')
      shell: bash
      run: |
        if docker buildx version &>/dev/null; then
          echo "available=true" >> $GITHUB_OUTPUT
          echo "✓ Docker Buildx available: $(docker buildx version)"
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "Docker Buildx not available"
        fi

    - name: Check if QEMU is available
      id: qemu-check
      if: contains(steps.resolve.outputs.deps, 'buildx') && runner.os == 'Linux'
      shell: bash
      run: |
        if docker run --rm --privileged multiarch/qemu-user-static --version &>/dev/null 2>&1; then
          echo "available=true" >> $GITHUB_OUTPUT
          echo "✓ QEMU already available"
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "QEMU not found - will set up"
        fi

    - name: Setup QEMU
      if: contains(steps.resolve.outputs.deps, 'buildx') && steps.qemu-check.outputs.available == 'false'
      shell: bash
      run: |
        # Setup QEMU with retry logic (Docker Hub can have transient 500 errors)
        MAX_RETRIES=3
        RETRY_DELAY=10

        for attempt in $(seq 1 $MAX_RETRIES); do
          echo "Setting up QEMU (attempt $attempt/$MAX_RETRIES)..."

          if docker run --rm --privileged tonistiigi/binfmt --install all 2>&1; then
            echo "✓ QEMU installed successfully"
            exit 0
          fi

          if [ $attempt -lt $MAX_RETRIES ]; then
            echo "⚠️ QEMU setup failed, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
          fi
        done

        echo "❌ Failed to setup QEMU after $MAX_RETRIES attempts"
        exit 1

    - name: Check if UPX is available
      id: upx-check
      if: contains(steps.resolve.outputs.deps, 'upx')
      shell: bash
      run: |
        if command -v upx &> /dev/null; then
          echo "available=true" >> $GITHUB_OUTPUT
          echo "✓ UPX already installed: $(upx --version 2>&1 | head -1 || true)"
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "UPX not found - will install"
        fi

    - name: Install UPX (Linux)
      if: contains(steps.resolve.outputs.deps, 'upx') && steps.upx-check.outputs.available != 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        # Install UPX with retry logic (apt mirrors can have transient failures)
        MAX_RETRIES=3
        RETRY_DELAY=5

        for attempt in $(seq 1 $MAX_RETRIES); do
          echo "Installing UPX (attempt $attempt/$MAX_RETRIES)..."
          if sudo apt-get update -qq && sudo apt-get install -y upx-ucl; then
            echo "✓ UPX installed: $(upx --version 2>&1 | head -1 || true)"
            exit 0
          fi
          if [ $attempt -lt $MAX_RETRIES ]; then
            echo "⚠️ apt-get failed, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
          fi
        done
        echo "❌ Failed to install UPX after $MAX_RETRIES attempts"
        exit 1

    - name: Install UPX (Windows)
      if: contains(steps.resolve.outputs.deps, 'upx') && steps.upx-check.outputs.available != 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        # Install UPX with retry logic (Chocolatey can have transient failures)
        $maxRetries = 3
        $retryDelay = 5

        for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
          Write-Host "Installing UPX (attempt $attempt/$maxRetries)..."
          try {
            choco install upx -y --no-progress
            Write-Host "✓ UPX installed: $(upx --version | Select-Object -First 1)"
            exit 0
          } catch {
            if ($attempt -lt $maxRetries) {
              Write-Host "⚠️ choco failed, retrying in ${retryDelay}s..."
              Start-Sleep -Seconds $retryDelay
              $retryDelay = $retryDelay * 2
            }
          }
        }
        Write-Host "❌ Failed to install UPX after $maxRetries attempts"
        exit 1

    - name: Install UPX (macOS)
      if: contains(steps.resolve.outputs.deps, 'upx') && steps.upx-check.outputs.available != 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        # Install UPX with retry logic (Homebrew can have transient failures)
        MAX_RETRIES=3
        RETRY_DELAY=5

        for attempt in $(seq 1 $MAX_RETRIES); do
          echo "Installing UPX (attempt $attempt/$MAX_RETRIES)..."
          if brew install upx; then
            echo "✓ UPX installed: $(upx --version 2>&1 | head -1 || true)"
            exit 0
          fi
          if [ $attempt -lt $MAX_RETRIES ]; then
            echo "⚠️ brew failed, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
          fi
        done
        echo "❌ Failed to install UPX after $MAX_RETRIES attempts"
        exit 1

    - name: Summary
      if: steps.resolve.outputs.deps != ''
      shell: bash
      env:
        COMMANDS: ${{ inputs.commands-path }}
        DEPS: ${{ steps.resolve.outputs.deps }}
        MODULE: ${{ inputs.module }}
        GO_AVAILABLE: ${{ steps.go-check.outputs.available }}
        NODE_AVAILABLE: ${{ steps.node-check.outputs.available }}
        BUILDX_AVAILABLE: ${{ steps.buildx-check.outputs.available }}
        QEMU_AVAILABLE: ${{ steps.qemu-check.outputs.available }}
        UPX_AVAILABLE: ${{ steps.upx-check.outputs.available }}
        MARKDOWNLINT_AVAILABLE: ${{ steps.markdownlint-check.outputs.available }}
      run: |
        # Build flags for Go command
        FLAGS="--module=$MODULE --deps=$DEPS"

        [ "$GO_AVAILABLE" = "true" ] && FLAGS="$FLAGS --go-available"
        [ "$NODE_AVAILABLE" = "true" ] && FLAGS="$FLAGS --node-available"
        [ "$BUILDX_AVAILABLE" = "true" ] && FLAGS="$FLAGS --buildx-available"
        [ "$QEMU_AVAILABLE" = "true" ] && FLAGS="$FLAGS --qemu-available"
        [ "$UPX_AVAILABLE" = "true" ] && FLAGS="$FLAGS --upx-available"
        [ "$MARKDOWNLINT_AVAILABLE" = "true" ] && FLAGS="$FLAGS --markdownlint-available"

        # Generate summary using Go command
        ${COMMANDS:?COMMANDS not set} show deps-setup-summary $FLAGS >> $GITHUB_STEP_SUMMARY
