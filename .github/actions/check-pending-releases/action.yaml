# Check Pending Releases Action
#
# Checks for pending releases from three sources:
# 1. Semver modules: changelog versions without corresponding git tags
# 2. Calver modules with CI: auto-release when their CI was dispatched
# 3. Calver bundle modules: auto-release when ANY dependency was dispatched
#
# Uses the Go command `release check-pending` which handles all detection logic.
#
# Usage:
#   - uses: ./.github/actions/check-pending-releases
#     id: pending
#     with:
#       dispatched-modules: ${{ needs.detect-changes.outputs.changed-modules }}
#   - run: echo "${{ steps.pending.outputs.has_pending }}"

name: Check Pending Releases
description: Check for pending semver releases (changelog) and calver releases (CI triggered)

inputs:
  dispatched-modules:
    description: 'Space-separated list of modules that had CI dispatched (for calver detection)'
    required: false
    default: ''

outputs:
  has_pending:
    description: 'true if there are pending releases'
    value: ${{ steps.check.outputs.has_pending }}
  modules_json:
    description: 'JSON array of modules needing release [{module, version, tag, type}]'
    value: ${{ steps.check.outputs.modules_json }}
  layers_json:
    description: 'JSON array of layers for dependency-ordered release [[layer0], [layer1], ...]'
    value: ${{ steps.check.outputs.layers_json }}
  layer_count:
    description: 'Number of dependency layers'
    value: ${{ steps.check.outputs.layer_count }}

runs:
  using: composite
  steps:
    - name: Setup Commands Binary
      id: commands
      uses: ./.github/actions/setup-commands

    - name: Check pending releases
      id: check
      shell: bash
      run: |
        COMMANDS="${{ steps.commands.outputs.commands-path }}"
        DISPATCHED="${{ inputs.dispatched-modules }}"

        echo "Checking pending releases..."
        echo "  Dispatched modules: $DISPATCHED"
        echo ""

        # Use Go command to check all pending releases (semver + calver + bundles)
        # Shell format outputs: HAS_PENDING, MODULES, LAYER_COUNT, LAYERS_JSON, MODULES_JSON
        if [ -n "$DISPATCHED" ]; then
          eval $($COMMANDS release check-pending --dispatched "$DISPATCHED" --format shell)
        else
          eval $($COMMANDS release check-pending --format shell)
        fi

        echo "Summary:"
        echo "  Has pending: $HAS_PENDING"
        echo "  Layer count: $LAYER_COUNT"
        echo "  Modules: $MODULES"

        echo "has_pending=$HAS_PENDING" >> $GITHUB_OUTPUT
        echo "modules_json=$MODULES_JSON" >> $GITHUB_OUTPUT
        echo "layers_json=$LAYERS_JSON" >> $GITHUB_OUTPUT
        echo "layer_count=$LAYER_COUNT" >> $GITHUB_OUTPUT
