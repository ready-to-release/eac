# Build Container Action
#
# Builds a container module and verifies the pushed image.
# Wraps build-module with container-specific verification.
#
# Container modules must have docker_build configuration in repository.yml
# with push: true and registry: ghcr.io
#
# Usage:
#   jobs:
#     build:
#       runs-on: ubuntu-latest
#       permissions:
#         packages: write
#       outputs:
#         image-name: ${{ steps.build.outputs.image-name }}
#         short-sha: ${{ steps.build.outputs.short-sha }}
#       steps:
#         - uses: actions/checkout@v6
#         - uses: ./.github/actions/build-container
#           id: build
#           with:
#             module: eac-ext
#           env:
#             GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Container
description: Build a container module and verify pushed image

inputs:
  module:
    description: Module moniker to build
    required: true
  component:
    description: 'Component name (for multi-container modules). When set, builds only this component and uses its name for image naming.'
    required: false
    default: ''
  trigger-run-id:
    description: 'Run ID of trigger workflow (for artifact download). If empty, builds from source.'
    required: false
    default: ''
  commit-sha:
    description: 'Commit SHA for artifact lookup and image tagging. Falls back to github.sha if empty.'
    required: false
    default: ''
  download-modules:
    description: 'Space-separated list of modules to download from CI before build'
    required: false
    default: ''
  upload-artifact:
    description: Whether to upload build artifacts
    required: false
    default: 'true'
  extra-args:
    description: Additional arguments to pass to the build command
    required: false
    default: ''
  registry:
    description: Container registry
    required: false
    default: 'ghcr.io'
  token:
    description: 'GitHub token for registry authentication (defaults to github.token)'
    required: false
    default: ''

outputs:
  image-name:
    description: Full image name (registry/owner/module)
    value: ${{ steps.vars.outputs.image-name }}
  short-sha:
    description: Short commit SHA used for image tag
    value: ${{ steps.vars.outputs.short-sha }}
  image-tag:
    description: Full image tag (sha-{short-sha})
    value: ${{ steps.vars.outputs.image-tag }}
  artifact-name:
    description: Name of the uploaded artifact
    value: ${{ steps.build.outputs.artifact-name }}

runs:
  using: composite
  steps:
    - name: Set variables
      id: vars
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        COMPONENT: ${{ inputs.component }}
        REGISTRY: ${{ inputs.registry }}
        COMMIT_SHA: ${{ inputs.commit-sha || github.sha }}
      run: |
        SHORT_SHA="${COMMIT_SHA:0:7}"
        # Use component name for image naming when building a specific component
        IMAGE_SUFFIX="${COMPONENT:-$MODULE}"
        IMAGE_NAME="$REGISTRY/${{ github.repository_owner }}/$IMAGE_SUFFIX"
        IMAGE_TAG="sha-$SHORT_SHA"

        echo "short-sha=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "image-name=$IMAGE_NAME" >> $GITHUB_OUTPUT
        echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

        echo "Container build configuration:"
        echo "  Module: $MODULE"
        if [ -n "$COMPONENT" ]; then
          echo "  Component: $COMPONENT"
        fi
        echo "  Image: $IMAGE_NAME:$IMAGE_TAG"

    # Login to container registry before build (required for push)
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.token || github.token }}

    # Download specific modules needed for integration testing
    - name: Download Module Dependencies
      if: ${{ inputs.download-modules != '' }}
      uses: ./.github/actions/download-module-deps
      with:
        module: ${{ inputs.download-modules }}
        trigger-run-id: ${{ inputs.trigger-run-id }}
        commit-sha: ${{ inputs.commit-sha || github.sha }}

    - name: Prepare build args
      id: build-args
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        ARGS="$EXTRA_ARGS"
        if [ -n "$COMPONENT" ]; then
          ARGS="$ARGS --component $COMPONENT"
        fi
        echo "args=$ARGS" >> $GITHUB_OUTPUT

    - name: Determine artifact name
      id: artifact-name
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        COMPONENT: ${{ inputs.component }}
      run: |
        if [ -n "$COMPONENT" ]; then
          echo "name=build-artifacts-${MODULE}-${COMPONENT}" >> $GITHUB_OUTPUT
        else
          echo "name=build-artifacts-${MODULE}" >> $GITHUB_OUTPUT
        fi

    - name: Build container module
      id: build
      uses: ./.github/actions/build-module
      with:
        module: ${{ inputs.module }}
        trigger-run-id: ${{ inputs.trigger-run-id }}
        upload-artifact: ${{ inputs.upload-artifact }}
        artifact-name: ${{ steps.artifact-name.outputs.name }}
        extra-args: ${{ steps.build-args.outputs.args }}
        # Container modules use buildx which is auto-detected from module type

    - name: Verify pushed image
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.vars.outputs.image-name }}
        IMAGE_TAG: ${{ steps.vars.outputs.image-tag }}
        MODULE: ${{ inputs.module }}
      run: |
        echo "Verifying pushed image..."
        echo ""

        # Pull the image to verify it was pushed successfully
        echo "Pulling $IMAGE_NAME:$IMAGE_TAG..."
        if ! docker pull "$IMAGE_NAME:$IMAGE_TAG"; then
          echo "::error::Failed to pull container image $IMAGE_NAME:$IMAGE_TAG"
          echo "The container build may have failed to push to the registry."
          echo ""
          echo "Troubleshooting:"
          echo "  1. Ensure GITHUB_TOKEN has packages:write permission"
          echo "  2. Check the build logs above for push errors"
          echo "  3. Verify the module's docker_build configuration"
          exit 1
        fi

        echo ""
        echo "Checking image labels..."
        docker inspect "$IMAGE_NAME:$IMAGE_TAG" --format='{{json .Config.Labels}}' | jq '.' || true

        echo ""
        echo "✓ Container image verified: $IMAGE_NAME:$IMAGE_TAG"

