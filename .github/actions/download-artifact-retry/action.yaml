# Download Artifact with Retry
#
# Wraps actions/download-artifact@v4 with retry logic for transient failures.

name: Download Artifact (with retry)
description: Download artifact with automatic retry on failure

inputs:
  name:
    description: 'Artifact name'
    required: true
  path:
    description: 'Path to download to'
    required: false
    default: ''
  run-id:
    description: 'Run ID to download from (omit to download from current run)'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for cross-run downloads'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # When run-id IS provided - download from specific run
    - name: Download Artifact (attempt 1, cross-run)
      id: download1-cross
      if: inputs.run-id != ''
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token || github.token }}

    - name: Wait before retry (cross-run)
      if: inputs.run-id != '' && steps.download1-cross.outcome == 'failure'
      shell: bash
      run: |
        echo "Download failed, waiting 10s before retry..."
        sleep 10

    - name: Retry Download (attempt 2, cross-run)
      id: download2-cross
      if: inputs.run-id != '' && steps.download1-cross.outcome == 'failure'
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token || github.token }}

    - name: Wait before final retry (cross-run)
      if: inputs.run-id != '' && steps.download1-cross.outcome == 'failure' && steps.download2-cross.outcome == 'failure'
      shell: bash
      run: |
        echo "Download failed again, waiting 30s before final retry..."
        sleep 30

    - name: Retry Download (attempt 3, cross-run)
      id: download3-cross
      if: inputs.run-id != '' && steps.download1-cross.outcome == 'failure' && steps.download2-cross.outcome == 'failure'
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token || github.token }}

    # When run-id is NOT provided - download from current run
    - name: Download Artifact (attempt 1, current run)
      id: download1-current
      if: inputs.run-id == ''
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}

    - name: Wait before retry (current run)
      if: inputs.run-id == '' && steps.download1-current.outcome == 'failure'
      shell: bash
      run: |
        echo "Download failed, waiting 10s before retry..."
        sleep 10

    - name: Retry Download (attempt 2, current run)
      id: download2-current
      if: inputs.run-id == '' && steps.download1-current.outcome == 'failure'
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}

    - name: Wait before final retry (current run)
      if: inputs.run-id == '' && steps.download1-current.outcome == 'failure' && steps.download2-current.outcome == 'failure'
      shell: bash
      run: |
        echo "Download failed again, waiting 30s before final retry..."
        sleep 30

    - name: Retry Download (attempt 3, current run)
      id: download3-current
      if: inputs.run-id == '' && steps.download1-current.outcome == 'failure' && steps.download2-current.outcome == 'failure'
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
