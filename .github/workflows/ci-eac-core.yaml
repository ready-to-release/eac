name: "ci-eac-core (stage 1-7)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  ci-eac-core:
    uses: ./.github/workflows/_module-ci.yaml
    with:
      module: eac-core
      ref: ${{ inputs.ref }}
      sha: ${{ inputs.sha }}
      trigger_run_id: ${{ inputs.trigger_run_id }}
      scans: ''  # No scans for core library
