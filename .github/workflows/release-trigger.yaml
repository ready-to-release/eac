# Release Trigger - Orchestrates pending releases after CI completion
#
# This workflow checks for pending releases and dispatches them all in parallel.
# Each release template's config job derives whether it needs to await dependencies
# (e.g., bundle releases await their dependency releases via core config).
#
# It can be invoked:
# 1. Automatically by change-trigger.yaml after CI completes
# 2. Manually via workflow_dispatch to retry failed releases
#
# Pipeline:
# 1. await-ci: Verify CI has passed (should be instant if called from change-trigger)
# 2. await-releases: Wait for any active release workflows to complete
# 3. check-pending: Detect pending releases (semver from changelog, calver from CI)
# 4. dispatch: Trigger all pending releases in parallel (each handles its own deps)

name: "Release Trigger"

on:
  workflow_dispatch:
    inputs:
      skip-ci-await:
        description: 'Skip CI await (use when CI already verified)'
        required: false
        type: boolean
        default: false
      dispatched-modules:
        description: 'Space-separated list of modules that had CI dispatched (optional, for calver detection)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  trigger-releases:
    name: Trigger Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands
        # No trigger-run-id - this is a standalone workflow dispatch, build from source

      # Step 1: Verify CI has passed (should be instant if called from change-trigger)
      - name: Await CI workflows
        if: inputs.skip-ci-await != true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
        run: |
          echo "Verifying CI has passed for current commit..."
          echo ""
          # Short timeout since CI should already be complete
          ${COMMANDS:?COMMANDS not set} pipeline await-ci --timeout 60 || {
            echo ""
            echo "::warning::CI not complete - waiting longer..."
            ${COMMANDS:?COMMANDS not set} pipeline await-ci --timeout 1800
          }
          echo ""
          echo "CI verification complete"

      # Step 2: Wait for any active release workflows to complete
      - name: Await active releases
        env:
          GH_TOKEN: ${{ github.token }}
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
        run: |
          echo "Checking for active release workflows..."
          # Exclude ourselves to avoid waiting for our own workflow
          ${COMMANDS:?COMMANDS not set} pipeline await-release --timeout 600 --exclude release-trigger.yaml
          echo "No conflicting releases in progress"

      # Step 3: Check for pending releases (semver from changelog, calver from dispatched CI)
      - name: Check for pending releases
        id: check
        uses: ./.github/actions/check-pending-releases
        with:
          dispatched-modules: ${{ inputs.dispatched-modules }}

      # Step 4: Dispatch all pending releases in parallel
      # Each release template has a config job that derives whether to await deps
      - name: Dispatch pending releases
        if: steps.check.outputs.has_pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          MODULES_JSON: ${{ steps.check.outputs.modules_json }}
        run: |
          echo "Dispatching all pending releases in parallel..."
          echo ""

          TOTAL=0
          for row in $(echo "$MODULES_JSON" | jq -r '.[] | @base64'); do
            MODULE=$(echo "$row" | base64 -d | jq -r '.module')
            VERSION=$(echo "$row" | base64 -d | jq -r '.version')
            TYPE=$(echo "$row" | base64 -d | jq -r '.type')

            WORKFLOW="release-${MODULE}.yaml"

            if [ ! -f ".github/workflows/$WORKFLOW" ]; then
              echo "  [$MODULE] No release workflow found: $WORKFLOW - skipping"
              continue
            fi

            echo "  [$MODULE] ($TYPE) Dispatching $WORKFLOW"

            # Build dispatch args - semver modules get version, calver auto-generates
            DISPATCH_ARGS=""
            if [ "$TYPE" = "semver" ] && [ -n "$VERSION" ]; then
              DISPATCH_ARGS="-f version=$VERSION"
            fi

            gh workflow run "$WORKFLOW" --ref main $DISPATCH_ARGS
            TOTAL=$((TOTAL + 1))
            sleep 2
          done

          echo ""
          echo "Dispatched $TOTAL release workflow(s) in parallel"
          echo "Each release template handles its own dependency awaiting via core config."

      - name: Release Summary
        if: always()
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
        run: |
          echo "## Release Trigger" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check.outputs.has_pending }}" = "true" ]; then
            MODULES_JSON='${{ steps.check.outputs.modules_json }}'
            echo "**Pending releases dispatched in parallel:**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Module | Version | Type |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|---------|------|" >> $GITHUB_STEP_SUMMARY
            for row in $(echo "$MODULES_JSON" | jq -r '.[] | @base64'); do
              MODULE=$(echo "$row" | base64 -d | jq -r '.module')
              VERSION=$(echo "$row" | base64 -d | jq -r '.version')
              TYPE=$(echo "$row" | base64 -d | jq -r '.type')
              echo "| $MODULE | $VERSION | $TYPE |" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Each release workflow derives its own config (release type, dep awaiting) from core." >> $GITHUB_STEP_SUMMARY
          else
            echo "No pending releases detected." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Releases are triggered when:" >> $GITHUB_STEP_SUMMARY
            echo "- **Semver modules**: CHANGELOG.md has unreleased version" >> $GITHUB_STEP_SUMMARY
            echo "- **Calver modules**: CI passed for module with release workflow" >> $GITHUB_STEP_SUMMARY
          fi
