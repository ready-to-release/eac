name: "ci-books (stage 1-6)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  build:
    name: Build PDF Books
    runs-on: ubuntu-latest
    outputs:
      pdf_count: ${{ steps.verify.outputs.pdf_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache MkDocs PDF image
        uses: docker/build-push-action@v6
        with:
          context: ./containers/mkdocs-pdf
          file: ./containers/mkdocs-pdf/Dockerfile
          tags: cli-mkdocs-pdf:latest
          load: true
          cache-from: type=gha,scope=mkdocs-pdf
          cache-to: type=gha,mode=max,scope=mkdocs-pdf

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands
        with:
          trigger-run-id: ${{ inputs.trigger_run_id }}

      - name: Setup Module Dependencies
        uses: ./.github/actions/setup-module-deps
        with:
          module: books
          commands-path: ${{ steps.commands.outputs.commands-path }}

      - name: Build PDF Books
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"
          echo "Building PDF documentation (output mode from books.yml)..."
          # Build only default books (for faster CI feedback)
          $COMMANDS build books

      - name: Verify PDF outputs
        id: verify
        run: |
          # Each book has its own output directory
          BOOKS_DIR="out/build/books"

          echo "Checking for PDF outputs..."

          # Find all PDFs in the books output directory
          PDF_COUNT=$(find "$BOOKS_DIR" -name "*.pdf" 2>/dev/null | wc -l)

          if [ "$PDF_COUNT" -eq 0 ]; then
            echo "::warning::No PDF files found - all books may have default: false"
            echo "Release workflow will build all books with --all flag"
          else
            echo "PDF books built successfully:"
            find "$BOOKS_DIR" -name "*.pdf" -exec du -h {} \; | while read size file; do
              echo "  $file: $size"
            done
          fi

          echo "pdf_count=$PDF_COUNT" >> $GITHUB_OUTPUT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-artifacts-books
          path: out/build/books/**

      - name: Build Summary
        if: always()
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"

          echo "## Build: books" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "PDF documentation books built successfully." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### PDF Books" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Book | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            find out/build/books -name "*.pdf" -exec sh -c 'echo "| $(basename {}) | $(du -h {} | cut -f1) |"' \; >> $GITHUB_STEP_SUMMARY
          else
            echo "PDF book build failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Common Issues" >> $GITHUB_STEP_SUMMARY
            echo "- Docker image build failure" >> $GITHUB_STEP_SUMMARY
            echo "- Book preprocessing failures" >> $GITHUB_STEP_SUMMARY
            echo "- Missing PDF template styles" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            $COMMANDS pipeline ci summary-link ${{ github.run_id }} --type build >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts uploaded as \`build-artifacts-books\`" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    # Skip tests if no PDFs were built (all books have default: false)
    if: needs.build.outputs.pdf_count != '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands
        with:
          trigger-run-id: ${{ inputs.trigger_run_id }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v6
        with:
          name: build-artifacts-books
          path: out/build/books

      - name: Test Module (Commit Suite - L0-L2)
        run: ${{ steps.commands.outputs.commands-path }} test books --suite commit

      - name: Test Module (Acceptance Suite - L3)
        # Skip acceptance tests for PRs - only run on main/release branches
        if: ${{ !startsWith(inputs.ref, 'refs/pull/') }}
        run: ${{ steps.commands.outputs.commands-path }} test books --suite acceptance

      - name: Test Summary
        if: always()
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"

          echo "## Test: books" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "PDF book validation tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "PDF book validation tests failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            $COMMANDS pipeline ci summary-link ${{ github.run_id }} --type books --artifact build-artifacts-books >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Tests Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Level | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| commit | L0-L2 | Unit and integration tests |" >> $GITHUB_STEP_SUMMARY
          echo "| acceptance | L3 | Acceptance verification tests |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Checks Performed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- PDF file integrity" >> $GITHUB_STEP_SUMMARY
          echo "- Book preprocessing validation" >> $GITHUB_STEP_SUMMARY
          echo "- Generated content presence" >> $GITHUB_STEP_SUMMARY

  trigger-release:
    name: Trigger Release
    needs: test
    runs-on: ubuntu-latest
    # Only trigger release on main branch, NEVER for PRs
    # (test job will be skipped if no PDFs built, which also skips this job)
    if: |
      (github.ref == 'refs/heads/main' || inputs.ref == 'refs/heads/main') &&
      !startsWith(inputs.ref || github.ref, 'refs/pull/')
    steps:
      - name: Trigger release workflow
        run: |
          # Trigger PDF book release
          gh workflow run release-books.yaml \
            --repo ${{ github.repository }} \
            -f ci_run_id=${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release Trigger Summary
        run: |
          echo "## Release Triggered: books" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered release workflow:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`release-books.yaml\` | Build and release PDF books |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| CI Run ID | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
