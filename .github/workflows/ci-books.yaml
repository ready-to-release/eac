name: "ci-books (stage 1-7)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  # =============================================================================
  # Build PDF Books
  # =============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build Module (all PDF books)
        uses: ./.github/actions/build-module
        with:
          module: books
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}
          extra-args: '--all'

  # =============================================================================
  # Test
  # =============================================================================
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Test Module
        uses: ./.github/actions/test-module
        with:
          module: books
          trigger-run-id: ${{ inputs.trigger_run_id }}
          suites: ${{ (inputs.ref != '' && startsWith(inputs.ref, 'refs/pull/')) && 'component' || 'component,integration,acceptance' }}

  # =============================================================================
  # Trigger Release (main branch only)
  # =============================================================================
  trigger-release:
    name: Trigger Release
    needs: test
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || inputs.ref == 'refs/heads/main') && !startsWith(inputs.ref || github.ref, 'refs/pull/')
    steps:
      - name: Trigger release workflow
        run: |
          gh workflow run release-books.yaml \
            --repo ${{ github.repository }} \
            -f ci_run_id=${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release Trigger Summary
        run: |
          echo "## Release Triggered: books" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered release workflow:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`release-books.yaml\` | Create GitHub Release with PDF books |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger Run ID | \`${{ inputs.trigger_run_id || 'none (standalone)' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CI Books Run ID | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
