name: "ci-implicit-r2r-cli (stage 1-7)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''

jobs:
  ci:
    uses: ./.github/workflows/_module-ci.yaml
    with:
      module: implicit-r2r-cli
      ref: ${{ inputs.ref }}
      sha: ${{ inputs.sha }}
      trigger_run_id: ${{ inputs.trigger_run_id }}
      build-args: '--all'
      cross-compile-windows: true
      no-deps: false  # Needs eac-commands dependency for testing
      test-on-windows: true
      scans: ''  # No scans for invoker scripts
