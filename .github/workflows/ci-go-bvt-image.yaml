name: "ci-go-bvt-image (stage 1-6)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to build'
        default: ''

permissions:
  actions: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/go-bvt-image

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image with CI tags
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "Building and pushing multi-platform image with CI tags..."
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            containers/go-bvt-image

          echo ""
          echo "✅ Published CI images:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA"

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image from GHCR
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "Pulling CI image..."
          docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA"
          docker tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA" go-bvt-image:test
          docker images go-bvt-image:test

      - name: Test container - Go version
        run: docker run --rm go-bvt-image:test go version

      - name: Test container - Git version
        run: docker run --rm go-bvt-image:test git --version

      - name: Test container - GitHub CLI
        run: docker run --rm go-bvt-image:test gh --version

      - name: Test container - jq
        run: docker run --rm go-bvt-image:test jq --version

      - name: Test container - Docker CLI
        run: docker run --rm go-bvt-image:test docker --version

      - name: Test container - Run Go build
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            go-bvt-image:test \
            sh -c "cd src/commands && go build ."

  trigger-release:
    name: Trigger Release
    needs: test
    runs-on: ubuntu-latest
    # Only trigger release on main branch
    if: github.ref == 'refs/heads/main' || inputs.ref == 'refs/heads/main'
    steps:
      - name: Trigger release workflow
        run: |
          gh workflow run release-go-bvt-image.yml \
            --repo ${{ github.repository }} \
            -f ci_run_id=${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
