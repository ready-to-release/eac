name: "ci-go-bvt-image (stage 1-6)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to build'
        default: ''

permissions:
  actions: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/go-bvt-image

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image with CI tags
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "Building and pushing multi-platform image with CI tags..."
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            containers/go-bvt-image

          echo ""
          echo "✅ Published CI images:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA"

      - name: Build Summary
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "## Build: go-bvt-image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Built and pushed multi-platform Go CI container image." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Published Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| CI | \`${IMAGE_REF}:ci\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${IMAGE_REF}:sha-${SHORT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Build Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile | \`containers/go-bvt-image/Dockerfile\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image from GHCR
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "Pulling CI image..."
          docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA"
          docker tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA" go-bvt-image:test
          docker images go-bvt-image:test

      - name: Test container - Go version
        run: docker run --rm go-bvt-image:test go version

      - name: Test container - Git version
        run: docker run --rm go-bvt-image:test git --version

      - name: Test container - jq
        run: docker run --rm go-bvt-image:test jq --version

      - name: Test container - Run Go build
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            go-bvt-image:test \
            sh -c "cd src/commands && go build ."

      - name: Test Summary
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "## Test: go-bvt-image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All container tool verification tests passed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Tools Verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Go | \`go version\` | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Git | \`git --version\` | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| jq | \`jq --version\` | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Build | \`go build src/commands\` | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Tested Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY

  trigger-release:
    name: Trigger Release
    needs: test
    runs-on: ubuntu-latest
    # Only trigger release on main branch
    if: github.ref == 'refs/heads/main' || inputs.ref == 'refs/heads/main'
    steps:
      - name: Trigger release workflow
        run: |
          gh workflow run release-go-bvt-image.yml \
            --repo ${{ github.repository }} \
            -f ci_run_id=${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release Trigger Summary
        run: |
          echo "## Release Triggered: go-bvt-image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Triggered \`release-go-bvt-image.yml\` workflow to publish release tags." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| CI Run ID | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
