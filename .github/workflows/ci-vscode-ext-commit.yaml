name: "ci-vscode-ext-commit (stage 1-6)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands
        with:
          trigger-run-id: ${{ inputs.trigger_run_id }}

      - name: Build Module
        uses: ./.github/actions/build-module
        with:
          module: vscode-ext-commit
          commands-path: ${{ steps.commands.outputs.commands-path }}
          setup-deps: auto

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands
        with:
          trigger-run-id: ${{ inputs.trigger_run_id }}

      - name: Test Module
        uses: ./.github/actions/test-module
        with:
          module: vscode-ext-commit
          commands-path: ${{ steps.commands.outputs.commands-path }}
          setup-deps: auto
          # PRs run commit suite only; main/release branches run full suite
          suites: ${{ startsWith(inputs.ref, 'refs/pull/') && 'commit' || 'commit,acceptance' }}
