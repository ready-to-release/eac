name: "Release docs"

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID to download artifacts from'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts from CI
        if: inputs.ci_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-docs
          path: out/build/docs
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Set up Go (no CI artifacts)
        if: inputs.ci_run_id == ''
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            src/commands/go.sum
            src/core/go.sum

      - name: Build docs (no CI artifacts)
        if: inputs.ci_run_id == ''
        run: |
          echo "No CI run ID provided - building docs..."
          go run ./src/commands build docs

      - name: Verify build output
        run: |
          if [ ! -f "out/build/docs/site/index.html" ]; then
            echo "❌ Error: Build output not found"
            ls -la out/build/docs/ || echo "out/build/docs/ does not exist"
            exit 1
          fi
          echo "✅ Build output verified"
          ls -la out/build/docs/site/

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/build/docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Documentation deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
