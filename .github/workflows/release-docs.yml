name: "Release docs"

on:
  workflow_run:
    workflows: ["ci-docs (stage 1-6)"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run on successful CI completion (or manual trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the commit from the triggering workflow run
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download build artifacts from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-docs
          path: out/build/docs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Set up Go (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'

      - name: Build docs (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual trigger - building docs..."
          go run ./src/commands build docs

      - name: Verify build output
        run: |
          if [ ! -f "out/build/docs/site/index.html" ]; then
            echo "❌ Error: Build output not found"
            ls -la out/build/docs/ || echo "out/build/docs/ does not exist"
            exit 1
          fi
          echo "✅ Build output verified"
          ls -la out/build/docs/site/

      - name: Calculate CalVer version
        id: version
        run: |
          # CalVer format: YYYY.MMDD.BUILDNUMBER
          YEAR=$(date -u +%Y)
          MMDD=$(date -u +%m%d)

          # Get the latest tag for docs to calculate build number
          LATEST_TAG=$(git tag -l "docs/${YEAR}.${MMDD}.*" | sort -V | tail -1)

          if [ -z "$LATEST_TAG" ]; then
            # No releases today, start at 1
            BUILD_NUMBER=1
          else
            # Extract the build number and increment
            CURRENT_BUILD=$(echo "$LATEST_TAG" | sed -E 's/docs\/[0-9]+\.[0-9]+\.([0-9]+)/\1/')
            BUILD_NUMBER=$((CURRENT_BUILD + 1))
          fi

          VERSION="${YEAR}.${MMDD}.${BUILD_NUMBER}"
          TAG_NAME="docs/${VERSION}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Calculated version: $VERSION"

      - name: Check for existing release
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"

          if gh release view "$TAG_NAME" 2>/dev/null; then
            echo "❌ Error: Release already exists for tag $TAG_NAME"
            exit 1
          fi

          echo "✅ No existing release found for $TAG_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create tag
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists"
          else
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
            echo "✅ Created and pushed tag: $TAG_NAME"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/build/docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          VERSION="${{ steps.version.outputs.version }}"

          cat << EOF > release_notes.md
          # Documentation Release $VERSION

          ## What's New

          Documentation release version $VERSION deployed to GitHub Pages.

          ## Links

          - **Live Documentation**: ${{ steps.deployment.outputs.page_url }}

          ## Release Information

          - **Version**: $VERSION (CalVer: YYYY.MMDD.BUILD)
          - **Commit**: ${{ github.sha }}
          - **Tag**: $TAG_NAME

          ---

          Generated with [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

          gh release create "$TAG_NAME" \
            --title "Documentation v$VERSION" \
            --notes-file release_notes.md

          echo "✅ Release created successfully"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Released Documentation version **${{ steps.version.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ steps.version.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Version Format" >> $GITHUB_STEP_SUMMARY
          echo "CalVer: YYYY.MMDD.BUILD" >> $GITHUB_STEP_SUMMARY
