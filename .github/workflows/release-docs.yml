name: "release-docs (stage 7+)"

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID to download artifacts from'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create calver tag
        id: tag
        run: |
          # Generate calver tag: docs/YYYY.MM.DD or docs/YYYY.MM.DD.N for multiple releases per day
          BASE_TAG="docs/$(date -u +%Y.%m.%d)"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch all tags
          git fetch --tags --force

          # Check if base tag exists, if so append incrementing suffix
          TAG="$BASE_TAG"
          SUFFIX=1
          while git rev-parse "$TAG" >/dev/null 2>&1; do
            TAG="${BASE_TAG}.${SUFFIX}"
            SUFFIX=$((SUFFIX + 1))
          done

          echo "Creating tag: $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ Created tag: $TAG"

      - name: Download build artifacts from CI
        if: inputs.ci_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-docs
          path: out/build/docs
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Set up Go (no CI artifacts)
        if: inputs.ci_run_id == ''
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            src/commands/go.sum
            src/core/go.sum

      - name: Build docs (no CI artifacts)
        if: inputs.ci_run_id == ''
        run: |
          echo "No CI run ID provided - building docs..."
          go run ./src/commands build docs

      - name: Verify build output
        run: |
          if [ ! -f "out/build/docs/site/index.html" ]; then
            echo "❌ Error: Build output not found"
            ls -la out/build/docs/ || echo "out/build/docs/ does not exist"
            exit 1
          fi
          echo "✅ Build output verified"
          ls -la out/build/docs/site/

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/build/docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "## ✅ Documentation Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully deployed project documentation to GitHub Pages." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.ci_run_id }}" ]; then
            echo "| Source | CI artifacts from run #${{ inputs.ci_run_id }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Source | Built from source |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Site Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "out/build/docs/site" ]; then
            FILE_COUNT=$(find out/build/docs/site -type f | wc -l | tr -d ' ')
            HTML_COUNT=$(find out/build/docs/site -name "*.html" | wc -l | tr -d ' ')
            TOTAL_SIZE=$(du -sh out/build/docs/site | cut -f1)
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Files | ${FILE_COUNT} |" >> $GITHUB_STEP_SUMMARY
            echo "| HTML Pages | ${HTML_COUNT} |" >> $GITHUB_STEP_SUMMARY
            echo "| Total Size | ${TOTAL_SIZE} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Access" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 [**View Documentation**](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
