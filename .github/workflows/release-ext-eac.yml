# Release ext-eac - Container Image Release Workflow
#
# This workflow releases the EAC extension container image by retagging a CI-built image.
#
# CI Verification: Requires a successful ci-ext-eac.yaml run on the exact commit being released.
# This ensures the container image was built and tested before release.
#
# The workflow retags the CI-built image (sha-<short>) with release version tags.

name: "release-ext-eac (stage 7+)"

on:
  push:
    tags:
      - 'ext-eac/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver format: x.y.z)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CI status and find source image
        id: ci_check
        run: |
          echo "Checking CI coverage for ext-eac module..."
          COMMIT_SHA="${{ github.sha }}"
          echo "Current commit SHA: $COMMIT_SHA"
          echo "Repository: ${{ github.repository }}"

          MAX_WAIT_TIME=300  # 5 minutes
          CHECK_INTERVAL=15
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT_TIME ]; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Checking CI coverage (elapsed: ${ELAPSED}s)..."

            # Check for ci-ext-eac.yaml run on this exact commit
            CI_RUNS=$(gh run list \
              --commit $COMMIT_SHA \
              --workflow ci-ext-eac.yaml \
              --json status,conclusion \
              --limit 5)

            CI_SUCCESS=$(echo "$CI_RUNS" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
            CI_FAILED=$(echo "$CI_RUNS" | jq '[.[] | select(.status == "completed" and .conclusion == "failure")] | length')
            CI_RUNNING=$(echo "$CI_RUNS" | jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')

            if [ "$CI_SUCCESS" -gt "0" ]; then
              echo "✅ Found successful ci-ext-eac.yaml run for this exact commit"
              echo "image_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
              echo "Image will be sourced from: sha-${COMMIT_SHA:0:7}"
              exit 0
            fi

            if [ "$CI_FAILED" -gt "0" ]; then
              echo "❌ CI failed for this commit - cannot release"
              exit 1
            fi

            if [ "$CI_RUNNING" -gt "0" ]; then
              echo "⏳ ci-ext-eac.yaml is running for this commit - waiting..."
              sleep $CHECK_INTERVAL
              ELAPSED=$((ELAPSED + CHECK_INTERVAL))
              continue
            fi

            # No CI run found for this commit
            echo "⚠️  No ci-ext-eac.yaml run found for this commit"
            echo ""
            echo "A successful CI run is required before releasing."
            echo "Please trigger CI first:"
            echo "  gh workflow run ci-ext-eac.yaml --ref ${{ github.ref }}"
            echo ""
            echo "Waiting for CI to be triggered..."
            sleep $CHECK_INTERVAL
            ELAPSED=$((ELAPSED + CHECK_INTERVAL))

          done

          echo ""
          echo "❌ Timeout: No successful ci-ext-eac.yaml run found for this commit"
          echo ""
          echo "Please trigger CI and wait for it to complete:"
          echo "  gh workflow run ci-ext-eac.yaml --ref ${{ github.ref }}"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract and validate version
        id: extract_version
        run: |
          # Determine version based on trigger type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="ext-eac/$VERSION"
            echo "Manual trigger with version: $VERSION"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#ext-eac/}"
            echo "Tag trigger with version: $VERSION"
          fi

          # Validate semver format (x.y.z where x, y, z are non-negative integers)
          if ! echo "$VERSION" | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' > /dev/null; then
            echo "Error: Invalid semver format: $VERSION"
            echo "Expected format: x.y.z (e.g., 1.0.0)"
            exit 1
          fi

          # Reject versions with 'v' prefix
          if echo "$VERSION" | grep -E '^v' > /dev/null; then
            echo "Error: Version should not have 'v' prefix: $VERSION"
            echo "Use x.y.z format (e.g., 1.0.0 not v1.0.0)"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "✅ Valid semver: $VERSION"

      - name: Check for existing container image
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          IMAGE_NAME="ghcr.io/ready-to-release/ext-eac"

          echo "Checking if container image already exists for version $VERSION..."

          # Try to pull the specific version tag
          if docker pull "$IMAGE_NAME:$VERSION" 2>/dev/null; then
            echo ""
            echo "❌ Error: Container image already exists for version $VERSION"
            echo ""
            echo "Image: $IMAGE_NAME:$VERSION"
            echo ""
            echo "If you want to release a new version:"
            echo "1. Increment the version number"
            echo "2. Re-run this workflow with the new version"
            exit 1
          fi

          echo "✅ No existing container image found for version $VERSION"

      - name: Create tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"

          echo "Preparing to create tag: $TAG_NAME"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch all tags from remote
          echo "Fetching existing tags..."
          git fetch --tags --force

          # Check if tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "ℹ️  Tag $TAG_NAME already exists"
            echo "Using existing tag for release"
          else
            echo "Creating new tag: $TAG_NAME"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"

            echo "Pushing tag to remote..."
            git push origin "$TAG_NAME"

            echo "✅ Created and pushed tag: $TAG_NAME"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag and push release versions
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          IMAGE_NAME="ghcr.io/ready-to-release/ext-eac"

          # Use the image SHA from CI check (may be different from github.sha if module didn't need rebuild)
          IMAGE_SHA="${{ steps.ci_check.outputs.image_sha }}"
          SHORT_SHA="${IMAGE_SHA:0:7}"

          # Extract major and minor versions for additional tags
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)

          echo "Source image commit: $IMAGE_SHA"
          echo "Release commit: ${{ github.sha }}"
          if [ "$IMAGE_SHA" != "${{ github.sha }}" ]; then
            echo "ℹ️  Note: Source image is from a previous commit (no ext-eac changes since then)"
          fi
          echo ""

          echo "Retagging CI image sha-$SHORT_SHA with release tags..."
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$VERSION" \
            --tag "$IMAGE_NAME:$MAJOR.$MINOR" \
            --tag "$IMAGE_NAME:$MAJOR" \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_NAME:sha-$SHORT_SHA"

          echo ""
          echo "✅ Published release tags:"
          echo "  - $IMAGE_NAME:$VERSION"
          echo "  - $IMAGE_NAME:$MAJOR.$MINOR"
          echo "  - $IMAGE_NAME:$MAJOR"
          echo "  - $IMAGE_NAME:latest"
          echo ""
          echo "Source: $IMAGE_NAME:sha-$SHORT_SHA (from commit $IMAGE_SHA)"
          echo "Platforms: linux/amd64, linux/arm64"

      - name: Verify container images published
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          IMAGE_NAME="ghcr.io/ready-to-release/ext-eac"

          echo "Verifying published container images..."
          echo ""
          echo "Published tags:"
          echo "- $IMAGE_NAME:$VERSION"
          echo "- $IMAGE_NAME:latest"
          echo ""

          # Wait a moment for registry to be updated
          sleep 5

          echo "Pulling and verifying version tag..."
          docker pull "$IMAGE_NAME:$VERSION"
          docker inspect "$IMAGE_NAME:$VERSION" --format='Version: {{index .Config.Labels "org.opencontainers.image.version"}}'

          echo ""
          echo "✅ Container images successfully published to GHCR"

      - name: Summary
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"
          IMAGE_SHA="${{ steps.ci_check.outputs.image_sha }}"
          SHORT_SHA="${IMAGE_SHA:0:7}"

          echo "## ✅ EAC Extension Released" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully published **ext-eac v${VERSION}** container image to GitHub Container Registry." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Release Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${TAG_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source Image | \`sha-${SHORT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "$IMAGE_SHA" != "${{ github.sha }}" ]; then
            echo "| Note | Image from earlier build (no ext-eac changes since) |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Published Container Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`ghcr.io/ready-to-release/ext-eac:${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest | \`ghcr.io/ready-to-release/ext-eac:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Platforms" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Multi-architecture image supporting:" >> $GITHUB_STEP_SUMMARY
          echo "- \`linux/amd64\` (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- \`linux/arm64\` (Apple Silicon, ARM servers)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/ready-to-release/ext-eac:${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "📦 [**View GitHub Release**](https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME})" >> $GITHUB_STEP_SUMMARY
