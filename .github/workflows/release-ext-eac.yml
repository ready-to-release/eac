# Release ext-eac - Container Image Release Workflow
#
# This workflow releases the EAC extension container image by retagging a CI-built image.
#
# CI Verification Strategy:
# Since we use optimized CI (only changed modules are built), we can't require a direct
# CI run for every commit. Instead, we verify CI coverage AND find the correct source image:
#
# Strategy 1: Check for direct ext-eac.yaml CI run on this exact commit
#   - If found and successful → use image from THIS commit (sha-<short>)
#
# Strategy 2: Use `get changed modules ci` to check if ext-eac needs rebuild
#   - This uses the repository's dependency graph to determine if ext-eac
#     or any of its dependencies (src-core, src-commands) have changed
#   - If ext-eac IS in the list → code changed, need new build → wait/fail
#   - If ext-eac is NOT in the list → find last successful ext-eac.yaml run
#     and use THAT commit's image (the code hasn't changed since then)
#
# IMPORTANT: Unlike src-cli which builds from source, this workflow RETAGS an existing
# container image. We must use the image from the commit where ext-eac was actually built,
# which may be different from the current commit if only non-ext-eac files changed.
#
# The `image_sha` output from the CI check step determines which image to retag.

name: "Release ext-eac"

on:
  push:
    tags:
      - 'ext-eac/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver format: x.y.z)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            src/commands/go.sum
            src/core/go.sum

      - name: Check CI status and find source image
        id: ci_check
        run: |
          echo "Checking CI coverage for ext-eac module..."
          COMMIT_SHA="${{ github.sha }}"
          echo "Current commit SHA: $COMMIT_SHA"
          echo "Repository: ${{ github.repository }}"

          MAX_WAIT_TIME=300  # 5 minutes
          CHECK_INTERVAL=15
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT_TIME ]; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Checking CI coverage (elapsed: ${ELAPSED}s)..."

            # Check if any CI is currently running for this commit
            CI_REPO_STATUS=$(gh run list \
              --commit $COMMIT_SHA \
              --workflow ci-repository.yaml \
              --json status \
              --jq '.[0].status // "not_found"')

            if [ "$CI_REPO_STATUS" = "in_progress" ] || [ "$CI_REPO_STATUS" = "queued" ]; then
              echo "⏳ CI is running for this commit - waiting..."
              sleep $CHECK_INTERVAL
              ELAPSED=$((ELAPSED + CHECK_INTERVAL))
              continue
            fi

            # Strategy 1: Check for direct CI run on this commit
            echo ""
            echo "📋 Strategy 1: Check for ext-eac CI run on this exact commit..."
            DIRECT_RUNS=$(gh run list \
              --commit $COMMIT_SHA \
              --workflow ext-eac.yaml \
              --json status,conclusion,headSha \
              --limit 5)

            DIRECT_SUCCESS=$(echo "$DIRECT_RUNS" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
            DIRECT_FAILED=$(echo "$DIRECT_RUNS" | jq '[.[] | select(.status == "completed" and .conclusion == "failure")] | length')
            DIRECT_RUNNING=$(echo "$DIRECT_RUNS" | jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')

            if [ "$DIRECT_SUCCESS" -gt "0" ]; then
              echo "✅ Found successful ext-eac CI run for this exact commit"
              echo "image_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
              echo "Image will be sourced from: sha-${COMMIT_SHA:0:7}"
              exit 0
            fi

            if [ "$DIRECT_FAILED" -gt "0" ]; then
              echo "❌ CI failed for this commit - cannot release"
              exit 1
            fi

            if [ "$DIRECT_RUNNING" -gt "0" ]; then
              echo "⏳ ext-eac CI is running for this commit - waiting..."
              sleep $CHECK_INTERVAL
              ELAPSED=$((ELAPSED + CHECK_INTERVAL))
              continue
            fi

            # Strategy 2: No direct CI run found. Check if ext-eac even needs rebuilding.
            #
            # Unlike src-cli (which builds from source), ext-eac RETAGS an existing container
            # image. This means we need to find which commit's image to use.
            #
            # The `get changed modules ci` command tells us if ext-eac needs rebuilding.
            # If ext-eac is NOT in the list:
            #   - No files affecting ext-eac have changed since last CI
            #   - We can use the image from the last ext-eac build (it's still valid)
            #
            # If ext-eac IS in the list:
            #   - Files affecting ext-eac have changed but CI hasn't run
            #   - Must wait for CI to build a new image
            echo ""
            echo "📋 Strategy 2: Check if last successful CI covers this commit..."

            cd src/commands
            RESULT=$(go run . "get changed modules ci" --as-json 2>/dev/null || echo '{"is_bootstrap": true}')
            cd ../..

            echo "Change detection result:"
            echo "$RESULT" | jq . 2>/dev/null || echo "$RESULT"

            IS_BOOTSTRAP=$(echo "$RESULT" | jq -r '.is_bootstrap // true')
            MODULES=$(echo "$RESULT" | jq -r '.modules // [] | join(" ")')

            if [ "$IS_BOOTSTRAP" = "true" ]; then
              echo "⚠️  No previous successful CI found - bootstrap scenario"
              echo "❌ Cannot release without CI verification"
              echo ""
              echo "Please run CI first:"
              echo "  gh workflow run ci-repository.yaml"
              exit 1
            fi

            # If ext-eac is in the modules list, it needs rebuilding (code changed, no image yet)
            if echo " $MODULES " | grep -q " ext-eac "; then
              echo ""
              echo "⚠️  ext-eac requires rebuild based on dependency analysis"
              echo "Modules requiring rebuild: $MODULES"
              echo ""
              echo "The optimized CI should have triggered a build for these changes."
              echo "If CI hasn't run yet, trigger it manually:"
              echo "  gh workflow run ci-repository.yaml"
              echo ""
              echo "Waiting for CI to complete..."
              sleep $CHECK_INTERVAL
              ELAPSED=$((ELAPSED + CHECK_INTERVAL))
              continue
            fi

            # ext-eac is NOT in the modules list, meaning nothing affecting it has changed.
            # Find the last successful ext-eac.yaml run - that image is still valid.
            # This is the key difference from src-cli: we MUST use the image from when
            # ext-eac was actually built, not the current commit.
            echo ""
            echo "📋 Finding last successful ext-eac build for image source..."
            LAST_EAC_SHA=$(gh run list \
              -w ext-eac.yaml \
              -s success \
              -L 1 \
              --json headSha \
              -q '.[0].headSha // ""')

            if [ -z "$LAST_EAC_SHA" ]; then
              echo "❌ No successful ext-eac CI run found"
              echo "Cannot release without a built container image."
              echo ""
              echo "Please run CI first:"
              echo "  gh workflow run ci-repository.yaml"
              exit 1
            fi

            echo "✅ ext-eac does not require rebuild - CI coverage valid"
            echo "Last ext-eac build was at commit: $LAST_EAC_SHA"
            echo "Image will be sourced from: sha-${LAST_EAC_SHA:0:7}"
            echo "image_sha=$LAST_EAC_SHA" >> $GITHUB_OUTPUT
            exit 0

          done

          echo ""
          echo "❌ Timeout: Could not verify CI coverage for this release"
          echo ""
          echo "Either:"
          echo "1. Wait for current CI to complete and re-run this release, OR"
          echo "2. Manually trigger CI: gh workflow run ci-repository.yaml"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract and validate version
        id: extract_version
        run: |
          # Determine version based on trigger type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="ext-eac/$VERSION"
            echo "Manual trigger with version: $VERSION"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#ext-eac/}"
            echo "Tag trigger with version: $VERSION"
          fi

          # Validate semver format (x.y.z where x, y, z are non-negative integers)
          if ! echo "$VERSION" | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' > /dev/null; then
            echo "Error: Invalid semver format: $VERSION"
            echo "Expected format: x.y.z (e.g., 1.0.0)"
            exit 1
          fi

          # Reject versions with 'v' prefix
          if echo "$VERSION" | grep -E '^v' > /dev/null; then
            echo "Error: Version should not have 'v' prefix: $VERSION"
            echo "Use x.y.z format (e.g., 1.0.0 not v1.0.0)"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "✅ Valid semver: $VERSION"

      - name: Check for existing container image
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          IMAGE_NAME="ghcr.io/ready-to-release/ext-eac"

          echo "Checking if container image already exists for version $VERSION..."

          # Try to pull the specific version tag
          if docker pull "$IMAGE_NAME:$VERSION" 2>/dev/null; then
            echo ""
            echo "❌ Error: Container image already exists for version $VERSION"
            echo ""
            echo "Image: $IMAGE_NAME:$VERSION"
            echo ""
            echo "If you want to release a new version:"
            echo "1. Increment the version number"
            echo "2. Re-run this workflow with the new version"
            exit 1
          fi

          echo "✅ No existing container image found for version $VERSION"

      - name: Create tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"

          echo "Preparing to create tag: $TAG_NAME"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch all tags from remote
          echo "Fetching existing tags..."
          git fetch --tags --force

          # Check if tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "ℹ️  Tag $TAG_NAME already exists"
            echo "Using existing tag for release"
          else
            echo "Creating new tag: $TAG_NAME"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"

            echo "Pushing tag to remote..."
            git push origin "$TAG_NAME"

            echo "✅ Created and pushed tag: $TAG_NAME"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag and push release versions
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          IMAGE_NAME="ghcr.io/ready-to-release/ext-eac"

          # Use the image SHA from CI check (may be different from github.sha if module didn't need rebuild)
          IMAGE_SHA="${{ steps.ci_check.outputs.image_sha }}"
          SHORT_SHA="${IMAGE_SHA:0:7}"

          # Extract major and minor versions for additional tags
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)

          echo "Source image commit: $IMAGE_SHA"
          echo "Release commit: ${{ github.sha }}"
          if [ "$IMAGE_SHA" != "${{ github.sha }}" ]; then
            echo "ℹ️  Note: Source image is from a previous commit (no ext-eac changes since then)"
          fi
          echo ""

          echo "Retagging CI image sha-$SHORT_SHA with release tags..."
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$VERSION" \
            --tag "$IMAGE_NAME:$MAJOR.$MINOR" \
            --tag "$IMAGE_NAME:$MAJOR" \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_NAME:sha-$SHORT_SHA"

          echo ""
          echo "✅ Published release tags:"
          echo "  - $IMAGE_NAME:$VERSION"
          echo "  - $IMAGE_NAME:$MAJOR.$MINOR"
          echo "  - $IMAGE_NAME:$MAJOR"
          echo "  - $IMAGE_NAME:latest"
          echo ""
          echo "Source: $IMAGE_NAME:sha-$SHORT_SHA (from commit $IMAGE_SHA)"
          echo "Platforms: linux/amd64, linux/arm64"

      - name: Verify container images published
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          IMAGE_NAME="ghcr.io/ready-to-release/ext-eac"

          echo "Verifying published container images..."
          echo ""
          echo "Published tags:"
          echo "- $IMAGE_NAME:$VERSION"
          echo "- $IMAGE_NAME:latest"
          echo ""

          # Wait a moment for registry to be updated
          sleep 5

          echo "Pulling and verifying version tag..."
          docker pull "$IMAGE_NAME:$VERSION"
          docker inspect "$IMAGE_NAME:$VERSION" --format='Version: {{index .Config.Labels "org.opencontainers.image.version"}}'

          echo ""
          echo "✅ Container images successfully published to GHCR"

      - name: Summary
        run: |
          IMAGE_SHA="${{ steps.ci_check.outputs.image_sha }}"
          SHORT_SHA="${IMAGE_SHA:0:7}"

          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Released EAC Extension version **${{ steps.extract_version.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/ready-to-release/ext-eac:${{ steps.extract_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/ready-to-release/ext-eac:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Source" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: ${{ steps.extract_version.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Image**: \`sha-$SHORT_SHA\` (from commit \`$IMAGE_SHA\`)" >> $GITHUB_STEP_SUMMARY
          if [ "$IMAGE_SHA" != "${{ github.sha }}" ]; then
            echo "- ℹ️ Image sourced from previous build (no ext-eac changes since)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms" >> $GITHUB_STEP_SUMMARY
          echo "- linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.extract_version.outputs.tag_name }})" >> $GITHUB_STEP_SUMMARY
