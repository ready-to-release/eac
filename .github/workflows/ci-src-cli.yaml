name: "ci-src-cli (stage 1-6)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      ci_image:
        required: true
        type: string
        description: 'Full CI container image reference'
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      ci_image:
        required: true
        type: string
        description: 'Full CI container image reference (e.g. ghcr.io/ready-to-release/go-bvt-image:2025.11.27)'

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.ci_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build Module
        working-directory: ./src/commands
        run: go run . build src-cli

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-src-cli
          path: |
            out/build/src-cli/**
            src/cli/**/generated_*.go
            src/cli/**/*.ebnf
            src/cli/**/schema.json

      - name: Build Summary
        run: |
          echo "## Build: src-cli" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ CLI binaries built for all platforms." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Built Binaries" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Binary | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|------|" >> $GITHUB_STEP_SUMMARY

          for file in out/build/src-cli/r2r-linux out/build/src-cli/r2r-darwin-amd64 out/build/src-cli/r2r-darwin-arm64 out/build/src-cli/r2r-windows.exe; do
            if [ -f "$file" ]; then
              name=$(basename "$file")
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "0")
              size_mb=$(echo "scale=1; $size / 1048576" | bc)
              platform=""
              case "$name" in
                r2r-linux) platform="Linux AMD64" ;;
                r2r-darwin-amd64) platform="macOS Intel" ;;
                r2r-darwin-arm64) platform="macOS Apple Silicon" ;;
                r2r-windows.exe) platform="Windows AMD64" ;;
              esac
              echo "| ${platform} | \`${name}\` | ${size_mb} MB |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Module | \`src-cli\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CI Image | \`${{ inputs.ci_image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Artifacts uploaded as \`build-artifacts-src-cli\`" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.ci_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-src-cli

      - name: Restore Executable Permissions
        run: |
          chmod +x out/build/src-cli/r2r-linux
          chmod +x out/build/src-cli/r2r-darwin-amd64
          chmod +x out/build/src-cli/r2r-darwin-arm64

      - name: Test Module
        working-directory: ./src/commands
        run: go run . test src-cli

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-src-cli
          path: out/test/**/src-cli/**

      - name: Test Summary
        if: always()
        run: |
          echo "## Test: src-cli" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All CLI tests passed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Module | \`src-cli\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Command | \`go run . test src-cli\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CI Image | \`${{ inputs.ci_image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### What Was Tested" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- CLI argument parsing" >> $GITHUB_STEP_SUMMARY
          echo "- Command execution (show, build, test, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "- Extension loading and execution" >> $GITHUB_STEP_SUMMARY
          echo "- Version output verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Binaries Verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`r2r-linux\` (Linux AMD64)" >> $GITHUB_STEP_SUMMARY
          echo "- \`r2r-darwin-amd64\` (macOS Intel)" >> $GITHUB_STEP_SUMMARY
          echo "- \`r2r-darwin-arm64\` (macOS Apple Silicon)" >> $GITHUB_STEP_SUMMARY
