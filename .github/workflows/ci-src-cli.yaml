name: "ci-src-cli (stage 1-6)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: src/cli/go.sum

      - name: Build Module
        working-directory: ./src/commands
        run: go run . build src-cli

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-src-cli
          path: |
            out/build/src-cli/**
            src/cli/**/generated_*.go
            src/cli/**/*.ebnf
            src/cli/**/schema.json

      - name: Build Summary
        if: always()
        run: |
          echo "## Build: src-cli" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ CLI binaries built for all platforms." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ CLI binary build failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            go run ./src/commands ci summary-link ${{ github.run_id }} --type build >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Built Binaries" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Binary | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|------|" >> $GITHUB_STEP_SUMMARY

          for file in out/build/src-cli/r2r-linux-amd64 out/build/src-cli/r2r-linux-arm64 out/build/src-cli/r2r-darwin-amd64 out/build/src-cli/r2r-darwin-arm64 out/build/src-cli/r2r-windows-amd64.exe; do
            if [ -f "$file" ]; then
              name=$(basename "$file")
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "0")
              size_mb=$(echo "scale=1; $size / 1048576" | bc)
              platform=""
              case "$name" in
                r2r-linux-amd64) platform="Linux AMD64" ;;
                r2r-linux-arm64) platform="Linux ARM64" ;;
                r2r-darwin-amd64) platform="macOS Intel" ;;
                r2r-darwin-arm64) platform="macOS Apple Silicon" ;;
                r2r-windows-amd64.exe) platform="Windows AMD64" ;;
              esac
              echo "| ${platform} | \`${name}\` | ${size_mb} MB |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Module | \`src-cli\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Artifacts uploaded as \`build-artifacts-src-cli\`" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: src/commands/go.sum

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-src-cli

      - name: Restore Executable Permissions
        run: |
          chmod +x out/build/src-cli/r2r-linux-amd64
          chmod +x out/build/src-cli/r2r-linux-arm64
          chmod +x out/build/src-cli/r2r-darwin-amd64
          chmod +x out/build/src-cli/r2r-darwin-arm64

      - name: Test Module
        working-directory: ./src/commands
        run: go run . test src-cli

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-src-cli
          path: out/test/**/src-cli/**

      - name: Test Summary
        if: always()
        run: |
          echo "## Test: src-cli" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All CLI tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ CLI tests failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            go run ./src/commands ci summary-link ${{ github.run_id }} --type test --artifact test-results-src-cli >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Module | \`src-cli\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Command | \`go run . test src-cli\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Binaries Verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`r2r-linux-amd64\` (Linux AMD64)" >> $GITHUB_STEP_SUMMARY
          echo "- \`r2r-linux-arm64\` (Linux ARM64)" >> $GITHUB_STEP_SUMMARY
          echo "- \`r2r-darwin-amd64\` (macOS Intel)" >> $GITHUB_STEP_SUMMARY
          echo "- \`r2r-darwin-arm64\` (macOS Apple Silicon)" >> $GITHUB_STEP_SUMMARY
