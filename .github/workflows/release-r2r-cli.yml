# Release r2r-cli - CLI Binary Release Workflow
#
# This workflow releases the r2r CLI binaries. It verifies CI coverage before releasing.
#
# CI Verification: Requires a successful ci-r2r-cli.yaml run on the exact commit being released.
# This ensures the code was built and tested before release.
#
# This workflow BUILDS FROM SOURCE, so it doesn't depend on pre-built artifacts.
# It only needs verification that the code was tested.

name: "release-r2r-cli (stage 7+)"

on:
  push:
    tags:
      - 'r2r-cli/*'
      - 'src-cli/*'  # Legacy tag format for backwards compatibility
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver format: x.y.z)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write      # Required for Sigstore signing (artifact attestations)
  attestations: write  # Required to persist attestations

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Check CI status
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"
          $COMMANDS release check-ci \
            --workflow ci-r2r-cli.yaml \
            --commit ${{ github.sha }} \
            --timeout 300
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract and validate version
        id: extract_version
        run: |
          # Determine version based on trigger type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="r2r-cli/$VERSION"
            echo "Manual trigger with version: $VERSION"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            # Handle both r2r-cli/* and legacy src-cli/* tag formats
            VERSION="${TAG_NAME#r2r-cli/}"
            VERSION="${VERSION#src-cli/}"
            echo "Tag trigger with version: $VERSION"
          fi

          # Validate semver format (x.y.z where x, y, z are non-negative integers)
          if ! echo "$VERSION" | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' > /dev/null; then
            echo "Error: Invalid semver format: $VERSION"
            echo "Expected format: x.y.z (e.g., 1.0.0)"
            exit 1
          fi

          # Reject versions with 'v' prefix
          if echo "$VERSION" | grep -E '^v' > /dev/null; then
            echo "Error: Version should not have 'v' prefix: $VERSION"
            echo "Use x.y.z format (e.g., 1.0.0 not v1.0.0)"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "✅ Valid semver: $VERSION"

      - name: Check for existing release
        run: |
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"

          # Check if a GitHub release already exists for this tag
          # gh release view returns exit code 1 if release doesn't exist
          if gh release view "$TAG_NAME" 2>/dev/null; then
            echo ""
            echo "❌ Error: Release already exists for tag $TAG_NAME"
            echo ""
            echo "A GitHub release has already been created for this version."
            echo "If you want to create a new release:"
            echo "1. Delete the existing release: gh release delete $TAG_NAME"
            echo "2. Delete the tag: git push --delete origin $TAG_NAME"
            echo "3. Re-run this workflow"
            echo ""
            echo "Or increment the version number for a new release."
            exit 1
          fi

          echo "✅ No existing release found for $TAG_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      # Note: Tag creation moved to release step - gh release create --target creates tag atomically
      # This prevents orphaned tags if the build/release fails

      - name: Install UPX
        run: |
          echo "Installing UPX for binary compression..."
          sudo apt-get update && sudo apt-get install -y upx-ucl
          upx --version

      - name: Build binaries for multiple platforms
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"
          echo "Building r2r-cli with version $VERSION using build command..."
          echo "Using --compressed-upx for release builds (stripped + UPX compressed)"
          $COMMANDS build r2r-cli --version "$VERSION" --no-tidy --compressed-upx

      - name: Verify binaries
        run: |
          echo "Verifying built binaries..."
          ls -lh out/build/r2r-cli/

          # Check all required files exist
          # Note: UPX compression only works for Linux/Windows when cross-compiling from Linux
          # Darwin binaries cannot be UPX-compressed without native macOS tooling
          REQUIRED_FILES=(
            "out/build/r2r-cli/r2r-linux-amd64"
            "out/build/r2r-cli/r2r-linux-amd64-upx"
            "out/build/r2r-cli/r2r-linux-arm64"
            "out/build/r2r-cli/r2r-darwin-amd64"
            "out/build/r2r-cli/r2r-darwin-arm64"
            "out/build/r2r-cli/r2r-windows-amd64.exe"
            "out/build/r2r-cli/r2r-windows-amd64-upx.exe"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Error: Required file missing: $file"
              exit 1
            fi
            size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
            size_mb=$(echo "scale=1; $size / 1048576" | bc)
            echo "✅ Found: $file (${size_mb} MB)"
          done

          echo ""
          echo "Testing Linux binary version (standard):"
          chmod +x out/build/r2r-cli/r2r-linux-amd64
          ./out/build/r2r-cli/r2r-linux-amd64 version || true

          echo ""
          echo "Testing Linux binary version (UPX):"
          chmod +x out/build/r2r-cli/r2r-linux-amd64-upx
          ./out/build/r2r-cli/r2r-linux-amd64-upx version || true

      - name: Generate build attestations
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            out/build/r2r-cli/r2r-linux-amd64
            out/build/r2r-cli/r2r-linux-amd64-upx
            out/build/r2r-cli/r2r-linux-arm64
            out/build/r2r-cli/r2r-darwin-amd64
            out/build/r2r-cli/r2r-darwin-arm64
            out/build/r2r-cli/r2r-windows-amd64.exe
            out/build/r2r-cli/r2r-windows-amd64-upx.exe

      - name: Create release notes
        id: release_notes
        run: |
          # Helper function to get file size in MB
          get_size_mb() {
            local file="$1"
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
              echo "scale=1; $size / 1048576" | bc
            else
              echo "?"
            fi
          }

          # Calculate sizes for all binaries
          SIZE_LINUX_AMD64=$(get_size_mb "out/build/r2r-cli/r2r-linux-amd64")
          SIZE_LINUX_ARM64=$(get_size_mb "out/build/r2r-cli/r2r-linux-arm64")
          SIZE_DARWIN_AMD64=$(get_size_mb "out/build/r2r-cli/r2r-darwin-amd64")
          SIZE_DARWIN_ARM64=$(get_size_mb "out/build/r2r-cli/r2r-darwin-arm64")
          SIZE_WINDOWS_AMD64=$(get_size_mb "out/build/r2r-cli/r2r-windows-amd64.exe")
          SIZE_LINUX_AMD64_UPX=$(get_size_mb "out/build/r2r-cli/r2r-linux-amd64-upx")
          SIZE_WINDOWS_AMD64_UPX=$(get_size_mb "out/build/r2r-cli/r2r-windows-amd64-upx.exe")

          cat << EOF > release_notes.md
          # r2r CLI ${{ steps.extract_version.outputs.version }}

          ## What's New

          Release of r2r CLI version ${{ steps.extract_version.outputs.version }}.

          ## Installation

          Download the appropriate binary for your platform. Two versions are available:

          ### Standard Binaries (Recommended)
          Stripped symbols, best compatibility:

          | Platform              | Binary                    | Size                     |
          |-----------------------|---------------------------|--------------------------|
          | Linux (AMD64)         | \`r2r-linux-amd64\`       | ${SIZE_LINUX_AMD64} MB   |
          | Linux (ARM64)         | \`r2r-linux-arm64\`       | ${SIZE_LINUX_ARM64} MB   |
          | macOS (Intel)         | \`r2r-darwin-amd64\`      | ${SIZE_DARWIN_AMD64} MB  |
          | macOS (Apple Silicon) | \`r2r-darwin-arm64\`      | ${SIZE_DARWIN_ARM64} MB  |
          | Windows (AMD64)       | \`r2r-windows-amd64.exe\` | ${SIZE_WINDOWS_AMD64} MB |

          ### UPX-Compressed Binaries (Minimal Size)
          Maximum compression, slightly slower startup. Available for Linux and Windows only:

          | Platform        | Binary                        | Size                         |
          |-----------------|-------------------------------|------------------------------|
          | Linux (AMD64)   | \`r2r-linux-amd64-upx\`       | ${SIZE_LINUX_AMD64_UPX} MB   |
          | Windows (AMD64) | \`r2r-windows-amd64-upx.exe\` | ${SIZE_WINDOWS_AMD64_UPX} MB |

          > **Note**: UPX compression is not available for macOS binaries when cross-compiling. UPX binaries may trigger antivirus false positives on Windows.

          ### Quick Start

          \`\`\`bash
          # Make executable (Linux/macOS)
          chmod +x r2r-*

          # Verify installation
          ./r2r-linux-amd64 version     # Linux AMD64
          ./r2r-linux-arm64 version     # Linux ARM64
          ./r2r-darwin-amd64 version    # macOS Intel
          ./r2r-darwin-arm64 version    # macOS Apple Silicon
          r2r-windows-amd64.exe version # Windows
          \`\`\`

          ## Supply Chain Security

          All binaries include [build attestations](https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations) for supply chain security. Verify any binary with:

          \`\`\`bash
          gh attestation verify <binary-file> --repo ${{ github.repository }}
          \`\`\`

          ## Release Information

          - **Version**: ${{ steps.extract_version.outputs.version }}
          - **Commit**: ${{ github.sha }}
          - **Tag**: ${{ steps.extract_version.outputs.tag_name }}

          ---

          🤖 Generated with [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

          cat release_notes.md

      - name: Create GitHub Release with binaries
        run: |
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"
          VERSION="${{ steps.extract_version.outputs.version }}"

          echo "Creating release for tag: $TAG_NAME with binaries"

          # For manual triggers, use --target to create tag atomically with release
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger: creating tag and release together"
            gh release create "$TAG_NAME" \
              --title "r2r CLI v$VERSION" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}" \
              out/build/r2r-cli/r2r-linux-amd64 \
              out/build/r2r-cli/r2r-linux-amd64-upx \
              out/build/r2r-cli/r2r-linux-arm64 \
              out/build/r2r-cli/r2r-darwin-amd64 \
              out/build/r2r-cli/r2r-darwin-arm64 \
              out/build/r2r-cli/r2r-windows-amd64.exe \
              out/build/r2r-cli/r2r-windows-amd64-upx.exe
          else
            # Tag trigger: use --verify-tag to ensure tag exists
            echo "Tag trigger: using existing tag"
            gh release create "$TAG_NAME" \
              --title "r2r CLI v$VERSION" \
              --notes-file release_notes.md \
              --verify-tag \
              out/build/r2r-cli/r2r-linux-amd64 \
              out/build/r2r-cli/r2r-linux-amd64-upx \
              out/build/r2r-cli/r2r-linux-arm64 \
              out/build/r2r-cli/r2r-darwin-amd64 \
              out/build/r2r-cli/r2r-darwin-arm64 \
              out/build/r2r-cli/r2r-windows-amd64.exe \
              out/build/r2r-cli/r2r-windows-amd64-upx.exe
          fi

          echo "✅ Release created with binaries successfully"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify release assets
        run: |
          echo "Checking uploaded assets for release..."
          gh release view ${{ steps.extract_version.outputs.tag_name }} --json assets --jq '.assets[] | .name'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary (failure)
        if: failure()
        run: |
          echo "## ❌ Release Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Common Failure Causes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Possible Cause | Fix |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Check CI status | No successful CI run for this commit | Run CI first: \`gh workflow run ci-r2r-cli.yaml\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Extract version | Invalid semver format | Use format: x.y.z (e.g., 1.0.0) |" >> $GITHUB_STEP_SUMMARY
          echo "| Check existing release | Release already exists | Delete existing release or bump version |" >> $GITHUB_STEP_SUMMARY
          echo "| Build binaries | Go compilation error | Check build logs for specific error |" >> $GITHUB_STEP_SUMMARY
          echo "| Verify binaries | Missing binary file | Check build step completed successfully |" >> $GITHUB_STEP_SUMMARY
          echo "| Create release | GitHub API error / tag conflict | Check if tag already exists |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Debug Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version Input | \`${{ github.event.inputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          COMMANDS="${{ steps.commands.outputs.commands-path }}"
          $COMMANDS ci summary-link ${{ github.run_id }} --type release --workflow ci-r2r-cli.yaml --commit ${{ github.sha }} >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary (success)
        if: success()
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"

          echo "## ✅ r2r CLI Released" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully built and published **r2r CLI v${VERSION}** to GitHub Releases." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Release Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${TAG_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Published Binaries (6 files)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Standard Binaries" >> $GITHUB_STEP_SUMMARY
          echo "Stripped symbols, best compatibility:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Binary | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|------|" >> $GITHUB_STEP_SUMMARY

          for file in out/build/r2r-cli/r2r-linux-amd64 out/build/r2r-cli/r2r-linux-arm64 out/build/r2r-cli/r2r-darwin-amd64 out/build/r2r-cli/r2r-darwin-arm64 out/build/r2r-cli/r2r-windows-amd64.exe; do
            if [ -f "$file" ]; then
              name=$(basename "$file")
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
              size_mb=$(echo "scale=1; $size / 1048576" | bc)
              platform=""
              case "$name" in
                r2r-linux-amd64) platform="Linux AMD64" ;;
                r2r-linux-arm64) platform="Linux ARM64" ;;
                r2r-darwin-amd64) platform="macOS Intel" ;;
                r2r-darwin-arm64) platform="macOS Apple Silicon" ;;
                r2r-windows-amd64.exe) platform="Windows AMD64" ;;
              esac
              echo "| ${platform} | \`${name}\` | ${size_mb} MB |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### UPX-Compressed Binaries (Linux/Windows only)" >> $GITHUB_STEP_SUMMARY
          echo "Maximum compression, slightly slower startup:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Binary | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|------|" >> $GITHUB_STEP_SUMMARY

          for file in out/build/r2r-cli/r2r-linux-amd64-upx out/build/r2r-cli/r2r-windows-amd64-upx.exe; do
            if [ -f "$file" ]; then
              name=$(basename "$file")
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
              size_mb=$(echo "scale=1; $size / 1048576" | bc)
              platform=""
              case "$name" in
                r2r-linux-amd64-upx) platform="Linux AMD64" ;;
                r2r-windows-amd64-upx.exe) platform="Windows AMD64" ;;
              esac
              echo "| ${platform} | \`${name}\` | ${size_mb} MB |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 [**View Release & Download Binaries**](https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME})" >> $GITHUB_STEP_SUMMARY
