# CI Orchestrator - Optimized Module Build Trigger
#
# This workflow implements incremental CI by only building modules that have changed
# since the last successful CI run. It uses the repository's dependency graph to ensure
# that when a module changes, all modules that depend on it are also rebuilt (cache invalidation).
#
# Pipeline stages:
# 1. build-tooling: Build/cache the commands binary for fast subsequent operations
# 2. PARALLEL FLOWS:
#    Flow A (Repository Validation):
#      - build-repository: Build repository module
#      - validate-repository: Run repository component suite (contract validation)
#    Flow B (Module CI Orchestration):
#      - detect-changes: Determine which modules need CI workflows triggered
#      - execute-workflows: Dispatch ALL module CI workflows in parallel
# 3. summary: Report results (waits for both flows)
#
# NOTE: All CI workflows run in parallel. Dependency verification happens at RELEASE time
# via the `release await-deps` command, not during CI dispatch.
#
# For PRs: Compares against PR base SHA
# For push: Compares against last successful CI SHA
# Bootstrap (no previous success): Builds all modules

name: "CI Trigger"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger-all:
        description: 'Trigger all workflows regardless of changes (override optimization)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  # =========================================
  # Stage 0: Build CI Tooling
  # =========================================
  build-tooling:
    name: Build CI Tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands
        # Don't require artifact - this is the job that creates it

      - name: Build Summary
        run: |
          echo "## Build CI Tooling" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commands binary: ${{ steps.commands.outputs.source }}" >> $GITHUB_STEP_SUMMARY

  # =========================================
  # Flow A: Repository Validation (runs in parallel with Flow B)
  # =========================================
  build-repository:
    name: Build Repository
    needs: build-tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Module
        uses: ./.github/actions/build-module
        with:
          module: repository
          trigger-run-id: ${{ github.run_id }}
          setup-deps: auto

  validate-repository:
    name: Test Repository
    needs: build-repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pre-compute git file list using GitHub API (fast) instead of git ls-files (84s)
      # GitHub API reads from database, not slow runner storage
      - name: Pre-compute git file list via GitHub API
        run: |
          echo "Fetching file list via GitHub API..."

          # Try GitHub API first (fast: ~2-5s)
          if curl -s -f -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/repos/${{ github.repository }}/git/trees/${{ github.sha }}?recursive=1" \
               | jq -r '.tree[] | select(.type=="blob") | .path' \
               > .git/cached-files.txt 2>/dev/null; then

            FILE_COUNT=$(wc -l < .git/cached-files.txt)
            if [ "$FILE_COUNT" -gt 0 ]; then
              echo "✓ Cached $FILE_COUNT files from GitHub API (~5s)"
              exit 0
            fi
          fi

          # Fallback to git ls-files if API fails (slow: ~84s)
          echo "⚠ GitHub API failed, falling back to git ls-files (slow)..."
          git ls-files > .git/cached-files.txt
          FILE_COUNT=$(wc -l < .git/cached-files.txt)
          echo "✓ Cached $FILE_COUNT files from git ls-files (~84s)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Module
        uses: ./.github/actions/test-module
        with:
          module: repository
          trigger-run-id: ${{ github.run_id }}
          setup-deps: auto
          suites: component

  # =========================================
  # Flow B: Module CI Orchestration (runs in parallel with Flow A)
  # =========================================
  detect-changes:
    name: Detect Changed Modules
    needs: build-tooling
    runs-on: ubuntu-latest
    outputs:
      changed-modules: ${{ steps.detect.outputs.modules }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      directly_changed: ${{ steps.detect.outputs.directly_changed }}
      invalidated: ${{ steps.detect.outputs.invalidated }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      is_bootstrap: ${{ steps.detect.outputs.is_bootstrap }}
      changed_file_count: ${{ steps.detect.outputs.changed_file_count }}
      files_by_module: ${{ steps.detect.outputs.files_by_module }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download commands binary
        uses: actions/download-artifact@v7
        with:
          name: commands-binary
          path: out/tools

      - name: Make executable
        run: chmod +x out/tools/commands

      - name: Detect Changed Modules
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMANDS="./out/tools/commands"

          # Check if trigger-all override is enabled
          TRIGGER_ALL="${{ inputs.trigger-all }}"

          if [ "$TRIGGER_ALL" = "true" ]; then
            echo "Trigger-all override enabled - building all modules"

            # Dynamically discover all CI workflows by scanning for ci-*.yaml files
            WORKFLOW_MODULES=""
            for workflow in .github/workflows/ci-*.yaml; do
              if [ -f "$workflow" ]; then
                # Extract module name from ci-<module>.yaml
                module=$(basename "$workflow" .yaml | sed 's/^ci-//')
                WORKFLOW_MODULES="$WORKFLOW_MODULES $module"
              fi
            done
            WORKFLOW_MODULES=$(echo $WORKFLOW_MODULES | xargs)

            echo "Discovered CI workflows: $WORKFLOW_MODULES"
            echo "directly_changed=all" >> $GITHUB_OUTPUT
            echo "invalidated=none" >> $GITHUB_OUTPUT
            echo "base_sha=N/A" >> $GITHUB_OUTPUT
            echo "is_bootstrap=false" >> $GITHUB_OUTPUT
            echo "changed_file_count=N/A" >> $GITHUB_OUTPUT
            echo "files_by_module={}" >> $GITHUB_OUTPUT
          else
            echo "Detecting modules requiring rebuild (with dependency invalidation)..."

            # For PRs: compare against PR base (what the PR introduces)
            # For push: compare against last successful CI (incremental since last success)
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Pull Request detected - comparing against PR base"
              RESULT=$($COMMANDS get changed-modules-ci --pr-base "${{ github.event.pull_request.base.sha }}" --as-json)
            else
              echo "Push detected - comparing against last successful CI"
              RESULT=$($COMMANDS get changed-modules-ci --as-json)
            fi

            echo "Raw result:"
            echo "$RESULT" | jq .

            # Extract the analysis results
            MODULES=$(echo "$RESULT" | jq -r '.modules | join(" ")')
            DIRECTLY_CHANGED=$(echo "$RESULT" | jq -r '.directly_changed | join(" ")')
            INVALIDATED=$(echo "$RESULT" | jq -r '.invalidated | join(" ")')
            BASE_SHA=$(echo "$RESULT" | jq -r '.base_sha')
            IS_BOOTSTRAP=$(echo "$RESULT" | jq -r '.is_bootstrap')
            CHANGED_FILE_COUNT=$(echo "$RESULT" | jq -r '.changed_file_count')
            FILES_BY_MODULE=$(echo "$RESULT" | jq -c '.files_by_module')

            echo ""
            echo "Analysis Results:"
            echo "  Base SHA: $BASE_SHA"
            echo "  Is Bootstrap: $IS_BOOTSTRAP"
            echo "  Changed Files: $CHANGED_FILE_COUNT"
            echo "  Directly Changed: $DIRECTLY_CHANGED"
            echo "  Invalidated (dependents): $INVALIDATED"
            echo "  All Modules to Rebuild: $MODULES"

            # Filter to only modules that have workflows
            WORKFLOW_MODULES=""
            for module in $MODULES; do
              if [ -f ".github/workflows/ci-${module}.yaml" ]; then
                WORKFLOW_MODULES="$WORKFLOW_MODULES $module"
              fi
            done
            WORKFLOW_MODULES=$(echo $WORKFLOW_MODULES | xargs)

            echo ""
            echo "Modules with workflows: $WORKFLOW_MODULES"

            # Store additional context for summary
            echo "directly_changed=$DIRECTLY_CHANGED" >> $GITHUB_OUTPUT
            echo "invalidated=$INVALIDATED" >> $GITHUB_OUTPUT
            echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT
            echo "is_bootstrap=$IS_BOOTSTRAP" >> $GITHUB_OUTPUT
            echo "changed_file_count=$CHANGED_FILE_COUNT" >> $GITHUB_OUTPUT
            echo "files_by_module=$FILES_BY_MODULE" >> $GITHUB_OUTPUT
          fi

          if [ -n "$WORKFLOW_MODULES" ]; then
            echo "modules=$WORKFLOW_MODULES" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "modules=" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
          fi

          # Generate step summary
          echo "## Change Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$TRIGGER_ALL" = "true" ]; then
            echo "**Mode**: Manual trigger-all override" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All CI workflows will be triggered:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$WORKFLOW_MODULES" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          elif [ -z "$WORKFLOW_MODULES" ]; then
            echo "**Result**: No modules require rebuilding" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Base SHA | \`$BASE_SHA\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Files Changed | $CHANGED_FILE_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Modules Affected | None with CI workflows |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            if [ "$IS_BOOTSTRAP" = "true" ]; then
              echo "| Mode | Bootstrap (no previous CI) |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Base SHA | \`$BASE_SHA\` |" >> $GITHUB_STEP_SUMMARY
            fi
            echo "| Files Changed | $CHANGED_FILE_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Directly Changed | \`$DIRECTLY_CHANGED\` |" >> $GITHUB_STEP_SUMMARY
            if [ -n "$INVALIDATED" ]; then
              echo "| Cache Invalidated | \`$INVALIDATED\` |" >> $GITHUB_STEP_SUMMARY
            fi
            echo "| **CI Workflows to Run** | \`$WORKFLOW_MODULES\` |" >> $GITHUB_STEP_SUMMARY

            # Show detailed reasoning per module (why each module was triggered)
            if [ "$IS_BOOTSTRAP" != "true" ] && [ -n "$FILES_BY_MODULE" ] && [ "$FILES_BY_MODULE" != "null" ] && [ "$FILES_BY_MODULE" != "{}" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Why each module was triggered" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Process directly changed modules
              for module in $DIRECTLY_CHANGED; do
                FILE_COUNT=$(echo "$FILES_BY_MODULE" | jq -r --arg m "$module" '.[$m] | length // 0')

                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary><strong>$module</strong> - $FILE_COUNT file(s) changed</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "$FILES_BY_MODULE" | jq -r --arg m "$module" '.[$m] // [] | .[]' >> $GITHUB_STEP_SUMMARY
                echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "</details>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              done

              # Process invalidated modules (triggered due to dependency changes)
              for module in $INVALIDATED; do
                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary><strong>$module</strong> - dependency changed</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "Triggered because a dependency was modified:" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                for dep in $DIRECTLY_CHANGED; do
                  echo "- \`$dep\`" >> $GITHUB_STEP_SUMMARY
                done
                echo "</details>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              done
            fi
          fi

  # =========================================
  # Stage 3: Execute Module Workflows (All Parallel)
  # =========================================
  execute-workflows:
    name: Dispatch All CI
    needs: [detect-changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Dispatch all workflows in parallel
        run: |
          # Early exit if no changes - job runs to satisfy status checks but skips execution
          if [ "${{ needs.detect-changes.outputs.has-changes }}" != "true" ]; then
            echo "No modules require building - skipping execution"
            echo "## Dispatch All CI" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No module CI workflows to execute." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          MODULES="${{ needs.detect-changes.outputs.changed-modules }}"

          # Determine the correct ref for workflow_dispatch
          # For PRs: use head_ref (the PR source branch)
          # For push: use ref_name (the branch name)
          HEAD_REF="${{ github.head_ref }}"
          REF_NAME="${{ github.ref_name }}"

          if [ -n "$HEAD_REF" ]; then
            DISPATCH_REF="$HEAD_REF"
          else
            DISPATCH_REF="$REF_NAME"
          fi

          echo "Event: ${{ github.event_name }}"
          echo "DISPATCH_REF: $DISPATCH_REF"
          echo "Modules: $MODULES"
          echo ""

          # Dispatch ALL workflows in parallel - no layering
          # Dependency verification happens at RELEASE time via `release await-deps`
          echo "Dispatching all module CI workflows in parallel..."
          echo ""

          DISPATCHED_COUNT=0
          DISPATCHED_LIST=""

          for module in $MODULES; do
            if [ -f ".github/workflows/ci-${module}.yaml" ]; then
              echo "  Dispatching: ci-${module}.yaml"
              gh workflow run "ci-${module}.yaml" \
                --ref "$DISPATCH_REF" \
                -f ref=${{ github.ref }} \
                -f sha=${{ github.sha }} \
                -f trigger_run_id=${{ github.run_id }}
              DISPATCHED_COUNT=$((DISPATCHED_COUNT + 1))
              DISPATCHED_LIST="$DISPATCHED_LIST $module"
              sleep 2
            fi
          done

          echo ""
          echo "======================================================================"
          echo "Dispatched $DISPATCHED_COUNT workflow(s) in parallel"
          echo "======================================================================"
          echo ""
          echo "Child workflows will report their own statuses."
          echo "Dependency verification happens at release time."

          # Generate step summary
          echo "## Dispatch All CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode**: Parallel execution (all modules)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dispatched **$DISPATCHED_COUNT** CI workflow(s):" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$DISPATCHED_LIST" | xargs >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note**: All workflows run in parallel. Dependency CI verification" >> $GITHUB_STEP_SUMMARY
          echo "> happens at release time via \`release await-deps\`." >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ github.token }}

  # =========================================
  # Summary (waits for both parallel flows)
  # =========================================
  summary:
    name: Summary
    needs: [build-tooling, build-repository, validate-repository, detect-changes, execute-workflows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate Summary
        run: |
          echo "## CI/CD Orchestration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check build-tooling status
          BUILD_TOOLING="${{ needs.build-tooling.result }}"
          BUILD_REPOSITORY="${{ needs.build-repository.result }}"
          VALIDATE_REPOSITORY="${{ needs.validate-repository.result }}"

          if [ "$BUILD_TOOLING" = "failure" ]; then
            echo "### Build Tooling Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Failed to build the commands binary. Check the build-tooling job for details." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "$BUILD_REPOSITORY" = "failure" ]; then
            echo "### Repository Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Repository module build failed. Check the build-repository job for details." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "$VALIDATE_REPOSITORY" = "failure" ]; then
            echo "### Repository Validation Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Repository component suite failed. Fix test failures before continuing." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "${{ needs.detect-changes.outputs.has-changes }}" != "true" ]; then
            echo "### No CI Workflows Triggered" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No module CI workflows were triggered for this commit." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            BASE_SHA="${{ needs.detect-changes.outputs.base_sha }}"
            CHANGED_FILE_COUNT="${{ needs.detect-changes.outputs.changed_file_count }}"

            echo "#### Reasoning" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "null" ]; then
              echo "No previous successful CI run found to compare against." >> $GITHUB_STEP_SUMMARY
            else
              echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
              echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
              echo "| Last Successful CI | [\`$BASE_SHA\`](${{ github.server_url }}/${{ github.repository }}/commit/$BASE_SHA) |" >> $GITHUB_STEP_SUMMARY
              echo "| Current Commit | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY
              echo "| Files Changed | ${CHANGED_FILE_COUNT:-0} |" >> $GITHUB_STEP_SUMMARY
              echo "| Modules Affected | None with CI workflows |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              if [ "${CHANGED_FILE_COUNT:-0}" = "0" ]; then
                echo "> No files changed between commits, or all changes are in untracked areas." >> $GITHUB_STEP_SUMMARY
              else
                echo "> Changed files do not belong to any modules with CI workflows." >> $GITHUB_STEP_SUMMARY
              fi
            fi
            exit 0
          fi

          # All validation passed
          TOTAL_MODULES="${{ needs.detect-changes.outputs.changed-modules }}"
          TOTAL_COUNT=$(echo "$TOTAL_MODULES" | wc -w | tr -d ' ')

          echo "### Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All validation checks passed. Module workflows are running in the background." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Pipeline Stages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|-------------|" >> $GITHUB_STEP_SUMMARY

          # Build tooling stage
          if [ "$BUILD_TOOLING" = "success" ]; then
            echo "| Build Tooling | Pass | Commands binary built/cached |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Build Tooling | $BUILD_TOOLING | Unexpected state |" >> $GITHUB_STEP_SUMMARY
          fi

          # Build repository stage
          if [ "$BUILD_REPOSITORY" = "success" ]; then
            echo "| Build Repository | Pass | Repository module built |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BUILD_REPOSITORY" = "failure" ]; then
            echo "| Build Repository | Fail | Build failed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BUILD_REPOSITORY" = "skipped" ]; then
            echo "| Build Repository | Skip | Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Build Repository | $BUILD_REPOSITORY | Unexpected state |" >> $GITHUB_STEP_SUMMARY
          fi

          # Validation stage
          if [ "$VALIDATE_REPOSITORY" = "success" ]; then
            echo "| Test Repository | Pass | Repository component suite passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$VALIDATE_REPOSITORY" = "failure" ]; then
            echo "| Test Repository | Fail | Repository test failures found |" >> $GITHUB_STEP_SUMMARY
          elif [ "$VALIDATE_REPOSITORY" = "skipped" ]; then
            echo "| Test Repository | Skip | Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Test Repository | $VALIDATE_REPOSITORY | Unexpected state |" >> $GITHUB_STEP_SUMMARY
          fi

          # Module builds (dispatched)
          EXECUTION="${{ needs.execute-workflows.result }}"
          if [ "$EXECUTION" = "success" ]; then
            echo "| Module Workflows | Dispatched | $TOTAL_COUNT workflow(s) triggered in parallel |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Module Workflows | $EXECUTION | Failed to dispatch workflows |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note**: Module CI workflows report their own statuses as separate checks." >> $GITHUB_STEP_SUMMARY
          echo "> Check individual \`CI: <module>\` checks for build results." >> $GITHUB_STEP_SUMMARY
