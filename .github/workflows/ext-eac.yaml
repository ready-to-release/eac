name: "ci-ext-eac (Docker Extension)"

on:
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            src/commands/go.sum
            src/cli/go.sum

      - name: Build extension using EAC build system
        run: |
          echo "Building ext-eac using EAC build system..."
          go run ./src/commands build module ext-eac

          echo ""
          echo "Verifying image was built..."
          docker images ext-eac:latest

          echo ""
          echo "Re-tagging for CI tests..."
          docker tag ext-eac:latest ext-eac:ci-test

      - name: Verify Docker Image
        run: |
          echo "Verifying ext-eac Docker image..."
          docker images ext-eac:ci-test

          echo ""
          echo "Checking image labels..."
          docker inspect ext-eac:ci-test --format='{{json .Config.Labels}}' | jq '.'

          echo ""
          echo "Testing extension metadata..."
          docker run --rm ext-eac:ci-test extension-meta

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-platform image to GHCR with CI tag
        run: |
          IMAGE_NAME="ghcr.io/ready-to-release/ext-eac"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "Building and pushing multi-platform image with CI tags..."
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE_NAME:ci" \
            --tag "$IMAGE_NAME:sha-$SHORT_SHA" \
            --file ./containers/ext-eac/Dockerfile \
            --cache-from type=gha \
            --push \
            .

          echo ""
          echo "✅ Published CI images:"
          echo "  - $IMAGE_NAME:ci"
          echo "  - $IMAGE_NAME:sha-$SHORT_SHA"

  test:
    name: Test Extension
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image from GHCR
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          IMAGE_NAME="ghcr.io/ready-to-release/ext-eac"

          echo "Pulling CI image..."
          docker pull "$IMAGE_NAME:sha-$SHORT_SHA"
          docker tag "$IMAGE_NAME:sha-$SHORT_SHA" ext-eac:ci-test
          docker images ext-eac:ci-test

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            src/commands/go.sum
            src/cli/go.sum

      - name: Build r2r CLI
        run: |
          echo "Building r2r CLI using EAC build system..."
          go run ./src/commands build module src-cli

          echo ""
          echo "Copying Linux binary to workspace root..."
          cp out/build/src-cli/r2r-linux ./r2r
          chmod +x ./r2r

          echo ""
          echo "Verifying r2r CLI..."
          ./r2r --version

      - name: Test Extension via r2r CLI
        run: |
          echo "Testing eac extension through r2r CLI..."

          echo ""
          echo "Creating .git directory for r2r to detect repository root..."
          mkdir -p .git

          echo ""
          echo "Creating r2r-cli.yml config with CI test image..."
          cat > r2r-cli.yml << EOF
          extensions:
            - name: 'eac'
              image: 'ext-eac:ci-test'
              image_pull_policy: 'Never'
          EOF

          echo ""
          echo "Testing 'help' command..."
          timeout 120 ./r2r run eac help || true

          echo ""
          echo "Testing 'show modules' command..."
          timeout 120 ./r2r run eac show modules

          echo ""
          echo "Testing 'extension-meta' command..."
          timeout 30 ./r2r run eac extension-meta

          echo ""
          echo "✅ Extension tests passed"

      - name: Test Direct Docker Execution
        run: |
          echo "Testing extension directly with Docker..."

          echo ""
          echo "Test 1: Help command"
          docker run --rm -v $(pwd):/var/task ext-eac:ci-test help | head -20

          echo ""
          echo "Test 2: Extension metadata"
          docker run --rm ext-eac:ci-test extension-meta

          echo ""
          echo "✅ Direct Docker tests passed"
