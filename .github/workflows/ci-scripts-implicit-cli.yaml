name: "ci-scripts-implicit-cli (stage 1-7)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build Module
        uses: ./.github/actions/build-module
        with:
          module: scripts-implicit-cli
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}
          # Build eac-commands dependency for all platforms (including Windows) to support cross-platform tests
          no-deps: 'false'
          extra-args: --all
          cross-compile-windows: 'true'

  test-linux:
    name: Test (Linux)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Test Module
        uses: ./.github/actions/test-module
        with:
          module: scripts-implicit-cli
          trigger-run-id: ${{ inputs.trigger_run_id }}
          results-artifact-name: test-results-scripts-implicit-cli-linux
          # PRs run component suite only; main/release branches run full suite
          suites: ${{ (inputs.ref != '' && startsWith(inputs.ref, 'refs/pull/')) && 'component' || 'component,integration,acceptance' }}

  test-windows:
    name: Test (Windows)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Test Module
        uses: ./.github/actions/test-module
        with:
          module: scripts-implicit-cli
          trigger-run-id: ${{ inputs.trigger_run_id }}
          results-artifact-name: test-results-scripts-implicit-cli-windows
          # PRs run component suite only; main/release branches run full suite
          suites: ${{ (inputs.ref != '' && startsWith(inputs.ref, 'refs/pull/')) && 'component' || 'component,integration,acceptance' }}
