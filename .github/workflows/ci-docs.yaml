name: "ci-docs (stage 1-6)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  # =============================================================================
  # Build HTML Site + PDF Books
  # =============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build Module (all artifacts)
        uses: ./.github/actions/build-module
        with:
          module: docs
          trigger-run-id: ${{ inputs.trigger_run_id }}
          extra-args: '--all'

  # =============================================================================
  # Test
  # =============================================================================
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Test Module
        uses: ./.github/actions/test-module
        with:
          module: docs
          trigger-run-id: ${{ inputs.trigger_run_id }}
          # PRs run commit suite only; main/release branches run full suite
          suites: ${{ (inputs.ref != '' && startsWith(inputs.ref, 'refs/pull/')) && 'commit' || 'commit,acceptance' }}

  # =============================================================================
  # Trigger Release (main branch only)
  # =============================================================================
  trigger-release:
    name: Trigger Release
    needs: test
    runs-on: ubuntu-latest
    # Only trigger release on main branch, NEVER for PRs
    if: |
      (github.ref == 'refs/heads/main' || inputs.ref == 'refs/heads/main') &&
      !startsWith(inputs.ref || github.ref, 'refs/pull/')
    steps:
      - name: Trigger release workflow
        run: |
          # Trigger docs release (site + PDFs)
          gh workflow run release-docs.yaml \
            --repo ${{ github.repository }} \
            -f ci_run_id=${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release Trigger Summary
        run: |
          echo "## Release Triggered: docs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered release workflow:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`release-docs.yaml\` | Deploy site to GitHub Pages + create GitHub Release with PDFs |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger Run ID | \`${{ inputs.trigger_run_id || 'none (standalone)' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CI Docs Run ID | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
