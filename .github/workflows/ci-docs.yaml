name: "ci-docs (stage 1-6)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Build Module
        run: ${{ steps.commands.outputs.commands-path }} build docs

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-artifacts-docs
          path: out/build/docs/**

      - name: Build Summary
        if: always()
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"

          echo "## Build: docs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "Documentation site built successfully with MkDocs." >> $GITHUB_STEP_SUMMARY
          else
            echo "Documentation build failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Common Issues" >> $GITHUB_STEP_SUMMARY
            echo "- Invalid mkdocs.yml configuration" >> $GITHUB_STEP_SUMMARY
            echo "- Missing markdown files referenced in nav" >> $GITHUB_STEP_SUMMARY
            echo "- Broken internal links" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            $COMMANDS ci summary-link ${{ github.run_id }} --type build >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Build Output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "out/build/docs/site" ]; then
            FILE_COUNT=$(find out/build/docs/site -type f | wc -l | tr -d ' ')
            HTML_COUNT=$(find out/build/docs/site -name "*.html" | wc -l | tr -d ' ')
            TOTAL_SIZE=$(du -sh out/build/docs/site | cut -f1)
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Files | ${FILE_COUNT} |" >> $GITHUB_STEP_SUMMARY
            echo "| HTML Pages | ${HTML_COUNT} |" >> $GITHUB_STEP_SUMMARY
            echo "| Total Size | ${TOTAL_SIZE} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts uploaded as \`build-artifacts-docs\`" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Download Build Artifacts
        uses: actions/download-artifact@v6
        with:
          name: build-artifacts-docs
          path: out/build/docs

      - name: Test Module (Commit Suite - L0-L2)
        run: ${{ steps.commands.outputs.commands-path }} test docs --suite commit

      - name: Test Module (Acceptance Suite - L3)
        run: ${{ steps.commands.outputs.commands-path }} test docs --suite acceptance

      - name: Test Summary
        if: always()
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"

          echo "## Test: docs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "Documentation validation tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Documentation validation tests failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            $COMMANDS ci summary-link ${{ github.run_id }} --type docs --artifact build-artifacts-docs >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Tests Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Level | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| commit | L0-L2 | Unit and integration tests |" >> $GITHUB_STEP_SUMMARY
          echo "| acceptance | L3 | Acceptance verification tests |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Checks Performed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Site structure validation" >> $GITHUB_STEP_SUMMARY
          echo "- Required pages present" >> $GITHUB_STEP_SUMMARY
          echo "- Build artifacts integrity" >> $GITHUB_STEP_SUMMARY

  trigger-release:
    name: Trigger Release
    needs: test
    runs-on: ubuntu-latest
    # Only trigger release on main branch, NEVER for PRs
    if: |
      (github.ref == 'refs/heads/main' || inputs.ref == 'refs/heads/main') &&
      !startsWith(inputs.ref || github.ref, 'refs/pull/')
    steps:
      - name: Trigger release workflow
        run: |
          gh workflow run release-docs.yml \
            --repo ${{ github.repository }} \
            -f ci_run_id=${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release Trigger Summary
        run: |
          echo "## Release Triggered: docs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered \`release-docs.yml\` workflow to deploy documentation." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| CI Run ID | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
