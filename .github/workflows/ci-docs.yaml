name: "ci-docs (stage 1-7)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  # =============================================================================
  # Build HTML Site
  # =============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build Module
        uses: ./.github/actions/build-module
        with:
          module: docs
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}

  # =============================================================================
  # Test
  # =============================================================================
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Test Module
        uses: ./.github/actions/test-module
        with:
          module: docs
          trigger-run-id: ${{ inputs.trigger_run_id }}
          # PRs run component suite only; main/release branches run full suite
          suites: ${{ (inputs.ref != '' && startsWith(inputs.ref, 'refs/pull/')) && 'component' || 'component,integration,acceptance' }}

  # =============================================================================
  # Trigger Release (main branch only)
  # =============================================================================
  trigger-release:
    name: Trigger Release
    needs: test
    runs-on: ubuntu-latest
    # Only trigger release on main branch, NEVER for PRs
    if: |
      (github.ref == 'refs/heads/main' || inputs.ref == 'refs/heads/main') && !startsWith(inputs.ref || github.ref, 'refs/pull/')
    steps:
      - uses: actions/checkout@v6

      - name: Trigger Release
        uses: ./.github/actions/trigger-release
        with:
          module: docs
          workflow: release-docs.yaml
          workflow-description: Deploy site to GitHub Pages
          ci-run-id: ${{ github.run_id }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          github-token: ${{ github.token }}
