name: "ci-docs (stage 1-7)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''

# Note: Release is triggered by change-trigger.yaml after all CI completes (calver auto-release)

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  ci-docs:
    uses: ./.github/workflows/_module-ci.yaml
    with:
      module: docs
      ref: ${{ inputs.ref }}
      sha: ${{ inputs.sha }}
      trigger_run_id: ${{ inputs.trigger_run_id }}
      build-args: '--all'  # Build PDFs alongside site
      scans: ''  # No scans for documentation
