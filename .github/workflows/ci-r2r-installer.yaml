name: "ci-r2r-installer (stage 1-7)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  ci:
    uses: ./.github/workflows/_module-ci.yaml
    with:
      module: r2r-installer
      ref: ${{ inputs.ref }}
      sha: ${{ inputs.sha }}
      trigger_run_id: ${{ inputs.trigger_run_id }}
      build-args: '--all'
      cross-compile-windows: true
      download-modules: r2r-cli  # Specific module needed for testing
      test-on-windows: true
      scans: ''  # No scans for installer scripts
