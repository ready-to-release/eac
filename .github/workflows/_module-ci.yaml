# Module CI - Reusable Workflow (internal)
#
# Standard CI pipeline for ALL module types. Config-driven: the module moniker
# is the sole input; all behavior (container, scans, tests, evidence) is derived
# from core config via `eac get ci-config`.
#
# Single-container or binary modules:
#   ┌────────┐
#   │ Config │  ← eac get ci-config --module <moniker>
#   └───┬────┘
#       │
#   ┌───┴────┐
#   │  Build │
#   └───┬────┘
#       │
#   ┌───┼────────────┬────────────┬──────┬──────────────┐
#   ▼   ▼            ▼            ▼      ▼              ▼
# ┌────┐ ┌─────────┐ ┌───────┐ ┌──────┐ ┌──────────────┐
# │Test│ │ Test    │ │ Test  │ │ Scan │ │Container Test│
# │Lin.│ │ Windows │ │ macOS │ │      │ │              │
# └────┘ └─────────┘ └───────┘ └──────┘ └──────────────┘
#
# Multi-container modules (is-multi-container=true):
#   ┌────────┐
#   │ Config │  ← derives container-components JSON matrix
#   └───┬────┘
#       │
#   ┌───┴──────────────────┐
#   │  Build Containers    │  ← matrix: one job per pushable container
#   │  (parallel per comp) │
#   └───┬──────────────────┘
#       │
#   ┌───┴────┐
#   │Summary │
#   └────────┘
#
# Underscore prefix convention: internal/shared workflows that are not meant
# to be triggered directly. This workflow is called by ci-*.yaml workflows.

name: Module CI

on:
  workflow_call:
    inputs:
      module:
        description: 'Module moniker to build and test'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      sha:
        description: 'Commit SHA (for artifact lookup)'
        required: false
        type: string
        default: ''
      trigger_run_id:
        description: 'Run ID of trigger workflow (for artifact download)'
        required: false
        type: string
        default: ''

    outputs:
      build-result:
        description: 'Build job result'
        value: ${{ jobs.build.result }}
      test-result:
        description: 'Test job result (Linux)'
        value: ${{ jobs.test-linux.result }}
      test-windows-result:
        description: 'Test job result (Windows)'
        value: ${{ jobs.test-windows.result }}
      test-macos-result:
        description: 'Test job result (macOS)'
        value: ${{ jobs.test-macos.result }}
      scan-result:
        description: 'Scan job result'
        value: ${{ jobs.scan.result }}
      container-test-result:
        description: 'Container test job result'
        value: ${{ jobs.container-test.result }}
      container-image:
        description: 'Container image name (when container)'
        value: ${{ jobs.build.outputs.image-name }}
      container-tag:
        description: 'Container image tag (when container)'
        value: ${{ jobs.build.outputs.image-tag }}
      container-short-sha:
        description: 'Short SHA used for container tag (when container)'
        value: ${{ jobs.build.outputs.short-sha }}
      evidence-result:
        description: 'Evidence job result'
        value: ${{ jobs.evidence.result }}
      evidence-artifact:
        description: 'Evidence artifact name'
        value: ${{ jobs.evidence.outputs.artifact-name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # ===========================================================================
  # Job 0: Config - derive all CI configuration from core config
  # ===========================================================================
  config:
    name: Config
    runs-on: ubuntu-latest
    outputs:
      is-container: ${{ steps.ci-config.outputs.is-container }}
      container-push: ${{ steps.ci-config.outputs.container-push }}
      has-tests: ${{ steps.ci-config.outputs.has-tests }}
      test-on-windows: ${{ steps.ci-config.outputs.test-on-windows }}
      test-on-macos: ${{ steps.ci-config.outputs.test-on-macos }}
      scans: ${{ steps.ci-config.outputs.scans }}
      scan-fail-mode: ${{ steps.ci-config.outputs.scan-fail-mode }}
      build-evidence: ${{ steps.ci-config.outputs.build-evidence }}
      cross-compile-windows: ${{ steps.ci-config.outputs.cross-compile-windows }}
      build-args: ${{ steps.ci-config.outputs.build-args }}
      download-modules: ${{ steps.ci-config.outputs.download-modules }}
      container-test-script: ${{ steps.ci-config.outputs.container-test-script }}
      test-suites: ${{ steps.ci-config.outputs.test-suites }}
      test-suites-full: ${{ steps.ci-config.outputs.test-suites-full }}
      is-multi-container: ${{ steps.ci-config.outputs.is-multi-container }}
      container-components: ${{ steps.ci-config.outputs.container-components }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Derive CI Config
        id: ci-config
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
        run: |
          ${COMMANDS:?COMMANDS not set} get ci-config \
            --module "${{ inputs.module }}" \
            --format github-output >> $GITHUB_OUTPUT

  # ===========================================================================
  # Job A: Build
  # ===========================================================================
  build:
    name: Build
    needs: config
    if: needs.config.outputs.is-multi-container != 'true'
    runs-on: ubuntu-latest
    outputs:
      image-name: ${{ steps.container-build.outputs.image-name }}
      image-tag: ${{ steps.container-build.outputs.image-tag }}
      short-sha: ${{ steps.container-build.outputs.short-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Binary build (default)
      - name: Build Module
        id: build-binary
        if: needs.config.outputs.is-container != 'true'
        uses: ./.github/actions/build-module
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          upload-artifact: 'false'
          extra-args: ${{ needs.config.outputs.build-args }}
          cross-compile-windows: ${{ needs.config.outputs.cross-compile-windows }}

      # Container build
      - name: Build Container
        id: container-build
        if: needs.config.outputs.is-container == 'true'
        uses: ./.github/actions/build-container
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}
          upload-artifact: 'true'
          extra-args: ${{ needs.config.outputs.build-args }}
          download-modules: ${{ needs.config.outputs.download-modules }}
          registry: ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Build Artifacts
        if: needs.config.outputs.is-container != 'true'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: build-artifacts-${{ inputs.module }}
          path: out/build/${{ inputs.module }}/
          if-no-files-found: error

      - name: Build Summary
        if: always() && needs.config.outputs.is-container != 'true'
        shell: bash
        env:
          COMMANDS: ${{ steps.build-binary.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$COMMANDS" ] || [ ! -f "$COMMANDS" ]; then
            echo "## ⚠️ Build Summary Unavailable" >> $GITHUB_STEP_SUMMARY
            echo "Commands binary not available - cannot generate detailed summary." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          ${COMMANDS:?COMMANDS not set} show build-summary $MODULE --run-id=$RUN_ID >> $GITHUB_STEP_SUMMARY

      - name: Container Build Summary
        if: always() && needs.config.outputs.is-container == 'true'
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
          IMAGE_NAME: ${{ steps.container-build.outputs.image-name }}
          IMAGE_TAG: ${{ steps.container-build.outputs.image-tag }}
        run: |
          echo "### Container Build: \`$MODULE\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`$IMAGE_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`$IMAGE_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "Container image pushed and verified." >> $GITHUB_STEP_SUMMARY
          else
            echo "Container build failed. See workflow logs for details." >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # Job A2: Build Containers (matrix) - for multi-container modules
  # ===========================================================================
  build-containers:
    name: "Build: ${{ matrix.component.name }}"
    needs: config
    if: needs.config.outputs.is-multi-container == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.config.outputs.container-components) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build Container Component
        id: container-build
        uses: ./.github/actions/build-container
        with:
          module: ${{ inputs.module }}
          component: ${{ matrix.component.name }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}
          upload-artifact: 'true'
          download-modules: ${{ needs.config.outputs.download-modules }}
          extra-args: ${{ needs.config.outputs.build-args }}
          registry: ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build Summary
        if: always()
        shell: bash
        env:
          COMPONENT: ${{ matrix.component.name }}
          IMAGE_NAME: ${{ steps.container-build.outputs.image-name }}
          IMAGE_TAG: ${{ steps.container-build.outputs.image-tag }}
        run: |
          echo "### Container Build: \`$COMPONENT\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`$IMAGE_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`$IMAGE_TAG\` |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job B: Test (Linux) - parallel with scan
  # ===========================================================================
  test-linux:
    name: Test (Linux)
    needs: [config, build]
    if: needs.config.outputs.has-tests == 'true' && needs.config.outputs.is-container != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download Module Dependencies
        if: needs.config.outputs.download-modules != ''
        uses: ./.github/actions/download-module-deps
        with:
          module: ${{ needs.config.outputs.download-modules }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}

      - name: Determine test suites
        id: suites
        shell: bash
        run: |
          REF="${{ inputs.ref || github.ref }}"
          if [[ "$REF" == refs/pull/* ]] || [[ "$REF" == *"/pull/"* ]]; then
            echo "suites=${{ needs.config.outputs.test-suites }}" >> $GITHUB_OUTPUT
          else
            echo "suites=${{ needs.config.outputs.test-suites-full }}" >> $GITHUB_OUTPUT
          fi

      - name: Test Module
        id: test
        uses: ./.github/actions/test-module
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          suites: ${{ steps.suites.outputs.suites }}
          results-artifact-name: test-results-${{ inputs.module }}-linux
          skip-depm: ${{ needs.config.outputs.download-modules == '' }}
          download-artifact: true

      - name: Upload Test Results
        if: always() && steps.test.outcome != 'skipped'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: test-results-${{ inputs.module }}-linux
          path: ${{ steps.test.outputs.results-artifact-path }}
          if-no-files-found: ignore

      - name: Test Summary
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        env:
          COMMANDS: ${{ steps.test.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          SUITES: ${{ steps.suites.outputs.suites }}
          RUN_ID: ${{ github.run_id }}
          TEST_FAILED: ${{ steps.test.outputs.test-failed }}
          GH_TOKEN: ${{ github.token }}
          RESULTS_ARTIFACT_NAME: test-results-${{ inputs.module }}-linux
        run: |
          if [ -z "$COMMANDS" ] || [ ! -f "$COMMANDS" ]; then
            echo "## ⚠️ Test Summary Unavailable" >> $GITHUB_STEP_SUMMARY
            echo "Commands binary not available - cannot generate detailed summary." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$TEST_FAILED" = "0" ]; then
            STATUS="success"
          else
            STATUS="failure"
          fi
          PRIMARY_SUITE=$(echo "$SUITES" | cut -d',' -f1 | xargs)
          ${COMMANDS:?COMMANDS not set} show test-summary $MODULE $PRIMARY_SUITE --status=$STATUS --run-id=$RUN_ID >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job B2: Test (Windows) - optional, parallel with scan
  # ===========================================================================
  test-windows:
    name: Test (Windows)
    needs: [config, build]
    if: needs.config.outputs.test-on-windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download Module Dependencies
        if: needs.config.outputs.download-modules != ''
        uses: ./.github/actions/download-module-deps
        with:
          module: ${{ needs.config.outputs.download-modules }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}

      - name: Determine test suites
        id: suites
        shell: bash
        run: |
          REF="${{ inputs.ref || github.ref }}"
          if [[ "$REF" == refs/pull/* ]] || [[ "$REF" == *"/pull/"* ]]; then
            echo "suites=${{ needs.config.outputs.test-suites }}" >> $GITHUB_OUTPUT
          else
            echo "suites=${{ needs.config.outputs.test-suites-full }}" >> $GITHUB_OUTPUT
          fi

      - name: Test Module
        id: test
        uses: ./.github/actions/test-module
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          suites: ${{ steps.suites.outputs.suites }}
          results-artifact-name: test-results-${{ inputs.module }}-windows
          skip-depm: ${{ needs.config.outputs.download-modules == '' }}
          download-artifact: true

      - name: Upload Test Results
        if: always() && steps.test.outcome != 'skipped'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: test-results-${{ inputs.module }}-windows
          path: ${{ steps.test.outputs.results-artifact-path }}
          if-no-files-found: ignore

      - name: Test Summary
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        env:
          COMMANDS: ${{ steps.test.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          SUITES: ${{ steps.suites.outputs.suites }}
          RUN_ID: ${{ github.run_id }}
          TEST_FAILED: ${{ steps.test.outputs.test-failed }}
          GH_TOKEN: ${{ github.token }}
          RESULTS_ARTIFACT_NAME: test-results-${{ inputs.module }}-windows
        run: |
          if [ -z "$COMMANDS" ] || [ ! -f "$COMMANDS" ]; then
            echo "## ⚠️ Test Summary Unavailable" >> $GITHUB_STEP_SUMMARY
            echo "Commands binary not available - cannot generate detailed summary." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$TEST_FAILED" = "0" ]; then
            STATUS="success"
          else
            STATUS="failure"
          fi
          PRIMARY_SUITE=$(echo "$SUITES" | cut -d',' -f1 | xargs)
          ${COMMANDS:?COMMANDS not set} show test-summary $MODULE $PRIMARY_SUITE --status=$STATUS --run-id=$RUN_ID >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job B3: Test (macOS) - optional, parallel with scan
  # ===========================================================================
  test-macos:
    name: Test (macOS)
    needs: [config, build]
    if: needs.config.outputs.test-on-macos == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download Module Dependencies
        if: needs.config.outputs.download-modules != ''
        uses: ./.github/actions/download-module-deps
        with:
          module: ${{ needs.config.outputs.download-modules }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}

      - name: Determine test suites
        id: suites
        shell: bash
        run: |
          REF="${{ inputs.ref || github.ref }}"
          if [[ "$REF" == refs/pull/* ]] || [[ "$REF" == *"/pull/"* ]]; then
            echo "suites=${{ needs.config.outputs.test-suites }}" >> $GITHUB_OUTPUT
          else
            echo "suites=${{ needs.config.outputs.test-suites-full }}" >> $GITHUB_OUTPUT
          fi

      - name: Test Module
        id: test
        uses: ./.github/actions/test-module
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          suites: ${{ steps.suites.outputs.suites }}
          results-artifact-name: test-results-${{ inputs.module }}-macos
          skip-depm: ${{ needs.config.outputs.download-modules == '' }}
          download-artifact: true

      - name: Upload Test Results
        if: always() && steps.test.outcome != 'skipped'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: test-results-${{ inputs.module }}-macos
          path: ${{ steps.test.outputs.results-artifact-path }}
          if-no-files-found: ignore

      - name: Test Summary
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        env:
          COMMANDS: ${{ steps.test.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          SUITES: ${{ steps.suites.outputs.suites }}
          RUN_ID: ${{ github.run_id }}
          TEST_FAILED: ${{ steps.test.outputs.test-failed }}
          GH_TOKEN: ${{ github.token }}
          RESULTS_ARTIFACT_NAME: test-results-${{ inputs.module }}-macos
        run: |
          if [ -z "$COMMANDS" ] || [ ! -f "$COMMANDS" ]; then
            echo "## ⚠️ Test Summary Unavailable" >> $GITHUB_STEP_SUMMARY
            echo "Commands binary not available - cannot generate detailed summary." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$TEST_FAILED" = "0" ]; then
            STATUS="success"
          else
            STATUS="failure"
          fi
          PRIMARY_SUITE=$(echo "$SUITES" | cut -d',' -f1 | xargs)
          ${COMMANDS:?COMMANDS not set} show test-summary $MODULE $PRIMARY_SUITE --status=$STATUS --run-id=$RUN_ID >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job C: Scan - parallel with test
  # ===========================================================================
  scan:
    name: Scan
    needs: [config, build]
    if: needs.config.outputs.scans != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Scan Module
        id: scan-step
        uses: ./.github/actions/scan-module
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          scans: ${{ needs.config.outputs.scans }}
          fail-on-error: ${{ needs.config.outputs.scan-fail-mode }}

      - name: Upload Scan Results
        if: always() && steps.scan-step.outcome != 'skipped'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: scan-results-${{ inputs.module }}
          path: out/scan/
          if-no-files-found: warn

      - name: Scan Summary
        if: always() && steps.scan-step.outcome != 'skipped'
        shell: bash
        env:
          COMMANDS: ${{ steps.scan-step.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          ARTIFACT_NAME: scan-results-${{ inputs.module }}
        run: |
          ${COMMANDS:?COMMANDS not set} show scan-summary "$MODULE" --artifact-name="$ARTIFACT_NAME" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job D: Container Test - for container modules with test scripts
  # ===========================================================================
  container-test:
    name: Container Test
    needs: [config, build]
    if: needs.config.outputs.is-container == 'true' && needs.config.outputs.container-test-script != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull CI image
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image-name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          echo "Pulling container image..."
          docker pull "$IMAGE_NAME:$IMAGE_TAG"
          docker tag "$IMAGE_NAME:$IMAGE_TAG" ${{ inputs.module }}:ci-test
          docker images ${{ inputs.module }}:ci-test

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts-${{ inputs.module }}
          path: out/build/

      - name: Download Module Dependencies
        if: needs.config.outputs.download-modules != ''
        uses: ./.github/actions/download-module-deps
        with:
          module: ${{ needs.config.outputs.download-modules }}
          commit-sha: ${{ inputs.sha || github.sha }}

      - name: Run Container Tests
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image-name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          MODULE: ${{ inputs.module }}
        run: |
          chmod +x "${{ needs.config.outputs.container-test-script }}"
          bash "${{ needs.config.outputs.container-test-script }}"

      - name: Container Test Summary
        if: always()
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image-name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          echo "## Container Test: ${{ inputs.module }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "Container tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Container tests failed." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`$IMAGE_NAME:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job E: Evidence - builds compliance PDFs from test/scan results
  # ===========================================================================
  evidence:
    name: Evidence
    needs: [config, build, build-containers, test-linux, test-windows, test-macos, container-test, scan]
    if: needs.config.outputs.build-evidence == 'true' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.evidence.outputs.artifact-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Build Evidence Books
        id: evidence
        uses: ./.github/actions/build-evidence-books
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    name: Summary
    needs: [config, build, build-containers, test-linux, test-windows, test-macos, container-test, scan, evidence]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Generate Summary
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_CONTAINERS_RESULT: ${{ needs.build-containers.result }}
          IS_MULTI_CONTAINER: ${{ needs.config.outputs.is-multi-container }}
          TEST_LINUX_RESULT: ${{ needs.test-linux.result }}
          TEST_WINDOWS_RESULT: ${{ needs.test-windows.result }}
          TEST_MACOS_RESULT: ${{ needs.test-macos.result }}
          CONTAINER_TEST_RESULT: ${{ needs.container-test.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          TEST_ON_WINDOWS: ${{ needs.config.outputs.test-on-windows }}
          TEST_ON_MACOS: ${{ needs.config.outputs.test-on-macos }}
          CONTAINER: ${{ needs.config.outputs.is-container }}
          CONTAINER_TEST_ENABLED: ${{ needs.config.outputs.container-test-script != '' }}
          SCANS: ${{ needs.config.outputs.scans }}
          BUILD_EVIDENCE: ${{ needs.config.outputs.build-evidence }}
        run: |
          echo "## CI Summary: $MODULE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # For multi-container modules, use the matrix build result
          if [ "$IS_MULTI_CONTAINER" = "true" ]; then
            BUILD_RESULT="$BUILD_CONTAINERS_RESULT"
          fi

          # Build flags for Go command
          FLAGS="--build=$BUILD_RESULT"

          if [ "$CONTAINER" = "true" ]; then
            FLAGS="$FLAGS --container"
            if [ "$CONTAINER_TEST_ENABLED" = "true" ]; then
              FLAGS="$FLAGS --container-test-enabled --container-test=$CONTAINER_TEST_RESULT"
            fi
          else
            FLAGS="$FLAGS --test-linux=$TEST_LINUX_RESULT"
            if [ "$TEST_ON_WINDOWS" = "true" ]; then
              FLAGS="$FLAGS --test-on-windows --test-windows=$TEST_WINDOWS_RESULT"
            fi
            if [ "$TEST_ON_MACOS" = "true" ]; then
              FLAGS="$FLAGS --test-on-macos --test-macos=$TEST_MACOS_RESULT"
            fi
          fi

          if [ -n "$SCANS" ]; then
            FLAGS="$FLAGS --scans-enabled --scan=$SCAN_RESULT"
          fi

          if [ "$BUILD_EVIDENCE" = "true" ]; then
            FLAGS="$FLAGS --evidence-enabled --evidence=$EVIDENCE_RESULT"
          fi

          # Generate summary using Go command
          ${COMMANDS:?COMMANDS not set} show ci-summary $FLAGS >> $GITHUB_STEP_SUMMARY

      # Centralized failure handling - diagnostic link for any CI failure
      - name: Diagnostic Link on Failure
        if: contains(needs.*.result, 'failure')
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          CONTAINER: ${{ needs.config.outputs.is-container }}
        run: |
          if [ "$CONTAINER" = "true" ]; then
            ${COMMANDS:?COMMANDS not set} pipeline ci summary-link ${{ github.run_id }} --type container >> $GITHUB_STEP_SUMMARY
          else
            ${COMMANDS:?COMMANDS not set} pipeline ci summary-link ${{ github.run_id }} --type test --artifact "test-results-$MODULE-linux" >> $GITHUB_STEP_SUMMARY
          fi
