# Module CI - Reusable Workflow (internal)
#
# Standard CI pipeline for ALL module types. Config-driven: the module moniker
# is the sole input; all behavior (container, scans, tests, evidence) is derived
# from core config via `eac get ci-config`.
#
# Single-container or binary modules:
#   ┌───────────────────────────────────────────────┐
#   │ Build (config + build + upload)               │
#   └───┬───────────────────────────────────────────┘
#       │
#   ┌───┼──────────────┬──────────┬───────────┬──────────────┐
#   ▼   ▼              ▼          ▼           ▼              ▼
# ┌──────────┐ ┌──────────┐ ┌─────────┐ ┌───────┐ ┌──────────────┐
# │ Test     │ │  Scan    │ │ Test    │ │ Test  │ │Container Test│
# │ (Linux)  │ │          │ │ Windows │ │ macOS │ │              │
# └──────────┘ └──────────┘ └─────────┘ └───────┘ └──────────────┘
#
# Multi-container modules (is-multi-container=true):
#   ┌───────────────────────────────────────────────┐
#   │ Build (config derivation only)                │
#   └───┬───────────────────────────────────────────┘
#       │
#   ┌───┴──────────────────┐
#   │  Check Containers    │  ← per-component change detection via GHCR tags
#   └───┬──────────────────┘
#       │
#   ┌───┴──────────────────┐
#   │  Build Containers    │  ← matrix: only CHANGED containers
#   │  (parallel per comp) │
#   └───┬──────────────────┘
#       │
#   ┌───┴────┐
#   │Summary │
#   └────────┘
#
# Underscore prefix convention: internal/shared workflows that are not meant
# to be triggered directly. This workflow is called by ci-*.yaml workflows.

name: Module CI

on:
  workflow_call:
    inputs:
      module:
        description: 'Module moniker to build and test'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      sha:
        description: 'Commit SHA (for artifact lookup)'
        required: false
        type: string
        default: ''
      trigger_run_id:
        description: 'Run ID of trigger workflow (for artifact download)'
        required: false
        type: string
        default: ''

    outputs:
      build-result:
        description: 'Build job result'
        value: ${{ jobs.build.result }}
      test-result:
        description: 'Test job result (Linux)'
        value: ${{ jobs.test-linux.result }}
      test-windows-result:
        description: 'Test job result (Windows)'
        value: ${{ jobs.test-windows.result }}
      test-macos-result:
        description: 'Test job result (macOS)'
        value: ${{ jobs.test-macos.result }}
      scan-result:
        description: 'Scan job result'
        value: ${{ jobs.scan.result }}
      container-test-result:
        description: 'Container test job result'
        value: ${{ jobs.container-test.result }}
      container-image:
        description: 'Container image name (when container)'
        value: ${{ jobs.build.outputs.image-name }}
      container-tag:
        description: 'Container image tag (when container)'
        value: ${{ jobs.build.outputs.image-tag }}
      container-short-sha:
        description: 'Short SHA used for container tag (when container)'
        value: ${{ jobs.build.outputs.short-sha }}
      evidence-result:
        description: 'Evidence job result'
        value: ${{ jobs.evidence.result }}
      evidence-artifact:
        description: 'Evidence artifact name'
        value: ${{ jobs.evidence.outputs.artifact-name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # ===========================================================================
  # Job A: Build (config + build only, test and scan run in parallel jobs)
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    if: true  # always runs
    outputs:
      # Config outputs (moved from config job)
      is-container: ${{ steps.ci-config.outputs.is-container }}
      container-push: ${{ steps.ci-config.outputs.container-push }}
      has-tests: ${{ steps.ci-config.outputs.has-tests }}
      test-on-windows: ${{ steps.ci-config.outputs.test-on-windows }}
      test-on-macos: ${{ steps.ci-config.outputs.test-on-macos }}
      scans: ${{ steps.ci-config.outputs.scans }}
      scan-fail-mode: ${{ steps.ci-config.outputs.scan-fail-mode }}
      build-evidence: ${{ steps.ci-config.outputs.build-evidence }}
      cross-compile-windows: ${{ steps.ci-config.outputs.cross-compile-windows }}
      build-args: ${{ steps.ci-config.outputs.build-args }}
      download-modules: ${{ steps.ci-config.outputs.download-modules }}
      container-test-script: ${{ steps.ci-config.outputs.container-test-script }}
      test-suites: ${{ steps.ci-config.outputs.test-suites }}
      test-suites-full: ${{ steps.ci-config.outputs.test-suites-full }}
      is-multi-container: ${{ steps.ci-config.outputs.is-multi-container }}
      container-components: ${{ steps.ci-config.outputs.container-components }}
      # Build outputs (existing)
      image-name: ${{ steps.container-build.outputs.image-name }}
      image-tag: ${{ steps.container-build.outputs.image-tag }}
      short-sha: ${{ steps.container-build.outputs.short-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # 1. Setup commands binary (one time for the whole job)
      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands
        with:
          trigger-run-id: ${{ inputs.trigger_run_id }}

      # 2. Derive CI config (replaces config job)
      - name: Derive CI Config
        id: ci-config
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
        run: |
          ${COMMANDS:?COMMANDS not set} get ci-config \
            --module "${{ inputs.module }}" \
            --format github-output >> $GITHUB_OUTPUT

      # 3. Setup module dependencies (one time)
      - name: Setup Module Dependencies
        uses: ./.github/actions/setup-module-deps
        with:
          module: ${{ inputs.module }}
          commands-path: ${{ steps.commands.outputs.commands-path }}

      # 4. Download module deps (for modules with depends_on_ci)
      - name: Download Module Dependencies
        if: steps.ci-config.outputs.download-modules != ''
        uses: ./.github/actions/download-module-deps
        with:
          module: ${{ steps.ci-config.outputs.download-modules }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}

      # 5. Build (binary or container)
      - name: Build Module (binary)
        id: build-binary
        if: steps.ci-config.outputs.is-container != 'true' && steps.ci-config.outputs.is-multi-container != 'true'
        shell: bash
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          EXTRA_ARGS: ${{ steps.ci-config.outputs.build-args }}
        run: |
          ${COMMANDS:?COMMANDS not set} build $MODULE --skip-cache --skip-depm $EXTRA_ARGS

      - name: Build Container
        id: container-build
        if: steps.ci-config.outputs.is-container == 'true' && steps.ci-config.outputs.is-multi-container != 'true'
        uses: ./.github/actions/build-container
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}
          upload-artifact: 'true'
          extra-args: ${{ steps.ci-config.outputs.build-args }}
          download-modules: ${{ steps.ci-config.outputs.download-modules }}
          registry: ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # 6. Upload build artifacts (needed by download-module-deps in dependent modules, cross-platform tests, and release workflows)
      - name: Upload Build Artifacts
        if: |
          steps.ci-config.outputs.is-container != 'true'
          && steps.ci-config.outputs.is-multi-container != 'true'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: build-artifacts-${{ inputs.module }}
          path: out/build/${{ inputs.module }}/
          if-no-files-found: error

      # 7. Build summary
      - name: Build Summary
        if: always() && steps.ci-config.outputs.is-container != 'true' && steps.ci-config.outputs.is-multi-container != 'true'
        shell: bash
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$COMMANDS" ] || [ ! -f "$COMMANDS" ]; then
            echo "## Build Summary Unavailable" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          ${COMMANDS:?COMMANDS not set} show build-summary $MODULE --run-id=$RUN_ID >> $GITHUB_STEP_SUMMARY

      - name: Container Build Summary
        if: always() && steps.ci-config.outputs.is-container == 'true' && steps.ci-config.outputs.is-multi-container != 'true'
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
          IMAGE_NAME: ${{ steps.container-build.outputs.image-name }}
          IMAGE_TAG: ${{ steps.container-build.outputs.image-tag }}
        run: |
          echo "### Container Build: \`$MODULE\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`$IMAGE_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`$IMAGE_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "Container image pushed and verified." >> $GITHUB_STEP_SUMMARY
          else
            echo "Container build failed. See workflow logs for details." >> $GITHUB_STEP_SUMMARY
          fi

      # 8. Cross-compile commands for Windows (after ci-config is known)
      - name: Cross-compile commands for Windows
        if: steps.ci-config.outputs.cross-compile-windows == 'true'
        shell: bash
        run: |
          cd go/cli/eac
          GOOS=windows GOARCH=amd64 go build -o ../../../out/tools/eac.exe .
      - name: Upload Windows commands binary
        if: steps.ci-config.outputs.cross-compile-windows == 'true'
        uses: ./.github/actions/upload-artifact-retry
        continue-on-error: true
        with:
          name: commands-binary-windows
          path: out/tools/eac.exe
          if-no-files-found: error


  # ===========================================================================
  # Job B1: Test (Linux) - parallel with scan and cross-platform tests
  # ===========================================================================
  test-linux:
    name: Test (Linux)
    needs: [build]
    if: >-
      needs.build.outputs.has-tests == 'true'
      && needs.build.outputs.is-container != 'true'
      && needs.build.outputs.is-multi-container != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands
        with:
          trigger-run-id: ${{ inputs.trigger_run_id }}

      - name: Setup Module Dependencies
        uses: ./.github/actions/setup-module-deps
        with:
          module: ${{ inputs.module }}
          commands-path: ${{ steps.commands.outputs.commands-path }}

      - name: Download Module Dependencies
        if: needs.build.outputs.download-modules != ''
        uses: ./.github/actions/download-module-deps
        with:
          module: ${{ needs.build.outputs.download-modules }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts-${{ inputs.module }}
          path: out/build/${{ inputs.module }}/

      - name: Determine test suites
        id: suites
        shell: bash
        run: |
          REF="${{ inputs.ref || github.ref }}"
          if [[ "$REF" == refs/pull/* ]] || [[ "$REF" == *"/pull/"* ]]; then
            echo "suites=${{ needs.build.outputs.test-suites }}" >> $GITHUB_OUTPUT
          else
            echo "suites=${{ needs.build.outputs.test-suites-full }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR (for integration tests)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Test Module (Linux)
        id: test-linux
        shell: bash
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          SUITES: ${{ steps.suites.outputs.suites }}
          SKIP_DEPM: ${{ needs.build.outputs.download-modules == '' }}
        run: |
          test_failed=0
          SKIP_DEPM_FLAG=""
          if [ "$SKIP_DEPM" = "true" ]; then
            SKIP_DEPM_FLAG="--skip-depm"
          fi
          IFS=',' read -ra SUITE_ARRAY <<< "$SUITES"
          for suite in "${SUITE_ARRAY[@]}"; do
            suite=$(echo "$suite" | xargs)
            echo "Running test suite: $suite"
            if ! ${COMMANDS:?COMMANDS not set} test $MODULE --suite $suite --skip-cache $SKIP_DEPM_FLAG; then
              test_failed=1
            fi
          done
          echo "test-failed=$test_failed" >> $GITHUB_OUTPUT
          if [ "$test_failed" -eq 1 ]; then
            exit 1
          fi

      - name: Upload Test Results (Linux)
        if: always() && steps.test-linux.outcome != 'skipped'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: test-results-${{ inputs.module }}-linux
          path: out/test/
          if-no-files-found: ignore

      - name: Test Summary (Linux)
        if: always() && steps.test-linux.outcome != 'skipped'
        shell: bash
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          SUITES: ${{ steps.suites.outputs.suites }}
          RUN_ID: ${{ github.run_id }}
          TEST_FAILED: ${{ steps.test-linux.outputs.test-failed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$COMMANDS" ] || [ ! -f "$COMMANDS" ]; then
            exit 0
          fi
          if [ "$TEST_FAILED" = "0" ]; then STATUS="success"; else STATUS="failure"; fi
          PRIMARY_SUITE=$(echo "$SUITES" | cut -d',' -f1 | xargs)
          ${COMMANDS:?COMMANDS not set} show test-summary $MODULE $PRIMARY_SUITE --status=$STATUS --run-id=$RUN_ID >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job C: Scan - parallel with tests
  # ===========================================================================
  scan:
    name: Scan
    needs: [build]
    if: >-
      needs.build.outputs.scans != ''
      && needs.build.outputs.is-container != 'true'
      && needs.build.outputs.is-multi-container != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands
        with:
          trigger-run-id: ${{ inputs.trigger_run_id }}

      - name: Setup Module Dependencies
        uses: ./.github/actions/setup-module-deps
        with:
          module: ${{ inputs.module }}
          commands-path: ${{ steps.commands.outputs.commands-path }}

      - name: Download Module Dependencies
        if: needs.build.outputs.download-modules != ''
        uses: ./.github/actions/download-module-deps
        with:
          module: ${{ needs.build.outputs.download-modules }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts-${{ inputs.module }}
          path: out/build/${{ inputs.module }}/

      - name: Setup Docker Buildx (for scans)
        uses: docker/setup-buildx-action@v4

      - name: Scan Module
        id: scan-step
        shell: bash
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          SCANS: ${{ needs.build.outputs.scans }}
          FAIL_ON_ERROR: ${{ needs.build.outputs.scan-fail-mode }}
        run: |
          mkdir -p out/scan/$MODULE
          if ${COMMANDS:?COMMANDS not set} scan $MODULE --scanner "$SCANS" --no-tui; then
            echo "scan-failed=false" >> $GITHUB_OUTPUT
          else
            echo "scan-failed=true" >> $GITHUB_OUTPUT
            if [ "$FAIL_ON_ERROR" = "error" ]; then
              exit 1
            fi
          fi

      - name: Upload Scan Results
        if: always() && steps.scan-step.outcome != 'skipped'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: scan-results-${{ inputs.module }}
          path: out/scan/
          if-no-files-found: warn

      - name: Scan Summary
        if: always() && steps.scan-step.outcome != 'skipped'
        shell: bash
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          ARTIFACT_NAME: scan-results-${{ inputs.module }}
        run: |
          ${COMMANDS:?COMMANDS not set} show scan-summary "$MODULE" --artifact-name="$ARTIFACT_NAME" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job A1.5: Check Container Changes - per-component change detection
  # ===========================================================================
  check-containers:
    name: Check Container Changes
    needs: [build]
    if: needs.build.outputs.is-multi-container == 'true'
    runs-on: ubuntu-latest
    outputs:
      filtered-components: ${{ steps.detect.outputs.filtered-components }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      skipped-components: ${{ steps.detect.outputs.skipped-components }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands
        with:
          trigger-run-id: ${{ inputs.trigger_run_id }}

      - name: Detect Changed Containers
        id: detect
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ${COMMANDS:?COMMANDS not set} get changed-containers \
            --module "${{ inputs.module }}" \
            --components '${{ needs.build.outputs.container-components }}' \
            --head-sha "${{ inputs.sha || github.sha }}" \
            --format github-output \
            >> $GITHUB_OUTPUT

      - name: Change Detection Summary
        env:
          HAS_CHANGES: ${{ steps.detect.outputs.has-changes }}
          FILTERED: ${{ steps.detect.outputs.filtered-components }}
          SKIPPED: ${{ steps.detect.outputs.skipped-components }}
        run: |
          echo "### Container Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Components |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Changed | \`$FILTERED\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Skipped | \`$SKIPPED\` |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job A2: Build Containers (matrix) - for multi-container modules
  # ===========================================================================
  build-containers:
    name: "Build: ${{ matrix.component.name }}"
    needs: [build, check-containers]
    if: >-
      needs.build.outputs.is-multi-container == 'true'
      && needs.check-containers.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.check-containers.outputs.filtered-components) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build Container Component
        id: container-build
        uses: ./.github/actions/build-container
        with:
          module: ${{ inputs.module }}
          component: ${{ matrix.component.name }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}
          upload-artifact: 'true'
          download-modules: ${{ needs.build.outputs.download-modules }}
          extra-args: ${{ needs.build.outputs.build-args }}
          registry: ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build Summary
        if: always()
        shell: bash
        env:
          COMPONENT: ${{ matrix.component.name }}
          IMAGE_NAME: ${{ steps.container-build.outputs.image-name }}
          IMAGE_TAG: ${{ steps.container-build.outputs.image-tag }}
        run: |
          echo "### Container Build: \`$COMPONENT\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`$IMAGE_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`$IMAGE_TAG\` |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job B2: Test (Windows) - optional, parallel with macOS
  # ===========================================================================
  test-windows:
    name: Test (Windows)
    needs: [build]
    if: needs.build.outputs.test-on-windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Workaround: actions/runner-images#13729 - Docker service may not be
      # started when the Windows runner boots. Start it explicitly and wait.
      - name: Ensure Docker is available
        shell: pwsh
        run: |
          $maxAttempts = 30
          $delay = 2
          for ($i = 1; $i -le $maxAttempts; $i++) {
            if (docker info 2>$null) {
              Write-Host "✓ Docker is ready (attempt $i/$maxAttempts)"
              docker version --format '{{.Server.Version}}'
              exit 0
            }
            if ($i -eq 1) {
              Write-Host "Docker not ready, ensuring service is started..."
              Get-Service -Name 'docker*' | Where-Object { $_.Status -ne 'Running' } | ForEach-Object {
                Write-Host "  Starting service: $($_.Name) (status: $($_.Status))"
                Start-Service $_.Name -ErrorAction SilentlyContinue
              }
            }
            Write-Host "Waiting for Docker (attempt $i/$maxAttempts)..."
            Start-Sleep -Seconds $delay
          }
          Write-Host "❌ Docker did not become available after $($maxAttempts * $delay)s"
          exit 1

      - name: Download Module Dependencies
        if: needs.build.outputs.download-modules != ''
        uses: ./.github/actions/download-module-deps
        with:
          module: ${{ needs.build.outputs.download-modules }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}

      - name: Determine test suites
        id: suites
        shell: bash
        run: |
          REF="${{ inputs.ref || github.ref }}"
          if [[ "$REF" == refs/pull/* ]] || [[ "$REF" == *"/pull/"* ]]; then
            echo "suites=${{ needs.build.outputs.test-suites }}" >> $GITHUB_OUTPUT
          else
            echo "suites=${{ needs.build.outputs.test-suites-full }}" >> $GITHUB_OUTPUT
          fi

      - name: Test Module
        id: test
        uses: ./.github/actions/test-module
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          suites: ${{ steps.suites.outputs.suites }}
          results-artifact-name: test-results-${{ inputs.module }}-windows
          skip-depm: ${{ needs.build.outputs.download-modules == '' }}
          download-artifact: true

      - name: Upload Test Results
        if: always() && steps.test.outcome != 'skipped'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: test-results-${{ inputs.module }}-windows
          path: ${{ steps.test.outputs.results-artifact-path }}
          if-no-files-found: ignore

      - name: Test Summary
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        env:
          COMMANDS: ${{ steps.test.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          SUITES: ${{ steps.suites.outputs.suites }}
          RUN_ID: ${{ github.run_id }}
          TEST_FAILED: ${{ steps.test.outputs.test-failed }}
          GH_TOKEN: ${{ github.token }}
          RESULTS_ARTIFACT_NAME: test-results-${{ inputs.module }}-windows
        run: |
          if [ -z "$COMMANDS" ] || [ ! -f "$COMMANDS" ]; then
            echo "## Test Summary Unavailable" >> $GITHUB_STEP_SUMMARY
            echo "Commands binary not available - cannot generate detailed summary." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$TEST_FAILED" = "0" ]; then
            STATUS="success"
          else
            STATUS="failure"
          fi
          PRIMARY_SUITE=$(echo "$SUITES" | cut -d',' -f1 | xargs)
          ${COMMANDS:?COMMANDS not set} show test-summary $MODULE $PRIMARY_SUITE --status=$STATUS --run-id=$RUN_ID >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job B3: Test (macOS) - optional, parallel with Windows
  # ===========================================================================
  test-macos:
    name: Test (macOS)
    needs: [build]
    if: needs.build.outputs.test-on-macos == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download Module Dependencies
        if: needs.build.outputs.download-modules != ''
        uses: ./.github/actions/download-module-deps
        with:
          module: ${{ needs.build.outputs.download-modules }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}

      - name: Determine test suites
        id: suites
        shell: bash
        run: |
          REF="${{ inputs.ref || github.ref }}"
          if [[ "$REF" == refs/pull/* ]] || [[ "$REF" == *"/pull/"* ]]; then
            echo "suites=${{ needs.build.outputs.test-suites }}" >> $GITHUB_OUTPUT
          else
            echo "suites=${{ needs.build.outputs.test-suites-full }}" >> $GITHUB_OUTPUT
          fi

      - name: Test Module
        id: test
        uses: ./.github/actions/test-module
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          suites: ${{ steps.suites.outputs.suites }}
          results-artifact-name: test-results-${{ inputs.module }}-macos
          skip-depm: ${{ needs.build.outputs.download-modules == '' }}
          download-artifact: true

      - name: Upload Test Results
        if: always() && steps.test.outcome != 'skipped'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: test-results-${{ inputs.module }}-macos
          path: ${{ steps.test.outputs.results-artifact-path }}
          if-no-files-found: ignore

      - name: Test Summary
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        env:
          COMMANDS: ${{ steps.test.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          SUITES: ${{ steps.suites.outputs.suites }}
          RUN_ID: ${{ github.run_id }}
          TEST_FAILED: ${{ steps.test.outputs.test-failed }}
          GH_TOKEN: ${{ github.token }}
          RESULTS_ARTIFACT_NAME: test-results-${{ inputs.module }}-macos
        run: |
          if [ -z "$COMMANDS" ] || [ ! -f "$COMMANDS" ]; then
            echo "## Test Summary Unavailable" >> $GITHUB_STEP_SUMMARY
            echo "Commands binary not available - cannot generate detailed summary." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$TEST_FAILED" = "0" ]; then
            STATUS="success"
          else
            STATUS="failure"
          fi
          PRIMARY_SUITE=$(echo "$SUITES" | cut -d',' -f1 | xargs)
          ${COMMANDS:?COMMANDS not set} show test-summary $MODULE $PRIMARY_SUITE --status=$STATUS --run-id=$RUN_ID >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job D: Container Test - for container modules with test scripts
  # ===========================================================================
  container-test:
    name: Container Test
    needs: [build]
    if: needs.build.outputs.is-container == 'true' && needs.build.outputs.container-test-script != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull CI image
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image-name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          echo "Pulling container image..."
          docker pull "$IMAGE_NAME:$IMAGE_TAG"
          docker tag "$IMAGE_NAME:$IMAGE_TAG" ${{ inputs.module }}:ci-test
          docker images ${{ inputs.module }}:ci-test

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts-${{ inputs.module }}
          path: out/build/

      - name: Download Module Dependencies
        if: needs.build.outputs.download-modules != ''
        uses: ./.github/actions/download-module-deps
        with:
          module: ${{ needs.build.outputs.download-modules }}
          commit-sha: ${{ inputs.sha || github.sha }}

      - name: Run Container Tests
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image-name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          MODULE: ${{ inputs.module }}
        run: |
          chmod +x "${{ needs.build.outputs.container-test-script }}"
          bash "${{ needs.build.outputs.container-test-script }}"

      - name: Container Test Summary
        if: always()
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image-name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          echo "## Container Test: ${{ inputs.module }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "Container tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Container tests failed." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`$IMAGE_NAME:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job E: Evidence - builds compliance PDFs from test/scan results
  # ===========================================================================
  evidence:
    name: Evidence
    needs: [build, test-linux, scan, check-containers, build-containers, test-windows, test-macos, container-test]
    if: always() && needs.build.outputs.build-evidence == 'true' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.evidence.outputs.artifact-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Build Evidence Books
        id: evidence
        uses: ./.github/actions/build-evidence-books
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    name: Summary
    needs: [build, test-linux, scan, check-containers, build-containers, test-windows, test-macos, container-test, evidence]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Generate Summary
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_CONTAINERS_RESULT: ${{ needs.build-containers.result }}
          IS_MULTI_CONTAINER: ${{ needs.build.outputs.is-multi-container }}
          TEST_LINUX_RESULT: ${{ needs.test-linux.result }}
          TEST_WINDOWS_RESULT: ${{ needs.test-windows.result }}
          TEST_MACOS_RESULT: ${{ needs.test-macos.result }}
          CONTAINER_TEST_RESULT: ${{ needs.container-test.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          TEST_ON_WINDOWS: ${{ needs.build.outputs.test-on-windows }}
          TEST_ON_MACOS: ${{ needs.build.outputs.test-on-macos }}
          CONTAINER: ${{ needs.build.outputs.is-container }}
          CONTAINER_TEST_ENABLED: ${{ needs.build.outputs.container-test-script != '' }}
          SCANS: ${{ needs.build.outputs.scans }}
          BUILD_EVIDENCE: ${{ needs.build.outputs.build-evidence }}
        run: |
          echo "## CI Summary: $MODULE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # For multi-container modules, use the matrix build result
          if [ "$IS_MULTI_CONTAINER" = "true" ]; then
            BUILD_RESULT="$BUILD_CONTAINERS_RESULT"
          fi

          # Build flags for Go command
          FLAGS="--build=$BUILD_RESULT"

          if [ "$CONTAINER" = "true" ]; then
            FLAGS="$FLAGS --container"
            if [ "$CONTAINER_TEST_ENABLED" = "true" ]; then
              FLAGS="$FLAGS --container-test-enabled --container-test=$CONTAINER_TEST_RESULT"
            fi
          else
            FLAGS="$FLAGS --test-linux=$TEST_LINUX_RESULT"
            if [ "$TEST_ON_WINDOWS" = "true" ]; then
              FLAGS="$FLAGS --test-on-windows --test-windows=$TEST_WINDOWS_RESULT"
            fi
            if [ "$TEST_ON_MACOS" = "true" ]; then
              FLAGS="$FLAGS --test-on-macos --test-macos=$TEST_MACOS_RESULT"
            fi
          fi

          if [ -n "$SCANS" ]; then
            FLAGS="$FLAGS --scans-enabled --scan=$SCAN_RESULT"
          fi

          if [ "$BUILD_EVIDENCE" = "true" ]; then
            FLAGS="$FLAGS --evidence-enabled --evidence=$EVIDENCE_RESULT"
          fi

          # Generate summary using Go command
          ${COMMANDS:?COMMANDS not set} show ci-summary $FLAGS >> $GITHUB_STEP_SUMMARY

      # Centralized failure handling - diagnostic link for any CI failure
      - name: Diagnostic Link on Failure
        if: contains(needs.*.result, 'failure')
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          CONTAINER: ${{ needs.build.outputs.is-container }}
        run: |
          if [ "$CONTAINER" = "true" ]; then
            ${COMMANDS:?COMMANDS not set} pipeline ci summary-link ${{ github.run_id }} --type container >> $GITHUB_STEP_SUMMARY
          else
            ${COMMANDS:?COMMANDS not set} pipeline ci summary-link ${{ github.run_id }} --type test --artifact "test-results-$MODULE-linux" >> $GITHUB_STEP_SUMMARY
          fi
