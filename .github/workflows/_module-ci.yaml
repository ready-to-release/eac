# Module CI - Reusable Workflow (internal)
#
# Standard CI pipeline for modules with parallel test and scan jobs:
#
#   ┌─────────┐
#   │  Build  │ (Job A)
#   └────┬────┘
#        │
#   ┌────┴────┐
#   ▼         ▼
# ┌─────┐  ┌──────┐
# │Test │  │ Scan │ (Jobs B & C - parallel)
# └─────┘  └──────┘
#
# Underscore prefix convention: internal/shared workflows that are not meant
# to be triggered directly. This workflow is called by ci-*.yaml workflows.
#
# Usage in ci-*.yaml:
#   jobs:
#     ci:
#       uses: ./.github/workflows/_module-ci.yaml
#       with:
#         module: eac-core
#         scans: sbom,vuln,secrets
#
# For modules needing Windows testing:
#   jobs:
#     ci:
#       uses: ./.github/workflows/_module-ci.yaml
#       with:
#         module: r2r-cli
#         test-on-windows: true
#         cross-compile-windows: true
#
# For container modules:
#   jobs:
#     ci:
#       uses: ./.github/workflows/_module-ci.yaml
#       with:
#         module: ext-eac
#         container: true
#         no-deps: false  # Need deps for integration testing

name: Module CI

on:
  workflow_call:
    inputs:
      module:
        description: 'Module moniker to build and test'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      sha:
        description: 'Commit SHA (for artifact lookup)'
        required: false
        type: string
        default: ''
      trigger_run_id:
        description: 'Run ID of trigger workflow (for artifact download)'
        required: false
        type: string
        default: ''
      # Build options
      build-args:
        description: 'Extra arguments for build command'
        required: false
        type: string
        default: ''
      cross-compile-windows:
        description: 'Cross-compile for Windows (for CLI modules)'
        required: false
        type: boolean
        default: false
      no-deps:
        description: 'Build in isolated mode without dependency artifacts'
        required: false
        type: boolean
        default: true
      container:
        description: 'Build as container module (uses build-container action)'
        required: false
        type: boolean
        default: false
      container-registry:
        description: 'Container registry for container builds'
        required: false
        type: string
        default: 'ghcr.io'
      upload-build-artifact:
        description: 'Upload build artifacts'
        required: false
        type: boolean
        default: true
      # Test options
      test-suites:
        description: 'Test suites to run (comma-separated)'
        required: false
        type: string
        default: 'unit,integration'
      test-suites-full:
        description: 'Test suites for main/release branches'
        required: false
        type: string
        default: 'unit,integration,acceptance'
      test-on-windows:
        description: 'Also run tests on Windows'
        required: false
        type: boolean
        default: false
      # Scan options
      scans:
        description: 'Security scans to run (comma-separated, empty to skip)'
        required: false
        type: string
        default: 'sbom,vuln,secrets'
      scan-fail-mode:
        description: 'How to handle scan failures: error, warn, ignore'
        required: false
        type: string
        default: 'warn'
      # Container test options
      container-test-enabled:
        description: 'Enable container testing (pulls image and runs tests)'
        required: false
        type: boolean
        default: false
      container-test-command:
        description: 'Command to run inside container for health check'
        required: false
        type: string
        default: ''

    outputs:
      build-result:
        description: 'Build job result'
        value: ${{ jobs.build.result }}
      test-result:
        description: 'Test job result (Linux)'
        value: ${{ jobs.test-linux.result }}
      test-windows-result:
        description: 'Test job result (Windows)'
        value: ${{ jobs.test-windows.result }}
      scan-result:
        description: 'Scan job result'
        value: ${{ jobs.scan.result }}
      container-test-result:
        description: 'Container test job result'
        value: ${{ jobs.container-test.result }}
      # Container outputs (only populated when container: true)
      container-image:
        description: 'Container image name (when container: true)'
        value: ${{ jobs.build.outputs.image-name }}
      container-tag:
        description: 'Container image tag (when container: true)'
        value: ${{ jobs.build.outputs.image-tag }}
      container-short-sha:
        description: 'Short SHA used for container tag (when container: true)'
        value: ${{ jobs.build.outputs.short-sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write  # Required for container builds (push to GHCR)
  actions: read

jobs:
  # ===========================================================================
  # Job A: Build
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      # Container outputs (only populated when container: true)
      image-name: ${{ steps.container-build.outputs.image-name }}
      image-tag: ${{ steps.container-build.outputs.image-tag }}
      short-sha: ${{ steps.container-build.outputs.short-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Binary build (default)
      - name: Build Module
        if: ${{ !inputs.container }}
        uses: ./.github/actions/build-module
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}
          upload-artifact: ${{ inputs.upload-build-artifact && 'true' || 'false' }}
          extra-args: ${{ inputs.build-args }}
          cross-compile-windows: ${{ inputs.cross-compile-windows && 'true' || 'false' }}
          no-deps: ${{ inputs.no-deps && 'true' || 'false' }}

      # Container build (when container: true)
      - name: Build Container
        id: container-build
        if: ${{ inputs.container }}
        uses: ./.github/actions/build-container
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}
          upload-artifact: ${{ inputs.upload-build-artifact && 'true' || 'false' }}
          extra-args: ${{ inputs.build-args }}
          no-deps: ${{ inputs.no-deps && 'true' || 'false' }}
          registry: ${{ inputs.container-registry }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ===========================================================================
  # Job B: Test (Linux) - parallel with scan
  # Skip for container modules (use container-test instead)
  # ===========================================================================
  test-linux:
    name: Test (Linux)
    needs: build
    if: ${{ !inputs.container }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Determine test suites
        id: suites
        shell: bash
        run: |
          # PRs use lighter suite, main/release use full suite
          REF="${{ inputs.ref || github.ref }}"
          if [[ "$REF" == refs/pull/* ]] || [[ "$REF" == *"/pull/"* ]]; then
            echo "suites=${{ inputs.test-suites }}" >> $GITHUB_OUTPUT
          else
            echo "suites=${{ inputs.test-suites-full }}" >> $GITHUB_OUTPUT
          fi

      - name: Test Module
        uses: ./.github/actions/test-module
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          suites: ${{ steps.suites.outputs.suites }}
          results-artifact-name: test-results-${{ inputs.module }}-linux

  # ===========================================================================
  # Job B2: Test (Windows) - optional, parallel with scan
  # ===========================================================================
  test-windows:
    name: Test (Windows)
    needs: build
    if: inputs.test-on-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Determine test suites
        id: suites
        shell: bash
        run: |
          REF="${{ inputs.ref || github.ref }}"
          if [[ "$REF" == refs/pull/* ]] || [[ "$REF" == *"/pull/"* ]]; then
            echo "suites=${{ inputs.test-suites }}" >> $GITHUB_OUTPUT
          else
            echo "suites=${{ inputs.test-suites-full }}" >> $GITHUB_OUTPUT
          fi

      - name: Test Module
        uses: ./.github/actions/test-module
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          suites: ${{ steps.suites.outputs.suites }}
          results-artifact-name: test-results-${{ inputs.module }}-windows

  # ===========================================================================
  # Job C: Scan - parallel with test
  # ===========================================================================
  scan:
    name: Security Scan
    needs: build
    if: inputs.scans != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Scan Module
        uses: ./.github/actions/scan-module
        with:
          module: ${{ inputs.module }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          scans: ${{ inputs.scans }}
          fail-on-error: ${{ inputs.scan-fail-mode }}

  # ===========================================================================
  # Job B3: Container Test - for container modules
  # ===========================================================================
  container-test:
    name: Container Test
    needs: build
    if: ${{ inputs.container && inputs.container-test-enabled }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.container-registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull CI image
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image-name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          echo "Pulling container image..."
          docker pull "$IMAGE_NAME:$IMAGE_TAG"
          docker tag "$IMAGE_NAME:$IMAGE_TAG" ${{ inputs.module }}:ci-test
          docker images ${{ inputs.module }}:ci-test

      - name: Download Build Artifacts
        if: ${{ !inputs.no-deps }}
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts-${{ inputs.module }}
          path: out/build/

      - name: Run Container Test
        if: ${{ inputs.container-test-command != '' }}
        env:
          TEST_IMAGE: ${{ inputs.module }}:ci-test
          TEST_CMD: ${{ inputs.container-test-command }}
        run: |
          echo "Running container test command..."
          docker run --rm "$TEST_IMAGE" $TEST_CMD

      - name: Container Test Summary
        if: always()
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image-name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          echo "## Container Test: ${{ inputs.module }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "Container tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Container tests failed." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`$IMAGE_NAME:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    name: Summary
    needs: [build, test-linux, test-windows, container-test, scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Generate Summary
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          MODULE: ${{ inputs.module }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_LINUX_RESULT: ${{ needs.test-linux.result }}
          TEST_WINDOWS_RESULT: ${{ needs.test-windows.result }}
          CONTAINER_TEST_RESULT: ${{ needs.container-test.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
          TEST_ON_WINDOWS: ${{ inputs.test-on-windows }}
          CONTAINER: ${{ inputs.container }}
          CONTAINER_TEST_ENABLED: ${{ inputs.container-test-enabled }}
          SCANS: ${{ inputs.scans }}
        run: |
          echo "## CI Summary: $MODULE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Build flags for Go command
          FLAGS="--build=$BUILD_RESULT"

          if [ "$CONTAINER" = "true" ]; then
            FLAGS="$FLAGS --container"
            if [ "$CONTAINER_TEST_ENABLED" = "true" ]; then
              FLAGS="$FLAGS --container-test-enabled --container-test=$CONTAINER_TEST_RESULT"
            fi
          else
            FLAGS="$FLAGS --test-linux=$TEST_LINUX_RESULT"
            if [ "$TEST_ON_WINDOWS" = "true" ]; then
              FLAGS="$FLAGS --test-on-windows --test-windows=$TEST_WINDOWS_RESULT"
            fi
          fi

          if [ -n "$SCANS" ]; then
            FLAGS="$FLAGS --scans-enabled --scan=$SCAN_RESULT"
          fi

          # Generate summary using Go command
          $COMMANDS show ci-summary $FLAGS >> $GITHUB_STEP_SUMMARY
