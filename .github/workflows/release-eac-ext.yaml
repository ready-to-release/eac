# Release eac-ext - Container Image Release Workflow
#
# Retags, attests, and publishes the EAC extension container image.
# Release type (container) is derived from core config.

name: "Release: eac-ext"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver format: x.y.z)'
        required: true
        type: string
      skip-ci-check:
        description: 'Skip CI verification (dangerous - hotfixes only)'
        required: false
        type: boolean
        default: false

jobs:
  release:
    uses: ./.github/workflows/_module-release.yaml
    with:
      module: eac-ext
      version: ${{ inputs.version }}
      skip-ci-check: ${{ inputs.skip-ci-check }}
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
      attestations: write
      actions: read
