# CI Orchestrator - Optimized Module Build Trigger
#
# This workflow implements incremental CI by only building modules that have changed
# since the last successful CI run. It uses the repository's dependency graph to ensure
# that when a module changes, all modules that depend on it are also rebuilt (cache invalidation).
#
# How it works:
# 1. Compares current commit against last successful "Change Trigger" run
# 2. Uses `get changed modules ci` command which:
#    - Maps changed files to their owning modules (via module contracts)
#    - Expands to include all transitive dependents (if src-core changes, src-cli rebuilds too)
# 3. Triggers only the necessary module workflows in dependency order
#
# For PRs: Compares against PR base SHA
# For push: Compares against last successful CI SHA
# Bootstrap (no previous success): Builds all modules

name: "Change Trigger"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger-all:
        description: 'Trigger all workflows regardless of changes (override optimization)'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      changed-modules: ${{ steps.detect.outputs.modules }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      directly_changed: ${{ steps.detect.outputs.directly_changed }}
      invalidated: ${{ steps.detect.outputs.invalidated }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      is_bootstrap: ${{ steps.detect.outputs.is_bootstrap }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            src/commands/go.sum
            src/core/go.sum

      - name: Detect Changed Modules
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src/commands

          # Check if trigger-all override is enabled
          TRIGGER_ALL="${{ inputs.trigger-all }}"

          if [ "$TRIGGER_ALL" = "true" ]; then
            echo "🔄 Trigger-all override enabled - building all modules"
            WORKFLOW_MODULES="src-cli src-commands src-core src-mcp-commands ext-eac docs"
            echo "directly_changed=all" >> $GITHUB_OUTPUT
            echo "invalidated=none" >> $GITHUB_OUTPUT
            echo "base_sha=N/A" >> $GITHUB_OUTPUT
            echo "is_bootstrap=false" >> $GITHUB_OUTPUT
          else
            # Optimized CI: Only rebuild modules that have actually changed or whose
            # dependencies have changed. The `get changed modules ci` command:
            #   1. Queries GitHub API for the last successful "Change Trigger" run SHA
            #   2. Computes git diff between that SHA and current HEAD
            #   3. Maps changed files to modules using repository contracts
            #   4. Expands with transitive dependents (cache invalidation)
            #
            # Example: If only src/core/* files changed:
            #   - directly_changed: [src-core]
            #   - invalidated: [src-commands, src-cli, src-mcp-commands, ext-eac] (dependents)
            #   - modules: [src-core, src-commands, src-cli, src-mcp-commands, ext-eac]
            echo "🔍 Detecting modules requiring rebuild (with dependency invalidation)..."

            # For PRs: compare against PR base (what the PR introduces)
            # For push: compare against last successful CI (incremental since last success)
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "📋 Pull Request detected - comparing against PR base"
              RESULT=$(go run . "get changed modules ci" --pr-base "${{ github.event.pull_request.base.sha }}" --as-json)
            else
              echo "📋 Push detected - comparing against last successful CI"
              RESULT=$(go run . "get changed modules ci" --as-json)
            fi

            echo "Raw result:"
            echo "$RESULT" | jq .

            # Extract the analysis results:
            # - modules: ALL modules that need rebuilding (changed + dependents)
            # - directly_changed: modules with actual file changes
            # - invalidated: modules that need rebuild because their dependencies changed
            MODULES=$(echo "$RESULT" | jq -r '.modules | join(" ")')
            DIRECTLY_CHANGED=$(echo "$RESULT" | jq -r '.directly_changed | join(" ")')
            INVALIDATED=$(echo "$RESULT" | jq -r '.invalidated | join(" ")')
            BASE_SHA=$(echo "$RESULT" | jq -r '.base_sha')
            IS_BOOTSTRAP=$(echo "$RESULT" | jq -r '.is_bootstrap')

            echo ""
            echo "📊 Analysis Results:"
            echo "  Base SHA: $BASE_SHA"
            echo "  Is Bootstrap: $IS_BOOTSTRAP"
            echo "  Directly Changed: $DIRECTLY_CHANGED"
            echo "  Invalidated (dependents): $INVALIDATED"
            echo "  All Modules to Rebuild: $MODULES"

            # Filter to only modules that have workflows
            WORKFLOW_MODULES=""
            for module in $MODULES; do
              if [ -f "../../.github/workflows/ci-${module}.yaml" ]; then
                WORKFLOW_MODULES="$WORKFLOW_MODULES $module"
              fi
            done
            WORKFLOW_MODULES=$(echo $WORKFLOW_MODULES | xargs)

            echo ""
            echo "📦 Modules with workflows: $WORKFLOW_MODULES"

            # Store additional context for summary
            echo "directly_changed=$DIRECTLY_CHANGED" >> $GITHUB_OUTPUT
            echo "invalidated=$INVALIDATED" >> $GITHUB_OUTPUT
            echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT
            echo "is_bootstrap=$IS_BOOTSTRAP" >> $GITHUB_OUTPUT
          fi

          if [ -n "$WORKFLOW_MODULES" ]; then
            echo "modules=$WORKFLOW_MODULES" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "modules=" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
          fi

  # Validate repository contracts before running any module builds
  # This catches configuration errors early (unordered files, overlapping ownership)
  validate-repository:
    name: Validate Repository Contracts
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            src/commands/go.sum
            src/core/go.sum

      - name: Run Repository Validation
        id: validation
        run: |
          cd src/commands
          FAILED=0
          ERRORS=""

          echo "🔍 Validating repository contracts..."
          if ! OUTPUT=$(go run . test repository 2>&1); then
            FAILED=1
            ERRORS="${ERRORS}### Repository Contract Validation Failed\n\`\`\`\n${OUTPUT}\n\`\`\`\n\n"
            echo "::error::Repository contract validation failed"
          fi
          echo "$OUTPUT"

          echo ""
          echo "🔍 Validating module dependencies..."
          if ! OUTPUT=$(go run . validate dependencies 2>&1); then
            FAILED=1
            ERRORS="${ERRORS}### Module Dependencies Validation Failed\n\`\`\`\n${OUTPUT}\n\`\`\`\n\n"
            echo "::error::Module dependencies validation failed"
          fi
          echo "$OUTPUT"

          echo ""
          echo "🔍 Validating static modules (config files)..."
          if ! OUTPUT=$(go run . build repo-config 2>&1); then
            FAILED=1
            ERRORS="${ERRORS}### repo-config Build Failed\n\`\`\`\n${OUTPUT}\n\`\`\`\n\n"
            echo "::error::repo-config build failed"
          fi
          echo "$OUTPUT"

          if ! OUTPUT=$(go run . build contracts 2>&1); then
            FAILED=1
            ERRORS="${ERRORS}### contracts Build Failed\n\`\`\`\n${OUTPUT}\n\`\`\`\n\n"
            echo "::error::contracts build failed"
          fi
          echo "$OUTPUT"

          echo ""
          if [ $FAILED -ne 0 ]; then
            # Write errors to step summary for visibility
            echo "## ❌ Validation Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo -e "$ERRORS" >> $GITHUB_STEP_SUMMARY
            echo "::error::Validation failed - see job summary for details"
            exit 1
          fi

          echo "✅ All validations passed"
          echo "## ✅ Validation Passed" >> $GITHUB_STEP_SUMMARY

  calculate-order:
    name: Calculate Execution Order
    needs: [detect-changes, validate-repository]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      execution-plan: ${{ steps.calculate.outputs.plan }}
      layer-count: ${{ steps.calculate.outputs.layer-count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            src/commands/go.sum
            src/core/go.sum

      - name: Calculate Execution Order
        id: calculate
        run: |
          cd src/commands

          # Get execution order for changed modules
          MODULES="${{ needs.detect-changes.outputs.changed-modules }}"

          # Calculate execution order using the new command
          PLAN=$(go run . "get execution order" $MODULES --as-json)

          echo "Execution plan:"
          echo "$PLAN" | jq .

          # Save plan
          echo "plan<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Extract layer count
          LAYER_COUNT=$(echo "$PLAN" | jq -r '.layer_count')
          echo "layer-count=$LAYER_COUNT" >> $GITHUB_OUTPUT

  # Execute module workflows in dependency order
  # Single job that processes all layers sequentially
  # Each layer's workflows are triggered in parallel and awaited

  execute-layers:
    name: Execute Dependency Layers
    needs: [detect-changes, calculate-order]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Execute All Layers Sequentially
        run: |
          PLAN='${{ needs.calculate-order.outputs.execution-plan }}'
          LAYER_COUNT=$(echo "$PLAN" | jq -r '.layer_count')

          echo "📊 Execution plan has $LAYER_COUNT layer(s)"
          echo ""

          # Process each layer sequentially
          for ((layer_idx=0; layer_idx<LAYER_COUNT; layer_idx++)); do
            LAYER_NUM=$((layer_idx + 1))
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔨 Processing Layer $LAYER_NUM"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Get modules for this layer
            LAYER_MODULES=$(echo "$PLAN" | jq -r ".layers[$layer_idx][]")

            if [ -z "$LAYER_MODULES" ]; then
              echo "⚠️  No modules in layer $LAYER_NUM"
              continue
            fi

            echo "📦 Modules in Layer $LAYER_NUM: $LAYER_MODULES"
            echo ""

            # Arrays to track workflow run IDs
            declare -a RUN_IDS=()
            declare -a MODULES=()

            # Trigger all workflows in this layer in parallel
            for module in $LAYER_MODULES; do
              WORKFLOW_FILE=".github/workflows/ci-${module}.yaml"
              if [ -f "$WORKFLOW_FILE" ]; then
                echo "🚀 Triggering workflow for $module..."
                gh workflow run "ci-${module}.yaml" \
                  --ref ${{ github.ref_name }} \
                  -f ref=${{ github.ref }} \
                  -f sha=${{ github.sha }}

                if [ $? -ne 0 ]; then
                  echo "::error::Failed to trigger $module workflow"
                  exit 1
                fi

                # Wait a moment for the workflow to be created
                sleep 2

                # Get the most recent run ID for this workflow
                RUN_ID=$(gh run list --workflow="ci-${module}.yaml" --limit 1 --json databaseId --jq '.[0].databaseId')

                if [ -n "$RUN_ID" ]; then
                  echo "  📝 Workflow $module started with run ID: $RUN_ID"
                  RUN_IDS+=("$RUN_ID")
                  MODULES+=("$module")
                else
                  echo "  ::warning::Could not find run ID for $module workflow"
                fi
              else
                echo "  ⚠️  No workflow file found for $module"
              fi
            done

            # Wait for all workflows in this layer to complete
            if [ ${#RUN_IDS[@]} -gt 0 ]; then
              echo ""
              echo "⏳ Waiting for all Layer $LAYER_NUM workflows to complete..."
              echo ""

              FAILED=0
              for i in "${!RUN_IDS[@]}"; do
                RUN_ID="${RUN_IDS[$i]}"
                MODULE="${MODULES[$i]}"

                echo "⌛ Waiting for $MODULE (run $RUN_ID)..."

                # Watch the workflow run and wait for completion
                gh run watch "$RUN_ID" --exit-status --interval 10

                if [ $? -ne 0 ]; then
                  echo "  ::error::❌ Workflow $MODULE failed!"
                  FAILED=1
                else
                  echo "  ✅ Workflow $MODULE completed successfully"
                fi
              done

              if [ $FAILED -eq 1 ]; then
                echo ""
                echo "::error::❌ One or more workflows in Layer $LAYER_NUM failed"
                exit 1
              fi

              echo ""
              echo "🎉 All Layer $LAYER_NUM workflows completed successfully"
            else
              echo "⚠️  No workflows were triggered in Layer $LAYER_NUM"
            fi

            echo ""
          done

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ All layers completed successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        env:
          GH_TOKEN: ${{ github.token }}

  summary:
    name: Summary
    needs: [detect-changes, validate-repository, calculate-order, execute-layers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          echo "## CI/CD Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.detect-changes.outputs.has-changes }}" != "true" ]; then
            echo "### ✅ No Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "No modules require rebuilding since last successful CI." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Base SHA**: \`${{ needs.detect-changes.outputs.base_sha }}\`" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "### 📊 Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          IS_BOOTSTRAP="${{ needs.detect-changes.outputs.is_bootstrap }}"
          if [ "$IS_BOOTSTRAP" = "true" ]; then
            echo "**Mode**: Bootstrap (no previous successful CI found)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Base SHA**: \`${{ needs.detect-changes.outputs.base_sha }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Category | Modules |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Directly Changed | ${{ needs.detect-changes.outputs.directly_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Invalidated (dependents) | ${{ needs.detect-changes.outputs.invalidated }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total to Rebuild** | ${{ needs.detect-changes.outputs.changed-modules }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📦 Execution Plan" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo '${{ needs.calculate-order.outputs.execution-plan }}' | jq . >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🔍 Validation Result" >> $GITHUB_STEP_SUMMARY
          VALIDATION="${{ needs.validate-repository.result }}"
          if [ "$VALIDATION" = "success" ]; then
            echo "✅ **Repository Contracts**: Valid" >> $GITHUB_STEP_SUMMARY
          elif [ "$VALIDATION" = "failure" ]; then
            echo "❌ **Repository Contracts**: Invalid - fix contract issues" >> $GITHUB_STEP_SUMMARY
          elif [ "$VALIDATION" = "skipped" ]; then
            echo "⏭️ **Repository Contracts**: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Repository Contracts**: $VALIDATION" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🏁 Execution Result" >> $GITHUB_STEP_SUMMARY
          RESULT="${{ needs.execute-layers.result }}"
          if [ "$RESULT" = "success" ]; then
            echo "✅ **Status**: Success" >> $GITHUB_STEP_SUMMARY
          elif [ "$RESULT" = "failure" ]; then
            echo "❌ **Status**: Failed" >> $GITHUB_STEP_SUMMARY
          elif [ "$RESULT" = "skipped" ]; then
            echo "⏭️ **Status**: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status**: $RESULT" >> $GITHUB_STEP_SUMMARY
          fi
