# Change Trigger - Optimized Module Build Orchestrator
#
# This workflow implements incremental CI by only building modules that have changed
# since the last successful CI run. It uses the repository's dependency graph to ensure
# that when a module changes, all modules that depend on it are also rebuilt (cache invalidation).
#
# Pipeline stages:
# 1. setup: Build commands binary (shared by all jobs)
# 2. detect-changes: Determine which modules need CI workflows triggered
# 3. execute-workflows: Dispatch ALL module CI workflows in parallel (including repository)
# 4. summary: Report results
#
# NOTE: All CI workflows run in parallel. Dependency verification happens at RELEASE time
# via the `release await-deps` command, not during CI dispatch.
#
# For PRs: Compares against PR base SHA
# For push: Compares against last successful CI SHA
# Bootstrap (no previous success): Builds all modules

name: "Change Trigger"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger-all:
        description: 'Trigger all workflows regardless of changes (override optimization)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write  # Required for creating release tags

jobs:
  # =========================================
  # Setup: Build commands binary (runs first, shared by all jobs)
  # =========================================
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Commands Binary
        uses: ./.github/actions/setup-commands

  # =========================================
  # Detect Changed Modules
  # =========================================
  detect-changes:
    name: Detect Changed Modules
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      changed-modules: ${{ steps.detect.outputs.modules }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      directly_changed: ${{ steps.detect.outputs.directly_changed }}
      invalidated: ${{ steps.detect.outputs.invalidated }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      is_bootstrap: ${{ steps.detect.outputs.is_bootstrap }}
      changed_file_count: ${{ steps.detect.outputs.changed_file_count }}
      files_by_module: ${{ steps.detect.outputs.files_by_module }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands
        with:
          trigger-run-id: ${{ github.run_id }}

      - name: Detect Changed Modules
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
        run: |
          # Check if trigger-all override is enabled
          TRIGGER_ALL="${{ inputs.trigger-all }}"

          if [ "$TRIGGER_ALL" = "true" ]; then
            echo "Trigger-all override enabled - building all modules"

            # Dynamically discover all CI workflows
            WORKFLOW_MODULES=$($COMMANDS get ci-workflows --format space)

            echo "Discovered CI workflows: $WORKFLOW_MODULES"
            echo "directly_changed=all" >> $GITHUB_OUTPUT
            echo "invalidated=none" >> $GITHUB_OUTPUT
            echo "base_sha=N/A" >> $GITHUB_OUTPUT
            echo "is_bootstrap=false" >> $GITHUB_OUTPUT
            echo "changed_file_count=N/A" >> $GITHUB_OUTPUT
            echo "files_by_module={}" >> $GITHUB_OUTPUT
          else
            echo "Detecting modules requiring rebuild (with dependency invalidation)..."

            # For PRs: compare against PR base (what the PR introduces)
            # For push: compare against last successful CI (incremental since last success)
            # Use --format shell to get variables directly (no jq needed)
            # Shell format outputs: MODULES, DIRECTLY_CHANGED, INVALIDATED, BASE_SHA, IS_BOOTSTRAP, CHANGED_FILE_COUNT, FILES_BY_MODULE
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Pull Request detected - comparing against PR base"
              eval $($COMMANDS get changed-modules-ci --pr-base "${{ github.event.pull_request.base.sha }}" --format shell)
            else
              echo "Push detected - comparing against last successful CI"
              eval $($COMMANDS get changed-modules-ci --format shell)
            fi

            echo ""
            echo "Analysis Results:"
            echo "  Base SHA: $BASE_SHA"
            echo "  Is Bootstrap: $IS_BOOTSTRAP"
            echo "  Changed Files: $CHANGED_FILE_COUNT"
            echo "  Directly Changed: $DIRECTLY_CHANGED"
            echo "  Invalidated (dependents): $INVALIDATED"
            echo "  All Modules to Rebuild: $MODULES"

            # Filter to only modules that have workflows
            WORKFLOW_MODULES=""
            for module in $MODULES; do
              if [ -f ".github/workflows/ci-${module}.yaml" ]; then
                WORKFLOW_MODULES="$WORKFLOW_MODULES $module"
              fi
            done
            WORKFLOW_MODULES=$(echo $WORKFLOW_MODULES | xargs)

            echo ""
            echo "Modules with workflows: $WORKFLOW_MODULES"

            # Store additional context for summary
            echo "directly_changed=$DIRECTLY_CHANGED" >> $GITHUB_OUTPUT
            echo "invalidated=$INVALIDATED" >> $GITHUB_OUTPUT
            echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT
            echo "is_bootstrap=$IS_BOOTSTRAP" >> $GITHUB_OUTPUT
            echo "changed_file_count=$CHANGED_FILE_COUNT" >> $GITHUB_OUTPUT
            echo "files_by_module=$FILES_BY_MODULE" >> $GITHUB_OUTPUT
          fi

          if [ -n "$WORKFLOW_MODULES" ]; then
            echo "modules=$WORKFLOW_MODULES" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "modules=" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
          fi

          # Generate step summary
          echo "## Change Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$TRIGGER_ALL" = "true" ]; then
            echo "**Mode**: Manual trigger-all override" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All CI workflows will be triggered:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$WORKFLOW_MODULES" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          elif [ -z "$WORKFLOW_MODULES" ]; then
            echo "**Result**: No modules require rebuilding" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Base SHA | \`$BASE_SHA\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Files Changed | $CHANGED_FILE_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Modules Affected | None with CI workflows |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            if [ "$IS_BOOTSTRAP" = "true" ]; then
              echo "| Mode | Bootstrap (no previous CI) |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Base SHA | \`$BASE_SHA\` |" >> $GITHUB_STEP_SUMMARY
            fi
            echo "| Files Changed | $CHANGED_FILE_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Directly Changed | \`$DIRECTLY_CHANGED\` |" >> $GITHUB_STEP_SUMMARY
            if [ -n "$INVALIDATED" ]; then
              echo "| Cache Invalidated | \`$INVALIDATED\` |" >> $GITHUB_STEP_SUMMARY
            fi
            echo "| **CI Workflows to Run** | \`$WORKFLOW_MODULES\` |" >> $GITHUB_STEP_SUMMARY

            # Show detailed reasoning per module (why each module was triggered)
            if [ "$IS_BOOTSTRAP" != "true" ] && [ -n "$FILES_BY_MODULE" ] && [ "$FILES_BY_MODULE" != "null" ] && [ "$FILES_BY_MODULE" != "{}" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Why each module was triggered" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Process directly changed modules
              for module in $DIRECTLY_CHANGED; do
                FILE_COUNT=$($COMMANDS get files-by-module "$module" --json "$FILES_BY_MODULE" --count)

                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary><strong>$module</strong> - $FILE_COUNT file(s) changed</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                $COMMANDS get files-by-module "$module" --json "$FILES_BY_MODULE" --format list >> $GITHUB_STEP_SUMMARY
                echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "</details>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              done

              # Process invalidated modules (triggered due to dependency changes)
              for module in $INVALIDATED; do
                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary><strong>$module</strong> - dependency changed</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "Triggered because a dependency was modified:" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                for dep in $DIRECTLY_CHANGED; do
                  echo "- \`$dep\`" >> $GITHUB_STEP_SUMMARY
                done
                echo "</details>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              done
            fi
          fi

  # =========================================
  # Execute Module Workflows (Layered by CI Artifact Dependencies)
  # =========================================
  execute-workflows:
    name: Dispatch CI
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Commands Binary
        id: commands
        if: needs.detect-changes.outputs.has-changes == 'true'
        uses: ./.github/actions/setup-commands
        with:
          trigger-run-id: ${{ github.run_id }}

      - name: Filter modules with valid CI
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
        run: |
          # Early exit if no changes
          if [ "${{ needs.detect-changes.outputs.has-changes }}" != "true" ]; then
            echo "modules=" >> $GITHUB_OUTPUT
            echo "skipped=" >> $GITHUB_OUTPUT
            exit 0
          fi

          DIRECTLY_CHANGED="${{ needs.detect-changes.outputs.directly_changed }}"
          INVALIDATED="${{ needs.detect-changes.outputs.invalidated }}"

          echo "Filtering modules that already have valid CI..."
          echo "  Directly changed: $DIRECTLY_CHANGED"
          echo "  Invalidated: $INVALIDATED"
          echo ""

          # Use Go command to filter modules
          eval $($COMMANDS get ci-dispatch \
            --directly-changed "$DIRECTLY_CHANGED" \
            --invalidated "$INVALIDATED" \
            --head-sha "${{ github.sha }}" \
            --format shell)

          # DISPATCH and SKIPPED variables are now set
          echo "modules=$DISPATCH" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

      - name: Compute CI dispatch layers
        id: layers
        if: steps.filter.outputs.modules != ''
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
        run: |
          MODULES="${{ steps.filter.outputs.modules }}"

          echo "Computing CI dispatch layers for: $MODULES"
          echo ""

          # Get layers based on CI artifact dependencies
          eval $($COMMANDS get ci-dispatch-layers --modules "$MODULES" --format shell)

          # LAYER_COUNT, LAYER_0, LAYER_1, LAYERS_JSON are now set
          echo "layer_count=$LAYER_COUNT" >> $GITHUB_OUTPUT
          echo "layer_0=$LAYER_0" >> $GITHUB_OUTPUT
          echo "layer_1=${LAYER_1:-}" >> $GITHUB_OUTPUT
          echo "layers_json=$LAYERS_JSON" >> $GITHUB_OUTPUT

      - name: Dispatch CI workflows in layers
        env:
          GH_TOKEN: ${{ github.token }}
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
        run: |
          # Early exit if no changes
          if [ "${{ needs.detect-changes.outputs.has-changes }}" != "true" ]; then
            echo "No modules require building - skipping execution"
            echo "## Dispatch CI" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No module CI workflows to execute." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          MODULES="${{ steps.filter.outputs.modules }}"
          SKIPPED="${{ steps.filter.outputs.skipped }}"

          # Check if all modules were skipped
          if [ -z "$MODULES" ]; then
            echo "All modules have valid CI at current HEAD - nothing to dispatch"
            echo "## Dispatch CI" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**All modules skipped** - valid CI already exists at current HEAD." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Skipped modules: \`$SKIPPED\`" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Determine the correct ref for workflow_dispatch
          HEAD_REF="${{ github.head_ref }}"
          REF_NAME="${{ github.ref_name }}"
          if [ -n "$HEAD_REF" ]; then
            DISPATCH_REF="$HEAD_REF"
          else
            DISPATCH_REF="$REF_NAME"
          fi

          LAYER_COUNT="${{ steps.layers.outputs.layer_count }}"
          LAYER_0="${{ steps.layers.outputs.layer_0 }}"
          LAYER_1="${{ steps.layers.outputs.layer_1 }}"

          echo "Event: ${{ github.event_name }}"
          echo "DISPATCH_REF: $DISPATCH_REF"
          echo "Layer count: $LAYER_COUNT"
          echo ""

          TOTAL_DISPATCHED=0
          DISPATCHED_LIST=""

          # Helper function to dispatch a layer
          dispatch_layer() {
            local layer_num=$1
            local modules=$2

            if [ -z "$modules" ]; then
              return 0
            fi

            echo ""
            echo "=============================================="
            echo "Layer $layer_num: $modules"
            echo "=============================================="

            for module in $modules; do
              if [ -f ".github/workflows/ci-${module}.yaml" ]; then
                echo "  Dispatching: ci-${module}.yaml"
                gh workflow run "ci-${module}.yaml" \
                  --ref "$DISPATCH_REF" \
                  -f ref=${{ github.ref }} \
                  -f sha=${{ github.sha }} \
                  -f trigger_run_id=${{ github.run_id }}
                TOTAL_DISPATCHED=$((TOTAL_DISPATCHED + 1))
                DISPATCHED_LIST="$DISPATCHED_LIST $module"
                sleep 2
              fi
            done
          }

          # Dispatch Layer 0 (modules with no CI artifact dependencies)
          dispatch_layer 0 "$LAYER_0"

          # If there's a Layer 1, wait for Layer 0 deps then dispatch
          if [ -n "$LAYER_1" ]; then
            echo ""
            echo "=============================================="
            echo "Waiting for Layer 0 dependencies to complete..."
            echo "=============================================="

            # Layer 1 modules depend on r2r-cli - wait for it if dispatched
            if echo "$LAYER_0" | grep -qw "r2r-cli"; then
              echo "Waiting for r2r-cli CI to complete..."
              $COMMANDS pipeline wait --workflow ci-r2r-cli.yaml --sha "${{ github.sha }}" --timeout 1200 || {
                echo "::error::r2r-cli CI did not complete successfully"
                exit 1
              }
              echo "✅ r2r-cli CI completed"
            fi

            # Dispatch Layer 1
            dispatch_layer 1 "$LAYER_1"
          fi

          echo ""
          echo "======================================================================"
          echo "Dispatched $TOTAL_DISPATCHED workflow(s) in $LAYER_COUNT layer(s)"
          echo "======================================================================"

          # Generate step summary
          echo "## Dispatch CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode**: Layered execution (CI artifact dependencies)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dispatched **$TOTAL_DISPATCHED** CI workflow(s) in **$LAYER_COUNT** layer(s):" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Layer 0 (no CI deps)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$LAYER_0" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          if [ -n "$LAYER_1" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Layer 1 (depends on r2r-cli)" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$LAYER_1" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$SKIPPED" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Skipped** (valid CI exists at HEAD): \`$SKIPPED\`" >> $GITHUB_STEP_SUMMARY
          fi

  # =========================================
  # Summary
  # =========================================
  summary:
    name: Summary
    needs: [detect-changes, execute-workflows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Generate Summary
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## CI/CD Orchestration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.detect-changes.outputs.has-changes }}" != "true" ]; then
            echo "### No CI Workflows Triggered" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No module CI workflows were triggered for this commit." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            BASE_SHA="${{ needs.detect-changes.outputs.base_sha }}"
            CHANGED_FILE_COUNT="${{ needs.detect-changes.outputs.changed_file_count }}"

            echo "#### Reasoning" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "null" ]; then
              echo "No previous successful CI run found to compare against." >> $GITHUB_STEP_SUMMARY
            else
              echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
              echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
              echo "| Last Successful CI | [\`$BASE_SHA\`](${{ github.server_url }}/${{ github.repository }}/commit/$BASE_SHA) |" >> $GITHUB_STEP_SUMMARY
              echo "| Current Commit | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY
              echo "| Files Changed | ${CHANGED_FILE_COUNT:-0} |" >> $GITHUB_STEP_SUMMARY
              echo "| Modules Affected | None with CI workflows |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              if [ "${CHANGED_FILE_COUNT:-0}" = "0" ]; then
                echo "> No files changed between commits, or all changes are in untracked areas." >> $GITHUB_STEP_SUMMARY
              else
                echo "> Changed files do not belong to any modules with CI workflows." >> $GITHUB_STEP_SUMMARY
              fi
            fi
            exit 0
          fi

          # Workflows dispatched successfully
          TOTAL_MODULES="${{ needs.detect-changes.outputs.changed-modules }}"
          TOTAL_COUNT=$(echo "$TOTAL_MODULES" | wc -w | tr -d ' ')
          EXECUTION="${{ needs.execute-workflows.result }}"

          if [ "$EXECUTION" = "success" ]; then
            echo "### ✅ CI Workflows Dispatched" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$TOTAL_COUNT** module CI workflow(s) triggered in parallel." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Dispatch Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Failed to dispatch module workflows. Check the execute-workflows job for details." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note**: Module CI workflows report their own statuses as separate checks." >> $GITHUB_STEP_SUMMARY
          echo "> Check individual \`CI: <module>\` checks for build results." >> $GITHUB_STEP_SUMMARY

  # =========================================
  # Release Trigger (push or workflow_dispatch to main)
  # =========================================
  # After CI workflows are dispatched, check for pending releases and trigger them.
  # Releases are processed in dependency order (layer by layer) with await.
  trigger-releases:
    name: Trigger Releases
    needs: [summary, detect-changes]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands
        with:
          trigger-run-id: ${{ github.run_id }}

      # Step 1: Wait for all dispatched CI workflows to complete
      - name: Await CI workflows
        env:
          GH_TOKEN: ${{ github.token }}
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
        run: |
          $COMMANDS pipeline await-ci --timeout 1800

      # Step 2: Wait for any active release workflows to complete
      - name: Await active releases
        env:
          GH_TOKEN: ${{ github.token }}
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
        run: |
          $COMMANDS pipeline await-release --timeout 600

      # Step 3: Check for pending releases (semver from changelog, calver from dispatched CI)
      - name: Check for pending releases
        id: check
        uses: ./.github/actions/check-pending-releases
        with:
          dispatched-modules: ${{ needs.detect-changes.outputs.changed-modules }}

      # Step 4: Trigger releases in dependency order (layer by layer)
      - name: Trigger releases by layer
        if: steps.check.outputs.has_pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          LAYERS_JSON: ${{ steps.check.outputs.layers_json }}
        run: |
          $COMMANDS release execute-layers --layers "$LAYERS_JSON"

      - name: Release Summary
        if: always()
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
        run: |
          echo "## Release Trigger" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check.outputs.has_pending }}" = "true" ]; then
            LAYER_COUNT="${{ steps.check.outputs.layer_count }}"
            LAYERS_JSON='${{ steps.check.outputs.layers_json }}'
            $COMMANDS show release-summary --layers "$LAYERS_JSON" >> $GITHUB_STEP_SUMMARY
          else
            echo "No pending releases." >> $GITHUB_STEP_SUMMARY
          fi
