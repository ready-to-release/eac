# Release docs - Documentation Release Workflow
#
# This workflow releases the HTML documentation site to GitHub Pages.
# It downloads pre-built artifacts from CI and deploys them.
#
# CI Verification:
# - Uses approve-release action which handles CI verification (strict mode)
# - CI inheritance when only changelog changed
# - Exports CI_RUN_ID for artifact download

name: "release-docs (stage 8+)"

on:
  push:
    tags:
      - 'docs/*'
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID (passed from CI for artifact download)'
        required: false
        type: string
        default: ''
      skip-ci-check:
        description: 'Skip CI verification (dangerous - for hotfixes only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  approve:
    name: Approve Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag_name: ${{ steps.gate.outputs.tag_name }}
      ci_sha: ${{ steps.gate.outputs.ci_sha }}
      ci_run_id: ${{ inputs.ci_run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Approve release
        id: gate
        uses: ./.github/actions/approve-release
        with:
          module: docs
          version-type: calver
          # Skip CI check when triggered from CI (ci_run_id provided) or manually skipped
          skip-ci-check: ${{ inputs.ci_run_id != '' || inputs.skip-ci-check || 'false' }}
          timeout: '300'

  release:
    name: Deploy Site
    needs: approve
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Get CI run ID
        id: ci
        run: |
          # Priority: 1) ci_run_id from CI trigger, 2) lookup from ci_sha
          if [ -n "${{ needs.approve.outputs.ci_run_id }}" ]; then
            echo "run_id=${{ needs.approve.outputs.ci_run_id }}" >> $GITHUB_OUTPUT
            echo "Using CI run ID from trigger: ${{ needs.approve.outputs.ci_run_id }}"
          else
            COMMANDS="${{ steps.commands.outputs.commands-path }}"
            CI_SHA="${{ needs.approve.outputs.ci_sha }}"
            WORKFLOW="ci-docs.yaml"

            RUN_ID=$($COMMANDS pipeline ci get-run-id --workflow "$WORKFLOW" --sha "$CI_SHA" 2>/dev/null || echo "")

            if [ -z "$RUN_ID" ]; then
              echo "❌ Could not find CI run for SHA: $CI_SHA"
              exit 1
            fi

            echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
            echo "Using CI run ID from lookup: $RUN_ID (SHA: $CI_SHA)"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download CI artifacts
        uses: actions/download-artifact@v6
        with:
          name: build-artifacts-docs
          path: out/build
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate artifacts
        id: verify
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"

          # Validate artifacts against build manifest (checks existence, paths, hashes)
          $COMMANDS validate artifacts docs

          # Collect stats for summary
          SITE_DIR="out/build/docs/site"
          FILE_COUNT=$(find "$SITE_DIR" -type f | wc -l | tr -d ' ')
          HTML_COUNT=$(find "$SITE_DIR" -name "*.html" | wc -l | tr -d ' ')
          TOTAL_SIZE=$(du -sh "$SITE_DIR" | cut -f1)

          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          echo "html_count=$HTML_COUNT" >> $GITHUB_OUTPUT
          echo "total_size=$TOTAL_SIZE" >> $GITHUB_OUTPUT

      # ==========================================================================
      # Deploy HTML Site to GitHub Pages
      # ==========================================================================
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out/build/docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ==========================================================================
      # Create GitHub Release
      # ==========================================================================
      - name: Create release notes
        id: release_notes
        run: |
          cat << 'EOF' > release_notes.md
          ## Documentation Site Release

          The HTML documentation site has been deployed to GitHub Pages.

          ### Release Information

          - **Version**: ${{ needs.approve.outputs.version }}
          - **Commit**: ${{ github.sha }}
          - **Site URL**: ${{ steps.deployment.outputs.page_url }}

          ---
          🤖 Generated with [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

          cat release_notes.md

      - name: Create GitHub Release
        run: |
          TAG_NAME="${{ needs.approve.outputs.tag_name }}"
          VERSION="${{ needs.approve.outputs.version }}"

          echo "Creating release for tag: $TAG_NAME"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger: creating tag and release together"
            gh release create "$TAG_NAME" \
              --title "Documentation Site $VERSION" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}" \
              --prerelease \
              --latest=false
          else
            echo "Tag trigger: using existing tag"
            gh release create "$TAG_NAME" \
              --title "Documentation Site $VERSION" \
              --notes-file release_notes.md \
              --verify-tag \
              --prerelease \
              --latest=false
          fi

          echo "✅ Release created successfully"
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # Cleanup Old Releases
  # ==========================================================================
  cleanup:
    name: Cleanup Old Releases
    needs: [approve, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cleanup old releases
        uses: ./.github/actions/cleanup-pre-releases
        with:
          module: docs

  # ==========================================================================
  # Summary
  # ==========================================================================
  summary:
    name: Summary
    needs: [approve, release, cleanup]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Generate summary
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"
          VERSION="${{ needs.approve.outputs.version }}"
          TAG_NAME="${{ needs.approve.outputs.tag_name }}"
          APPROVE_RESULT="${{ needs.approve.result }}"
          RELEASE_RESULT="${{ needs.release.result }}"

          if [ "$APPROVE_RESULT" = "success" ] && [ "$RELEASE_RESULT" = "success" ]; then
            echo "## ✅ Documentation Site Released" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Successfully released documentation site **${VERSION}**." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`${VERSION}\` (calver)" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag**: \`${TAG_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🌐 [**View Documentation Site**](https://ready-to-release.github.io/eac/)" >> $GITHUB_STEP_SUMMARY
          elif [ "$APPROVE_RESULT" = "failure" ]; then
            echo "## ❌ Release Approval Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release was not approved. Check the approve job for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            $COMMANDS pipeline ci summary-link ${{ github.run_id }} --type release --workflow ci-docs.yaml --commit ${{ github.sha }} >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Documentation Release Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release failed after approval. Check the release job for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            $COMMANDS pipeline ci summary-link ${{ github.run_id }} --type release --workflow ci-docs.yaml --commit ${{ github.sha }} >> $GITHUB_STEP_SUMMARY
          fi
        env:
          GH_TOKEN: ${{ github.token }}
