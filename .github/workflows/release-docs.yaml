# Release docs - Documentation Release Workflow
#
# This workflow releases the HTML documentation site to GitHub Pages.
# It downloads pre-built artifacts from CI and deploys them.
#
# CI Verification:
# - Uses approve-release action which handles CI verification (strict mode)
# - CI inheritance when only changelog changed
# - Exports CI_RUN_ID for artifact download

name: "release-docs (stage 8+)"

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID (passed from CI for artifact download)'
        required: false
        type: string
        default: ''
      skip-ci-check:
        description: 'Skip CI verification (dangerous - for hotfixes only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  approve:
    name: Approve Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag_name: ${{ steps.gate.outputs.tag_name }}
      ci_sha: ${{ steps.gate.outputs.ci_sha }}
      ci_run_id: ${{ inputs.ci_run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Approve release
        id: gate
        uses: ./.github/actions/approve-release
        with:
          module: docs
          version-type: calver
          # Skip CI check when triggered from CI (ci_run_id provided) or manually skipped
          skip-ci-check: ${{ inputs.ci_run_id != '' || inputs.skip-ci-check || 'false' }}
          timeout: '600'

  release:
    name: Deploy Site
    needs: approve
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download CI Artifacts
        id: artifacts
        uses: ./.github/actions/download-ci-artifacts
        with:
          module: docs
          ci-run-id: ${{ needs.approve.outputs.ci_run_id }}
          ci-sha: ${{ needs.approve.outputs.ci_sha }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Validate artifacts
        id: verify
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"

          # Validate artifacts against build manifest (checks existence, paths, hashes)
          # Use --skip-depm since release workflows only download target module artifacts
          # (CI already validated dependencies during build)
          ${COMMANDS:?COMMANDS not set} validate artifacts docs --skip-depm

          # Collect stats for summary (site output is in site/site/ subdirectory)
          SITE_DIR="out/build/docs/site/site"
          FILE_COUNT=$(find "$SITE_DIR" -type f | wc -l | tr -d ' ')
          HTML_COUNT=$(find "$SITE_DIR" -name "*.html" | wc -l | tr -d ' ')
          TOTAL_SIZE=$(du -sh "$SITE_DIR" | cut -f1)

          # Check for PDF artifacts
          PDF_COUNT=$(find "out/build/docs" -maxdepth 2 -name "*.pdf" -type f 2>/dev/null | wc -l | tr -d ' ')
          PDF_SIZE=$(du -sh "out/build/docs" 2>/dev/null | cut -f1 || echo "0")

          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          echo "html_count=$HTML_COUNT" >> $GITHUB_OUTPUT
          echo "total_size=$TOTAL_SIZE" >> $GITHUB_OUTPUT
          echo "pdf_count=$PDF_COUNT" >> $GITHUB_OUTPUT
          echo "pdf_size=$PDF_SIZE" >> $GITHUB_OUTPUT

      # ==========================================================================
      # Deploy HTML Site to GitHub Pages
      # ==========================================================================
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out/build/docs/site/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ==========================================================================
      # Create GitHub Release
      # ==========================================================================
      - name: Create release notes
        id: release_notes
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"
          TAG_NAME="${{ needs.approve.outputs.tag_name }}"
          REPO="${{ github.repository }}"

          cat > release_notes.md << 'HEADER'
          ## Documentation Site Release

          The HTML documentation site has been deployed to GitHub Pages.

          HEADER

          # Add PDF books section if PDFs exist
          PDF_COUNT=$(find out/build/docs -maxdepth 2 -name "*.pdf" -type f 2>/dev/null | wc -l)
          if [ "$PDF_COUNT" -gt 0 ]; then
            cat >> release_notes.md << 'PDF_HEADER'
          ### PDF Books

          PDF documentation books for offline reading:

          PDF_HEADER

            # Generate list items dynamically from actual PDFs
            for pdf in $(find out/build/docs -maxdepth 2 -name "*.pdf" -type f); do
              FILENAME=$(basename "$pdf")
              SIZE=$(du -h "$pdf" | cut -f1)
              DESC=$(${COMMANDS:?COMMANDS not set} get book-description "$FILENAME" --default "Documentation")
              DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/${FILENAME}"
              echo "- **${FILENAME}** - ${DESC} (${SIZE}) - [Download](${DOWNLOAD_URL})" >> release_notes.md
            done

            echo "" >> release_notes.md
          fi

          cat >> release_notes.md << EOF
          ### Release Information

          - **Version**: ${{ needs.approve.outputs.version }}
          - **Commit**: ${{ github.sha }}
          - **Site URL**: ${{ steps.deployment.outputs.page_url }}

          ---
          🤖 Generated with [GitHub Actions](https://github.com/${REPO}/actions/runs/${{ github.run_id }})
          EOF

          cat release_notes.md

      - name: Create GitHub Release
        run: |
          TAG_NAME="${{ needs.approve.outputs.tag_name }}"
          VERSION="${{ needs.approve.outputs.version }}"

          echo "Creating release for tag: $TAG_NAME"

          # Idempotency check: skip if release already exists
          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "✅ Release $TAG_NAME already exists - skipping creation (idempotent)"
            exit 0
          fi

          # Collect PDF files if they exist
          PDF_FILES=$(find out/build/docs -maxdepth 2 -name "*.pdf" -type f 2>/dev/null | tr '\n' ' ')

          # Create tag and release together (tag created on success only)
          if [ -n "$PDF_FILES" ]; then
            echo "Including PDF files in release: $PDF_FILES"
            gh release create "$TAG_NAME" \
              --title "Documentation Site $VERSION" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}" \
              --latest=false \
              $PDF_FILES
          else
            gh release create "$TAG_NAME" \
              --title "Documentation Site $VERSION" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}" \
              --latest=false
          fi

          echo "✅ Release created successfully"
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # Update Evidence
  # ==========================================================================
  evidence:
    name: Update Evidence
    needs: [approve, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      evidence-count: ${{ steps.evidence.outputs.evidence-count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update evidence
        id: evidence
        uses: ./.github/actions/update-evidence
        with:
          module: docs
          tag_name: ${{ needs.approve.outputs.tag_name }}
          ci-run-id: ${{ needs.approve.outputs.ci_run_id }}
          ci-sha: ${{ needs.approve.outputs.ci_sha }}

  # ==========================================================================
  # Cleanup Old Releases
  # ==========================================================================
  cleanup:
    name: Cleanup Old Releases
    needs: [approve, release, evidence]
    if: needs.release.result == 'success' && needs.evidence.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cleanup old releases
        uses: ./.github/actions/cleanup-pre-releases
        with:
          module: docs

  # ==========================================================================
  # Summary
  # ==========================================================================
  summary:
    name: Summary
    needs: [approve, release, evidence, cleanup]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Generate summary
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"
          VERSION="${{ needs.approve.outputs.version }}"
          TAG_NAME="${{ needs.approve.outputs.tag_name }}"
          APPROVE_RESULT="${{ needs.approve.result }}"
          RELEASE_RESULT="${{ needs.release.result }}"
          EVIDENCE_RESULT="${{ needs.evidence.result }}"
          EVIDENCE_COUNT="${{ needs.evidence.outputs.evidence-count }}"

          if [ "$APPROVE_RESULT" = "success" ] && [ "$RELEASE_RESULT" = "success" ] && [ "$EVIDENCE_RESULT" != "failure" ]; then
            echo "## ✅ Documentation Site Released" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Successfully released documentation site **${VERSION}**." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`${VERSION}\` (calver)" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag**: \`${TAG_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            if [ -n "$EVIDENCE_COUNT" ] && [ "$EVIDENCE_COUNT" != "0" ]; then
              echo "- **Evidence**: $EVIDENCE_COUNT file(s) attached" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🌐 [**View Documentation Site**](https://ready-to-release.github.io/eac/)" >> $GITHUB_STEP_SUMMARY
          elif [ "$APPROVE_RESULT" = "failure" ]; then
            echo "## ❌ Release Approval Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release was not approved. Check the approve job for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            ${COMMANDS:?COMMANDS not set} pipeline ci summary-link ${{ github.run_id }} --type release --workflow ci-docs.yaml --commit ${{ github.sha }} >> $GITHUB_STEP_SUMMARY
          elif [ "$EVIDENCE_RESULT" = "failure" ]; then
            echo "## ❌ Release Failed - Evidence" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release published but evidence generation failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            ${COMMANDS:?COMMANDS not set} pipeline ci summary-link ${{ github.run_id }} --type release --workflow ci-docs.yaml --commit ${{ github.sha }} >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Documentation Release Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release failed after approval. Check the release job for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            ${COMMANDS:?COMMANDS not set} pipeline ci summary-link ${{ github.run_id }} --type release --workflow ci-docs.yaml --commit ${{ github.sha }} >> $GITHUB_STEP_SUMMARY
          fi
        env:
          GH_TOKEN: ${{ github.token }}
