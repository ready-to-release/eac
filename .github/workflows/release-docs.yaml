# Release docs - Documentation Release Workflow
#
# Deploys the HTML documentation site to GitHub Pages and creates a release
# with PDF books attached. Version type (calver) is derived from core config.

name: "Release: docs"

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID (passed from CI for artifact download)'
        required: false
        type: string
        default: ''
      skip-ci-check:
        description: 'Skip CI verification (dangerous - hotfixes only)'
        required: false
        type: boolean
        default: false

jobs:
  release:
    uses: ./.github/workflows/_module-release.yaml
    with:
      module: docs
      ci_run_id: ${{ inputs.ci_run_id }}
      skip-ci-check: ${{ inputs.skip-ci-check }}
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
      attestations: write
      actions: read
