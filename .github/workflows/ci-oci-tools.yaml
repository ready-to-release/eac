name: "CI: oci-tools"

on:
  workflow_call:
    inputs:
      ref: { required: false, type: string, default: '' }
      sha: { required: false, type: string, default: '' }
      trigger_run_id: { required: false, type: string, default: '' }
      force-all-containers: { required: false, type: boolean, default: false }
  workflow_dispatch:
    inputs:
      ref: { required: false, type: string, default: '' }
      sha: { required: false, type: string, default: '' }
      trigger_run_id: { required: false, type: string, default: '' }
      force-all-containers:
        description: 'Force rebuild all containers (skip change detection)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  ci:
    uses: ./.github/workflows/_module-ci.yaml
    with:
      module: oci-tools
      ref: ${{ inputs.ref }}
      sha: ${{ inputs.sha }}
      trigger_run_id: ${{ inputs.trigger_run_id }}
      force-all-containers: ${{ inputs.force-all-containers }}
