# Release ext-eac - Container Image Release Workflow
#
# This workflow releases the EAC extension container image using reusable actions:
# 1. approve-release: Validates CI passed and release preconditions
# 2. attested-container-publish: Retags, attests, and publishes container
#
# CI Verification: Requires a successful ci-ext-eac.yaml run on the EXACT commit
# being released (strict mode). This ensures the container was built and tested.

name: "release-ext-eac (stage 8+)"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver format: x.y.z)'
        required: true
        type: string
      skip-ci-check:
        description: 'Skip CI verification (dangerous - very hot fixes only, unregulated path)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  approve:
    name: Approve Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag_name: ${{ steps.gate.outputs.tag_name }}
      ci_sha: ${{ steps.gate.outputs.ci_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Approve release
        id: gate
        uses: ./.github/actions/approve-release
        with:
          module: ext-eac
          skip-ci-check: ${{ inputs.skip-ci-check || 'false' }}
          timeout: '900'

  release:
    name: Publish Container
    needs: approve
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish container
        uses: ./.github/actions/attested-container-publish
        with:
          module: ext-eac
          version: ${{ needs.approve.outputs.version }}
          tag_name: ${{ needs.approve.outputs.tag_name }}
          ci_sha: ${{ needs.approve.outputs.ci_sha }}

  cleanup:
    name: Cleanup on Failure
    needs: [approve, release]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cleanup failed release
        uses: ./.github/actions/cleanup-failed-release
        with:
          tag_name: ${{ needs.approve.outputs.tag_name }}

  summary:
    name: Summary
    needs: [approve, release, cleanup]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Generate summary
        env:
          COMMANDS: ${{ steps.commands.outputs.commands-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.approve.outputs.version }}"
          TAG_NAME="${{ needs.approve.outputs.tag_name }}"
          APPROVE_RESULT="${{ needs.approve.result }}"
          RELEASE_RESULT="${{ needs.release.result }}"
          CLEANUP_RESULT="${{ needs.cleanup.result }}"
          RUN_ID="${{ github.run_id }}"
          COMMIT="${{ github.sha }}"
          SHORT_SHA="${COMMIT:0:7}"

          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/ext-eac"

          if [ "$APPROVE_RESULT" = "failure" ]; then
            echo "## :x: Release Failed - Approval" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release preconditions not met. Check the approve job for details." >> $GITHUB_STEP_SUMMARY
            if [ "$CLEANUP_RESULT" = "success" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Tag cleaned up. Retry after fixing." >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            $COMMANDS pipeline ci summary-link $RUN_ID --type release --workflow ci-ext-eac.yaml --commit "$COMMIT" >> $GITHUB_STEP_SUMMARY
          elif [ "$RELEASE_RESULT" = "failure" ]; then
            echo "## :x: Release Failed - Publish" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Container publish failed. Check the release job for details." >> $GITHUB_STEP_SUMMARY
            if [ "$CLEANUP_RESULT" = "success" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Tag cleaned up. Retry with same version." >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            $COMMANDS pipeline ci summary-link $RUN_ID --type container --image "$IMAGE_NAME:sha-$SHORT_SHA" >> $GITHUB_STEP_SUMMARY
          elif [ "$RELEASE_RESULT" = "success" ]; then
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
            echo "## :white_check_mark: ext-eac v$VERSION Released" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Release**: [$TAG_NAME]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Container Image" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "docker pull $IMAGE_NAME:$VERSION" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "## :grey_question: Release Status Unknown" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
            echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Approve | $APPROVE_RESULT |" >> $GITHUB_STEP_SUMMARY
            echo "| Release | $RELEASE_RESULT |" >> $GITHUB_STEP_SUMMARY
            echo "| Cleanup | $CLEANUP_RESULT |" >> $GITHUB_STEP_SUMMARY
          fi
