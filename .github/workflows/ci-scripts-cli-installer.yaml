name: "ci-scripts-cli-installer (stage 1-6)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build Module
        uses: ./.github/actions/build-module
        with:
          module: scripts-cli-installer
          trigger-run-id: ${{ inputs.trigger_run_id }}

  test-linux:
    name: Test (Linux)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Test Module
        uses: ./.github/actions/test-module
        with:
          module: scripts-cli-installer
          trigger-run-id: ${{ inputs.trigger_run_id }}
          setup-deps: auto
          # PRs run commit suite only; main/release branches run full suite
          suites: ${{ startsWith(inputs.ref, 'refs/pull/') && 'commit' || 'commit,acceptance' }}

  test-windows:
    name: Test (Windows)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands
        with:
          trigger-run-id: ${{ inputs.trigger_run_id }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v6
        with:
          name: build-artifacts-scripts-cli-installer
          path: out/build/scripts-cli-installer

      - name: Test Module (Commit Suite - L0-L2)
        shell: pwsh
        run: |
          & "${{ steps.commands.outputs.commands-path }}" test scripts-cli-installer --suite commit

      - name: Test Module (Acceptance Suite - L3)
        # Skip acceptance tests for PRs - only run on main/release branches
        if: ${{ !startsWith(inputs.ref, 'refs/pull/') }}
        shell: pwsh
        run: |
          & "${{ steps.commands.outputs.commands-path }}" test scripts-cli-installer --suite acceptance

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-scripts-cli-installer-windows
          path: out/test/**

      - name: Test Summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Test: scripts-cli-installer (Windows)

          ### Tests Executed

          | Suite | Level | Tests |
          |-------|-------|-------|
          | commit | L0-L2 | Error handling (invalid version) |
          | acceptance | L3 | Install latest from GitHub releases |

          ### Test Details

          | Property | Value |
          |----------|-------|
          | Platform | Windows (windows-latest) |
          | Installer | ``scripts/pwsh/cli/install.ps1`` |
          "@ >> $env:GITHUB_STEP_SUMMARY
