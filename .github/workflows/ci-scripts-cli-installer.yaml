name: "ci-scripts-cli-installer (stage 1-6)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Build Module
        uses: ./.github/actions/build-module
        with:
          module: scripts-cli-installer
          commands-path: ${{ steps.commands.outputs.commands-path }}

  test-linux:
    name: Test (Linux)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Test Module
        uses: ./.github/actions/test-module
        with:
          module: scripts-cli-installer
          commands-path: ${{ steps.commands.outputs.commands-path }}

  test-windows:
    name: Test (Windows)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Note: Using setup-go + go run on Windows since the composite action
      # uses bash-specific commands that may not work reliably on Windows
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: go/eac/commands/go.sum

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-scripts-cli-installer
          path: out/build/scripts-cli-installer

      - name: Test Module (Commit Suite - L0-L2)
        working-directory: ./go/eac/commands
        run: go run . test scripts-cli-installer --suite commit

      - name: Test Module (Acceptance Suite - L3)
        working-directory: ./go/eac/commands
        run: go run . test scripts-cli-installer --suite acceptance

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-scripts-cli-installer-windows
          path: out/test/**

      - name: Test Summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Test: scripts-cli-installer (Windows)

          ### Tests Executed

          | Suite | Level | Tests |
          |-------|-------|-------|
          | commit | L0-L2 | Error handling (invalid version) |
          | acceptance | L3 | Install latest from GitHub releases |

          ### Test Details

          | Property | Value |
          |----------|-------|
          | Platform | Windows (windows-latest) |
          | Installer | ``scripts/pwsh/cli/install.ps1`` |
          "@ >> $env:GITHUB_STEP_SUMMARY
