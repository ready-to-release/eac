name: "ci-scripts-cli-installer (stage 1-6)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Build Module
        run: ${{ steps.commands.outputs.commands-path }} build scripts-cli-installer

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-scripts-cli-installer
          path: out/build/scripts-cli-installer/**

      - name: Build Summary
        if: always()
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"

          echo "## Build: scripts-cli-installer" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "Installer scripts validated successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "Installer script validation failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            $COMMANDS ci summary-link ${{ github.run_id }} --type build >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Scripts Validated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Script |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bash | \`scripts/sh/cli/install.sh\` |" >> $GITHUB_STEP_SUMMARY
          echo "| PowerShell | \`scripts/pwsh/cli/install.ps1\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Build Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Module | \`scripts-cli-installer\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  test-linux:
    name: Test (Linux)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-scripts-cli-installer
          path: out/build/scripts-cli-installer

      - name: Test Module (Commit Suite - L0-L2)
        run: ${{ steps.commands.outputs.commands-path }} test scripts-cli-installer --suite commit

      - name: Test Module (Acceptance Suite - L3)
        run: ${{ steps.commands.outputs.commands-path }} test scripts-cli-installer --suite acceptance

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-scripts-cli-installer-linux
          path: out/test/**

      - name: Test Summary
        if: always()
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"

          echo "## Test: scripts-cli-installer (Linux)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "Bash installer tests passed on Linux." >> $GITHUB_STEP_SUMMARY
          else
            echo "Bash installer tests failed on Linux." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            $COMMANDS ci summary-link ${{ github.run_id }} --type test --artifact test-results-scripts-cli-installer-linux >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Tests Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Level | Tests |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| commit | L0-L2 | Error handling (invalid version) |" >> $GITHUB_STEP_SUMMARY
          echo "| acceptance | L3 | Install latest from GitHub releases |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Linux (ubuntu-latest) |" >> $GITHUB_STEP_SUMMARY
          echo "| Installer | \`scripts/sh/cli/install.sh\` |" >> $GITHUB_STEP_SUMMARY

  test-windows:
    name: Test (Windows)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Note: Using setup-go + go run on Windows since the composite action
      # uses bash-specific commands that may not work reliably on Windows
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go/eac/commands/go.sum

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-scripts-cli-installer
          path: out/build/scripts-cli-installer

      - name: Test Module (Commit Suite - L0-L2)
        working-directory: ./go/eac/commands
        run: go run . test scripts-cli-installer --suite commit

      - name: Test Module (Acceptance Suite - L3)
        working-directory: ./go/eac/commands
        run: go run . test scripts-cli-installer --suite acceptance

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-scripts-cli-installer-windows
          path: out/test/**

      - name: Test Summary
        if: always()
        shell: pwsh
        run: |
          echo "## Test: scripts-cli-installer (Windows)" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          if ("${{ job.status }}" -eq "success") {
            echo "PowerShell installer tests passed on Windows." >> $env:GITHUB_STEP_SUMMARY
          } else {
            echo "PowerShell installer tests failed on Windows." >> $env:GITHUB_STEP_SUMMARY
            echo "" >> $env:GITHUB_STEP_SUMMARY
            go run ./go/eac/commands ci summary-link ${{ github.run_id }} --type test --artifact test-results-scripts-cli-installer-windows >> $env:GITHUB_STEP_SUMMARY
          }
          echo "" >> $env:GITHUB_STEP_SUMMARY

          echo "### Tests Executed" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| Suite | Level | Tests |" >> $env:GITHUB_STEP_SUMMARY
          echo "|-------|-------|-------|" >> $env:GITHUB_STEP_SUMMARY
          echo "| commit | L0-L2 | Error handling (invalid version) |" >> $env:GITHUB_STEP_SUMMARY
          echo "| acceptance | L3 | Install latest from GitHub releases |" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY

          echo "### Test Details" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $env:GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $env:GITHUB_STEP_SUMMARY
          echo "| Platform | Windows (windows-latest) |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Installer | ``scripts/pwsh/cli/install.ps1`` |" >> $env:GITHUB_STEP_SUMMARY
