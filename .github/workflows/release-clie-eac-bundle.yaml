# Release Bundle - Creates the "Latest" GitHub release
#
# Aggregates links to all module releases into a single "Latest" release.
# Release type (bundle), version type (calver), and await behavior are
# all derived from core config.

name: "Release: clie-eac-bundle"

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID (passed from CI)'
        required: false
        type: string
        default: ''
      skip-ci-check:
        description: 'Skip CI verification'
        required: false
        type: boolean
        default: false

jobs:
  release:
    uses: ./.github/workflows/_module-release.yaml
    with:
      module: clie-eac-bundle
      ci_run_id: ${{ inputs.ci_run_id }}
      skip-ci-check: ${{ inputs.skip-ci-check }}
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
      attestations: write
      actions: read
