# CI Release Bundle - Creates the "Latest" GitHub release with links to all modules
#
# This is a lightweight CI that runs after docs (same layer as books).
# It triggers the release workflow which creates a GitHub release marked as "Latest"
# containing links to all module releases.

name: "ci-r2r-eac (stage 1-7)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow'
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  # =============================================================================
  # Validate (static module - no build needed)
  # =============================================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Validate module configuration
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"

          # Validate the r2r-eac module exists and is properly configured
          $COMMANDS get modules --as-json | jq -e '.[] | select(.moniker == "r2r-eac")' > /dev/null
          echo "✅ r2r-eac module configuration valid"

  # =============================================================================
  # Trigger Release (main branch only)
  # =============================================================================
  trigger-release:
    name: Trigger Release
    needs: validate
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || inputs.ref == 'refs/heads/main') && !startsWith(inputs.ref || github.ref, 'refs/pull/')
    steps:
      - uses: actions/checkout@v6

      - name: Trigger Release
        uses: ./.github/actions/trigger-release
        with:
          module: r2r-eac
          workflow: release-r2r-eac.yaml
          workflow-description: Create Latest GitHub Release bundle
          ci-run-id: ${{ github.run_id }}
          trigger-run-id: ${{ inputs.trigger_run_id }}
          github-token: ${{ github.token }}
