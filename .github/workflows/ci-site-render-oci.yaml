# CI workflow for site-render-oci container module
#
# Builds and pushes the MkDocs site container to GHCR.
# This container provides MkDocs with Material theme for HTML site generation.
# No tests or evidence - this is an internal build tool.
#
# Triggers:
# - workflow_call (from change-trigger)
# - workflow_dispatch (manual)
# - Push to main with changes to container files

name: "ci-site-render-oci"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to build'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to build'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow'
        default: ''
  push:
    branches: [main]
    paths:
      - 'containers/site-render-oci/**'
      - '.github/workflows/ci-site-render-oci.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  build:
    name: Build (site-render-oci)
    runs-on: ubuntu-latest
    outputs:
      image-name: ${{ steps.container.outputs.image-name }}
      image-tag: ${{ steps.container.outputs.image-tag }}
      short-sha: ${{ steps.container.outputs.short-sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build Container
        id: container
        uses: ./.github/actions/build-container
        with:
          module: site-render-oci
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: CI Summary (site-render-oci)
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate Summary
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          IMAGE_NAME: ${{ needs.build.outputs.image-name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          echo "## CI Summary: site-render-oci" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$BUILD_RESULT" = "success" ]; then
            echo "Container built and pushed successfully." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Image:** \`$IMAGE_NAME:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Latest:** \`$IMAGE_NAME:latest\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Build failed. See workflow logs for details." >> $GITHUB_STEP_SUMMARY
          fi
