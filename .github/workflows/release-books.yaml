# Release books - PDF Books Release Workflow
#
# This workflow releases PDF documentation books to GitHub Releases.
# It downloads pre-built artifacts from CI and creates a release with PDFs.
#
# CI Verification:
# - When triggered by CI (ci_run_id provided): Uses that run directly, no waiting
# - When triggered manually/by tag: Uses `release check-ci` which handles:
#   - Waiting for CI to complete (with proper chain detection)
#   - CI inheritance when only changelog changed
#   - Exports CI_RUN_ID for artifact download

name: "release-books (stage 8+)"

on:
  push:
    tags:
      - 'books/*'
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID (for verification)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Check CI status
        id: ci_check
        if: inputs.ci_run_id == ''
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"

          # Only check CI when not invoked directly from CI workflow
          # When ci_run_id is provided, CI just completed - no need to wait
          $COMMANDS release check-ci \
            --workflow ci-books.yaml \
            --commit ${{ github.sha }} \
            --timeout 300

          # CI_RUN_ID and CI_SHA are now available in GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate CalVer tag
        id: tag
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#books/}"
            echo "Tag trigger: using existing tag $TAG"
          else
            TAG=$($COMMANDS release generate-module-calver books)
            VERSION="${TAG#books/}"
            echo "Manual trigger: generated tag $TAG"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check for existing release
        run: |
          TAG_NAME="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG_NAME" 2>/dev/null; then
            echo ""
            echo "❌ Error: Release already exists for tag $TAG_NAME"
            echo ""
            echo "A GitHub release has already been created for this version."
            echo "If you want to create a new release:"
            echo "1. Delete the existing release: gh release delete $TAG_NAME"
            echo "2. Delete the tag: git push --delete origin $TAG_NAME"
            echo "3. Re-run this workflow"
            exit 1
          fi
          echo "✅ No existing release found for $TAG_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get CI run ID
        id: ci
        run: |
          # Priority: 1) Input parameter, 2) CI_RUN_ID from check-ci
          if [ -n "${{ inputs.ci_run_id }}" ]; then
            echo "run_id=${{ inputs.ci_run_id }}" >> $GITHUB_OUTPUT
            echo "Using provided CI run ID: ${{ inputs.ci_run_id }}"
          elif [ -n "$CI_RUN_ID" ]; then
            echo "run_id=$CI_RUN_ID" >> $GITHUB_OUTPUT
            echo "Using CI run from check-ci: $CI_RUN_ID (SHA: ${CI_SHA:-unknown})"
          else
            echo "❌ No CI run ID available"
            echo "   check-ci should have set CI_RUN_ID"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download CI artifacts
        uses: actions/download-artifact@v6
        with:
          name: build-artifacts-books
          path: out/build
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate artifacts
        id: verify
        run: |
          echo "Validating downloaded PDF artifacts..."

          # Check PDFs exist
          PDF_COUNT=$(find "out/build/books" -maxdepth 1 -name "*.pdf" -type f 2>/dev/null | wc -l)
          TOTAL_SIZE=$(du -sh "out/build/books" 2>/dev/null | cut -f1 || echo "0")

          if [ "$PDF_COUNT" -eq 0 ]; then
            echo "❌ No PDF files found in out/build/books/"
            ls -la out/build/books/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi

          echo "✅ Found $PDF_COUNT PDF files ($TOTAL_SIZE)"
          find "out/build/books" -maxdepth 1 -name "*.pdf" -type f -exec basename {} \;

          echo "pdf_count=$PDF_COUNT" >> $GITHUB_OUTPUT
          echo "total_size=$TOTAL_SIZE" >> $GITHUB_OUTPUT

      - name: Create release notes
        id: release_notes
        run: |
          cat << 'EOF' > release_notes.md
          ## PDF Books Release

          This release includes PDF documentation books for offline reading.

          ### Available Books

          | Book | Description |
          |------|-------------|
          | `tutorials-dark.pdf` | Step-by-step tutorials |
          | `howto-dark.pdf` | How-to guides |
          | `explanation-dark.pdf` | Conceptual documentation |
          | `specifications-dark.pdf` | Technical specifications |
          | `repository-report-dark.pdf` | Repository structure report |

          ### Release Information

          - **Version**: ${{ steps.tag.outputs.version }}
          - **Commit**: ${{ github.sha }}

          ---
          🤖 Generated with [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

          cat release_notes.md

      - name: Create GitHub Release
        run: |
          TAG_NAME="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"

          echo "Creating release for tag: $TAG_NAME"

          PDF_FILES=$(find out/build/books -maxdepth 1 -name "*.pdf" -type f 2>/dev/null | tr '\n' ' ')

          if [ -z "$PDF_FILES" ]; then
            echo "❌ No PDF files found in out/build/books/"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger: creating tag and release together"
            gh release create "$TAG_NAME" \
              --title "PDF Books $VERSION" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}" \
              $PDF_FILES
          else
            echo "Tag trigger: using existing tag"
            gh release create "$TAG_NAME" \
              --title "PDF Books $VERSION" \
              --notes-file release_notes.md \
              --verify-tag \
              $PDF_FILES
          fi

          echo "✅ Release created successfully"
        env:
          GH_TOKEN: ${{ github.token }}

      # ==========================================================================
      # Summary
      # ==========================================================================
      - name: Summary (failure)
        if: failure()
        run: |
          echo "## ❌ PDF Books Release Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Debug Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Planned Tag | \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Summary (success)
        if: success()
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          TAG_NAME="${{ steps.tag.outputs.tag }}"

          echo "## ✅ PDF Books Released" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully released PDF books **${VERSION}**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Release Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${TAG_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| PDF Count | ${{ steps.verify.outputs.pdf_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Size | ${{ steps.verify.outputs.total_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### PDF Books" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Book | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          find out/build/books -maxdepth 1 -name "*.pdf" -exec sh -c 'echo "| $(basename {}) | $(du -h {} | cut -f1) |"' \; >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 [**View Release & Download PDFs**](https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME})" >> $GITHUB_STEP_SUMMARY
