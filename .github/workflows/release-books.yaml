# Release books - PDF Books Release Workflow
#
# This workflow releases PDF documentation books to GitHub Releases.
# It downloads pre-built artifacts from CI and creates a release with PDFs.
#
# CI Verification:
# - Uses approve-release action which handles CI verification (strict mode)
# - CI inheritance when only changelog changed
# - Exports CI_RUN_ID for artifact download

name: "release-books (stage 8+)"

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID (passed from CI for artifact download)'
        required: false
        type: string
        default: ''
      skip-ci-check:
        description: 'Skip CI verification (dangerous - for hotfixes only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  approve:
    name: Approve Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag_name: ${{ steps.gate.outputs.tag_name }}
      ci_sha: ${{ steps.gate.outputs.ci_sha }}
      ci_run_id: ${{ inputs.ci_run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Approve release
        id: gate
        uses: ./.github/actions/approve-release
        with:
          module: books
          version-type: calver
          # Skip CI check when triggered from CI (ci_run_id provided) or manually skipped
          skip-ci-check: ${{ inputs.ci_run_id != '' || inputs.skip-ci-check || 'false' }}
          timeout: '300'

  release:
    name: Publish PDFs
    needs: approve
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download CI Artifacts
        id: artifacts
        uses: ./.github/actions/download-ci-artifacts
        with:
          module: books
          ci-run-id: ${{ needs.approve.outputs.ci_run_id }}
          ci-sha: ${{ needs.approve.outputs.ci_sha }}

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Validate artifacts
        id: verify
        run: |
          echo "Validating downloaded PDF artifacts..."

          # Check PDFs exist
          PDF_COUNT=$(find "out/build/books" -maxdepth 1 -name "*.pdf" -type f 2>/dev/null | wc -l)
          TOTAL_SIZE=$(du -sh "out/build/books" 2>/dev/null | cut -f1 || echo "0")

          if [ "$PDF_COUNT" -eq 0 ]; then
            echo "❌ No PDF files found in out/build/books/"
            ls -la out/build/books/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi

          echo "✅ Found $PDF_COUNT PDF files ($TOTAL_SIZE)"
          find "out/build/books" -maxdepth 1 -name "*.pdf" -type f -exec basename {} \;

          echo "pdf_count=$PDF_COUNT" >> $GITHUB_OUTPUT
          echo "total_size=$TOTAL_SIZE" >> $GITHUB_OUTPUT

      - name: Create release notes
        id: release_notes
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"
          TAG_NAME="${{ needs.approve.outputs.tag_name }}"
          VERSION="${{ needs.approve.outputs.version }}"
          REPO="${{ github.repository }}"

          cat > release_notes.md << 'HEADER'
          ## PDF Books Release

          This release includes PDF documentation books for offline reading.

          ### Available Books

          HEADER

          # Generate list items dynamically from actual PDFs
          for pdf in out/build/books/*.pdf; do
            FILENAME=$(basename "$pdf")
            SIZE=$(du -h "$pdf" | cut -f1)

            # Look up description from books config
            DESC=$($COMMANDS get book-description "$FILENAME" --default "Documentation")

            DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/${FILENAME}"
            echo "- **${FILENAME}** - ${DESC} (${SIZE}) - [Download](${DOWNLOAD_URL})" >> release_notes.md
          done

          cat >> release_notes.md << EOF

          ### Release Information

          - **Version**: ${VERSION}
          - **Commit**: ${{ github.sha }}

          ---
          🤖 Generated with [GitHub Actions](https://github.com/${REPO}/actions/runs/${{ github.run_id }})
          EOF

          cat release_notes.md

      - name: Create GitHub Release
        run: |
          TAG_NAME="${{ needs.approve.outputs.tag_name }}"
          VERSION="${{ needs.approve.outputs.version }}"

          echo "Creating release for tag: $TAG_NAME"

          # Idempotency check: skip if release already exists
          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "✅ Release $TAG_NAME already exists - skipping creation (idempotent)"
            exit 0
          fi

          PDF_FILES=$(find out/build/books -maxdepth 1 -name "*.pdf" -type f 2>/dev/null | tr '\n' ' ')

          if [ -z "$PDF_FILES" ]; then
            echo "❌ No PDF files found in out/build/books/"
            exit 1
          fi

          # Create tag and release together (tag created on success only)
          gh release create "$TAG_NAME" \
            --title "PDF Books $VERSION" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest=false \
            $PDF_FILES

          echo "✅ Release created successfully"
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # Cleanup Old Releases
  # ==========================================================================
  cleanup:
    name: Cleanup Old Releases
    needs: [approve, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cleanup old releases
        uses: ./.github/actions/cleanup-pre-releases
        with:
          module: books

  # ==========================================================================
  # Summary
  # ==========================================================================
  summary:
    name: Summary
    needs: [approve, release, cleanup]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Generate summary
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"
          VERSION="${{ needs.approve.outputs.version }}"
          TAG_NAME="${{ needs.approve.outputs.tag_name }}"
          APPROVE_RESULT="${{ needs.approve.result }}"
          RELEASE_RESULT="${{ needs.release.result }}"

          if [ "$APPROVE_RESULT" = "success" ] && [ "$RELEASE_RESULT" = "success" ]; then
            echo "## ✅ PDF Books Released" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Successfully released PDF books **${VERSION}**." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`${VERSION}\` (calver)" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag**: \`${TAG_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 [**View Release & Download PDFs**](https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME})" >> $GITHUB_STEP_SUMMARY
          elif [ "$APPROVE_RESULT" = "failure" ]; then
            echo "## ❌ Release Approval Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release was not approved. Check the approve job for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            $COMMANDS pipeline ci summary-link ${{ github.run_id }} --type release --workflow ci-books.yaml --commit ${{ github.sha }} >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ PDF Books Release Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release failed after approval. Check the release job for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            $COMMANDS pipeline ci summary-link ${{ github.run_id }} --type release --workflow ci-books.yaml --commit ${{ github.sha }} >> $GITHUB_STEP_SUMMARY
          fi
        env:
          GH_TOKEN: ${{ github.token }}
