name: "release-books"

# Release documentation as downloadable PDF books
# Triggered by ci-books after successful build on main branch

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID to download artifacts from'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID to download artifacts from'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  build-pdfs:
    name: Build PDF Books
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands
        with:
          trigger-run-id: ${{ inputs.ci_run_id }}

      - name: Setup Module Dependencies
        uses: ./.github/actions/setup-module-deps
        with:
          module: books
          commands-path: ${{ steps.commands.outputs.commands-path }}

      - name: Build PDF Books
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"
          echo "Building PDF documentation (output mode from books.yml)..."
          # Use --all to include books with default: false (all PDF books)
          $COMMANDS build books --all

      - name: Verify PDF outputs
        id: verify
        run: |
          # Each book has its own output directory
          BOOKS_DIR="out/build/books"

          echo "Checking for PDF outputs..."

          # Find all PDFs in the books output directory
          PDF_COUNT=$(find "$BOOKS_DIR" -name "*.pdf" 2>/dev/null | wc -l)

          if [ "$PDF_COUNT" -eq 0 ]; then
            echo "::error::No PDF files found in $BOOKS_DIR"
            exit 1
          fi

          echo "PDF books built successfully:"
          find "$BOOKS_DIR" -name "*.pdf" -exec du -h {} \; | while read size file; do
            echo "  $file: $size"
          done

          echo "pdf_count=$PDF_COUNT" >> $GITHUB_OUTPUT

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v5
        with:
          name: pdf-books
          path: out/build/books/**/*.pdf
          retention-days: 90

      - name: Generate calver tag name
        id: tag
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          # Generate calver tag for book release (books/YYYY.MM.DD or books/YYYY.MM.DD.N)
          TAG=$($COMMANDS release generate-module-calver books)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Documentation Books ${{ steps.tag.outputs.tag }}"
          body: |
            ## Ready-to-Release Documentation Books

            PDF versions of the project documentation for offline reading and printing.

            ### Available Books

            - **Repository Report**: Complete repository structure with modules, dependencies, and test suites
            - **Explanation**: Conceptual documentation covering Everything-as-Code methodology

            ### Themes

            - **Dark PDFs** (`*-dark.pdf`): Optimized for reading on screens with dark background
            - **Light PDFs** (`*-light.pdf`): Optimized for printing on paper with light background

            ---
            Generated from commit: ${{ github.sha }}
          files: out/build/books/**/*.pdf
          draft: false
          prerelease: false
          generate_release_notes: false

      - name: Create git tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # Check if tag already exists (created by release action)
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            echo "Creating tag: $TAG"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## PDF Book Release" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Successfully built and released PDF documentation books." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Release Details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Tag | \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| PDF Count | ${{ steps.verify.outputs.pdf_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### PDF Books" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Book | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            find out/build/books -name "*.pdf" -exec sh -c 'echo "| $(basename {}) | $(du -h {} | cut -f1) |"' \; >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "PDFs are available as release assets and workflow artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "## PDF Book Release Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Failed to build or release PDF documentation." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Common Issues" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Docker image build failure" >> $GITHUB_STEP_SUMMARY
            echo "- Missing PDF template styles" >> $GITHUB_STEP_SUMMARY
          fi
