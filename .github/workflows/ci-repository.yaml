name: "Change Trigger"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger-all:
        description: 'Trigger all workflows regardless of changes'
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      changed-modules: ${{ steps.detect.outputs.modules }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Detect Changed Modules
        id: detect
        run: |
          cd src/commands

          # Check if trigger-all is enabled (defaults to true for push/PR, user can override on manual dispatch)
          TRIGGER_ALL="${{ inputs.trigger-all }}"

          # If inputs.trigger-all is empty (push/PR events), default to true
          if [ -z "$TRIGGER_ALL" ]; then
            TRIGGER_ALL="true"
          fi

          if [ "$TRIGGER_ALL" = "true" ]; then
            echo "Trigger all mode enabled - running all workflows"
            WORKFLOW_MODULES="src-cli src-commands src-core src-mcp-commands"
          else
            # Get changed modules using existing command
            MODULES=$(go run . "get changed modules" --as-json | jq -r '.modules | join(" ")')

            # Filter to only Go modules that have workflows
            WORKFLOW_MODULES=""
            for module in $MODULES; do
              if [ -f ".github/workflows/${module}.yaml" ]; then
                WORKFLOW_MODULES="$WORKFLOW_MODULES $module"
              fi
            done
            WORKFLOW_MODULES=$(echo $WORKFLOW_MODULES | xargs)

            echo "All changed modules: $MODULES"
            echo "Modules with workflows: $WORKFLOW_MODULES"
          fi

          if [ -n "$WORKFLOW_MODULES" ]; then
            echo "modules=$WORKFLOW_MODULES" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "modules=" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
          fi

  calculate-order:
    name: Calculate Execution Order
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      execution-plan: ${{ steps.calculate.outputs.plan }}
      layer-count: ${{ steps.calculate.outputs.layer-count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Calculate Execution Order
        id: calculate
        run: |
          cd src/commands

          # Get execution order for changed modules
          MODULES="${{ needs.detect-changes.outputs.changed-modules }}"

          # Calculate execution order using the new command
          PLAN=$(go run . "get execution order" $MODULES --as-json)

          echo "Execution plan:"
          echo "$PLAN" | jq .

          # Save plan
          echo "plan<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Extract layer count
          LAYER_COUNT=$(echo "$PLAN" | jq -r '.layer_count')
          echo "layer-count=$LAYER_COUNT" >> $GITHUB_OUTPUT

  # Execute module workflows in dependency order
  # Note: GitHub Actions doesn't support dynamic job creation,
  # so we create a job for each potential module and use conditions

  trigger-src-cli:
    name: Trigger src-cli
    needs: [detect-changes, calculate-order]
    if: needs.detect-changes.outputs.has-changes == 'true' && contains(needs.detect-changes.outputs.changed-modules, 'src-cli')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger src-cli workflow
        run: |
          gh workflow run src-cli.yaml \
            --ref ${{ github.ref_name }} \
            -f ref=${{ github.ref }} \
            -f sha=${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-src-commands:
    name: Trigger src-commands
    needs: [detect-changes, calculate-order]
    if: needs.detect-changes.outputs.has-changes == 'true' && contains(needs.detect-changes.outputs.changed-modules, 'src-commands')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger src-commands workflow
        run: |
          gh workflow run src-commands.yaml \
            --ref ${{ github.ref_name }} \
            -f ref=${{ github.ref }} \
            -f sha=${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-src-core:
    name: Trigger src-core
    needs: [detect-changes, calculate-order]
    if: needs.detect-changes.outputs.has-changes == 'true' && contains(needs.detect-changes.outputs.changed-modules, 'src-core')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger src-core workflow
        run: |
          gh workflow run src-core.yaml \
            --ref ${{ github.ref_name }} \
            -f ref=${{ github.ref }} \
            -f sha=${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-src-mcp-commands:
    name: Trigger src-mcp-commands
    needs: [detect-changes, calculate-order]
    if: needs.detect-changes.outputs.has-changes == 'true' && contains(needs.detect-changes.outputs.changed-modules, 'src-mcp-commands')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger src-mcp-commands workflow
        run: |
          gh workflow run src-mcp-commands.yaml \
            --ref ${{ github.ref_name }} \
            -f ref=${{ github.ref }} \
            -f sha=${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Summary
    needs: [detect-changes, calculate-order, trigger-src-cli, trigger-src-commands, trigger-src-core, trigger-src-mcp-commands]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          echo "## CI/CD Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changed Modules" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.detect-changes.outputs.changed-modules }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Execution Plan" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo '${{ needs.calculate-order.outputs.execution-plan }}' | jq . >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Workflow Execution Results" >> $GITHUB_STEP_SUMMARY
          echo "- src-cli: ${{ needs.trigger-src-cli.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- src-commands: ${{ needs.trigger-src-commands.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- src-core: ${{ needs.trigger-src-core.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- src-mcp-commands: ${{ needs.trigger-src-mcp-commands.result }}" >> $GITHUB_STEP_SUMMARY
