name: "Change Trigger"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger-all:
        description: 'Trigger all workflows regardless of changes'
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      changed-modules: ${{ steps.detect.outputs.modules }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Detect Changed Modules
        id: detect
        run: |
          cd src/commands

          # Check if trigger-all is enabled (defaults to true for push/PR, user can override on manual dispatch)
          TRIGGER_ALL="${{ inputs.trigger-all }}"

          # If inputs.trigger-all is empty (push/PR events), default to true
          if [ -z "$TRIGGER_ALL" ]; then
            TRIGGER_ALL="true"
          fi

          if [ "$TRIGGER_ALL" = "true" ]; then
            echo "Trigger all mode enabled - running all workflows"
            WORKFLOW_MODULES="src-cli src-commands src-core src-mcp-commands ext-eac"
          else
            # Get changed modules using existing command
            MODULES=$(go run . "get changed modules" --as-json | jq -r '.modules | join(" ")')

            # Filter to only Go modules that have workflows
            WORKFLOW_MODULES=""
            for module in $MODULES; do
              if [ -f ".github/workflows/${module}.yaml" ]; then
                WORKFLOW_MODULES="$WORKFLOW_MODULES $module"
              fi
            done
            WORKFLOW_MODULES=$(echo $WORKFLOW_MODULES | xargs)

            echo "All changed modules: $MODULES"
            echo "Modules with workflows: $WORKFLOW_MODULES"
          fi

          if [ -n "$WORKFLOW_MODULES" ]; then
            echo "modules=$WORKFLOW_MODULES" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "modules=" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
          fi

  calculate-order:
    name: Calculate Execution Order
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      execution-plan: ${{ steps.calculate.outputs.plan }}
      layer-count: ${{ steps.calculate.outputs.layer-count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Calculate Execution Order
        id: calculate
        run: |
          cd src/commands

          # Get execution order for changed modules
          MODULES="${{ needs.detect-changes.outputs.changed-modules }}"

          # Calculate execution order using the new command
          PLAN=$(go run . "get execution order" $MODULES --as-json)

          echo "Execution plan:"
          echo "$PLAN" | jq .

          # Save plan
          echo "plan<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Extract layer count
          LAYER_COUNT=$(echo "$PLAN" | jq -r '.layer_count')
          echo "layer-count=$LAYER_COUNT" >> $GITHUB_OUTPUT

  # Execute module workflows in dependency order
  # Each layer job triggers workflows for all modules in that layer in parallel
  # Layers execute sequentially to respect dependencies

  trigger-layer-1:
    name: Build Layer 1
    needs: [detect-changes, calculate-order]
    if: needs.detect-changes.outputs.has-changes == 'true' && needs.calculate-order.outputs.layer-count >= '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Layer 1 Workflows
        run: |
          PLAN='${{ needs.calculate-order.outputs.execution-plan }}'
          LAYER_1=$(echo "$PLAN" | jq -r '.layers[0][]')

          echo "Layer 1 modules: $LAYER_1"

          # Array to track workflow run IDs
          declare -a RUN_IDS
          declare -a MODULES

          # Trigger all workflows in parallel
          for module in $LAYER_1; do
            WORKFLOW_FILE=".github/workflows/${module}.yaml"
            if [ -f "$WORKFLOW_FILE" ]; then
              echo "🚀 Triggering workflow for $module..."
              gh workflow run "${module}.yaml" \
                --ref ${{ github.ref_name }} \
                -f ref=${{ github.ref }} \
                -f sha=${{ github.sha }}

              if [ $? -ne 0 ]; then
                echo "::error::Failed to trigger $module workflow"
                exit 1
              fi

              # Wait a moment for the workflow to be created
              sleep 2

              # Get the most recent run ID for this workflow
              RUN_ID=$(gh run list --workflow="${module}.yaml" --limit 1 --json databaseId --jq '.[0].databaseId')

              if [ -n "$RUN_ID" ]; then
                echo "📝 Workflow $module started with run ID: $RUN_ID"
                RUN_IDS+=("$RUN_ID")
                MODULES+=("$module")
              else
                echo "::warning::Could not find run ID for $module workflow"
              fi
            else
              echo "⚠️ No workflow file found for $module"
            fi
          done

          # Wait for all workflows to complete
          echo ""
          echo "⏳ Waiting for all Layer 1 workflows to complete..."

          FAILED=0
          for i in "${!RUN_IDS[@]}"; do
            RUN_ID="${RUN_IDS[$i]}"
            MODULE="${MODULES[$i]}"

            echo "⌛ Waiting for $MODULE (run $RUN_ID)..."

            # Watch the workflow run and wait for completion
            gh run watch "$RUN_ID" --exit-status

            if [ $? -ne 0 ]; then
              echo "::error::❌ Workflow $MODULE failed!"
              FAILED=1
            else
              echo "✅ Workflow $MODULE completed successfully"
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "::error::One or more Layer 1 workflows failed"
            exit 1
          fi

          echo ""
          echo "🎉 All Layer 1 workflows completed successfully"
        env:
          GH_TOKEN: ${{ github.token }}

  trigger-layer-2:
    name: Build Layer 2
    needs: [detect-changes, calculate-order, trigger-layer-1]
    if: needs.detect-changes.outputs.has-changes == 'true' && needs.calculate-order.outputs.layer-count >= '2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Layer 2 Workflows
        run: |
          PLAN='${{ needs.calculate-order.outputs.execution-plan }}'
          LAYER_2=$(echo "$PLAN" | jq -r '.layers[1][]')

          echo "Layer 2 modules: $LAYER_2"

          declare -a RUN_IDS
          declare -a MODULES

          for module in $LAYER_2; do
            WORKFLOW_FILE=".github/workflows/${module}.yaml"
            if [ -f "$WORKFLOW_FILE" ]; then
              echo "🚀 Triggering workflow for $module..."
              gh workflow run "${module}.yaml" \
                --ref ${{ github.ref_name }} \
                -f ref=${{ github.ref }} \
                -f sha=${{ github.sha }}

              if [ $? -ne 0 ]; then
                echo "::error::Failed to trigger $module workflow"
                exit 1
              fi

              sleep 2
              RUN_ID=$(gh run list --workflow="${module}.yaml" --limit 1 --json databaseId --jq '.[0].databaseId')

              if [ -n "$RUN_ID" ]; then
                echo "📝 Workflow $module started with run ID: $RUN_ID"
                RUN_IDS+=("$RUN_ID")
                MODULES+=("$module")
              else
                echo "::warning::Could not find run ID for $module workflow"
              fi
            else
              echo "⚠️ No workflow file found for $module"
            fi
          done

          echo ""
          echo "⏳ Waiting for all Layer 2 workflows to complete..."

          FAILED=0
          for i in "${!RUN_IDS[@]}"; do
            RUN_ID="${RUN_IDS[$i]}"
            MODULE="${MODULES[$i]}"
            echo "⌛ Waiting for $MODULE (run $RUN_ID)..."
            gh run watch "$RUN_ID" --exit-status

            if [ $? -ne 0 ]; then
              echo "::error::❌ Workflow $MODULE failed!"
              FAILED=1
            else
              echo "✅ Workflow $MODULE completed successfully"
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "::error::One or more Layer 2 workflows failed"
            exit 1
          fi

          echo ""
          echo "🎉 All Layer 2 workflows completed successfully"
        env:
          GH_TOKEN: ${{ github.token }}

  trigger-layer-3:
    name: Build Layer 3
    needs: [detect-changes, calculate-order, trigger-layer-2]
    if: needs.detect-changes.outputs.has-changes == 'true' && needs.calculate-order.outputs.layer-count >= '3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Layer 3 Workflows
        run: |
          PLAN='${{ needs.calculate-order.outputs.execution-plan }}'
          LAYER_3=$(echo "$PLAN" | jq -r '.layers[2][]')

          echo "Layer 3 modules: $LAYER_3"

          declare -a RUN_IDS
          declare -a MODULES

          for module in $LAYER_3; do
            WORKFLOW_FILE=".github/workflows/${module}.yaml"
            if [ -f "$WORKFLOW_FILE" ]; then
              echo "🚀 Triggering workflow for $module..."
              gh workflow run "${module}.yaml" \
                --ref ${{ github.ref_name }} \
                -f ref=${{ github.ref }} \
                -f sha=${{ github.sha }}

              if [ $? -ne 0 ]; then
                echo "::error::Failed to trigger $module workflow"
                exit 1
              fi

              sleep 2
              RUN_ID=$(gh run list --workflow="${module}.yaml" --limit 1 --json databaseId --jq '.[0].databaseId')

              if [ -n "$RUN_ID" ]; then
                echo "📝 Workflow $module started with run ID: $RUN_ID"
                RUN_IDS+=("$RUN_ID")
                MODULES+=("$module")
              else
                echo "::warning::Could not find run ID for $module workflow"
              fi
            else
              echo "⚠️ No workflow file found for $module"
            fi
          done

          echo ""
          echo "⏳ Waiting for all Layer 3 workflows to complete..."

          FAILED=0
          for i in "${!RUN_IDS[@]}"; do
            RUN_ID="${RUN_IDS[$i]}"
            MODULE="${MODULES[$i]}"
            echo "⌛ Waiting for $MODULE (run $RUN_ID)..."
            gh run watch "$RUN_ID" --exit-status

            if [ $? -ne 0 ]; then
              echo "::error::❌ Workflow $MODULE failed!"
              FAILED=1
            else
              echo "✅ Workflow $MODULE completed successfully"
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "::error::One or more Layer 3 workflows failed"
            exit 1
          fi

          echo ""
          echo "🎉 All Layer 3 workflows completed successfully"
        env:
          GH_TOKEN: ${{ github.token }}

  trigger-layer-4:
    name: Build Layer 4
    needs: [detect-changes, calculate-order, trigger-layer-3]
    if: needs.detect-changes.outputs.has-changes == 'true' && needs.calculate-order.outputs.layer-count >= '4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Layer 4 Workflows
        run: |
          PLAN='${{ needs.calculate-order.outputs.execution-plan }}'
          LAYER_4=$(echo "$PLAN" | jq -r '.layers[3][]')

          echo "Layer 4 modules: $LAYER_4"

          declare -a RUN_IDS
          declare -a MODULES

          for module in $LAYER_4; do
            WORKFLOW_FILE=".github/workflows/${module}.yaml"
            if [ -f "$WORKFLOW_FILE" ]; then
              echo "🚀 Triggering workflow for $module..."
              gh workflow run "${module}.yaml" \
                --ref ${{ github.ref_name }} \
                -f ref=${{ github.ref }} \
                -f sha=${{ github.sha }}

              if [ $? -ne 0 ]; then
                echo "::error::Failed to trigger $module workflow"
                exit 1
              fi

              sleep 2
              RUN_ID=$(gh run list --workflow="${module}.yaml" --limit 1 --json databaseId --jq '.[0].databaseId')

              if [ -n "$RUN_ID" ]; then
                echo "📝 Workflow $module started with run ID: $RUN_ID"
                RUN_IDS+=("$RUN_ID")
                MODULES+=("$module")
              else
                echo "::warning::Could not find run ID for $module workflow"
              fi
            else
              echo "⚠️ No workflow file found for $module"
            fi
          done

          echo ""
          echo "⏳ Waiting for all Layer 4 workflows to complete..."

          FAILED=0
          for i in "${!RUN_IDS[@]}"; do
            RUN_ID="${RUN_IDS[$i]}"
            MODULE="${MODULES[$i]}"
            echo "⌛ Waiting for $MODULE (run $RUN_ID)..."
            gh run watch "$RUN_ID" --exit-status

            if [ $? -ne 0 ]; then
              echo "::error::❌ Workflow $MODULE failed!"
              FAILED=1
            else
              echo "✅ Workflow $MODULE completed successfully"
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "::error::One or more Layer 4 workflows failed"
            exit 1
          fi

          echo ""
          echo "🎉 All Layer 4 workflows completed successfully"
        env:
          GH_TOKEN: ${{ github.token }}

  trigger-layer-5:
    name: Build Layer 5
    needs: [detect-changes, calculate-order, trigger-layer-4]
    if: needs.detect-changes.outputs.has-changes == 'true' && needs.calculate-order.outputs.layer-count >= '5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Layer 5 Workflows
        run: |
          PLAN='${{ needs.calculate-order.outputs.execution-plan }}'
          LAYER_5=$(echo "$PLAN" | jq -r '.layers[4][]')

          echo "Layer 5 modules: $LAYER_5"

          declare -a RUN_IDS
          declare -a MODULES

          for module in $LAYER_5; do
            WORKFLOW_FILE=".github/workflows/${module}.yaml"
            if [ -f "$WORKFLOW_FILE" ]; then
              echo "🚀 Triggering workflow for $module..."
              gh workflow run "${module}.yaml" \
                --ref ${{ github.ref_name }} \
                -f ref=${{ github.ref }} \
                -f sha=${{ github.sha }}

              if [ $? -ne 0 ]; then
                echo "::error::Failed to trigger $module workflow"
                exit 1
              fi

              sleep 2
              RUN_ID=$(gh run list --workflow="${module}.yaml" --limit 1 --json databaseId --jq '.[0].databaseId')

              if [ -n "$RUN_ID" ]; then
                echo "📝 Workflow $module started with run ID: $RUN_ID"
                RUN_IDS+=("$RUN_ID")
                MODULES+=("$module")
              else
                echo "::warning::Could not find run ID for $module workflow"
              fi
            else
              echo "⚠️ No workflow file found for $module"
            fi
          done

          echo ""
          echo "⏳ Waiting for all Layer 5 workflows to complete..."

          FAILED=0
          for i in "${!RUN_IDS[@]}"; do
            RUN_ID="${RUN_IDS[$i]}"
            MODULE="${MODULES[$i]}"
            echo "⌛ Waiting for $MODULE (run $RUN_ID)..."
            gh run watch "$RUN_ID" --exit-status

            if [ $? -ne 0 ]; then
              echo "::error::❌ Workflow $MODULE failed!"
              FAILED=1
            else
              echo "✅ Workflow $MODULE completed successfully"
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "::error::One or more Layer 5 workflows failed"
            exit 1
          fi

          echo ""
          echo "🎉 All Layer 5 workflows completed successfully"
        env:
          GH_TOKEN: ${{ github.token }}

  summary:
    name: Summary
    needs: [detect-changes, calculate-order, trigger-layer-1, trigger-layer-2, trigger-layer-3, trigger-layer-4, trigger-layer-5]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          echo "## CI/CD Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.detect-changes.outputs.has-changes }}" != "true" ]; then
            echo "### No Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "No modules were changed in this push." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "### Changed Modules" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.detect-changes.outputs.changed-modules }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Execution Plan" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo '${{ needs.calculate-order.outputs.execution-plan }}' | jq . >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Layer Execution Results" >> $GITHUB_STEP_SUMMARY

          # Only show results for layers that actually ran
          if [ "${{ needs.trigger-layer-1.result }}" != "" ]; then
            echo "- Layer 1: ${{ needs.trigger-layer-1.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.trigger-layer-2.result }}" != "" ]; then
            echo "- Layer 2: ${{ needs.trigger-layer-2.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.trigger-layer-3.result }}" != "" ]; then
            echo "- Layer 3: ${{ needs.trigger-layer-3.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.trigger-layer-4.result }}" != "" ]; then
            echo "- Layer 4: ${{ needs.trigger-layer-4.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.trigger-layer-5.result }}" != "" ]; then
            echo "- Layer 5: ${{ needs.trigger-layer-5.result }}" >> $GITHUB_STEP_SUMMARY
          fi
