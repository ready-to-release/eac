name: "Change Trigger"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger-all:
        description: 'Trigger all workflows regardless of changes'
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      changed-modules: ${{ steps.detect.outputs.modules }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Detect Changed Modules
        id: detect
        run: |
          cd src/commands

          # Check if trigger-all is enabled (defaults to true for push/PR, user can override on manual dispatch)
          TRIGGER_ALL="${{ inputs.trigger-all }}"

          # If inputs.trigger-all is empty (push/PR events), default to true
          if [ -z "$TRIGGER_ALL" ]; then
            TRIGGER_ALL="true"
          fi

          if [ "$TRIGGER_ALL" = "true" ]; then
            echo "Trigger all mode enabled - running all workflows"
            WORKFLOW_MODULES="src-cli src-commands src-core src-mcp-commands ext-eac docs"
          else
            # Get changed modules using existing command
            MODULES=$(go run . "get changed modules" --as-json | jq -r '.modules | join(" ")')

            # Filter to only Go modules that have workflows
            WORKFLOW_MODULES=""
            for module in $MODULES; do
              if [ -f ".github/workflows/${module}.yaml" ]; then
                WORKFLOW_MODULES="$WORKFLOW_MODULES $module"
              fi
            done
            WORKFLOW_MODULES=$(echo $WORKFLOW_MODULES | xargs)

            echo "All changed modules: $MODULES"
            echo "Modules with workflows: $WORKFLOW_MODULES"
          fi

          if [ -n "$WORKFLOW_MODULES" ]; then
            echo "modules=$WORKFLOW_MODULES" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "modules=" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
          fi

  calculate-order:
    name: Calculate Execution Order
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      execution-plan: ${{ steps.calculate.outputs.plan }}
      layer-count: ${{ steps.calculate.outputs.layer-count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Calculate Execution Order
        id: calculate
        run: |
          cd src/commands

          # Get execution order for changed modules
          MODULES="${{ needs.detect-changes.outputs.changed-modules }}"

          # Calculate execution order using the new command
          PLAN=$(go run . "get execution order" $MODULES --as-json)

          echo "Execution plan:"
          echo "$PLAN" | jq .

          # Save plan
          echo "plan<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Extract layer count
          LAYER_COUNT=$(echo "$PLAN" | jq -r '.layer_count')
          echo "layer-count=$LAYER_COUNT" >> $GITHUB_OUTPUT

  # Execute module workflows in dependency order
  # Single job that processes all layers sequentially
  # Each layer's workflows are triggered in parallel and awaited

  execute-layers:
    name: Execute Dependency Layers
    needs: [detect-changes, calculate-order]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Execute All Layers Sequentially
        run: |
          PLAN='${{ needs.calculate-order.outputs.execution-plan }}'
          LAYER_COUNT=$(echo "$PLAN" | jq -r '.layer_count')

          echo "📊 Execution plan has $LAYER_COUNT layer(s)"
          echo ""

          # Process each layer sequentially
          for ((layer_idx=0; layer_idx<LAYER_COUNT; layer_idx++)); do
            LAYER_NUM=$((layer_idx + 1))
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔨 Processing Layer $LAYER_NUM"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Get modules for this layer
            LAYER_MODULES=$(echo "$PLAN" | jq -r ".layers[$layer_idx][]")

            if [ -z "$LAYER_MODULES" ]; then
              echo "⚠️  No modules in layer $LAYER_NUM"
              continue
            fi

            echo "📦 Modules in Layer $LAYER_NUM: $LAYER_MODULES"
            echo ""

            # Arrays to track workflow run IDs
            declare -a RUN_IDS=()
            declare -a MODULES=()

            # Trigger all workflows in this layer in parallel
            for module in $LAYER_MODULES; do
              WORKFLOW_FILE=".github/workflows/${module}.yaml"
              if [ -f "$WORKFLOW_FILE" ]; then
                echo "🚀 Triggering workflow for $module..."
                gh workflow run "${module}.yaml" \
                  --ref ${{ github.ref_name }} \
                  -f ref=${{ github.ref }} \
                  -f sha=${{ github.sha }}

                if [ $? -ne 0 ]; then
                  echo "::error::Failed to trigger $module workflow"
                  exit 1
                fi

                # Wait a moment for the workflow to be created
                sleep 2

                # Get the most recent run ID for this workflow
                RUN_ID=$(gh run list --workflow="${module}.yaml" --limit 1 --json databaseId --jq '.[0].databaseId')

                if [ -n "$RUN_ID" ]; then
                  echo "  📝 Workflow $module started with run ID: $RUN_ID"
                  RUN_IDS+=("$RUN_ID")
                  MODULES+=("$module")
                else
                  echo "  ::warning::Could not find run ID for $module workflow"
                fi
              else
                echo "  ⚠️  No workflow file found for $module"
              fi
            done

            # Wait for all workflows in this layer to complete
            if [ ${#RUN_IDS[@]} -gt 0 ]; then
              echo ""
              echo "⏳ Waiting for all Layer $LAYER_NUM workflows to complete..."
              echo ""

              FAILED=0
              for i in "${!RUN_IDS[@]}"; do
                RUN_ID="${RUN_IDS[$i]}"
                MODULE="${MODULES[$i]}"

                echo "⌛ Waiting for $MODULE (run $RUN_ID)..."

                # Watch the workflow run and wait for completion
                gh run watch "$RUN_ID" --exit-status --interval 10

                if [ $? -ne 0 ]; then
                  echo "  ::error::❌ Workflow $MODULE failed!"
                  FAILED=1
                else
                  echo "  ✅ Workflow $MODULE completed successfully"
                fi
              done

              if [ $FAILED -eq 1 ]; then
                echo ""
                echo "::error::❌ One or more workflows in Layer $LAYER_NUM failed"
                exit 1
              fi

              echo ""
              echo "🎉 All Layer $LAYER_NUM workflows completed successfully"
            else
              echo "⚠️  No workflows were triggered in Layer $LAYER_NUM"
            fi

            echo ""
          done

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ All layers completed successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        env:
          GH_TOKEN: ${{ github.token }}

  summary:
    name: Summary
    needs: [detect-changes, calculate-order, execute-layers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          echo "## CI/CD Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.detect-changes.outputs.has-changes }}" != "true" ]; then
            echo "### No Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "No modules were changed in this push." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "### Changed Modules" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.detect-changes.outputs.changed-modules }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Execution Plan" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo '${{ needs.calculate-order.outputs.execution-plan }}' | jq . >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Execution Result" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.execute-layers.result }}" >> $GITHUB_STEP_SUMMARY
