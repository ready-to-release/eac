name: "Release src-cli"

on:
  push:
    tags:
      - 'src-cli/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver format: x.y.z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CI status
        run: |
          echo "Checking if CI has passed for src-cli module..."
          COMMIT_SHA="${{ github.sha }}"
          echo "Commit SHA: $COMMIT_SHA"
          echo "Repository: ${{ github.repository }}"

          MAX_WAIT_TIME=600  # 10 minutes
          CHECK_INTERVAL=30   # 30 seconds
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT_TIME ]; do
            echo ""
            echo "Checking CI status (elapsed: ${ELAPSED}s)..."

            # Debug: show all workflow runs for this commit across all workflows
            echo "All workflows for commit $COMMIT_SHA:"
            gh run list --commit $COMMIT_SHA --limit 5 --json name,status,conclusion --jq '.[] | "\(.status)\t\(.conclusion // "n/a")\t\(.name)"'

            # Check if ci-repository (Change Trigger) is still running
            CI_REPO_STATUS=$(gh run list \
              --commit $COMMIT_SHA \
              --workflow ci-repository.yaml \
              --json status \
              --jq '.[0].status // "not_found"')

            echo ""
            echo "ci-repository.yaml status: $CI_REPO_STATUS"

            if [ "$CI_REPO_STATUS" = "in_progress" ] || [ "$CI_REPO_STATUS" = "queued" ]; then
              echo "⏳ CI orchestrator is still running - it will trigger src-cli workflow"
              echo "Waiting ${CHECK_INTERVAL}s for orchestrator to complete..."
              sleep $CHECK_INTERVAL
              ELAPSED=$((ELAPSED + CHECK_INTERVAL))
              continue
            fi

            # Get all runs for this commit and analyze them
            RUNS=$(gh run list \
              --commit $COMMIT_SHA \
              --workflow src-cli.yaml \
              --json status,conclusion,databaseId,createdAt \
              --limit 10)

            echo ""
            echo "Debug - src-cli.yaml workflow: API returned $(echo "$RUNS" | jq 'length') runs"
            if [ "$(echo "$RUNS" | jq 'length')" -gt "0" ]; then
              echo "$RUNS" | jq -c '.[] | {status, conclusion, createdAt}'
            fi

            # Count runs by status
            SUCCESS_COUNT=$(echo "$RUNS" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
            IN_PROGRESS_COUNT=$(echo "$RUNS" | jq '[.[] | select(.status == "in_progress")] | length')
            QUEUED_COUNT=$(echo "$RUNS" | jq '[.[] | select(.status == "queued" or .status == "waiting")] | length')
            FAILED_COUNT=$(echo "$RUNS" | jq '[.[] | select(.status == "completed" and .conclusion == "failure")] | length')
            TOTAL_COUNT=$(echo "$RUNS" | jq 'length')

            echo "CI runs for commit: success=$SUCCESS_COUNT, in_progress=$IN_PROGRESS_COUNT, queued=$QUEUED_COUNT, failed=$FAILED_COUNT, total=$TOTAL_COUNT"

            # If CI passed, we're done
            if [ "$SUCCESS_COUNT" -gt "0" ]; then
              echo "✅ CI has passed for commit $COMMIT_SHA"
              exit 0
            fi

            # If CI failed, stop immediately
            if [ "$FAILED_COUNT" -gt "0" ]; then
              echo "❌ Error: CI workflow failed for commit $COMMIT_SHA"
              echo "Fix the CI failures and re-run this release workflow."
              exit 1
            fi

            # If CI is running or queued, wait
            if [ "$IN_PROGRESS_COUNT" -gt "0" ] || [ "$QUEUED_COUNT" -gt "0" ]; then
              echo "⏳ CI is running... waiting ${CHECK_INTERVAL}s before next check..."
              sleep $CHECK_INTERVAL
              ELAPSED=$((ELAPSED + CHECK_INTERVAL))
              continue
            fi

            # No runs found at all
            if [ "$TOTAL_COUNT" -eq "0" ]; then
              echo "❌ Error: No CI workflow run found for commit $COMMIT_SHA"
              echo ""
              echo "The commit being released has not been tested by CI."
              echo "CI must run on this specific commit before releasing."
              echo ""
              echo "To fix:"
              echo "1. Push code changes to trigger CI automatically, OR"
              echo "2. Manually trigger CI: gh workflow run src-cli.yaml --ref ${{ github.ref_name }}"
              echo ""
              echo "Then re-run this release workflow after CI passes."
              exit 1
            fi

            # Unknown state - wait and retry
            echo "⏳ Waiting for CI state to change..."
            sleep $CHECK_INTERVAL
            ELAPSED=$((ELAPSED + CHECK_INTERVAL))
          done

          echo "❌ Error: Timeout waiting for CI to complete (waited ${MAX_WAIT_TIME}s)"
          echo "The CI is taking too long. Please check the workflow status and re-run when ready."
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract and validate version
        id: extract_version
        run: |
          # Determine version based on trigger type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="src-cli/$VERSION"
            echo "Manual trigger with version: $VERSION"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#src-cli/}"
            echo "Tag trigger with version: $VERSION"
          fi

          # Validate semver format (x.y.z where x, y, z are non-negative integers)
          if ! echo "$VERSION" | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' > /dev/null; then
            echo "Error: Invalid semver format: $VERSION"
            echo "Expected format: x.y.z (e.g., 1.0.0)"
            exit 1
          fi

          # Reject versions with 'v' prefix
          if echo "$VERSION" | grep -E '^v' > /dev/null; then
            echo "Error: Version should not have 'v' prefix: $VERSION"
            echo "Use x.y.z format (e.g., 1.0.0 not v1.0.0)"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "✅ Valid semver: $VERSION"

      - name: Check for existing release
        run: |
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"

          # Check if a GitHub release already exists for this tag
          # gh release view returns exit code 1 if release doesn't exist
          if gh release view "$TAG_NAME" 2>/dev/null; then
            echo ""
            echo "❌ Error: Release already exists for tag $TAG_NAME"
            echo ""
            echo "A GitHub release has already been created for this version."
            echo "If you want to create a new release:"
            echo "1. Delete the existing release: gh release delete $TAG_NAME"
            echo "2. Delete the tag: git push --delete origin $TAG_NAME"
            echo "3. Re-run this workflow"
            echo ""
            echo "Or increment the version number for a new release."
            exit 1
          fi

          echo "✅ No existing release found for $TAG_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"

          echo "Preparing to create tag: $TAG_NAME"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch all tags from remote
          echo "Fetching existing tags..."
          git fetch --tags --force

          # Check if tag already exists (locally or remote)
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "ℹ️  Tag $TAG_NAME already exists"
            echo "Using existing tag for release"
          else
            echo "Creating new tag: $TAG_NAME"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"

            echo "Pushing tag to remote..."
            git push origin "$TAG_NAME"

            echo "✅ Created and pushed tag: $TAG_NAME"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'

      - name: Build binaries for multiple platforms
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          echo "Building src-cli with version $VERSION using build command..."
          go run ./src/commands build src-cli --version "$VERSION" --no-tidy

      - name: Verify binaries
        run: |
          echo "Verifying built binaries..."
          ls -lh out/build/src-cli/

          # Check all required files exist
          REQUIRED_FILES=(
            "out/build/src-cli/r2r-linux"
            "out/build/src-cli/r2r-darwin-amd64"
            "out/build/src-cli/r2r-darwin-arm64"
            "out/build/src-cli/r2r-windows.exe"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Error: Required file missing: $file"
              exit 1
            fi
            echo "✅ Found: $file ($(stat -f%z "$file" 2>/dev/null || stat -c%s "$file") bytes)"
          done

          echo ""
          echo "Testing Linux binary version:"
          chmod +x out/build/src-cli/r2r-linux
          ./out/build/src-cli/r2r-linux version || true

      - name: Create release notes
        id: release_notes
        run: |
          cat << EOF > release_notes.md
          # r2r CLI ${{ steps.extract_version.outputs.version }}

          ## What's New

          Release of r2r CLI version ${{ steps.extract_version.outputs.version }}.

          ## Installation

          Download the appropriate binary for your platform:

          - **Linux (AMD64)**: \`r2r-linux\`
          - **macOS (Intel)**: \`r2r-darwin-amd64\`
          - **macOS (Apple Silicon)**: \`r2r-darwin-arm64\`
          - **Windows (AMD64)**: \`r2r-windows.exe\`

          Make the binary executable (Linux/macOS):
          \`\`\`bash
          chmod +x r2r-*
          \`\`\`

          Verify the installation:
          \`\`\`bash
          ./r2r-linux version     # Linux
          ./r2r-darwin-amd64 version  # macOS Intel
          ./r2r-darwin-arm64 version  # macOS Apple Silicon
          r2r-windows.exe version     # Windows
          \`\`\`

          ## Release Information

          - **Version**: ${{ steps.extract_version.outputs.version }}
          - **Commit**: ${{ github.sha }}
          - **Tag**: ${{ steps.extract_version.outputs.tag_name }}

          ---

          🤖 Generated with [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

          cat release_notes.md

      - name: Create GitHub Release with binaries
        run: |
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"
          VERSION="${{ steps.extract_version.outputs.version }}"

          echo "Creating release for tag: $TAG_NAME with binaries"

          gh release create "$TAG_NAME" \
            --title "r2r CLI v$VERSION" \
            --notes-file release_notes.md \
            --verify-tag \
            out/build/src-cli/r2r-linux \
            out/build/src-cli/r2r-darwin-amd64 \
            out/build/src-cli/r2r-darwin-arm64 \
            out/build/src-cli/r2r-windows.exe

          echo "✅ Release created with binaries successfully"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify release assets
        run: |
          echo "Checking uploaded assets for release..."
          gh release view ${{ steps.extract_version.outputs.tag_name }} --json assets --jq '.assets[] | .name'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Released r2r CLI version **${{ steps.extract_version.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- r2r-linux" >> $GITHUB_STEP_SUMMARY
          echo "- r2r-darwin-amd64" >> $GITHUB_STEP_SUMMARY
          echo "- r2r-darwin-arm64" >> $GITHUB_STEP_SUMMARY
          echo "- r2r-windows.exe" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.extract_version.outputs.tag_name }})" >> $GITHUB_STEP_SUMMARY
