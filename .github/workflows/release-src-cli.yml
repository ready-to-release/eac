name: "Release src-cli"

on:
  push:
    tags:
      - 'src-cli:*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#src-cli:}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'

      - name: Build binaries for multiple platforms
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          echo "Building src-cli with version $VERSION using build command..."
          go run ./src/commands build module src-cli --version "$VERSION" --no-tidy

          echo "Copying binaries to release directory..."
          mkdir -p out
          cp out/build/src-cli/linux-amd64-r2r-cli out/r2r-linux-amd64
          cp out/build/src-cli/darwin-amd64-r2r-cli out/r2r-darwin-amd64
          cp out/build/src-cli/darwin-arm64-r2r-cli out/r2r-darwin-arm64
          cp out/build/src-cli/windows-amd64-r2r-cli.exe out/r2r-windows-amd64.exe

      - name: Verify binaries
        run: |
          echo "Verifying built binaries..."
          ls -lh out/

          echo ""
          echo "Testing Linux binary version:"
          chmod +x out/r2r-linux-amd64
          ./out/r2r-linux-amd64 version || true

          echo ""
          echo "Testing Darwin AMD64 binary:"
          chmod +x out/r2r-darwin-amd64
          file out/r2r-darwin-amd64

          echo ""
          echo "Testing Darwin ARM64 binary:"
          chmod +x out/r2r-darwin-arm64
          file out/r2r-darwin-arm64

          echo ""
          echo "Testing Windows binary:"
          file out/r2r-windows-amd64.exe

      - name: Create release notes
        id: release_notes
        run: |
          cat << EOF > release_notes.md
          # r2r CLI ${{ steps.extract_version.outputs.version }}

          ## What's New

          Release of r2r CLI version ${{ steps.extract_version.outputs.version }}.

          ## Installation

          Download the appropriate binary for your platform:

          - **Linux (AMD64)**: \`r2r-linux-amd64\`
          - **macOS (Intel)**: \`r2r-darwin-amd64\`
          - **macOS (Apple Silicon)**: \`r2r-darwin-arm64\`
          - **Windows (AMD64)**: \`r2r-windows-amd64.exe\`

          Make the binary executable (Linux/macOS):
          \`\`\`bash
          chmod +x r2r-*
          \`\`\`

          Verify the installation:
          \`\`\`bash
          ./r2r-* version
          \`\`\`

          ## Release Information

          - **Version**: ${{ steps.extract_version.outputs.version }}
          - **Commit**: ${{ github.sha }}
          - **Tag**: ${{ steps.extract_version.outputs.tag_name }}

          ---

          🤖 Generated with [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.extract_version.outputs.tag_name }}
          name: "r2r CLI v${{ steps.extract_version.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            out/r2r-linux-amd64
            out/r2r-darwin-amd64
            out/r2r-darwin-arm64
            out/r2r-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Released r2r CLI version **${{ steps.extract_version.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- r2r-linux-amd64" >> $GITHUB_STEP_SUMMARY
          echo "- r2r-darwin-amd64" >> $GITHUB_STEP_SUMMARY
          echo "- r2r-darwin-arm64" >> $GITHUB_STEP_SUMMARY
          echo "- r2r-windows-amd64.exe" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.extract_version.outputs.tag_name }})" >> $GITHUB_STEP_SUMMARY
