name: "Release src-cli"

on:
  push:
    tags:
      - 'src-cli/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver format: x.y.z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CI status
        run: |
          echo "Checking if CI has passed for src-cli module..."

          # Get the commit SHA to check
          COMMIT_SHA="${{ github.sha }}"

          # Check for successful src-cli workflow run on this commit
          gh api \
            repos/${{ github.repository }}/actions/workflows/src-cli.yaml/runs \
            -f status=completed \
            -f conclusion=success \
            -f head_sha=$COMMIT_SHA \
            --jq '.workflow_runs | length' > run_count.txt

          RUN_COUNT=$(cat run_count.txt)

          if [ "$RUN_COUNT" -eq "0" ]; then
            echo "❌ Error: No successful CI run found for commit $COMMIT_SHA"
            echo ""
            echo "The src-cli CI workflow must pass before releasing."
            echo "Please ensure 'ci-src-cli (stage 1-6)' workflow has completed successfully."
            echo ""
            echo "You can:"
            echo "1. Wait for the CI workflow to complete"
            echo "2. Check workflow status at: https://github.com/${{ github.repository }}/actions/workflows/src-cli.yaml"
            echo "3. Re-run this release workflow after CI passes"
            exit 1
          fi

          echo "✅ CI has passed for commit $COMMIT_SHA"
          echo "Found $RUN_COUNT successful CI run(s)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract and validate version
        id: extract_version
        run: |
          # Determine version based on trigger type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="src-cli/$VERSION"
            echo "Manual trigger with version: $VERSION"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#src-cli/}"
            echo "Tag trigger with version: $VERSION"
          fi

          # Validate semver format (x.y.z where x, y, z are non-negative integers)
          if ! echo "$VERSION" | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' > /dev/null; then
            echo "Error: Invalid semver format: $VERSION"
            echo "Expected format: x.y.z (e.g., 1.0.0)"
            exit 1
          fi

          # Reject versions with 'v' prefix
          if echo "$VERSION" | grep -E '^v' > /dev/null; then
            echo "Error: Version should not have 'v' prefix: $VERSION"
            echo "Use x.y.z format (e.g., 1.0.0 not v1.0.0)"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "✅ Valid semver: $VERSION"

      - name: Check for existing release
        run: |
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"

          # Check if a GitHub release already exists for this tag
          # gh release view returns exit code 1 if release doesn't exist
          if gh release view "$TAG_NAME" 2>/dev/null; then
            echo ""
            echo "❌ Error: Release already exists for tag $TAG_NAME"
            echo ""
            echo "A GitHub release has already been created for this version."
            echo "If you want to create a new release:"
            echo "1. Delete the existing release: gh release delete $TAG_NAME"
            echo "2. Delete the tag: git push --delete origin $TAG_NAME"
            echo "3. Re-run this workflow"
            echo ""
            echo "Or increment the version number for a new release."
            exit 1
          fi

          echo "✅ No existing release found for $TAG_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"

          echo "Preparing to create tag: $TAG_NAME"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch all tags from remote
          echo "Fetching existing tags..."
          git fetch --tags --force

          # Check if tag already exists (locally or remote)
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "ℹ️  Tag $TAG_NAME already exists"
            echo "Using existing tag for release"
          else
            echo "Creating new tag: $TAG_NAME"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"

            echo "Pushing tag to remote..."
            git push origin "$TAG_NAME"

            echo "✅ Created and pushed tag: $TAG_NAME"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'

      - name: Build binaries for multiple platforms
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          echo "Building src-cli with version $VERSION using build command..."
          go run ./src/commands build module src-cli --version "$VERSION" --no-tidy

      - name: Verify binaries
        run: |
          echo "Verifying built binaries..."
          ls -lh out/build/src-cli/

          echo ""
          echo "Testing Linux binary version:"
          chmod +x out/build/src-cli/r2r-linux
          ./out/build/src-cli/r2r-linux version || true

          echo ""
          echo "Testing Darwin AMD64 binary:"
          file out/build/src-cli/r2r-darwin-amd64

          echo ""
          echo "Testing Darwin ARM64 binary:"
          file out/build/src-cli/r2r-darwin-arm64

          echo ""
          echo "Testing Windows binary:"
          file out/build/src-cli/r2r-windows.exe

      - name: Create release notes
        id: release_notes
        run: |
          cat << EOF > release_notes.md
          # r2r CLI ${{ steps.extract_version.outputs.version }}

          ## What's New

          Release of r2r CLI version ${{ steps.extract_version.outputs.version }}.

          ## Installation

          Download the appropriate binary for your platform:

          - **Linux (AMD64)**: \`r2r-linux\`
          - **macOS (Intel)**: \`r2r-darwin-amd64\`
          - **macOS (Apple Silicon)**: \`r2r-darwin-arm64\`
          - **Windows (AMD64)**: \`r2r-windows.exe\`

          Make the binary executable (Linux/macOS):
          \`\`\`bash
          chmod +x r2r-*
          \`\`\`

          Verify the installation:
          \`\`\`bash
          ./r2r-linux version     # Linux
          ./r2r-darwin-amd64 version  # macOS Intel
          ./r2r-darwin-arm64 version  # macOS Apple Silicon
          r2r-windows.exe version     # Windows
          \`\`\`

          ## Release Information

          - **Version**: ${{ steps.extract_version.outputs.version }}
          - **Commit**: ${{ github.sha }}
          - **Tag**: ${{ steps.extract_version.outputs.tag_name }}

          ---

          🤖 Generated with [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.extract_version.outputs.tag_name }}
          name: "r2r CLI v${{ steps.extract_version.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            out/build/src-cli/r2r-linux
            out/build/src-cli/r2r-darwin-amd64
            out/build/src-cli/r2r-darwin-arm64
            out/build/src-cli/r2r-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Released r2r CLI version **${{ steps.extract_version.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- r2r-linux" >> $GITHUB_STEP_SUMMARY
          echo "- r2r-darwin-amd64" >> $GITHUB_STEP_SUMMARY
          echo "- r2r-darwin-arm64" >> $GITHUB_STEP_SUMMARY
          echo "- r2r-windows.exe" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.extract_version.outputs.tag_name }})" >> $GITHUB_STEP_SUMMARY
