# Release src-cli - CLI Binary Release Workflow
#
# This workflow releases the r2r CLI binaries. It verifies CI coverage before releasing.
#
# CI Verification Strategy:
# Since we use optimized CI (only changed modules are built), we can't require a direct
# CI run for every commit. Instead, we verify that the code has been tested:
#
# Strategy 1: Check for direct src-cli.yaml CI run on this exact commit
#   - If found and successful → code was tested → proceed
#
# Strategy 2: Use `get changed modules ci` to check if src-cli needs rebuild
#   - This uses the repository's dependency graph to determine if src-cli
#     or any of its dependencies (src-core, src-commands) have changed
#   - If src-cli IS in the list → code changed but not yet tested → wait/fail
#   - If src-cli is NOT in the list → code hasn't changed since last test → proceed
#
# This workflow BUILDS FROM SOURCE, so it doesn't depend on pre-built artifacts.
# It only needs verification that the code was tested.

name: "release-src-cli (stage 7+)"

on:
  push:
    tags:
      - 'src-cli/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver format: x.y.z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            src/commands/go.sum
            src/core/go.sum

      - name: Check CI status
        run: |
          echo "Checking CI coverage for src-cli module..."
          COMMIT_SHA="${{ github.sha }}"
          echo "Current commit SHA: $COMMIT_SHA"
          echo "Repository: ${{ github.repository }}"

          MAX_WAIT_TIME=300  # 5 minutes
          CHECK_INTERVAL=15
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT_TIME ]; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Checking CI coverage (elapsed: ${ELAPSED}s)..."

            # Check if any CI is currently running for this commit
            CI_REPO_STATUS=$(gh run list \
              --commit $COMMIT_SHA \
              --workflow change-trigger.yaml \
              --json status \
              --jq '.[0].status // "not_found"')

            if [ "$CI_REPO_STATUS" = "in_progress" ] || [ "$CI_REPO_STATUS" = "queued" ]; then
              echo "⏳ CI is running for this commit - waiting..."
              sleep $CHECK_INTERVAL
              ELAPSED=$((ELAPSED + CHECK_INTERVAL))
              continue
            fi

            # Strategy 1: Check for direct CI run on this commit
            echo ""
            echo "📋 Strategy 1: Check for src-cli CI run on this exact commit..."
            DIRECT_RUNS=$(gh run list \
              --commit $COMMIT_SHA \
              --workflow src-cli.yaml \
              --json status,conclusion \
              --limit 5)

            DIRECT_SUCCESS=$(echo "$DIRECT_RUNS" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
            DIRECT_FAILED=$(echo "$DIRECT_RUNS" | jq '[.[] | select(.status == "completed" and .conclusion == "failure")] | length')
            DIRECT_RUNNING=$(echo "$DIRECT_RUNS" | jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')

            if [ "$DIRECT_SUCCESS" -gt "0" ]; then
              echo "✅ Found successful src-cli CI run for this exact commit"
              exit 0
            fi

            if [ "$DIRECT_FAILED" -gt "0" ]; then
              echo "❌ CI failed for this commit - cannot release"
              exit 1
            fi

            if [ "$DIRECT_RUNNING" -gt "0" ]; then
              echo "⏳ src-cli CI is running for this commit - waiting..."
              sleep $CHECK_INTERVAL
              ELAPSED=$((ELAPSED + CHECK_INTERVAL))
              continue
            fi

            # Strategy 2: No direct CI run found. Check if src-cli even needs rebuilding.
            #
            # The `get changed modules ci` command compares current commit against the last
            # successful "Change Trigger" CI run. It returns modules that WOULD need rebuilding
            # based on changed files and the dependency graph.
            #
            # If src-cli is NOT in the list, it means:
            #   - No files affecting src-cli have changed since last successful CI
            #   - The code was already tested (at some previous commit)
            #   - Safe to release (we build from source anyway)
            #
            # If src-cli IS in the list, it means:
            #   - Files affecting src-cli (or its dependencies) have changed
            #   - But CI hasn't run yet for these changes
            #   - Must wait for CI before releasing
            echo ""
            echo "📋 Strategy 2: Check if last successful CI covers this commit..."

            cd src/commands
            RESULT=$(go run . "get changed modules ci" --as-json 2>/dev/null || echo '{"is_bootstrap": true}')
            cd ../..

            echo "Change detection result:"
            echo "$RESULT" | jq . 2>/dev/null || echo "$RESULT"

            IS_BOOTSTRAP=$(echo "$RESULT" | jq -r '.is_bootstrap // true')
            MODULES=$(echo "$RESULT" | jq -r '.modules // [] | join(" ")')

            if [ "$IS_BOOTSTRAP" = "true" ]; then
              echo "⚠️  No previous successful CI found - bootstrap scenario"
              echo "❌ Cannot release without CI verification"
              echo ""
              echo "Please run CI first:"
              echo "  gh workflow run change-trigger.yaml"
              exit 1
            fi

            # If src-cli is in the modules list, it needs rebuilding (code changed but not tested)
            # If src-cli is NOT in the list, it's covered by previous CI (safe to release)
            if echo " $MODULES " | grep -q " src-cli "; then
              echo ""
              echo "⚠️  src-cli requires rebuild based on dependency analysis"
              echo "Modules requiring rebuild: $MODULES"
              echo ""
              echo "The optimized CI should have triggered a build for these changes."
              echo "If CI hasn't run yet, trigger it manually:"
              echo "  gh workflow run change-trigger.yaml"
              echo ""
              echo "Waiting for CI to complete..."
              sleep $CHECK_INTERVAL
              ELAPSED=$((ELAPSED + CHECK_INTERVAL))
              continue
            fi

            echo "✅ src-cli does not require rebuild - CI coverage valid"
            echo "Modules that would need rebuild (if any): $MODULES"
            exit 0

          done

          echo ""
          echo "❌ Timeout: Could not verify CI coverage for this release"
          echo ""
          echo "Either:"
          echo "1. Wait for current CI to complete and re-run this release, OR"
          echo "2. Manually trigger CI: gh workflow run change-trigger.yaml"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract and validate version
        id: extract_version
        run: |
          # Determine version based on trigger type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="src-cli/$VERSION"
            echo "Manual trigger with version: $VERSION"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#src-cli/}"
            echo "Tag trigger with version: $VERSION"
          fi

          # Validate semver format (x.y.z where x, y, z are non-negative integers)
          if ! echo "$VERSION" | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' > /dev/null; then
            echo "Error: Invalid semver format: $VERSION"
            echo "Expected format: x.y.z (e.g., 1.0.0)"
            exit 1
          fi

          # Reject versions with 'v' prefix
          if echo "$VERSION" | grep -E '^v' > /dev/null; then
            echo "Error: Version should not have 'v' prefix: $VERSION"
            echo "Use x.y.z format (e.g., 1.0.0 not v1.0.0)"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "✅ Valid semver: $VERSION"

      - name: Check for existing release
        run: |
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"

          # Check if a GitHub release already exists for this tag
          # gh release view returns exit code 1 if release doesn't exist
          if gh release view "$TAG_NAME" 2>/dev/null; then
            echo ""
            echo "❌ Error: Release already exists for tag $TAG_NAME"
            echo ""
            echo "A GitHub release has already been created for this version."
            echo "If you want to create a new release:"
            echo "1. Delete the existing release: gh release delete $TAG_NAME"
            echo "2. Delete the tag: git push --delete origin $TAG_NAME"
            echo "3. Re-run this workflow"
            echo ""
            echo "Or increment the version number for a new release."
            exit 1
          fi

          echo "✅ No existing release found for $TAG_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"

          echo "Preparing to create tag: $TAG_NAME"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch all tags from remote
          echo "Fetching existing tags..."
          git fetch --tags --force

          # Check if tag already exists (locally or remote)
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "ℹ️  Tag $TAG_NAME already exists"
            echo "Using existing tag for release"
          else
            echo "Creating new tag: $TAG_NAME"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"

            echo "Pushing tag to remote..."
            git push origin "$TAG_NAME"

            echo "✅ Created and pushed tag: $TAG_NAME"
          fi

      - name: Install UPX
        run: |
          echo "Installing UPX for binary compression..."
          sudo apt-get update && sudo apt-get install -y upx-ucl
          upx --version

      - name: Build binaries for multiple platforms
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          echo "Building src-cli with version $VERSION using build command..."
          echo "Using --compressed-upx for release builds (stripped + UPX compressed)"
          go run ./src/commands build src-cli --version "$VERSION" --no-tidy --compressed-upx

      - name: Verify binaries
        run: |
          echo "Verifying built binaries..."
          ls -lh out/build/src-cli/

          # Check all required files exist (both standard and UPX-compressed)
          REQUIRED_FILES=(
            "out/build/src-cli/r2r-linux"
            "out/build/src-cli/r2r-linux-upx"
            "out/build/src-cli/r2r-darwin-amd64"
            "out/build/src-cli/r2r-darwin-amd64-upx"
            "out/build/src-cli/r2r-darwin-arm64"
            "out/build/src-cli/r2r-darwin-arm64-upx"
            "out/build/src-cli/r2r-windows.exe"
            "out/build/src-cli/r2r-windows-upx.exe"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Error: Required file missing: $file"
              exit 1
            fi
            size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
            size_mb=$(echo "scale=1; $size / 1048576" | bc)
            echo "✅ Found: $file (${size_mb} MB)"
          done

          echo ""
          echo "Testing Linux binary version (standard):"
          chmod +x out/build/src-cli/r2r-linux
          ./out/build/src-cli/r2r-linux version || true

          echo ""
          echo "Testing Linux binary version (UPX):"
          chmod +x out/build/src-cli/r2r-linux-upx
          ./out/build/src-cli/r2r-linux-upx version || true

      - name: Create release notes
        id: release_notes
        run: |
          cat << EOF > release_notes.md
          # r2r CLI ${{ steps.extract_version.outputs.version }}

          ## What's New

          Release of r2r CLI version ${{ steps.extract_version.outputs.version }}.

          ## Installation

          Download the appropriate binary for your platform. Two versions are available:

          ### Standard Binaries (Recommended)
          Smaller than debug builds (~26 MB), best compatibility:

          | Platform | Binary |
          |----------|--------|
          | Linux (AMD64) | \`r2r-linux\` |
          | macOS (Intel) | \`r2r-darwin-amd64\` |
          | macOS (Apple Silicon) | \`r2r-darwin-arm64\` |
          | Windows (AMD64) | \`r2r-windows.exe\` |

          ### UPX-Compressed Binaries (Minimal Size)
          Maximum compression (~10 MB), slightly slower startup:

          | Platform | Binary |
          |----------|--------|
          | Linux (AMD64) | \`r2r-linux-upx\` |
          | macOS (Intel) | \`r2r-darwin-amd64-upx\` |
          | macOS (Apple Silicon) | \`r2r-darwin-arm64-upx\` |
          | Windows (AMD64) | \`r2r-windows-upx.exe\` |

          > **Note**: UPX binaries may trigger antivirus false positives on Windows. Use standard binaries if you encounter issues.

          ### Quick Start

          \`\`\`bash
          # Make executable (Linux/macOS)
          chmod +x r2r-*

          # Verify installation
          ./r2r-linux version           # Linux
          ./r2r-darwin-amd64 version    # macOS Intel
          ./r2r-darwin-arm64 version    # macOS Apple Silicon
          r2r-windows.exe version       # Windows
          \`\`\`

          ## Release Information

          - **Version**: ${{ steps.extract_version.outputs.version }}
          - **Commit**: ${{ github.sha }}
          - **Tag**: ${{ steps.extract_version.outputs.tag_name }}

          ---

          🤖 Generated with [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

          cat release_notes.md

      - name: Create GitHub Release with binaries
        run: |
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"
          VERSION="${{ steps.extract_version.outputs.version }}"

          echo "Creating release for tag: $TAG_NAME with binaries"

          gh release create "$TAG_NAME" \
            --title "r2r CLI v$VERSION" \
            --notes-file release_notes.md \
            --verify-tag \
            out/build/src-cli/r2r-linux \
            out/build/src-cli/r2r-linux-upx \
            out/build/src-cli/r2r-darwin-amd64 \
            out/build/src-cli/r2r-darwin-amd64-upx \
            out/build/src-cli/r2r-darwin-arm64 \
            out/build/src-cli/r2r-darwin-arm64-upx \
            out/build/src-cli/r2r-windows.exe \
            out/build/src-cli/r2r-windows-upx.exe

          echo "✅ Release created with binaries successfully"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify release assets
        run: |
          echo "Checking uploaded assets for release..."
          gh release view ${{ steps.extract_version.outputs.tag_name }} --json assets --jq '.assets[] | .name'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"

          echo "## ✅ r2r CLI Released" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully built and published **r2r CLI v${VERSION}** to GitHub Releases." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Release Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${TAG_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Published Binaries (8 files)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Standard Binaries" >> $GITHUB_STEP_SUMMARY
          echo "Stripped symbols, best compatibility:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Binary | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|------|" >> $GITHUB_STEP_SUMMARY

          for file in out/build/src-cli/r2r-linux out/build/src-cli/r2r-darwin-amd64 out/build/src-cli/r2r-darwin-arm64 out/build/src-cli/r2r-windows.exe; do
            if [ -f "$file" ]; then
              name=$(basename "$file")
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
              size_mb=$(echo "scale=1; $size / 1048576" | bc)
              platform=""
              case "$name" in
                r2r-linux) platform="Linux AMD64" ;;
                r2r-darwin-amd64) platform="macOS Intel" ;;
                r2r-darwin-arm64) platform="macOS Apple Silicon" ;;
                r2r-windows.exe) platform="Windows AMD64" ;;
              esac
              echo "| ${platform} | \`${name}\` | ${size_mb} MB |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### UPX-Compressed Binaries" >> $GITHUB_STEP_SUMMARY
          echo "Maximum compression, slightly slower startup:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Binary | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|------|" >> $GITHUB_STEP_SUMMARY

          for file in out/build/src-cli/r2r-linux-upx out/build/src-cli/r2r-darwin-amd64-upx out/build/src-cli/r2r-darwin-arm64-upx out/build/src-cli/r2r-windows-upx.exe; do
            if [ -f "$file" ]; then
              name=$(basename "$file")
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
              size_mb=$(echo "scale=1; $size / 1048576" | bc)
              platform=""
              case "$name" in
                r2r-linux-upx) platform="Linux AMD64" ;;
                r2r-darwin-amd64-upx) platform="macOS Intel" ;;
                r2r-darwin-arm64-upx) platform="macOS Apple Silicon" ;;
                r2r-windows-upx.exe) platform="Windows AMD64" ;;
              esac
              echo "| ${platform} | \`${name}\` | ${size_mb} MB |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 [**View Release & Download Binaries**](https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME})" >> $GITHUB_STEP_SUMMARY
