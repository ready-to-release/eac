name: "ci-ext-eac (stage 1-7)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # =============================================================================
  # Build ext-eac container (downloads r2r-cli dependency for testing)
  # =============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image-name: ${{ steps.container.outputs.image-name }}
      image-tag: ${{ steps.container.outputs.image-tag }}
      short-sha: ${{ steps.container.outputs.short-sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build Container
        id: container
        uses: ./.github/actions/build-container
        with:
          module: ext-eac
          trigger-run-id: ${{ inputs.trigger_run_id }}
          commit-sha: ${{ inputs.sha || github.sha }}
          # Download r2r-cli dependency for integration testing
          no-deps: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # Run module tests (specs/unit tests if defined)
  # =============================================================================
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Test Module
        uses: ./.github/actions/test-module
        with:
          module: ext-eac
          trigger-run-id: ${{ inputs.trigger_run_id }}
          suites: unit,integration
          results-artifact-name: test-results-ext-eac

  # =============================================================================
  # Integration tests with r2r CLI and direct Docker
  # =============================================================================
  integration-test:
    name: Integration Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image from GHCR
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image-name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          echo "Pulling CI image..."
          docker pull "$IMAGE_NAME:$IMAGE_TAG"
          docker tag "$IMAGE_NAME:$IMAGE_TAG" ext-eac:ci-test
          docker images ext-eac:ci-test

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts-ext-eac
          path: out/build/

      - name: Setup r2r CLI
        run: |
          echo "Setting up r2r CLI from build artifacts..."
          cp out/build/r2r-cli/r2r-linux-amd64 ./r2r
          chmod +x ./r2r
          echo "✓ r2r-cli ready"

      - name: Test Extension via r2r CLI
        run: |
          echo "Testing eac extension through r2r CLI..."

          # Create isolated test environment
          mkdir -p /tmp/ext-eac-test
          cd /tmp/ext-eac-test
          mkdir -p .git
          cp -r $GITHUB_WORKSPACE/contracts ./contracts

          # Configure to use CI test image
          mkdir -p .r2r
          cat > .r2r/r2r-cli.yml << EOF
          extensions:
            - name: 'eac'
              image: 'ext-eac:ci-test'
              image_pull_policy: 'Never'
          EOF

          cp $GITHUB_WORKSPACE/r2r ./r2r
          chmod +x ./r2r

          echo ""
          echo "Testing 'show modules' command..."
          timeout 120 ./r2r run eac show modules

          echo ""
          echo "Testing 'extension-meta' command..."
          timeout 30 ./r2r run eac extension-meta

          echo ""
          echo "Extension tests passed"

      - name: Test Direct Docker Execution
        run: |
          echo "Testing extension directly with Docker..."

          echo ""
          echo "Test 1: Help command"
          docker run --rm -v $(pwd):/var/task ext-eac:ci-test help 2>&1 | head -20 || true

          echo ""
          echo "Test 2: Extension metadata"
          docker run --rm ext-eac:ci-test extension-meta

          echo ""
          echo "Direct Docker tests passed"

      - name: Test Summary
        if: always()
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image-name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          echo "## Integration Test: ext-eac" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "All extension tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Extension tests failed." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Tests Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Method | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| show modules | r2r CLI | List repository modules |" >> $GITHUB_STEP_SUMMARY
          echo "| extension-meta | r2r CLI | Extension metadata |" >> $GITHUB_STEP_SUMMARY
          echo "| help | Docker | Direct container execution |" >> $GITHUB_STEP_SUMMARY
          echo "| extension-meta | Docker | Direct container execution |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Tested Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`$IMAGE_NAME:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
