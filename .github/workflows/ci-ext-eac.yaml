name: "ci-ext-eac (stage 1-6)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        id: build
        run: |
          IMAGE_NAME="ghcr.io/ready-to-release/ext-eac"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "Building and pushing multi-platform image..."
          echo "Using registry-based caching for fast rebuilds"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE_NAME:ci" \
            --tag "$IMAGE_NAME:sha-$SHORT_SHA" \
            --file ./containers/ext-eac/Dockerfile \
            --cache-from type=registry,ref=$IMAGE_NAME:buildcache \
            --cache-from type=registry,ref=$IMAGE_NAME:ci \
            --cache-to type=registry,ref=$IMAGE_NAME:buildcache,mode=max \
            --provenance=true \
            --sbom=true \
            --push \
            .

          echo ""
          echo "Published images:"
          echo "  - $IMAGE_NAME:ci"
          echo "  - $IMAGE_NAME:sha-$SHORT_SHA"

          echo "image-name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "short-sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Verify pushed image
        run: |
          IMAGE_NAME="${{ steps.build.outputs.image-name }}"
          SHORT_SHA="${{ steps.build.outputs.short-sha }}"

          echo "Pulling and verifying pushed image..."
          docker pull "$IMAGE_NAME:sha-$SHORT_SHA"

          echo ""
          echo "Checking image labels..."
          docker inspect "$IMAGE_NAME:sha-$SHORT_SHA" --format='{{json .Config.Labels}}' | jq '.'

          echo ""
          echo "Testing extension metadata..."
          docker run --rm "$IMAGE_NAME:sha-$SHORT_SHA" extension-meta

      - name: Build Summary
        if: always()
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          IMAGE_NAME="ghcr.io/ready-to-release/ext-eac"

          echo "## Build: ext-eac" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "Built and pushed multi-platform container image to GitHub Container Registry." >> $GITHUB_STEP_SUMMARY
          else
            echo "Container image build failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Common Issues" >> $GITHUB_STEP_SUMMARY
            echo "- Dockerfile syntax error" >> $GITHUB_STEP_SUMMARY
            echo "- Base image pull failed" >> $GITHUB_STEP_SUMMARY
            echo "- Go compilation error" >> $GITHUB_STEP_SUMMARY
            echo "- Registry authentication failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Published Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| CI | \`${IMAGE_NAME}:ci\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${IMAGE_NAME}:sha-${SHORT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Build Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile | \`containers/ext-eac/Dockerfile\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cache | Registry-based (\`:buildcache\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| Attestations | SLSA Provenance, SBOM |" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test Extension
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image from GHCR
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          IMAGE_NAME="ghcr.io/ready-to-release/ext-eac"

          echo "Pulling CI image..."
          docker pull "$IMAGE_NAME:sha-$SHORT_SHA"
          docker tag "$IMAGE_NAME:sha-$SHORT_SHA" ext-eac:ci-test
          docker images ext-eac:ci-test

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Build r2r CLI
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"

          echo "Building r2r CLI..."
          $COMMANDS build r2r-cli

          echo ""
          echo "Copying Linux binary to workspace root..."
          cp out/build/r2r-cli/r2r-linux-amd64 ./r2r
          chmod +x ./r2r

      - name: Test Extension via r2r CLI
        run: |
          echo "Testing eac extension through r2r CLI..."

          # Create isolated test environment
          mkdir -p /tmp/ext-eac-test
          cd /tmp/ext-eac-test
          mkdir -p .git
          cp -r $GITHUB_WORKSPACE/contracts ./contracts

          # Configure to use CI test image
          mkdir -p .r2r
          cat > .r2r/r2r-cli.yml << EOF
          extensions:
            - name: 'eac'
              image: 'ext-eac:ci-test'
              image_pull_policy: 'Never'
          EOF

          cp $GITHUB_WORKSPACE/r2r ./r2r
          chmod +x ./r2r

          echo ""
          echo "Testing 'show modules' command..."
          timeout 120 ./r2r run eac show modules

          echo ""
          echo "Testing 'extension-meta' command..."
          timeout 30 ./r2r run eac extension-meta

          echo ""
          echo "Extension tests passed"

      - name: Test Direct Docker Execution
        run: |
          echo "Testing extension directly with Docker..."

          echo ""
          echo "Test 1: Help command"
          docker run --rm -v $(pwd):/var/task ext-eac:ci-test help | head -20

          echo ""
          echo "Test 2: Extension metadata"
          docker run --rm ext-eac:ci-test extension-meta

          echo ""
          echo "Direct Docker tests passed"

      - name: Test Summary
        if: always()
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "## Test: ext-eac" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "All extension tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Extension tests failed." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Tests Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Method | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| show modules | r2r CLI | List repository modules |" >> $GITHUB_STEP_SUMMARY
          echo "| extension-meta | r2r CLI | Extension metadata |" >> $GITHUB_STEP_SUMMARY
          echo "| help | Docker | Direct container execution |" >> $GITHUB_STEP_SUMMARY
          echo "| extension-meta | Docker | Direct container execution |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Tested Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/ready-to-release/ext-eac:sha-${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY
