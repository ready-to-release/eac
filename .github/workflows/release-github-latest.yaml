# Release Bundle - Creates the "Latest" GitHub release
#
# This workflow creates a GitHub release that aggregates links to all module releases.
# It becomes the "Latest" release on the repository, providing a single entry point
# to find all current module versions.
#
# Title format: "r2r (x.y.z) + eac (x.y.z)"
# Body: Table with links to all module releases

name: "release-release (stage 8+)"

on:
  push:
    tags:
      - 'release/*'
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID (passed from CI)'
        required: false
        type: string
        default: ''
      skip-ci-check:
        description: 'Skip CI verification'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  # =============================================================================
  # Approve Release
  # =============================================================================
  approve:
    name: Approve Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag_name: ${{ steps.gate.outputs.tag_name }}
      ci_sha: ${{ steps.gate.outputs.ci_sha }}
      ci_run_id: ${{ inputs.ci_run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Approve release
        id: gate
        uses: ./.github/actions/approve-release
        with:
          module: release
          version-type: calver
          skip-ci-check: ${{ inputs.ci_run_id != '' || inputs.skip-ci-check || 'false' }}
          timeout: '300'

  # =============================================================================
  # Create Release Bundle
  # =============================================================================
  release:
    name: Create Release Bundle
    needs: approve
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Gather module versions
        id: versions
        run: |
          COMMANDS="${{ steps.commands.outputs.commands-path }}"
          REPO="${{ github.repository }}"

          echo "Loading release bundle configuration..."
          BUNDLE=$($COMMANDS get release-bundle --as-json)
          echo "$BUNDLE" | jq .

          # Get title format from config
          TITLE_FORMAT=$(echo "$BUNDLE" | jq -r '.title_format')
          echo "Title format: $TITLE_FORMAT"

          # Get all GitHub releases once
          RELEASES=$(gh release list --limit 100)

          # Gather all unique module monikers from headline and categories
          ALL_MONIKERS=$(echo "$BUNDLE" | jq -r '
            ([.headline | to_entries[].value.moniker] +
             [.categories[].modules[].moniker])
            | unique | .[]
          ')

          echo ""
          echo "Gathering versions for modules:"

          # Build version map
          declare -A VERSIONS
          declare -A TAGS

          for MONIKER in $ALL_MONIKERS; do
            TAG=$(echo "$RELEASES" | grep "^${MONIKER}/" | head -1 | awk '{print $1}' || echo "")
            VERSION="${TAG#${MONIKER}/}"
            VERSIONS[$MONIKER]="$VERSION"
            TAGS[$MONIKER]="$TAG"
            echo "  $MONIKER: $VERSION"
          done

          # Build title from headline modules
          TITLE="$TITLE_FORMAT"
          for LABEL in $(echo "$BUNDLE" | jq -r '.headline | keys[]'); do
            MONIKER=$(echo "$BUNDLE" | jq -r ".headline.$LABEL.moniker")
            VERSION="${VERSIONS[$MONIKER]}"
            # Replace {label_version} placeholder
            TITLE=$(echo "$TITLE" | sed "s/{${LABEL}_version}/${VERSION}/g")
          done
          echo ""
          echo "Release title: $TITLE"
          echo "title=$TITLE" >> $GITHUB_OUTPUT

          # Build release notes dynamically from categories
          echo ""
          echo "Building release notes..."
          cat > release_notes.md << 'HEADER'
          ## Release Bundle

          This release provides links to the latest versions of all modules in the EAC ecosystem.

          HEADER

          # Process each category
          for CAT_IDX in $(echo "$BUNDLE" | jq -r '.categories | keys[]'); do
            CAT_NAME=$(echo "$BUNDLE" | jq -r ".categories[$CAT_IDX].name")
            CAT_DESC=$(echo "$BUNDLE" | jq -r ".categories[$CAT_IDX].description // empty")

            echo "### $CAT_NAME" >> release_notes.md
            echo "" >> release_notes.md
            if [ -n "$CAT_DESC" ]; then
              echo "$CAT_DESC" >> release_notes.md
              echo "" >> release_notes.md
            fi
            echo "| Module | Version | Link |" >> release_notes.md
            echo "|--------|---------|------|" >> release_notes.md

            # Process each module in category (modules have name included)
            for MOD_IDX in $(echo "$BUNDLE" | jq -r ".categories[$CAT_IDX].modules | keys[]"); do
              MONIKER=$(echo "$BUNDLE" | jq -r ".categories[$CAT_IDX].modules[$MOD_IDX].moniker")
              NAME=$(echo "$BUNDLE" | jq -r ".categories[$CAT_IDX].modules[$MOD_IDX].name")

              VERSION="${VERSIONS[$MONIKER]}"
              TAG="${TAGS[$MONIKER]}"

              if [ -n "$TAG" ]; then
                echo "| **$NAME** | \`$VERSION\` | [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG}) |" >> release_notes.md
              else
                echo "| **$NAME** | *not released* | - |" >> release_notes.md
              fi
            done
            echo "" >> release_notes.md
          done

          # Add quick install section
          cat >> release_notes.md << FOOTER

          ### Quick Install

          \`\`\`bash
          # Install r2r CLI (Linux/macOS)
          curl -fsSL https://raw.githubusercontent.com/${REPO}/main/scripts/sh/cli/install.sh | bash

          # Install r2r CLI (Windows PowerShell)
          iwr -useb https://raw.githubusercontent.com/${REPO}/main/scripts/pwsh/cli/install.ps1 | iex
          \`\`\`

          ---
          Generated with [GitHub Actions](https://github.com/${REPO}/actions/runs/${{ github.run_id }})
          FOOTER

          echo ""
          echo "Release notes:"
          cat release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        run: |
          TAG_NAME="${{ needs.approve.outputs.tag_name }}"
          TITLE="${{ steps.versions.outputs.title }}"

          echo "Creating release: $TITLE"
          echo "Tag: $TAG_NAME"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger: creating tag and release together"
            gh release create "$TAG_NAME" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}" \
              --latest
          else
            echo "Tag trigger: using existing tag"
            gh release create "$TAG_NAME" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --verify-tag \
              --latest
          fi

          echo "✅ Release created successfully"
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # Cleanup Old Releases
  # ==========================================================================
  cleanup:
    name: Cleanup Old Releases
    needs: [approve, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cleanup old releases
        uses: ./.github/actions/cleanup-pre-releases
        with:
          module: release
          keep-count: '3'

  # ==========================================================================
  # Summary
  # ==========================================================================
  summary:
    name: Summary
    needs: [approve, release, cleanup]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Commands Binary
        id: commands
        uses: ./.github/actions/setup-commands

      - name: Generate summary
        run: |
          VERSION="${{ needs.approve.outputs.version }}"
          TAG_NAME="${{ needs.approve.outputs.tag_name }}"
          APPROVE_RESULT="${{ needs.approve.result }}"
          RELEASE_RESULT="${{ needs.release.result }}"

          if [ "$APPROVE_RESULT" = "success" ] && [ "$RELEASE_RESULT" = "success" ]; then
            echo "## ✅ Release Bundle Created" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Successfully created release bundle **${VERSION}**." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This release is now marked as **Latest** on GitHub." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`${VERSION}\` (calver)" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag**: \`${TAG_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 [**View Release**](https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME})" >> $GITHUB_STEP_SUMMARY
          elif [ "$APPROVE_RESULT" = "failure" ]; then
            echo "## ❌ Release Approval Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release was not approved. Check the approve job for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Release Bundle Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release failed after approval. Check the release job for details." >> $GITHUB_STEP_SUMMARY
          fi
        env:
          GH_TOKEN: ${{ github.token }}
