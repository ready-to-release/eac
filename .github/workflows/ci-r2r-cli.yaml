name: "ci-r2r-cli (stage 1-6)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: 'Git ref to checkout'
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      trigger_run_id:
        required: false
        type: string
        description: 'Run ID of trigger workflow (for artifact download)'
        default: ''

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build Module
        uses: ./.github/actions/build-module
        with:
          module: r2r-cli
          trigger-run-id: ${{ inputs.trigger_run_id }}
          artifact-name: build-artifacts-r2r-cli
          upload-artifact: 'true'

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Test Module
        uses: ./.github/actions/test-module
        with:
          module: r2r-cli
          trigger-run-id: ${{ inputs.trigger_run_id }}
          results-artifact-name: test-results-r2r-cli
          # PRs run commit suite only; main/release branches run full suite
          suites: ${{ startsWith(inputs.ref, 'refs/pull/') && 'commit' || 'commit,acceptance' }}

      - name: Restore Executable Permissions
        run: |
          chmod +x out/build/r2r-cli/r2r-linux-amd64
          chmod +x out/build/r2r-cli/r2r-linux-arm64
          chmod +x out/build/r2r-cli/r2r-darwin-amd64
          chmod +x out/build/r2r-cli/r2r-darwin-arm64
