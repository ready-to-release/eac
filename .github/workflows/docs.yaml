name: "ci-docs (stage 1-6)"

on:
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: src/commands/go.sum

      - name: Build Module
        working-directory: ./src/commands
        run: go run . build docs

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-docs
          path: out/build/docs/**

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: src/commands/go.sum

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-docs
          path: out/build/docs

      - name: Test Module
        working-directory: ./src/commands
        run: go run . test docs

  trigger-release:
    name: Trigger Release
    needs: test
    runs-on: ubuntu-latest
    # Only trigger release on main branch
    if: github.ref == 'refs/heads/main' || inputs.ref == 'refs/heads/main'
    steps:
      - name: Trigger release workflow
        run: |
          gh workflow run release-docs.yml \
            --repo ${{ github.repository }} \
            -f ci_run_id=${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
