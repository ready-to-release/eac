# Release go-bvt-image - Container Image Release Workflow
#
# This workflow releases the Go BVT container image by retagging a CI-built image.
# It does NOT rebuild the image - it promotes the tested CI image to release tags.

name: "release-go-bvt-image (stage 7+)"

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID that triggered this release'
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/go-bvt-image

jobs:
  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find source image from CI
        id: ci_check
        run: |
          echo "Finding CI-built image to promote..."

          # If triggered by CI, find the commit SHA from that run
          if [ -n "${{ inputs.ci_run_id }}" ]; then
            echo "Looking up commit from CI run ${{ inputs.ci_run_id }}..."
            CI_SHA=$(gh run view ${{ inputs.ci_run_id }} --json headSha -q '.headSha')
            if [ -n "$CI_SHA" ]; then
              echo "Found commit SHA from CI run: $CI_SHA"
              echo "image_sha=$CI_SHA" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Otherwise find last successful CI run
          echo "Finding last successful go-bvt-image CI run..."
          LAST_SHA=$(gh run list \
            -w ci-go-bvt-image.yaml \
            -s success \
            -L 1 \
            --json headSha \
            -q '.[0].headSha // ""')

          if [ -z "$LAST_SHA" ]; then
            echo "❌ No successful CI run found"
            echo "Please run CI first: gh workflow run ci-go-bvt-image.yaml"
            exit 1
          fi

          echo "Found last successful CI at commit: $LAST_SHA"
          echo "image_sha=$LAST_SHA" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create calver tag
        id: tag
        run: |
          # Generate calver tag: go-bvt-image/YYYY.MM.DD or go-bvt-image/YYYY.MM.DD.N for multiple releases per day
          BASE_TAG="go-bvt-image/$(date -u +%Y.%m.%d)"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch all tags
          git fetch --tags --force

          # Check if base tag exists, if so append incrementing suffix
          TAG="$BASE_TAG"
          SUFFIX=1
          while git rev-parse "$TAG" >/dev/null 2>&1; do
            TAG="${BASE_TAG}.${SUFFIX}"
            SUFFIX=$((SUFFIX + 1))
          done

          # Extract version from tag (everything after the module prefix)
          VERSION="${TAG#go-bvt-image/}"

          echo "Creating tag: $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Created tag: $TAG (version: $VERSION)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag and push release versions
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          IMAGE_SHA="${{ steps.ci_check.outputs.image_sha }}"
          SHORT_SHA="${IMAGE_SHA:0:7}"

          echo "Source image commit: $IMAGE_SHA"
          echo "Release version: $VERSION"
          echo ""

          echo "Retagging CI image sha-$SHORT_SHA with release tags..."
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA"

          echo ""
          echo "✅ Published release tags:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "Source: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA"

      - name: Generate summary
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          IMAGE_SHA="${{ steps.ci_check.outputs.image_sha }}"
          SHORT_SHA="${IMAGE_SHA:0:7}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "## ✅ Go BVT Image Released" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully promoted CI-tested image to release tags in GitHub Container Registry." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Release Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Git Tag | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source Image | \`sha-${SHORT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source Commit | \`${IMAGE_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.ci_run_id }}" ]; then
            echo "| Triggered By | [CI Run #${{ inputs.ci_run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ inputs.ci_run_id }}) |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Published Container Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Full Image Reference |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|---------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${VERSION}\` | \`${IMAGE_REF}:${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`latest\` | \`${IMAGE_REF}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Image Contents" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Lightweight Alpine-based image for Go CI (~500MB):" >> $GITHUB_STEP_SUMMARY
          echo "- Go 1.24 toolchain" >> $GITHUB_STEP_SUMMARY
          echo "- Git for repository operations" >> $GITHUB_STEP_SUMMARY
          echo "- jq for JSON processing" >> $GITHUB_STEP_SUMMARY
          echo "- Build essentials (gcc, make) for CGO" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Usage in GitHub Actions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          echo "jobs:" >> $GITHUB_STEP_SUMMARY
          echo "  build:" >> $GITHUB_STEP_SUMMARY
          echo "    runs-on: ubuntu-latest" >> $GITHUB_STEP_SUMMARY
          echo "    container:" >> $GITHUB_STEP_SUMMARY
          echo "      image: ${IMAGE_REF}:${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
