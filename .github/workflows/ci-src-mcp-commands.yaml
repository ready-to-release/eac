name: "ci-src-mcp-commands (stage 1-6)"

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      ci_image:
        required: true
        type: string
        description: 'Full CI container image reference'
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      sha:
        required: false
        type: string
        description: 'Commit SHA to test'
        default: ''
      ci_image:
        required: true
        type: string
        description: 'Full CI container image reference (e.g. ghcr.io/ready-to-release/go-bvt-image:2025.11.27)'

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.ci_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build Module
        working-directory: ./src/commands
        run: go run . build src-mcp-commands

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-src-mcp-commands
          path: out/build/src-mcp-commands/**

      - name: Build Summary
        if: always()
        run: |
          echo "## Build: src-mcp-commands" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ MCP Commands server module built successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Build Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Module | \`src-mcp-commands\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CI Image | \`${{ inputs.ci_image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "out/build/src-mcp-commands" ]; then
            ARTIFACT_COUNT=$(find out/build/src-mcp-commands -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 ${ARTIFACT_COUNT} file(s) uploaded as \`build-artifacts-src-mcp-commands\`" >> $GITHUB_STEP_SUMMARY
          fi

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.ci_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-src-mcp-commands
          path: out/build/src-mcp-commands

      - name: Test Module
        working-directory: ./src/commands
        run: go run . test src-mcp-commands

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-src-mcp-commands
          path: out/test/**/src-mcp-commands/**

      - name: Test Summary
        if: always()
        run: |
          echo "## Test: src-mcp-commands" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All unit tests passed for MCP Commands server." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Module | \`src-mcp-commands\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Command | \`go run . test src-mcp-commands\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CI Image | \`${{ inputs.ci_image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### What Was Tested" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- MCP protocol handling (JSON-RPC)" >> $GITHUB_STEP_SUMMARY
          echo "- Tool registration and discovery" >> $GITHUB_STEP_SUMMARY
          echo "- Command execution through MCP" >> $GITHUB_STEP_SUMMARY
