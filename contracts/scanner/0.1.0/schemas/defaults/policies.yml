# Security Scanner Policies
# Maps component types to the scanners that should be run against them.
# Scanner IDs must match those defined in scanners.yml.

# Component type to scanner mappings
component_scanners:
  # Go modules - full security scan
  go:
    - trivy-sbom
    - trivy-vuln
    - trivy-secrets
    - semgrep

  go-feature:
    - trivy-sbom
    - trivy-vuln
    - trivy-secrets
    - semgrep

  godog:
    - trivy-secrets
    - semgrep

  # TypeScript/JavaScript - full security scan
  typescript:
    - trivy-sbom
    - trivy-vuln
    - trivy-secrets
    - semgrep

  javascript:
    - trivy-sbom
    - trivy-vuln
    - trivy-secrets
    - semgrep

  # Container images - container-focused scans
  container:
    - trivy-sbom
    - trivy-vuln
    - trivy-secrets
    - trivy-iac

  # Documentation - minimal scanning
  book:
    - trivy-secrets

  base-site:
    - trivy-secrets

  pdf-render:
    - trivy-secrets

  # Assets - secrets scanning only
  assets:
    - trivy-secrets

  # Static content - minimal or no scanning
  markdown: []
  yaml: []
  static: []

# Modules to skip during scanning
# These are typically meta-modules or supporting infrastructure
skip_modules:
  - repository

# Default scanners when no specific policy exists
default:
  - trivy-sbom
  - trivy-vuln
