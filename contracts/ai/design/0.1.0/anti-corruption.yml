version: "0.1.0"
name: "Structurizr DSL Anti-Corruption Rules"
description: "Patterns to strip from AI output to ensure clean DSL"

forbidden_prefixes:
  - "Here is"
  - "Here's"
  - "I'll"
  - "I will"
  - "Let me"
  - "Based on"
  - "The workspace"
  - "This workspace"
  - "Below is"

forbidden_contains:
  - "ready to assist"
  - "generating"
  - "workspace for you"
  - "DSL syntax"
  - "**Initialized"
  - "Structurizr DSL"

forbidden_emojis:
  - "🚀"
  - "✅"
  - "🤖"
  - "🎉"
  - "📋"
  - "🏗️"
  - "🔧"

agent_signatures: []
