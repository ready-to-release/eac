# Anti-Corruption Layer for Gherkin Specification Generation
# Version: 0.1.0
#
# This file defines patterns that must be filtered from AI-generated Gherkin specifications
# to ensure pure, structured output without conversational wrapper text.
#
# Purpose: AI agents often add initialization messages, explanations, and conversational
# wrappers around the requested output. This contract defines what to strip to get
# clean Gherkin content.

version: "0.1.0"
name: "Gherkin Specification Anti-Corruption Rules"
description: "Patterns to strip from AI output to ensure clean Gherkin specifications"

# FORBIDDEN PREFIXES
# Lines starting with these phrases are conversational wrappers and must be removed
# Apply these BEFORE the Feature: declaration is encountered
forbidden_prefixes:
  - "DEBUG INFO:"
  - "Here is"
  - "Here's"
  - "I'll"
  - "I will"
  - "I've"
  - "I'm"
  - "I can"
  - "Let me"
  - "Now I"
  - "Based on"
  - "According to"
  - "Looking at"
  - "After analyzing"
  - "After reviewing"
  - "The specification"
  - "The feature"
  - "This specification"
  - "This feature"
  - "Below is"
  - "Above is"
  - "Would you like"
  - "Should I"
  - "Can I"
  - "Shall I"

# FORBIDDEN CONTENT PATTERNS
# Lines containing these strings anywhere are noise and must be removed
forbidden_contains:
  - "ready to assist"
  - "ready to help"
  - "here to help"
  - "generating"
  - "specification for you"
  - "feature file"
  - "Gherkin syntax"
  - "**Initialized"
  - "**INITIALIZED"
  - "Loading project"
  - "I'll create"
  - "I'll generate"
  - "complete specification"
  - "enough context"
  - "Now I have"
  - "timestamp:"
  - "provider:"
  - "duration:"
  - "status:"
  - "input_length:"
  - "response_length:"

# FORBIDDEN EMOJIS
# Lines containing these emoji characters are celebration/status messages
# Gherkin specifications should not have emojis
forbidden_emojis:
  - "🚀"   # Rocket
  - "✅"   # Checkmark
  - "🤖"   # Robot
  - "🎉"   # Party
  - "✨"   # Sparkles
  - "📋"   # Clipboard
  - "📝"   # Memo
  - "💡"   # Lightbulb
  - "🔍"   # Magnifying glass
  - "⚡"   # Lightning

# MARKDOWN CODE FENCES
# AI often wraps output in markdown code blocks - remove them
code_fence_handling:
  opening_patterns:
    - "```gherkin"
    - "```feature"
    - "```"
  closing_pattern: "```"
  action: "Remove opening and closing fences, keep content between them"

# NOISE BEFORE FEATURE
# Common patterns that appear before the Feature: declaration
noise_before_feature:
  horizontal_rules:
    - "---"
    - "___"
    - "***"

  bold_announcements:
    pattern: "^\\*\\*.*\\*\\*$"
    examples:
      - "**Specification**"
      - "**Generated Feature File**"
      - "**Gherkin Specification**"

  markdown_headers:
    patterns:
      - "^#+ Specification"
      - "^#+ Feature"
      - "^#+ Gherkin"
    description: "Headers describing what follows are noise"

# CONVERSATIONAL PHRASES
# Common AI conversational patterns to remove
conversational_phrases:
  helpful_statements:
    - "I'll help you"
    - "I can help"
    - "Let me help"
    - "Happy to help"
    - "Here to help"

  transitional_phrases:
    - "Here's the"
    - "Here is the"
    - "Below is the"
    - "Above is the"
    - "Following is"

  meta_descriptions:
    - "This will"
    - "This should"
    - "This specification"
    - "The specification above"
    - "The specification below"

# AGENT-SPECIFIC SIGNATURES
# Lines indicating end of useful content
agent_signatures:
  - "Agent:"
  - "Assistant:"
  - "Claude:"
  - "---END---"

# CONTENT START DETECTION
# How to detect where actual Gherkin content begins
content_start_markers:
  primary: "Feature:"
  description: "Gherkin content always starts with 'Feature:' declaration"
  behavior: "Skip all lines before first 'Feature:' that match forbidden patterns"

# CONTENT END DETECTION
# How to detect where actual Gherkin content ends
content_end_markers:
  agent_signatures: true
  description: "Stop processing when agent signature is encountered"

# EMPTY LINE HANDLING
# Before Feature: declaration
empty_lines_before_feature:
  action: "Remove all empty lines before Feature: declaration"

# After Gherkin content
empty_lines_after_content:
  action: "Trim trailing empty lines"

# FILTERING ALGORITHM
# How stripAgentNoise() should process the output
filtering_algorithm:
  step1:
    action: "Remove markdown code fences if entire output is wrapped"
    description: "Check for opening ```gherkin and closing ```, remove both"

  step2:
    action: "Split into lines and scan for Feature: declaration"
    description: "Find the first line that starts with 'Feature:'"

  step3:
    action: "Remove all noise before Feature: declaration"
    rules:
      - "Skip lines matching forbidden_prefixes"
      - "Skip lines containing forbidden_contains"
      - "Skip lines with forbidden_emojis"
      - "Skip horizontal rules (---, ___, ***)"
      - "Skip bold announcements (**text**)"
      - "Skip empty lines"

  step4:
    action: "Keep all content from Feature: onwards"
    rules:
      - "Stop if agent_signature encountered"
      - "Keep all Gherkin structure (Feature, Background, Rule, Scenario)"

  step5:
    action: "Trim trailing whitespace and empty lines"

# SPECIAL CASES
special_cases:
  bullet_point_descriptions:
    description: "AI sometimes adds bullet points before Gherkin content"
    examples:
      - "- Feature for user authentication"
      - "- Includes login scenarios"
    action: "Remove lines starting with '- ' before Feature: declaration"

  numbered_lists:
    description: "AI sometimes numbers features or sections"
    examples:
      - "1. User Authentication Feature"
      - "2. Includes the following scenarios"
    action: "Remove lines matching '^\\d+\\.' before Feature: declaration"

# PRESERVATION RULES
# What NOT to filter (important to keep)
preserve:
  gherkin_comments:
    pattern: "^\\s*#"
    description: "Lines starting with # after Feature: are Gherkin comments"
    action: "Keep these - they are part of the specification"
    exception: "Only applies AFTER Feature: declaration is found"

  scenario_tags:
    pattern: "^\\s*@"
    description: "Lines starting with @ are Gherkin tags"
    action: "Always keep these"

  gherkin_keywords:
    keywords: ["Feature:", "Background:", "Rule:", "Scenario:", "Scenario Outline:", "Examples:", "Given", "When", "Then", "And", "But"]
    action: "Always keep lines with these keywords"

# ENFORCEMENT LOCATION
enforcement:
  implementation: "src/commands/impl/specs/create.go"
  function: "stripAgentNoise()"
  description: "Runtime filtering of AI output before writing to file"

# USAGE GUIDELINES
usage_guidelines:
  - "Apply filtering AFTER AI generation completes"
  - "Filter in order: code fences → noise before Feature → agent signatures"
  - "Preserve all Gherkin structure and formatting after Feature: declaration"
  - "Trim final output to remove trailing whitespace"

# EXAMPLES
examples:
  input_with_noise: |
    🚀 **Initialized and ready to help!**

    Here's the Gherkin specification for user authentication:

    ```gherkin
    Feature: src-cli_user-authentication
      As a user
      I want to authenticate with my credentials
      So that I can access protected features

      Rule: Valid credentials grant access

        @ov
        Scenario: User logs in successfully
          Given I have valid credentials
          When I run "r2r login"
          Then I should be authenticated
    ```

    This specification covers the basic authentication flow.

  expected_output: |
    Feature: src-cli_user-authentication
      As a user
      I want to authenticate with my credentials
      So that I can access protected features

      Rule: Valid credentials grant access

        @ov
        Scenario: User logs in successfully
          Given I have valid credentials
          When I run "r2r login"
          Then I should be authenticated

  explanation:
    removed:
      - "Emoji and bold announcement"
      - "Conversational introduction ('Here's the...')"
      - "Markdown code fences (```gherkin and ```)"
      - "Meta-description after specification"
    preserved:
      - "All Gherkin structure (Feature, Rule, Scenario)"
      - "Scenario tags (@ov)"
      - "Given/When/Then steps"
      - "Proper indentation"

# VERSION HISTORY
changelog:
  - version: "0.1.0"
    date: "2025-11-18"
    changes:
      - "Initial version for Gherkin specification generation"
      - "Based on commit-message anti-corruption patterns"
      - "Adapted for Gherkin-specific noise (code fences, etc.)"
