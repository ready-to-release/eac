version: "0.1.0"
name: "Gherkin Specification Anti-Corruption Rules"
description: "Patterns to strip from AI output to ensure clean Gherkin specifications"

forbidden_prefixes:
  - "DEBUG INFO:"
  - "Here is"
  - "Here's"
  - "I'll"
  - "I will"
  - "I've"
  - "I'm"
  - "I can"
  - "Let me"
  - "Now I"
  - "Based on"
  - "According to"
  - "Looking at"
  - "After analyzing"
  - "After reviewing"
  - "The specification"
  - "The feature"
  - "This specification"
  - "This feature"
  - "Below is"
  - "Above is"
  - "Would you like"
  - "Should I"
  - "Can I"
  - "Shall I"

forbidden_contains:
  - "ready to assist"
  - "ready to help"
  - "here to help"
  - "generating"
  - "specification for you"
  - "feature file"
  - "Gherkin syntax"
  - "**Initialized"
  - "**INITIALIZED"
  - "Loading project"
  - "I'll create"
  - "I'll generate"
  - "complete specification"
  - "enough context"
  - "Now I have"
  - "timestamp:"
  - "provider:"
  - "duration:"
  - "status:"
  - "input_length:"
  - "response_length:"

forbidden_emojis:
  - "🚀"
  - "✅"
  - "🤖"
  - "🎉"
  - "✨"
  - "📋"
  - "📝"
  - "💡"
  - "🔍"
  - "⚡"

agent_signatures:
  - "Agent:"
  - "Assistant:"
  - "Claude:"
  - "---END---"
