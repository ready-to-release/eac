forbidden_prefixes:
  - "Based on"
  - "Here is"
  - "Here's"
  - "Let me"
  - "I will"
  - "I'll"
  - "I've"
  - "I'm"
  - "I can see"
  - "Looking at"
  - "Now"
  - "You are now"
  - "The title"
  - "The corrected"
  - "The generated"
  - "The changes"
  - "After reviewing"
  - "Would you like"
  - "Should I"
  - "Can I"
  - "Shall I"
  - "According to"

forbidden_contains:
  - "ready to assist"
  - "**Initialized and ready"
  - "**INITIALIZED"
  - "Loading project context"

forbidden_emojis:
  - "🚀"
  - "✅"
  - "🤖"
  - "🎉"
  - "✨"

forbidden_patterns:
  - pattern: '^\*\*.*\*\*$'
    description: "Bold announcement lines"
  - pattern: '^```(markdown)?$'
    description: "Opening markdown code fences"
  - pattern: '^(---|___|___|\*\*\*)$'
    description: "Horizontal rules before content starts"

noise_header_keywords:
  - "summary"
  - "context"
  - "changes"
