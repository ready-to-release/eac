version: "0.1.0"
name: "Commit Message Format"
description: "Formal contract defining commit message structure and validation rules"

structure:
  - section: "top_level_heading"
    required: true
    format: "<type>(<scope>): <summary>"
    max_length: 72

  - section: "auditor_summary"
    required: true
    format: "Auditor-Summary: <One clear sentence describing the change>"

  - section: "top_level_body"
    required: true
    format: "2-4 sentences describing all changes"

  - section: "module_sections"
    required: true
    format: "<module-name> (plain text with dashes separator)"

semantic_types:
  - "feat"
  - "fix"
  - "refactor"
  - "docs"
  - "chore"
  - "test"
  - "perf"
  - "style"

subject_line_format: "<module>: <type>: <description>"

constraints:
  max_line_length: 72
  no_trailing_periods: true
  code_blocks_closed: true
  module_header_no_colons: true
  scope_required: true

markdown_rules:
  - rule: "MD041"
    description: "First line must be conventional commit format"
  - rule: "MD022"
    description: "Headers should be surrounded by blank lines"
  - rule: "MD026"
    description: "No trailing punctuation in headings"
