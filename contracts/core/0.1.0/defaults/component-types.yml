# yaml-language-server: $schema=../component-types.schema.json
# Component Types Configuration
# Defines component types for building, testing, linting, and scanning.
#
# Each component type specifies:
#   - extensions: File extensions that belong to this component type (empty for non-file-based)
#   - builders: Build tool IDs (empty = not buildable)
#   - testers: Test tool IDs (empty = not testable)
#   - linters: Lint tool IDs (empty = not lintable)
#   - scanners: Scanner categories (sbom, vuln, secrets, sast, iac)
#   - pool: Resource pool ("host" or "docker")
#   - default_root: Default root path pattern (supports {moniker} placeholder)
#   - files: Default file patterns (source, tests, config)

component-types:
  # Go component - compiles Go modules
  go:
    extensions: [".go"]
    builders: [go]
    testers: [go]
    linters: [golangci-lint]
    scanners: [sbom, vuln, secrets, sast]
    defaults:
      artifact_pattern: "{moniker}{ext}"
    files:
      source: ["**/*.go", "**/*.go.txt"]
      tests: ["**/*_test.go"]
      config: ["go.mod", "go.sum"]

  # TypeScript/JavaScript component - npm-based builds (containerized)
  typescript:
    extensions: [".ts", ".tsx"]
    builders: [npm]
    testers: [npm]
    linters: [eslint]
    scanners: [sbom, vuln, secrets, sast]
    pool: docker
    files:
      source: ["src/**/*.ts", "features/**/*.ts"]
      tests: ["**/*.test.ts"]
      config: ["package.json", "tsconfig.json", "*.config.js"]

  javascript:
    extensions: [".js", ".jsx", ".mjs", ".cjs"]
    builders: [npm]
    testers: [npm]
    linters: [eslint]
    scanners: [sbom, vuln, secrets, sast]
    pool: docker

  # Container component - Docker/Buildx builds
  dockerfile:
    extensions: []  # Dockerfile has no standard extension
    builders: [buildx]
    linters: [hadolint]
    scanners: [sbom, vuln, secrets, iac]
    build_after: [go]
    pool: docker
    files:
      source: ["Dockerfile"]

  # Book component - MkDocs documentation builds (LEGACY)
  book:
    extensions: []
    builders: [mkdocs]
    build_after: [structurizr, markdown, docs-assets, docs-drawio, docs-mermaid]
    pool: docker
    resources:
      cpus: 4

  # Docs PDF component - unified PDF documentation builds
  docs-pdf:
    extensions: []
    builders: [pdf]
    build_after: [structurizr, markdown, docs-assets, docs-drawio, docs-mermaid]
    pool: docker
    resources:
      cpus: 4
      memory: 4g
    defaults:
      theme: dark
    cache:
      key_sources: [sources.hash, config.hash, theme, container.hash]
      artifacts_cacheable: true

  # Docs Site component - unified HTML documentation builds
  docs-site:
    extensions: []
    builders: [site]
    build_after: [structurizr, markdown, docs-assets, docs-drawio, docs-mermaid]
    pool: docker
    resources:
      cpus: 4
      memory: 1g
    cache:
      key_sources: [sources.hash, config.hash, container.hash]
      artifacts_cacheable: true

  # Markdown component - documentation files
  markdown:
    extensions: [".md", ".markdown"]
    linters: [markdownlint]
    scanners: [secrets]
    files:
      source: ["**/*.md", "**/*.markdown"]

  # YAML component - configuration files
  yaml:
    extensions: [".yml", ".yaml"]
    linters: [yamllint]
    scanners: [secrets]
    files:
      source: ["**/*.yml", "**/*.yaml"]

  # GitHub Workflows component
  workflows:
    extensions: []
    linters: [actionlint]
    scanners: [secrets]
    default_root: .github/workflows
    files:
      source: ["**/*.yml", "**/*.yaml"]
      config: []

  # JSON component
  json:
    extensions: [".json"]
    linters: [jsonlint]
    scanners: [secrets]
    files:
      source: ["**/*.json"]

  # Gherkin - BDD specification files
  gherkin:
    extensions: [".feature"]
    testers: [godog]
    linters: [gherkin-lint]
    scanners: [secrets]
    files:
      source: ["**/*.feature"]

  # Structurizr - Architecture diagrams
  structurizr:
    extensions: [".dsl"]
    builders: [structurizr-render]
    linters: [structurizr-lint]
    scanners: [secrets]
    pool: docker
    requirements: [docker]
    resources:
      cpus: 2
    files:
      source: ["workspace.dsl", "**/*.dsl"]

  # Drawio component - renders .drawio.png files via drawio-tool container
  docs-drawio:
    extensions: []
    builders: [drawio-render]
    pool: docker
    requirements: [docker]
    resources:
      cpus: 1
    files:
      source: ["**/*.drawio.png"]

  # Mermaid component - renders mermaid diagrams from markdown sources
  docs-mermaid:
    extensions: []
    builders: [mermaid-render]
    pool: docker
    requirements: [docker]
    resources:
      cpus: 2
    files:
      source: []

  # Documentation assets
  docs-assets:
    extensions: [".png", ".jpg", ".jpeg", ".gif", ".svg", ".webp", ".ico"]
    files:
      source: ["**/*.png", "**/*.jpg", "**/*.svg"]

  # Repository configuration
  repository:
    extensions: []
    files:
      config: ["LICENSE", ".gitignore", ".gitattributes", "go.work", "go.work.sum"]

  # Test data/fixtures
  testdata:
    extensions: [".txt", ".go.txt"]
    files:
      source: ["**/*.txt", "**/*.go.txt"]

  # Container-bundled source code
  containercode:
    extensions: []
    linters: [shellcheck]
    scanners: [secrets]
    files:
      source: ["**/*"]

  # Gherkin Steps component
  gherkin-steps:
    extensions: [".go"]
    default_root: specs
    files:
      source: ["godog_test.go", "steps_*_test.go"]
      tests: ["*_test.go"]
      config: []

  # PowerShell component
  pwsh:
    extensions: [".ps1", ".psm1", ".psd1"]
    builders: [scripts]
    testers: [pester]
    linters: [psscriptanalyzer]
    scanners: [secrets]
    pool: docker
    files:
      source: ["**/*.ps1", "**/*.psm1"]
      tests: ["**/*.Tests.ps1"]
      config: ["**/*.psd1"]

  # Bash component
  bash:
    extensions: [".sh", ".bash"]
    builders: [scripts]
    testers: [bats]
    linters: [shellcheck]
    scanners: [secrets]
    pool: docker
    files:
      source: ["**/*.sh", "**/*.bash"]

  # Python component
  python:
    extensions: [".py"]
    builders: [python]
    testers: [pytest]
    linters: [ruff]
    scanners: [sbom, vuln, secrets, sast]
    files:
      source: ["**/*.py"]
      tests: ["tests/**/*.py", "**/*_test.py"]
      config: ["pyproject.toml", "setup.py", "requirements.txt"]

  # Rust component
  rust:
    extensions: [".rs"]
    builders: [cargo]
    testers: [cargo]
    linters: [clippy]
    scanners: [sbom, vuln, secrets, sast]
    files:
      source: ["src/**/*.rs", "**/*.rs"]
      tests: ["tests/**/*.rs"]
      config: ["Cargo.toml", "Cargo.lock"]

  # .NET component
  dotnet:
    extensions: [".cs", ".fs", ".vb"]
    builders: [dotnet]
    testers: [dotnet]
    linters: [dotnet-format]
    scanners: [sbom, vuln, secrets, sast]
    files:
      source: ["**/*.cs", "**/*.fs"]
      tests: ["**/*Tests.cs", "**/*.Tests/**/*.cs"]
      config: ["*.csproj", "*.sln", "Directory.Build.props"]

  #---------------------------------------------------------------------------
  # AI Analysis Component Types
  #---------------------------------------------------------------------------

  ai-dsl:
    extensions: [".dsl"]
    builders: [ai-dsl-analyzer]
    defaults:
      output_format: markdown
    files:
      source: ["**/*.dsl"]

  ai-specs:
    extensions: [".feature"]
    builders: [ai-specs-analyzer]
    defaults:
      output_format: markdown
    files:
      source: ["**/*.feature"]

  ai-source:
    extensions: []
    builders: [ai-source-analyzer]
    build_after: [ai-dsl, ai-specs]
    defaults:
      output_format: markdown

  ai-docs:
    extensions: [".md"]
    builders: [ai-docs-analyzer]
    defaults:
      output_format: markdown
    files:
      source: ["**/*.md"]
