# yaml-language-server: $schema=../component-types.schema.json
# Component Types Configuration
# Defines component types for building and file organization.
#
# Each component type specifies:
#   - extensions: File extensions that belong to this component type (empty for non-file-based)
#   - builder: The build handler to use (if buildable)
#   - requirements: System dependencies needed for building
#   - default_root: Default root path pattern (supports {moniker} placeholder)
#   - files: Default file patterns (source, tests, config)
#
# Note: Linting is configured separately in lint-providers.yml

component-types:
  # Go component - compiles Go modules
  go:
    extensions: [".go"]
    builder: go
    scanners: [sbom, vuln, secrets, sast]
    requirements: [go]
    defaults:
      # Default artifact pattern for Go executables
      artifact_pattern: "{moniker}{ext}"
    files:
      source: ["**/*.go", "**/*.go.txt"]
      tests: ["**/*_test.go"]
      config: ["go.mod", "go.sum"]

  # TypeScript/JavaScript component - npm-based builds (containerized)
  typescript:
    extensions: [".ts", ".tsx"]
    builder: npm
    scanners: [sbom, vuln, secrets, sast]
    requirements: [docker]
    files:
      source: ["src/**/*.ts", "features/**/*.ts"]
      tests: ["**/*.test.ts"]
      config: ["package.json", "tsconfig.json", "*.config.js"]

  javascript:
    extensions: [".js", ".jsx", ".mjs", ".cjs"]
    builder: npm
    scanners: [sbom, vuln, secrets, sast]
    requirements: [docker]

  # Container component - Docker/Buildx builds
  dockerfile:
    extensions: []  # Dockerfile has no standard extension
    builder: buildx
    scanners: [sbom, vuln, secrets, iac]
    # Dockerfiles often depend on Go binaries being built first
    build_after: [go]
    requirements: [docker]
    files:
      source: ["Dockerfile"]

  # Book component - MkDocs documentation builds (LEGACY - use base-site + site-render/pdf-render)
  # This type is maintained for backwards compatibility. New modules should use:
  #   - base-site: For preprocessing (no Docker required)
  #   - site-render: For HTML generation (depends on base-site)
  #   - pdf-render: For PDF generation (depends on base-site)
  book:
    extensions: []  # Not file-based, uses books.yml
    builder: mkdocs
    # Books depend on docs assets and diagrams being ready
    build_after: [structurizr, markdown, docs-assets]
    requirements: [docker]

  # Base site component - preprocessing only (NEW - replaces book for preprocessing)
  # Produces staged markdown content ready for MkDocs rendering.
  # No Docker required - runs in pure Go.
  # Output: staged/ (preprocessed markdown), mkdocs.yml (generated config), .manifest.json (cache metadata)
  #
  # Convention: Component name IS the book name from books.yml
  # Example: `tutorials-base: { type: base-site }` → uses book "tutorials"
  #          `base-site: { type: base-site, config: { book: site } }` → uses book "site"
  base-site:
    extensions: []  # Not file-based, uses books.yml
    builder: mkdocs-preprocess
    build_after: [structurizr, markdown, docs-assets]
    requirements: []  # No Docker - pure Go preprocessing
    defaults:
      # If component name ends with "-base", derive book from prefix
      # Otherwise, config.book must be specified or component name IS the book
      book_from_name: true
    cache:
      key_sources: [sources.hash, config.hash, assets.hash]
      artifacts_cacheable: true

  # Site render component - HTML generation (NEW)
  # Consumes base-site output, produces HTML site via MkDocs.
  # Requires Docker for site-render-tool container.
  #
  # Convention: If base-site component doesn't exist, auto-inject "{name}-base"
  # Example: `site: { type: site-render }` → auto-injects "site-base: { type: base-site }"
  site-render:
    extensions: []
    builder: site-render-tool
    build_after: [base-site]
    requirements: [docker]
    defaults:
      # Auto-inject base-site prerequisite if not declared
      inject_prerequisite: base-site
      # Auto-derive base-site dependency from naming convention
      auto_base_site: true
    cache:
      key_sources: [base-site.output_hash, container.hash]
      artifacts_cacheable: true

  # PDF render component - PDF generation (NEW)
  # Consumes base-site output, produces PDF via MkDocs with Playwright.
  # Requires Docker for pdf-render-tool container (with Chromium).
  #
  # Convention: If base-site component doesn't exist, auto-inject "{name}-base"
  # Example: `tutorials: { type: pdf-render }` → auto-injects "tutorials-base: { type: base-site }", theme=dark
  pdf-render:
    extensions: []
    builder: pdf-render-tool
    build_after: [base-site]
    requirements: [docker]
    resources:
      cpus: 4      # Weight for scheduler
      memory: 8g   # For Playwright
    defaults:
      # Auto-inject base-site prerequisite if not declared
      inject_prerequisite: base-site
      # Auto-derive base-site dependency from naming convention
      auto_base_site: true
      theme: dark  # Default theme for PDF generation
    cache:
      key_sources: [base-site.output_hash, theme, container.hash]
      artifacts_cacheable: true

  # Markdown component - documentation files
  markdown:
    extensions: [".md", ".markdown"]
    files:
      source: ["**/*.md", "**/*.markdown"]

  # YAML component - configuration files
  yaml:
    extensions: [".yml", ".yaml"]
    files:
      source: ["**/*.yml", "**/*.yaml"]

  # GitHub Workflows component - GitHub Actions workflows and reusable actions
  workflows:
    extensions: []  # Uses .yml/.yaml but in specific paths
    default_root: .github/workflows
    requirements: []
    files:
      source: ["**/*.yml", "**/*.yaml"]
      config: []

  # JSON component - data and configuration files
  json:
    extensions: [".json"]
    files:
      source: ["**/*.json"]

  # Gherkin - BDD specification files (.feature)
  gherkin:
    extensions: [".feature"]
    files:
      source: ["**/*.feature"]

  # Structurizr - Architecture diagrams in Structurizr DSL (.dsl)
  structurizr:
    extensions: [".dsl"]
    # Phase-specific tool configuration
    tools:
      build:
        default: structurizr-cli
      lint:
        default: structurizr-cli
      scan:
        secrets: trivy-secrets
        default: [secrets]  # DSL files only need secrets scanning
    scanners: [secrets]
    requirements: [docker]
    files:
      source: ["workspace.dsl", "**/*.dsl"]

  # Documentation assets - images, diagrams, and other binary assets
  docs-assets:
    extensions: [".png", ".jpg", ".jpeg", ".gif", ".svg", ".webp", ".ico"]
    files:
      source: ["**/*.png", "**/*.jpg", "**/*.svg"]

  # Repository configuration - root-level config files without extensions
  repository:
    extensions: []
    files:
      config: ["LICENSE", ".gitignore", ".gitattributes", "go.work", "go.work.sum"]

  # Test data/fixtures - sample files used by tests
  testdata:
    extensions: [".txt", ".go.txt"]
    files:
      source: ["**/*.txt", "**/*.go.txt"]

  # Gherkin Steps component - Co-located BDD step implementations
  # For Go: godog_test.go and steps_*_test.go files
  # For TypeScript: cucumber step definitions in features/ directory
  # Bindings for test runners like godog (Go) and cucumber-js (TypeScript)
  gherkin-steps:
    extensions: [".go"]
    requirements: [go]
    default_root: specs
    files:
      source: ["godog_test.go", "steps_*_test.go"]
      tests: ["*_test.go"]
      config: []

  # PowerShell component - PowerShell 7.4+ scripts (.ps1, .psm1, .psd1)
  # Runs in container for cross-platform consistency
  pwsh:
    extensions: [".ps1", ".psm1", ".psd1"]
    scanners: [secrets]
    requirements: [docker]
    files:
      source: ["**/*.ps1", "**/*.psm1"]
      tests: ["**/*.Tests.ps1"]
      config: ["**/*.psd1"]

  # Bash component - POSIX-compatible shell scripts (.sh)
  # Runs in container for cross-platform consistency (no host bash required)
  bash:
    extensions: [".sh", ".bash"]
    scanners: [secrets]
    requirements: [docker]
    files:
      source: ["**/*.sh", "**/*.bash"]

  # Python component - Python modules and packages
  python:
    extensions: [".py"]
    builder: python
    scanners: [sbom, vuln, secrets, sast]
    requirements: [python]
    files:
      source: ["**/*.py"]
      tests: ["tests/**/*.py", "**/*_test.py"]
      config: ["pyproject.toml", "setup.py", "requirements.txt"]

  # Rust component - Cargo-based Rust projects
  rust:
    extensions: [".rs"]
    builder: cargo
    scanners: [sbom, vuln, secrets, sast]
    requirements: [cargo]
    files:
      source: ["src/**/*.rs", "**/*.rs"]
      tests: ["tests/**/*.rs"]
      config: ["Cargo.toml", "Cargo.lock"]

  # .NET component - C#/F#/VB.NET projects
  dotnet:
    extensions: [".cs", ".fs", ".vb"]
    builder: dotnet
    scanners: [sbom, vuln, secrets, sast]
    requirements: [dotnet]
    files:
      source: ["**/*.cs", "**/*.fs"]
      tests: ["**/*Tests.cs", "**/*.Tests/**/*.cs"]
      config: ["*.csproj", "*.sln", "Directory.Build.props"]
