# Timeout Configuration - Default Values
# yaml-language-server: $schema=../timeouts.schema.json
#
# Override these values in .eac/timeouts.yml for repository-specific settings.
# All values use Go duration syntax: 500ms, 5s, 2m, 1h, 24h

# Docker and container operations
docker:
  query: 5s             # Quick daemon queries (info, ping)
  image_pull: 5m        # Image pull from registry
  image_build: 30m      # Image build with Dockerfile
  container_start: 60s  # Container startup
  container_stop: 5s    # Graceful stop timeout
  container_exec: 30m   # Container execution (scans, builds)
  validation: 30s       # Validation operations

# HTTP and network operations
http:
  request: 30s    # Standard HTTP requests
  download: 5m    # File downloads
  dial: 10s       # Connection establishment
  idle: 60s       # Idle connection timeout

# File system operations
filesystem:
  lock_acquire: 30s     # File lock acquisition
  stale_lock: 5m        # Stale lock cleanup threshold
  watch_debounce: 500ms # File watcher debounce

# CI/Pipeline operations
ci:
  dispatch_settle: 2s     # Wait after workflow dispatch
  poll_interval: 10s      # Status polling interval
  workflow_completion: 5m # Default completion timeout
  recent_run_window: 2h   # Recent run detection window

# Long-running operations
long_operations:
  security_scan: 30m    # Security scan timeout
  build: 30m            # Build operation timeout
  test: 30m             # Test execution timeout
  evidence_max_age: 24h # Evidence validity period
  worker_timeout: 5m    # Kill workers that hang (fail fast)

# TUI and interactive operations
tui:
  auto_scroll_resume: 8s  # Resume auto-scroll after user scroll
  exit_countdown: 10s     # Auto-exit countdown
  port_reservation: 30s   # Port reservation TTL

# Resource scheduling
scheduling:
  capacity_recalc: 2s  # Capacity recalculation interval
