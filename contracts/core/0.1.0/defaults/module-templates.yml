# Module Templates - Reusable module structures
#
# Templates define common module patterns that can be instantiated with
# the "template" field in module definitions. Parameters are substituted
# using {placeholder} syntax.
#
# Available parameters (automatically provided):
#   {moniker}   - Module moniker
#   {owner}     - Repository owner (from repository.remote.owner)
#
# Custom parameters can be provided via the "parameters" field in modules.
# Common custom parameters:
#   {go_root}   - Go module root (auto-inferred from "go" component if present)
#
# Usage in .eac/repository.yml:
#   - moniker: my-container
#     name: My Container
#     template: container-template
#
#   - moniker: my-lib
#     name: My Library
#     template: go-library-template
#     parameters:
#       go_root: go/my-lib

module-templates:
  # ==========================================================================
  # GO MODULE TEMPLATES
  # ==========================================================================

  # Base Go library module (internal/supporting)
  # Use for: shared libraries, core modules, internal utilities
  go-library-template:
    versioning:
      scheme: Implicit
      release_type: none
    components:
      go: "{go_root}"
      markdown: "{go_root}"
      # Convention-based components (auto-inferred if directory exists):
      # - gherkin: specs/{moniker}
      # - structurizr: specs/{moniker}/.design
      # - gherkin-steps: {go_root}/specs (if godog_test.go exists)

  # Go CLI tool (published)
  # Use for: command-line tools with releases
  # Use artifact_matrix parameter to reference cross-platform or cross-platform-upx
  go-cli-template:
    versioning:
      scheme: SemVer
      changelog: "release/{moniker}/CHANGELOG.md"
      release_type: published
    components:
      go: "{go_root}"
      markdown: "{go_root}"
      # Convention-based components auto-discovered

  # Go internal CLI (not externally released)
  # Use for: internal tools, development utilities
  go-internal-template:
    versioning:
      scheme: SemVer
      changelog: "{go_root}/CHANGELOG.md"
      release_type: internal
    components:
      go: "{go_root}"
      markdown: "{go_root}"

  # Go MCP server module
  # Use for: MCP (Model Context Protocol) servers
  go-mcp-server-template:
    versioning:
      scheme: SemVer
      changelog: "{go_root}/CHANGELOG.md"
      release_type: internal
    components:
      go:
        root: "{go_root}"
        build:
          artifacts:
            - id: mcp-server
              type: executable
              pattern: "{moniker}{ext}"
      markdown: "{go_root}"

  # ==========================================================================
  # CONTAINER TEMPLATES
  # ==========================================================================

  # Standard container (pushed to GHCR)
  # Use for: tool containers, build containers
  # Auto-discovers testdata and containercode components from file patterns
  container-template:
    components:
      dockerfile:
        root: "containers/{moniker}"
        docker_build:
          container: "{moniker}"
          context: "containers/{moniker}"
          dockerfile: "containers/{moniker}/Dockerfile"
          platforms:
            - linux/amd64
          tags:
            - "ghcr.io/{owner}/{moniker}:latest"
            - "ghcr.io/{owner}/{moniker}:sha-{short_sha}"
          push: true
          registry: ghcr.io
          cache:
            type: gha
      markdown: "containers/{moniker}"
      yaml: "containers/{moniker}"
      # Auto-discovered components (if matching files exist):
      # - testdata: when *.txt, *.conf, *.html, *.sh files exist
      # - containercode: when *.py, *.js files exist

  # Container with multi-arch support
  # Use for: containers that need to run on both amd64 and arm64
  container-multiarch-template:
    components:
      dockerfile:
        root: "containers/{moniker}"
        docker_build:
          container: "{moniker}"
          context: "."
          dockerfile: "containers/{moniker}/Dockerfile"
          platforms:
            - linux/amd64
            - linux/arm64
          tags:
            - "ghcr.io/{owner}/{moniker}:ci"
            - "ghcr.io/{owner}/{moniker}:sha-{short_sha}"
          push: true
          registry: ghcr.io
          cache:
            type: registry
            from: "ghcr.io/{owner}/{moniker}:buildcache"
            to: "ghcr.io/{owner}/{moniker}:buildcache"
            mode: max
          sbom: true
          provenance: true
      markdown: "containers/{moniker}"

  # ==========================================================================
  # DOCUMENTATION TEMPLATES
  # ==========================================================================

  # Documentation site module (MkDocs-based)
  # Use for: main documentation sites
  docs-site-template:
    versioning:
      scheme: CalVer
      release_type: published
    components:
      site:
        type: docs-site
        root: docs
        config:
          book: site
      markdown: docs
      yaml:
        root: docs
        patterns:
          source:
            - "**/.nav.yml"
            - mkdocs.yml
      assets:
        type: docs-assets
        root: docs/assets
    # PDF books auto-inferred from books.yml generators

  # ==========================================================================
  # EXTENSION TEMPLATES
  # ==========================================================================

  # VSCode extension module
  # Use for: Visual Studio Code extensions
  vscode-extension-template:
    versioning:
      scheme: Implicit
      release_type: internal
    components:
      typescript:
        root: "typescript/{moniker}"
        patterns:
          source: ["**/*.ts", "**/*.tsx", "**/*.js"]
          tests: ["test/**/*.test.ts"]
          config: ["*.json", ".mocharc.json", ".vscodeignore"]
      markdown: "typescript/{moniker}"
      json: "contracts/{moniker}"

# =============================================================================
# Artifact Matrices
# =============================================================================
# Reusable artifact configurations that can be referenced by modules.
# Use artifact_matrix parameter to reference these in module definitions.

artifact-matrices:
  # Standard cross-platform CLI build matrix
  # Produces binaries for Linux (amd64/arm64), macOS (amd64/arm64), Windows (amd64)
  cross-platform:
    - {id: linux-amd64, type: executable, pattern: "{moniker}-linux-amd64"}
    - {id: linux-arm64, type: executable, pattern: "{moniker}-linux-arm64"}
    - {id: darwin-amd64, type: executable, pattern: "{moniker}-darwin-amd64"}
    - {id: darwin-arm64, type: executable, pattern: "{moniker}-darwin-arm64"}
    - {id: windows-amd64, type: executable, pattern: "{moniker}-windows-amd64.exe"}

  # Cross-platform with UPX-compressed variants
  # Extends cross-platform with compressed binaries for reduced size
  cross-platform-upx:
    extends: cross-platform
    additional:
      - {id: linux-amd64-upx, type: executable, pattern: "{moniker}-linux-amd64-upx", compression: upx, derive_from: "{moniker}-linux-amd64"}
      - {id: windows-amd64-upx, type: executable, pattern: "{moniker}-windows-amd64-upx.exe", compression: upx, derive_from: "{moniker}-windows-amd64.exe"}

  # Single platform binary (for internal tools)
  # Uses {ext} placeholder for platform-appropriate extension
  single-platform:
    - {id: "{moniker}", type: executable, pattern: "{moniker}{ext}"}

# =============================================================================
# Discovery Conventions
# =============================================================================
# Rules for auto-discovering components based on filesystem patterns

conventions:
  component_discovery:
    # Gherkin specs: look in specs/{moniker}/
    gherkin:
      path_pattern: "specs/{moniker}"
      required_file: "specification.feature"

    # Structurizr designs: look in specs/{moniker}/.design/
    structurizr:
      path_pattern: "specs/{moniker}/.design"
      required_file: "workspace.dsl"

    # Gherkin steps: infer from code component location
    # - go component at X -> steps at X/specs (godog runner)
    # - typescript component at X -> steps at X/features (cucumber-js runner)
    # - no code component -> steps at go/eac/specs/{moniker}
    gherkin_steps:
      derive_from_components:
        go: "specs"
        typescript: "features"
      fallback_pattern: "go/eac/specs/{moniker}"
      required_file: "godog_test.go"

    # Markdown: derive from primary component (go, typescript, etc.)
    markdown:
      derive_from:
        - go
        - typescript
        - dockerfile

    # Container auxiliary components (auto-discovered for container templates)
    # testdata: *.txt, *.conf, *.html, *.sh files
    # containercode: *.py, *.js files
