# yaml-language-server: $schema=../blueprints.schema.json
#
# Blueprints - Component kinds and artifact matrices
#
# Sections:
#   1. component-kinds: Tool bindings, default patterns, resources per component type
#   2. artifact-matrices: Reusable artifact build configurations
#
# Component kinds define the building blocks: what tools (build/lint/test/scan)
# are attached to each component type, and what file patterns they own by default.
# A component declaring `type: go` inherits all defaults from the `go` kind.
#
# All components must be explicitly declared in repository.yml.
#         build:
#           binary_name: my-service

# =============================================================================
# Component Kinds
# =============================================================================
# The building blocks. Each kind defines:
#   - extensions: file extensions owned
#   - builders/testers/linters/scanners: tool bindings (0-4 tool types)
#   - files: default source/tests/config patterns
#   - pool: host or docker
#   - resources: cpu/memory hints
#   - build_after: intra-module ordering
#
# A component in repository.yml with `type: go` inherits ALL defaults
# from the `go` kind. Only declare what you need to override.

component-kinds:
  go:
    extensions: [".go"]
    source_prefixes: [go, src]
    builders: [go]
    testers: [go]
    linters: [golangci-lint]
    scanners: [sbom, vuln, secrets, sast]
    bdd_runner: godog
    defaults:
      artifact_pattern: "{moniker}{ext}"
    files:
      source: ["**/*.go", "**/*.go.txt", "**/*.json", "**/README.md"]
      tests: ["**/*_test.go"]
      config: ["go.mod", "go.sum"]
      data: ["**/testdata/**", "CHANGELOG.md"]

  typescript:
    extensions: [".ts", ".tsx"]
    source_prefixes: [typescript, src]
    builders: [npm]
    testers: [npm]
    linters: [eslint]
    scanners: [sbom, vuln, secrets, sast]
    bdd_runner: cucumberjs
    pool: docker
    files:
      source: ["src/**/*.ts", "features/**/*.ts"]
      tests: ["**/*.test.ts"]
      config: ["package.json", "tsconfig.json", "*.config.js", "cucumber.js", ".mocharc.json", ".vscodeignore"]
      data: ["CHANGELOG.md", "README.md"]

  javascript:
    extensions: [".js", ".jsx", ".mjs", ".cjs"]
    builders: [npm]
    testers: [npm]
    linters: [eslint]
    scanners: [sbom, vuln, secrets, sast]
    pool: docker

  container:
    extensions: [".py", ".sh", ".js", ".conf", ".txt", ".html"]
    source_prefixes: [containers]
    builders: [buildx]
    linters: [hadolint]
    scanners: [sbom, vuln, secrets, iac]
    build_after: [go]
    default_root: containers/{moniker}
    pool: docker
    files:
      source: ["**/*"]
      config: ["Dockerfile"]
    docker_build_defaults:
      container: "{moniker}"
      context: "containers/{moniker}"
      dockerfile: "containers/{moniker}/Dockerfile"
      platforms: [linux/amd64]
      tags:
        - "ghcr.io/{owner}/{moniker}:latest"
        - "ghcr.io/{owner}/{moniker}:sha-{short_sha}"
      push: true
      registry: ghcr.io
      cache:
        type: gha

  assets:
    extensions: [".md", ".markdown", ".yml", ".yaml", ".json", ".ebnf", ".txt", ".go.txt", ".png", ".jpg", ".jpeg", ".gif", ".svg", ".webp", ".ico"]
    source_prefixes: [go, src, typescript, scripts]
    component_group: doc-assets
    scanners: [secrets]
    files:
      source: ["**/*"]

  # Container assets - non-Dockerfile support files in container directories.
  # Scripts, configs, templates, vendored packages, etc.
  container-assets:
    extensions: []
    scanners: [secrets]
    default_root: containers/{moniker}
    files:
      source: ["**/*"]

  docs-assets:
    extensions: []
    component_group: doc-assets
    scanners: [secrets]
    default_root: docs
    files:
      source:
        - "**/*.md"
        - "**/*.markdown"
        - "**/.nav.yml"
        - "mkdocs.yml"
        - "assets/**/*.drawio.png"
        - "assets/**/*.png"
        - "assets/**/*.jpg"
        - "assets/**/*.svg"
        - "assets/**/*.css"
        - "assets/**/*.scss"
        - "assets/**/*.js"
        - "assets/**/*.pdf"
        - "assets/**/*.drawio"
        - "assets/*.json"
        - "assets/*.yml"
        - "LICENSE"
        - "LICENSE.*"

  gherkin:
    extensions: [".feature"]
    testers: [godog]
    linters: [gherkin-lint]
    scanners: [secrets]
    files:
      source: ["**/*.feature"]

  structurizr:
    extensions: [".dsl"]
    source_prefixes: [specs]
    component_group: doc-assets
    builders: [structurizr-render]
    linters: [structurizr-lint]
    scanners: [secrets]
    pool: docker
    requirements: [docker]
    resources:
      cpus: 2
    files:
      source: ["workspace.dsl", "**/*.dsl"]

  godog:
    extensions: [".go"]
    default_root: specs
    runner_search_dirs: [".", "specs"]
    files:
      source: ["godog_test.go", "steps_*_test.go"]
      tests: ["*_test.go"]
      config: []

  cucumberjs:
    extensions: [".ts", ".js"]
    default_root: features
    files:
      source: ["**/*.steps.ts", "**/*.steps.js", "cucumber.config.*"]
      tests: ["**/*.steps.ts"]
      config: ["cucumber.config.ts", "cucumber.config.js"]

  behave:
    extensions: [".py"]
    default_root: features
    files:
      source: ["**/*.py", "features/**/*.py"]
      tests: ["features/**/*.py"]
      config: ["pyproject.toml"]

  reqnroll:
    extensions: [".cs"]
    default_root: specs
    files:
      source: ["**/*.cs"]
      tests: ["**/*.cs"]
      config: ["*.csproj"]

  workflows:
    extensions: []
    linters: [actionlint]
    scanners: [secrets]
    default_root: .github/workflows
    files:
      source: ["**/*.yml", "**/*.yaml"]
      config: []

  docs-markdown-commands:
    extensions: []
    component_group: doc-assets
    builders: [markdown-commands]
    pool: host
    resources:
      cpus: 1

  book:
    extensions: []
    builders: [mkdocs]
    depends_on: [doc-assets]
    build_after: [structurizr, assets, docs-assets, docs-drawio, docs-mermaid, docs-plantuml, docs-markdown-commands]
    pool: docker
    resources:
      cpus: 4

  docs-pdf:
    extensions: []
    builders: [pdf]
    depends_on: [doc-assets]
    build_after: [structurizr, assets, docs-assets, docs-drawio, docs-mermaid, docs-plantuml, docs-markdown-commands]
    pool: docker
    resources:
      cpus: 4
      memory: 4g
    defaults:
      book_from_name: true
      theme: dark
    cache:
      key_sources: [sources.hash, config.hash, theme, container.hash]
      artifacts_cacheable: true

  docs-site:
    extensions: []
    builders: [site]
    depends_on: [doc-assets]
    build_after: [structurizr, assets, docs-assets, docs-drawio, docs-mermaid, docs-plantuml, docs-markdown-commands]
    default_root: docs
    pool: docker
    resources:
      cpus: 4
      memory: 1g
    defaults:
      book_from_name: true
    cache:
      key_sources: [sources.hash, config.hash, container.hash]
      artifacts_cacheable: true

  docs-drawio:
    extensions: []
    component_group: doc-assets
    builders: [drawio-render]
    default_root: docs/assets
    pool: docker
    requirements: [docker]
    resources:
      cpus: 1
    files:
      source: ["**/*.drawio.png"]

  docs-mermaid:
    extensions: []
    component_group: doc-assets
    builders: [mermaid-render]
    default_root: docs
    pool: docker
    requirements: [docker]
    resources:
      cpus: 2
    files:
      source: ["**/*.md"]

  docs-plantuml:
    extensions: []
    component_group: doc-assets
    builders: [plantuml-render]
    pool: docker
    requirements: [docker]
    resources:
      cpus: 2
    files:
      source: ["**/*.md"]

  repository:
    extensions: []
    default_root: /
    files:
      config: ["LICENSE", ".gitignore", ".gitattributes", "go.work", "go.work.sum"]

  templates:
    extensions: []
    builders: [templates-install]
    scanners: [secrets]
    files:
      source:
        - "**/*.md"
        - "**/*.yml"
        - "**/*.yaml"
        - "**/*.json"
        - "**/*.feature"
        - "**/*.template"
        - "**/*.dsl"
        - "test-repositories/**/*"

  pwsh:
    extensions: [".ps1", ".psm1", ".psd1"]
    source_prefixes: [scripts]
    builders: [scripts]
    testers: [pester]
    linters: [psscriptanalyzer]
    scanners: [secrets]
    pool: docker
    files:
      source: ["**/*.ps1", "**/*.psm1"]
      tests: ["**/*.Tests.ps1"]
      config: ["**/*.psd1"]

  bash:
    extensions: [".sh", ".bash"]
    source_prefixes: [scripts]
    builders: [scripts]
    testers: [bats]
    linters: [shellcheck]
    scanners: [secrets]
    pool: docker
    files:
      source: ["**/*.sh", "**/*.bash"]

  python:
    extensions: [".py"]
    builders: [python]
    testers: [pytest]
    linters: [ruff]
    scanners: [sbom, vuln, secrets, sast]
    bdd_runner: behave
    files:
      source: ["**/*.py"]
      tests: ["tests/**/*.py", "**/*_test.py"]
      config: ["pyproject.toml", "setup.py", "requirements.txt"]

  rust:
    extensions: [".rs"]
    builders: [cargo]
    testers: [cargo]
    linters: [clippy]
    scanners: [sbom, vuln, secrets, sast]
    files:
      source: ["src/**/*.rs", "**/*.rs"]
      tests: ["tests/**/*.rs"]
      config: ["Cargo.toml", "Cargo.lock"]

  dotnet:
    extensions: [".cs", ".fs", ".vb"]
    builders: [dotnet]
    testers: [dotnet]
    linters: [dotnet-format]
    scanners: [sbom, vuln, secrets, sast]
    bdd_runner: reqnroll
    files:
      source: ["**/*.cs", "**/*.fs"]
      tests: ["**/*Tests.cs", "**/*.Tests/**/*.cs"]
      config: ["*.csproj", "*.sln", "Directory.Build.props"]

  ai-dsl:
    extensions: [".dsl"]
    builders: [ai-dsl-analyzer]
    defaults:
      output_format: markdown
    files:
      source: ["**/*.dsl"]

  ai-specs:
    extensions: [".feature"]
    builders: [ai-specs-analyzer]
    defaults:
      output_format: markdown
    files:
      source: ["**/*.feature"]

  ai-source:
    extensions: []
    builders: [ai-source-analyzer]
    build_after: [ai-dsl, ai-specs]
    defaults:
      output_format: markdown

  ai-docs:
    extensions: [".md"]
    builders: [ai-docs-analyzer]
    defaults:
      output_format: markdown
    files:
      source: ["**/*.md"]

# =============================================================================
# Artifact Matrices
# =============================================================================
# Reusable artifact configurations that can be referenced by modules.
# Use artifact_matrix parameter to reference these in module definitions.

artifact-matrices:
  # Standard cross-platform CLI build matrix
  # Produces binaries for Linux (amd64/arm64), macOS (amd64/arm64), Windows (amd64)
  cross-platform:
    - {id: linux-amd64, type: executable, pattern: "{binary_name}-linux-amd64"}
    - {id: linux-arm64, type: executable, pattern: "{binary_name}-linux-arm64"}
    - {id: darwin-amd64, type: executable, pattern: "{binary_name}-darwin-amd64"}
    - {id: darwin-arm64, type: executable, pattern: "{binary_name}-darwin-arm64"}
    - {id: windows-amd64, type: executable, pattern: "{binary_name}-windows-amd64.exe"}

  # Cross-platform with UPX-compressed variants
  # Extends cross-platform with compressed binaries for reduced size
  cross-platform-upx:
    extends: cross-platform
    additional:
      - {id: linux-amd64-upx, type: executable, pattern: "{binary_name}-linux-amd64-upx", compression: upx, derive_from: "{binary_name}-linux-amd64"}
      - {id: windows-amd64-upx, type: executable, pattern: "{binary_name}-windows-amd64-upx.exe", compression: upx, derive_from: "{binary_name}-windows-amd64.exe"}

  # Single platform binary (for internal tools)
  # Uses {ext} placeholder for platform-appropriate extension
  single-platform:
    - {id: "{moniker}", type: executable, pattern: "{moniker}{ext}"}
