# Built-in module types
# Merged with .r2r/eac/module-types.yml (user types override these)
#
# Capabilities drive both system dependency resolution and handler dispatch:
#   - System deps: capability_requirements in system-dependencies.yml
#   - Handlers: dispatch rules in handlers.yml match on capability

types:
  # Go module type - unified type for all Go modules
  # Behavior is driven by per-module artifact definitions in repository.yml:
  #   - No artifacts: library (compile-only verification)
  #   - executable artifacts: builds binaries for specified platforms
  #   - test artifacts: runs tests and captures results
  - name: go
    description: "Go module"
    capabilities: [go_module]
    defaults:
      files:
        source: ["**/*.go", "**/*.go.txt"]
        tests: ["**/*_test.go"]
        config: ["go.mod", "go.sum"]
        changelog: CHANGELOG.md
      repo:
        specs: ["{specs_root}/{moniker}/**"]
        test_impl: "{test_impl_root}/{moniker}"
        design: "{specs_root}/{moniker}/.design"

  # Container module type - unified type for all Docker-based modules
  # Behavior is driven by per-module docker_build config:
  #   - Uses buildx handler for multi-platform builds with docker_build config
  #   - Requires docker and buildx system dependencies
  - name: container
    description: "Docker container module (behavior driven by per-module docker_build config)"
    capabilities: [buildx]
    defaults:
      files:
        source: ["Dockerfile"]
        assets: ["Dockerfile"]
      repo:
        specs: ["{specs_root}/{moniker}/**"]
        test_impl: "{test_impl_root}/{moniker}"
        design: "{specs_root}/{moniker}/.design"

  # TypeScript module type - for npm/TypeScript projects
  - name: typescript
    description: "TypeScript/npm module"
    capabilities: [npm_package, typescript]
    defaults:
      files:
        source: ["src/**/*.ts", "features/**/*.ts"]
        tests: ["**/*.test.ts"]
        config: ["package.json", "tsconfig.json", "*.config.js"]
        changelog: CHANGELOG.md
      repo:
        specs: ["{specs_root}/{moniker}/**"]
        test_impl: "{test_impl_root}/{moniker}"
        design: "{specs_root}/{moniker}/.design"

  # Static module type - for modules with no build step (config, scripts, docs, etc.)
  - name: static
    description: "Static files module (no build step, file ownership only)"
    capabilities: []
    defaults:
      files:
        changelog: CHANGELOG.md
      repo:
        specs: ["{specs_root}/{moniker}/**"]
        test_impl: "{test_impl_root}/{moniker}"
        design: "{specs_root}/{moniker}/.design"
