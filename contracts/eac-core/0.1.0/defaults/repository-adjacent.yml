# Type-specific defaults for adjacent/supporting repository architecture
# Merged on top of base repository.yml defaults when repository.type = "adjacent"
#
# Merge order: base defaults → type-specific defaults → user config
# User values always win over these defaults.
#
# Adjacent repos are supporting repositories that complement a main codebase:
# - Documentation repositories
# - Tool/utility repositories
# - Configuration/infrastructure repositories
# - Shared library repositories

repository:
  # Adjacent repos often have simpler, documentation-focused changes
  # that may take slightly longer to review
  max_branch_age_days: 3

  pr:
    # Adjacent repos can use regular merge to preserve history,
    # which is often valuable for documentation and tool evolution
    merge_strategy: merge
    delete_branch_on_merge: true

  # Adjacent repos have flexible versioning - they may use SemVer
  # for tools or CalVer for documentation releases
  versioning:
    constraint: unrestricted
