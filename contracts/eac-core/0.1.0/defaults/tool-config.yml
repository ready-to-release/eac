# Tool Configuration - Default Tool Definitions
# yaml-language-server: $schema=../tool-config.schema.json
#
# Naming: Use the actual tool name. Only add suffix for variations of same base tool.
# Examples: go, docker, golangci-lint, trivy-vuln, trivy-sbom (variations)

#---------------------------------------------------------------------------
# Base Image Versions (for container builds)
#---------------------------------------------------------------------------
base_images:
  python: "3.12"
  node: "25"
  alpine: "3.20"
  nginx: "alpine"

tools:
  #---------------------------------------------------------------------------
  # Bootstrap Tools (required system dependencies)
  #---------------------------------------------------------------------------
  go:
    description: "Go compiler and toolchain"
    type: system
    binary: go
    verify:
      command: "go version"
      pattern: "go version go(\\d+\\.\\d+)"
    version: ">=1.21"

  docker:
    description: "Container runtime"
    type: system
    binary: docker
    verify:
      command: "docker info"
      pattern: "Server Version: (\\d+\\.\\d+)"
    version: ">=20.10"

  #---------------------------------------------------------------------------
  # System Tools
  #---------------------------------------------------------------------------
  git:
    description: "Version control"
    type: system
    binary: git
    verify:
      command: "git --version"
      pattern: "git version (\\d+\\.\\d+)"
    version: ">=2.0"

  buildx:
    description: "Docker buildx for multi-platform builds"
    type: system
    binary: docker
    args: ["buildx", "build"]
    verify:
      command: "docker buildx version"
      pattern: "github.com/docker/buildx v(\\d+\\.\\d+)"
    version: ">=0.10"
    resources:
      cpus: 4
    requirements: [docker]

  npm:
    description: "Node.js package manager"
    type: system
    binary: npm
    verify:
      command: "node --version"
      pattern: "v(\\d+\\.\\d+)"
    version: ">=18.0"

  npm-build:
    description: "NPM build (runs 'npm run build')"
    type: system
    binary: npm
    args: ["run", "build"]
    verify:
      command: "node --version"
      pattern: "v(\\d+\\.\\d+)"
    version: ">=18.0"
    requirements: [npm]

  gh:
    description: "GitHub CLI"
    type: system
    binary: gh
    verify:
      command: "gh --version"
      pattern: "gh version (\\d+\\.\\d+)"
    version: ">=2.0"

  python:
    description: "Python interpreter"
    type: system
    binary: python
    verify:
      command: "python --version"
      pattern: "Python (\\d+\\.\\d+)"
    version: ">=3.8"

  cargo:
    description: "Rust package manager"
    type: system
    binary: cargo
    verify:
      command: "cargo --version"
      pattern: "cargo (\\d+\\.\\d+)"
    version: ">=1.70"

  dotnet:
    description: ".NET SDK"
    type: system
    binary: dotnet
    verify:
      command: "dotnet --version"
      pattern: "(\\d+\\.\\d+)"
    version: ">=8.0"

  bash:
    description: "Bash shell"
    type: system
    binary: bash
    verify:
      command: "bash --version"
      pattern: "version (\\d+\\.\\d+)"
    version: ">=4.0"

  pwsh:
    description: "PowerShell"
    type: system
    binary: pwsh
    platforms: [windows, linux, darwin]
    verify:
      command: "pwsh --version"
      pattern: "PowerShell (\\d+\\.\\d+)"
    version: ">=7.0"

  curl:
    description: "HTTP client"
    type: system
    binary: curl
    verify:
      command: "curl --version"
      pattern: "curl (\\d+\\.\\d+)"
    version: ">=7.0"

  mkdocs:
    description: "Documentation generator"
    type: system
    binary: mkdocs
    verify:
      command: "mkdocs --version"
      pattern: "mkdocs, version (\\d+\\.\\d+)"
    version: ">=1.5"

  gh-token:
    description: "GitHub credentials"
    type: system
    binary: ""
    verify:
      env_vars: [GITHUB_TOKEN, GITHUB_USERNAME]
      require: "all"

  #---------------------------------------------------------------------------
  # Linters (container-based for reproducibility)
  #---------------------------------------------------------------------------
  golangci-lint:
    description: "Go linter aggregator"
    type: container
    image: golangci/golangci-lint
    tag: "v1.62.2"
    command: ["golangci-lint", "run", "--out-format=json"]
    mounts:
      - source: "{module}"
        target: /app
      - source: "{workspace}/.cache/golangci-lint"
        target: /root/.cache/golangci-lint
    workdir: /app
    resources:
      cpus: 2
    requirements: [docker]

  eslint:
    description: "JavaScript/TypeScript linter"
    type: container
    image: node
    tag: "22-alpine"
    entrypoint: ["npx"]
    command: ["eslint", "--format=json", "."]
    mounts:
      - source: "{module}"
        target: /app
    workdir: /app
    resources:
      cpus: 2
    requirements: [docker]

  ruff:
    description: "Python linter"
    type: container
    image: ghcr.io/astral-sh/ruff
    tag: "0.8.6"
    command: ["check", "."]
    mounts:
      - source: "{module}"
        target: /app
    workdir: /app
    requirements: [docker]

  clippy:
    description: "Rust linter"
    type: container
    image: rust
    tag: "1.84.0"
    command: ["cargo", "clippy", "--", "-D", "warnings"]
    mounts:
      - source: "{module}"
        target: /app
    workdir: /app
    requirements: [docker]

  markdownlint:
    description: "Markdown linter"
    type: container
    image: davidanson/markdownlint-cli2
    tag: "v0.17.2"
    mounts:
      - source: "{module}"
        target: /workdir
    workdir: /workdir
    requirements: [docker]

  #---------------------------------------------------------------------------
  # Test Runners
  #---------------------------------------------------------------------------
  pytest:
    description: "Python test runner"
    type: container
    image: python
    tag: "3.12-slim"
    command: ["python", "-m", "pytest"]
    mounts:
      - source: "{module}"
        target: /app
    workdir: /app
    requirements: [docker]

  pester:
    description: "PowerShell test runner"
    type: container
    image: mcr.microsoft.com/powershell
    tag: "7.4-alpine-3.20"
    command: ["pwsh", "-NoLogo", "-NoProfile", "-Command", "Invoke-Pester -EnableExit"]
    mounts:
      - source: "{module}"
        target: /scripts
      - source: "{workspace}"
        target: /workspace
    workdir: /scripts
    resources:
      cpus: 1
      memory: "2g"
    requirements: [docker]

  #---------------------------------------------------------------------------
  # Documentation Tools (variations for different modes)
  #---------------------------------------------------------------------------
  mkdocs-build:
    description: "MkDocs build"
    type: container
    localPath: containers/mkdocs-site
    resources:
      cpus: 4
      memory: "4g"
    command: ["sh", "-c", "mkdocs build --strict --site-dir /output/site 2>&1 | tee /tmp/mkdocs.log; if grep -q 'Aborted' /tmp/mkdocs.log; then exit 1; fi"]
    mounts:
      - source: "{workspace}"
        target: /workspace
      - source: "{output}"
        target: /output
    workdir: /docs
    requirements: [docker]

  mkdocs-live:
    description: "MkDocs live server"
    type: container
    image: squidfunk/mkdocs-material
    tag: "9.5.49"
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    mounts:
      - source: "{module}"
        target: /docs
    workdir: /docs
    requirements: [docker]
    serve:
      container_port: 8000
      host_port_range: "9000-9999"
      restart_policy: unless-stopped
      auto_open_browser: true
      watch_enabled: true
      watch_paths: ["docs/", "mkdocs.yml"]

  #---------------------------------------------------------------------------
  # Diagram Tools
  #---------------------------------------------------------------------------
  drawio:
    description: "DrawIO CLI"
    type: container
    localPath: containers/drawio-cli
    command: ["python", "/app/drawio_cli.py"]
    mounts:
      - source: "{workspace}"
        target: /docs
    workdir: /docs
    requirements: [docker]

  plantuml:
    description: "PlantUML renderer"
    type: container
    image: plantuml/plantuml
    tag: "1.2024.8"
    mounts:
      - source: "{output}"
        target: /data
    requirements: [docker]

  #---------------------------------------------------------------------------
  # Architecture Tools (variations for different modes)
  #---------------------------------------------------------------------------
  structurizr-cli:
    description: "Structurizr CLI for export/validation"
    type: container
    image: structurizr/cli
    tag: "2024.12.18"
    mounts:
      - source: "{workspace}"
        target: /workspace
    workdir: /workspace
    requirements: [docker]

  structurizr-lite:
    description: "Structurizr diagram server"
    type: container
    image: structurizr/lite
    tag: "2024.12.18"
    mounts:
      - source: "{content}"
        target: /usr/local/structurizr
    requirements: [docker]
    serve:
      container_port: 8080
      host_port_range: "9000-9999"
      restart_policy: unless-stopped
      auto_open_browser: true

  #---------------------------------------------------------------------------
  # Servers
  #---------------------------------------------------------------------------
  static-site:
    description: "Static site server (nginx)"
    type: container
    localPath: containers/static-site
    mounts:
      - source: "{content}"
        target: /usr/share/nginx/html
        readonly: true
    requirements: [docker]
    serve:
      container_port: 8000
      host_port_range: "9000-9999"
      restart_policy: unless-stopped
      auto_open_browser: true

  #---------------------------------------------------------------------------
  # Security Scanners (trivy variations for different scan types)
  #---------------------------------------------------------------------------
  trivy-sbom:
    description: "SBOM generator"
    type: container
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command: ["fs", "--scanners", "vuln", "--format", "cyclonedx", "--list-all-pkgs", "--quiet", "/scan"]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  trivy-vuln:
    description: "Vulnerability scanner"
    type: container
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command: ["fs", "--scanners", "vuln", "--format", "json", "--quiet", "/scan"]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  trivy-secrets:
    description: "Secrets scanner"
    type: container
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command: ["fs", "--scanners", "secret", "--format", "json", "--quiet", "/scan"]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  trivy-iac:
    description: "IaC scanner"
    type: container
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command: ["fs", "--scanners", "misconfig", "--format", "json", "--quiet", "/scan"]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  trivy-compliance:
    description: "Compliance scanner"
    type: container
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command: ["fs", "--compliance", "all", "--format", "json", "--quiet", "/scan"]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  semgrep:
    description: "SAST scanner"
    type: container
    image: semgrep/semgrep
    tag: "1.145.1"
    command: ["semgrep", "scan", "--config", "auto", "--json", "/src"]
    mounts:
      - source: "{module}"
        target: /src
        readonly: true
    output_format: json
    requirements: [docker]

  zap:
    description: "DAST scanner"
    type: container
    image: zaproxy/zap-stable
    tag: "2.14.0"
    command: ["zap-baseline.py", "-t", "{target_url}", "-J", "report.json"]
    mounts:
      - source: "{output}"
        target: /zap/wrk
    output_format: json
    requirements: [docker]

#---------------------------------------------------------------------------
# Component-to-Tool Assignments
#---------------------------------------------------------------------------
component-tools:
  go:
    builder: go
    linter: golangci-lint
    tester: go
    scanners: [trivy-sbom, trivy-vuln, trivy-secrets, semgrep]

  typescript:
    builder: npm-build
    linter: eslint
    tester: npm
    scanners: [trivy-sbom, trivy-vuln, trivy-secrets]

  javascript:
    builder: npm
    linter: eslint
    tester: npm
    scanners: [trivy-sbom, trivy-vuln, trivy-secrets]

  python:
    builder: python
    linter: ruff
    tester: pytest
    scanners: [trivy-sbom, trivy-vuln, trivy-secrets, semgrep]

  rust:
    builder: cargo
    linter: clippy
    tester: cargo
    scanners: [trivy-sbom, trivy-vuln, trivy-secrets, semgrep]

  dotnet:
    builder: dotnet
    linter: dotnet
    tester: dotnet
    scanners: [trivy-sbom, trivy-vuln, trivy-secrets, semgrep]

  dockerfile:
    builder: buildx
    scanners: [trivy-sbom, trivy-vuln, trivy-iac]

  book:
    builder: mkdocs-build
    server: static-site
    servers: [static-site, mkdocs-live]

  design:
    server: structurizr-lite

  markdown:
    linter: markdownlint

  pwsh:
    builder: pwsh
    tester: pester

  bash:
    builder: bash

#---------------------------------------------------------------------------
# Environment Overrides
#---------------------------------------------------------------------------
environments:
  ci:
    description: "CI - containers for reproducibility"
    component-tools:
      book:
        builder: mkdocs-build

  local:
    description: "Local - system tools for speed"

#---------------------------------------------------------------------------
# Caches
#---------------------------------------------------------------------------
caches:
  go:
    path: ".cache/go"
    description: "Go module cache"

  go-build:
    path: ".cache/go-build"
    description: "Go build cache"

  npm:
    path: ".cache/npm"
    description: "NPM cache"

  lint:
    path: ".cache/lint"
    description: "Linter caches"
