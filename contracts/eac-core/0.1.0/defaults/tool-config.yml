# Tool Configuration - Default Tool Definitions
# yaml-language-server: $schema=../tool-config.schema.json
#
# This file defines the pluggable tool composition system.
# Tools can be system binaries or containers, assigned to component types for operations.
#
# Naming conventions:
# - Base dependencies: simple names (go, docker) - used in @deps: test tags
# - System operation tools: clean names (e.g., go-test, npm-build)
# - Container tools: simple names with purpose (e.g., go-lint, npm-build)
# - Multiple tools for same purpose: add "-<purpose>" suffix (e.g., mkdocs-build, mkdocs-live)
#
# Key concepts:
# - Tools: Executable definitions (system binary or container)
# - Component-tools: Maps component types to tools for each operation
# - Environments: Override tool assignments per environment (ci, local)
# - Resources: CPU/memory limits for containers; cpus value used as scheduling weight

#---------------------------------------------------------------------------
# Base Image Versions
# Pinned versions for reproducible Docker builds.
# These are passed as ARG values when building Dockerfiles locally.
#---------------------------------------------------------------------------
base_images:
  python: "3.12"
  python-slim: "3.14"
  python-alpine: "3.14"
  node: "25"
  node-slim: "25"
  alpine: "3.20"
  nginx: "alpine"

tools:
  #---------------------------------------------------------------------------
  # Base Dependencies (simple names for @deps: tag references in tests)
  # These are the only tools verified as system requirements.
  #---------------------------------------------------------------------------
  go:
    description: "Go programming language compiler and toolchain"
    type: system
    binary: go
    verify:
      command: "go version"
      pattern: "go version go(\\d+\\.\\d+)"
    version: ">=1.21"

  docker:
    description: "Container runtime for building and running containers"
    type: system
    binary: docker
    verify:
      command: "docker info"
      pattern: "Server Version: (\\d+\\.\\d+)"
    version: ">=20.10"

  git:
    description: "Distributed version control system"
    type: system
    binary: git
    verify:
      command: "git --version"
      pattern: "git version (\\d+\\.\\d+)"
    version: ">=2.0"

  #---------------------------------------------------------------------------
  # System Operation Tools
  # These tools use the base dependencies above.
  #---------------------------------------------------------------------------
  buildx:
    description: "Docker buildx for multi-platform container image builds"
    type: system
    binary: docker
    args: ["buildx", "build"]
    verify:
      command: "docker buildx version"
      pattern: "github.com/docker/buildx v(\\d+\\.\\d+)"
    version: ">=0.10"
    resources:
      cpus: 4
    requirements: [docker]

  npm:
    description: "Node.js runtime providing npm package manager"
    type: system
    binary: npm
    verify:
      command: "node --version"
      pattern: "v(\\d+\\.\\d+)"
    version: ">=18.0"

  gh-cli:
    description: "GitHub command-line interface"
    type: system
    binary: gh
    verify:
      command: "gh --version"
      pattern: "gh version (\\d+\\.\\d+)"
    version: ">=2.0"

  bash:
    description: "Bourne Again SHell for running shell scripts"
    type: system
    binary: bash
    verify:
      command: "bash --version"
      pattern: "version (\\d+\\.\\d+)"
    version: ">=4.0"

  pwsh:
    description: "PowerShell 7+ cross-platform shell"
    type: system
    binary: pwsh
    platforms: [windows, linux, darwin]
    verify:
      command: "pwsh --version"
      pattern: "PowerShell (\\d+\\.\\d+)"
    version: ">=7.0"

  curl:
    description: "Command-line tool for transferring data with URLs"
    type: system
    binary: curl
    verify:
      command: "curl --version"
      pattern: "curl (\\d+\\.\\d+)"
    version: ">=7.0"

  python-runtime:
    description: "Python programming language interpreter"
    type: system
    binary: python
    verify:
      command: "python --version"
      pattern: "Python (\\d+\\.\\d+)"
    version: ">=3.8"

  cargo:
    description: "Rust package manager and build tool"
    type: system
    binary: cargo
    verify:
      command: "cargo --version"
      pattern: "cargo (\\d+\\.\\d+)"
    version: ">=1.70"

  dotnet-runtime:
    description: ".NET SDK for building and running .NET applications"
    type: system
    binary: dotnet
    verify:
      command: "dotnet --version"
      pattern: "(\\d+\\.\\d+)"
    version: ">=8.0"

  mkdocs:
    description: "Documentation site generator"
    type: system
    binary: mkdocs
    verify:
      command: "mkdocs --version"
      pattern: "mkdocs, version (\\d+\\.\\d+)"
    version: ">=1.5"

  gh-token:
    description: "GitHub authentication credentials for registry access"
    type: system
    binary: ""
    verify:
      env_vars:
        - GITHUB_TOKEN
        - GITHUB_USERNAME
      require: "all"

  #---------------------------------------------------------------------------
  # Go System Tools
  #---------------------------------------------------------------------------
  go-lint:
    description: "golangci-lint linter (system)"
    type: system
    binary: golangci-lint
    resources:
      cpus: 2
    verify:
      command: "golangci-lint --version"
      pattern: "golangci-lint has version (\\d+\\.\\d+)"
    version: ">=1.50"

  go-test:
    description: "System Go test runner"
    type: system
    binary: go
    resources:
      cpus: 1
    args: ["test"]
    requirements: [go]

  #---------------------------------------------------------------------------
  # TypeScript/JavaScript Tools
  #---------------------------------------------------------------------------
  npm-build:
    description: "NPM build command (system)"
    type: system
    binary: npm
    resources:
      cpus: 2
    args: ["run", "build"]
    requirements: [npm]

  npm-test:
    description: "NPM test command (system)"
    type: system
    binary: npm
    resources:
      cpus: 2
    args: ["test"]
    requirements: [npm]

  #---------------------------------------------------------------------------
  # Python Tools
  #---------------------------------------------------------------------------
  python-build:
    description: "Python build using pip/setuptools (system)"
    type: system
    binary: python
    args: ["-m", "pip", "install", "-e", "."]
    requirements: [python-runtime]

  python-test:
    description: "Python test runner (system)"
    type: system
    binary: python
    args: ["-m", "pytest"]
    requirements: [python-runtime]

  #---------------------------------------------------------------------------
  # Python Container Tools
  #---------------------------------------------------------------------------
  python-lint:
    description: "Ruff Python linter (container)"
    type: container
    image: ghcr.io/astral-sh/ruff
    tag: "0.8.6"
    command: ["check", "."]
    mounts:
      - source: "{module}"
        target: /app
    workdir: /app
    requirements: [docker]

  #---------------------------------------------------------------------------
  # Rust System Tools
  #---------------------------------------------------------------------------
  rust-build:
    description: "Cargo build for Rust projects (system)"
    type: system
    binary: cargo
    args: ["build", "--release"]
    requirements: [cargo]

  rust-test:
    description: "Cargo test runner for Rust (system)"
    type: system
    binary: cargo
    args: ["test"]
    requirements: [cargo]

  #---------------------------------------------------------------------------
  # Rust Container Tools
  #---------------------------------------------------------------------------
  rust-lint:
    description: "Clippy Rust linter (container)"
    type: container
    image: rust
    tag: "1.84.0"
    command: ["cargo", "clippy", "--", "-D", "warnings"]
    mounts:
      - source: "{module}"
        target: /app
    workdir: /app
    requirements: [docker]

  #---------------------------------------------------------------------------
  # .NET System Tools
  #---------------------------------------------------------------------------
  dotnet-build:
    description: ".NET build command (system)"
    type: system
    binary: dotnet
    args: ["build", "--configuration", "Release"]
    requirements: [dotnet-runtime]

  dotnet-test:
    description: ".NET test runner (system)"
    type: system
    binary: dotnet
    args: ["test"]
    requirements: [dotnet-runtime]

  dotnet-lint:
    description: ".NET code formatter/linter (system)"
    type: system
    binary: dotnet
    args: ["format", "--verify-no-changes"]
    requirements: [dotnet-runtime]

  #---------------------------------------------------------------------------
  # Markdown Container Tools
  #---------------------------------------------------------------------------
  markdown-lint:
    description: "Markdown linter (container)"
    type: container
    image: davidanson/markdownlint-cli2
    tag: "v0.17.2"
    mounts:
      - source: "{module}"
        target: /workdir
    workdir: /workdir
    requirements: [docker]

  #---------------------------------------------------------------------------
  # Documentation Container Tools
  #---------------------------------------------------------------------------
  mkdocs-build:
    description: "MkDocs Material container for building docs"
    type: container
    localPath: containers/mkdocs-site
    resources:
      cpus: 4
      memory: "4g"
    # HACK: mkdocs --strict returns exit code 0 even when it aborts due to warnings.
    # This is a known bug: https://github.com/mkdocs/mkdocs/issues/3842 (open as of 1.6.1)
    # Workaround: capture output and check for "Aborted" string, return exit 1 if found.
    command: ["sh", "-c", "mkdocs build --strict --site-dir /output/site 2>&1 | tee /tmp/mkdocs.log; if grep -q 'Aborted' /tmp/mkdocs.log; then exit 1; fi"]
    mounts:
      - source: "{workspace}"
        target: /workspace
      - source: "{output}"
        target: /output
    workdir: /docs
    requirements: [docker]

  mkdocs-live:
    description: "MkDocs live reload server"
    type: container
    image: squidfunk/mkdocs-material
    tag: "9.5.49"
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    mounts:
      - source: "{module}"
        target: /docs
    workdir: /docs
    requirements: [docker]
    serve:
      container_port: 8000
      host_port_range: "9000-9999"
      restart_policy: unless-stopped
      auto_open_browser: true
      watch_enabled: true
      watch_paths: ["docs/", "mkdocs.yml"]

  #---------------------------------------------------------------------------
  # Diagram Container Tools
  #---------------------------------------------------------------------------
  drawio:
    description: "DrawIO CLI for diagram manipulation"
    type: container
    localPath: containers/drawio-cli
    command: ["python", "/app/drawio_cli.py"]
    mounts:
      - source: "{workspace}"
        target: /docs
    workdir: /docs
    requirements: [docker]

  #---------------------------------------------------------------------------
  # Architecture/Design Container Tools
  #---------------------------------------------------------------------------
  structurizr-cli:
    description: "Structurizr CLI for DSL export and validation"
    type: container
    image: structurizr/cli
    tag: "2024.12.18"
    mounts:
      - source: "{workspace}"
        target: /workspace
    workdir: /workspace
    requirements: [docker]

  structurizr-lite:
    description: "Structurizr Lite for architecture diagram viewing"
    type: container
    image: structurizr/lite
    tag: "2024.12.18"
    mounts:
      - source: "{content}"
        target: /usr/local/structurizr
    requirements: [docker]
    serve:
      container_port: 8080
      host_port_range: "9000-9999"
      restart_policy: unless-stopped
      auto_open_browser: true

  plantuml:
    description: "PlantUML diagram renderer"
    type: container
    image: plantuml/plantuml
    tag: "1.2024.8"
    mounts:
      - source: "{output}"
        target: /data
    requirements: [docker]

  #---------------------------------------------------------------------------
  # Serve Container Tools (for local development servers)
  #---------------------------------------------------------------------------
  static-site:
    description: "Static site server (nginx-based)"
    type: container
    localPath: containers/static-site
    mounts:
      - source: "{content}"
        target: /usr/share/nginx/html
        readonly: true
    requirements: [docker]
    serve:
      container_port: 8000
      host_port_range: "9000-9999"
      restart_policy: unless-stopped
      auto_open_browser: true

  structurizr:
    description: "Structurizr Lite architecture diagram server"
    type: container
    image: structurizr/lite
    tag: "2024.12.18"
    mounts:
      - source: "{content}"
        target: /usr/local/structurizr
        readonly: true
    requirements: [docker]
    serve:
      container_port: 8080
      host_port_range: "9000-9999"
      restart_policy: unless-stopped
      auto_open_browser: true

  #---------------------------------------------------------------------------
  # Security Scanners (Container-based)
  # Images pinned to match security-tools.yml for consistency
  #---------------------------------------------------------------------------
  trivy-sbom:
    description: "Trivy SBOM generator"
    type: container
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command: ["fs", "--scanners", "vuln", "--format", "cyclonedx", "--list-all-pkgs", "--quiet", "/scan"]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  trivy-vuln:
    description: "Trivy vulnerability scanner"
    type: container
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command: ["fs", "--scanners", "vuln", "--format", "json", "--quiet", "/scan"]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  trivy-secrets:
    description: "Trivy secrets scanner"
    type: container
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command: ["fs", "--scanners", "secret", "--format", "json", "--quiet", "/scan"]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  semgrep:
    description: "Semgrep SAST scanner"
    type: container
    image: semgrep/semgrep
    tag: "1.145.1"
    command: ["semgrep", "scan", "--config", "auto", "--json", "/src"]
    mounts:
      - source: "{module}"
        target: /src
        readonly: true
    output_format: json
    requirements: [docker]

  trivy-iac:
    description: "Trivy IaC scanner for misconfigurations"
    type: container
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command: ["fs", "--scanners", "misconfig", "--format", "json", "--quiet", "/scan"]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  trivy-compliance:
    description: "Trivy compliance scanner"
    type: container
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command: ["fs", "--compliance", "all", "--format", "json", "--quiet", "/scan"]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  zap:
    description: "OWASP ZAP DAST scanner"
    type: container
    image: zaproxy/zap-stable
    tag: "2.14.0"
    command: ["zap-baseline.py", "-t", "{target_url}", "-J", "report.json"]
    mounts:
      - source: "{output}"
        target: /zap/wrk
    output_format: json
    requirements: [docker]

  #---------------------------------------------------------------------------
  # Script Container Tools
  #---------------------------------------------------------------------------
  pwsh-build:
    description: "PowerShell build/execution (container)"
    type: container
    image: mcr.microsoft.com/powershell
    tag: "7.4-alpine-3.20"
    resources:
      cpus: 1
      memory: "1g"
    entrypoint: ["pwsh", "-NoLogo", "-NoProfile"]
    mounts:
      - source: "{module}"
        target: /scripts
      - source: "{workspace}"
        target: /workspace
    workdir: /scripts
    requirements: [docker]

  pwsh-test:
    description: "PowerShell Pester test runner (container)"
    type: container
    image: mcr.microsoft.com/powershell
    tag: "7.4-alpine-3.20"
    resources:
      cpus: 1
      memory: "2g"
    command: ["pwsh", "-NoLogo", "-NoProfile", "-Command", "Invoke-Pester -EnableExit"]
    mounts:
      - source: "{module}"
        target: /scripts
      - source: "{workspace}"
        target: /workspace
    workdir: /scripts
    requirements: [docker]

  bash-runner:
    description: "Bash script execution (container)"
    type: container
    image: bash
    tag: "5.2"
    resources:
      cpus: 1
      memory: "1g"
    entrypoint: ["bash"]
    mounts:
      - source: "{module}"
        target: /scripts
      - source: "{workspace}"
        target: /workspace
    workdir: /scripts
    requirements: [docker]

#---------------------------------------------------------------------------
# Component-to-Tool Assignments
# Maps component types (from component-types.yml) to tools for each operation
#---------------------------------------------------------------------------
component-tools:
  go:
    builder: go
    linter: go-lint
    tester: go-test
    scanners:
      - trivy-sbom
      - trivy-vuln
      - trivy-secrets
      - semgrep

  typescript:
    builder: npm-build
    tester: npm-test
    scanners:
      - trivy-sbom
      - trivy-vuln
      - trivy-secrets

  javascript:
    builder: npm-build
    tester: npm-test
    scanners:
      - trivy-sbom
      - trivy-vuln
      - trivy-secrets

  dockerfile:
    builder: buildx
    scanners:
      - trivy-sbom
      - trivy-vuln
      - trivy-iac

  book:
    builder: mkdocs-build
    server: static-site
    servers:
      - static-site
      - mkdocs-live

  design:
    server: structurizr

  markdown:
    linter: markdown-lint

  pwsh:
    builder: pwsh-build
    tester: pwsh-test

  bash:
    builder: bash-runner

  python:
    builder: python-build
    tester: python-test
    linter: python-lint
    scanners:
      - trivy-sbom
      - trivy-vuln
      - trivy-secrets
      - semgrep

  rust:
    builder: rust-build
    tester: rust-test
    linter: rust-lint
    scanners:
      - trivy-sbom
      - trivy-vuln
      - trivy-secrets
      - semgrep

  dotnet:
    builder: dotnet-build
    tester: dotnet-test
    linter: dotnet-lint
    scanners:
      - trivy-sbom
      - trivy-vuln
      - trivy-secrets
      - semgrep

#---------------------------------------------------------------------------
# Environment Overrides
# Different tool assignments based on execution context
#---------------------------------------------------------------------------
environments:
  ci:
    description: "CI/CD environment - prefer containers for reproducibility"
    component-tools:
      book:
        builder: mkdocs-build

  local:
    description: "Local development - prefer system tools for speed"
    # Default assignments already prefer system tools

#---------------------------------------------------------------------------
# Cache Configuration
# Paths for mounted caches (improves container performance)
#---------------------------------------------------------------------------
caches:
  go_cache:
    path: ".cache/go"
    description: "Go module cache"

  go_build_cache:
    path: ".cache/go-build"
    description: "Go build cache"

  npm_cache:
    path: ".cache/npm"
    description: "NPM package cache for container builds"

  powershell_cache:
    path: ".cache/powershell"
    description: "PowerShell module cache for container builds"

  lint_cache:
    path: ".cache/lint"
    description: "Linter caches (golangci-lint, etc.)"
