# Default system dependencies
# Merged with .r2r/eac/system-dependencies.yml (user values override these)
#
# These are common development tools that most projects need.
# Projects can override versions or add project-specific deps.

dependencies:
  # OS Platform dependencies (used for @deps:linux, @deps:windows, @deps:darwin tags)
  # These filter tests by the current OS at runtime
  - moniker: linux
    name: "Linux"
    description: "Linux operating system"
    version: "any"
    verify:
      os_platform: linux

  - moniker: windows
    name: "Windows"
    description: "Windows operating system"
    version: "any"
    verify:
      os_platform: windows

  - moniker: darwin
    name: "macOS"
    description: "macOS (Darwin) operating system"
    version: "any"
    verify:
      os_platform: darwin

  # Alias for darwin (specs may use @deps:macos)
  - moniker: macos
    name: "macOS"
    description: "macOS operating system (alias for darwin)"
    version: "any"
    verify:
      os_platform: darwin

  - moniker: go
    name: "Go"
    description: "Go programming language compiler and toolchain"
    version: ">=1.21"
    verify:
      command: "go version"
      pattern: "go version go(\\d+\\.\\d+\\.\\d+)"

  - moniker: git
    name: "Git"
    description: "Distributed version control system"
    version: ">=2.30"
    verify:
      command: "git --version"
      pattern: "git version (\\d+\\.\\d+)"

  - moniker: docker
    name: "Docker"
    description: "Container runtime for building and running containers"
    version: ">=20.10"
    verify:
      command: "docker info"
      pattern: "Server Version: (\\d+\\.\\d+)"

  - moniker: buildx
    name: "Docker Buildx"
    description: "Docker buildx for multi-platform container image builds"
    version: ">=0.10"
    verify:
      command: "docker buildx version"
      pattern: "github.com/docker/buildx v(\\d+\\.\\d+)"

  - moniker: npm
    name: "Node.js"
    description: "JavaScript runtime providing npm package manager"
    version: ">=18.0"
    verify:
      command: "node --version"
      pattern: "v(\\d+\\.\\d+)"

  - moniker: gh-cli
    name: "GitHub CLI"
    description: "GitHub command-line interface"
    version: ">=2.0"
    verify:
      command: "gh --version"
      pattern: "gh version (\\d+\\.\\d+)"

  - moniker: curl
    name: "cURL"
    description: "Command-line tool for transferring data with URLs"
    version: ">=7.0"
    verify:
      command: "curl --version"
      pattern: "curl (\\d+\\.\\d+)"

# Capability to system dependency mappings
# Used by get build-deps to resolve module capabilities to actual deps
capability_requirements:
  go_module: [go]
  buildx: [docker, buildx]
  npm_package: [npm]
  typescript: [npm]
  documentation: [docker]
  container: [docker]
