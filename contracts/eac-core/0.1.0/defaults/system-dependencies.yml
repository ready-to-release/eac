# Default system dependencies
# Merged with .r2r/eac/system-dependencies.yml (user values override these)
#
# These are common development tools that most projects need.
# Projects can override versions or add project-specific deps.
#
# Phase markers indicate when a dependency is needed:
#   - command: Required for running CLI commands (runtime dependency)
#   - build: Required for building modules
#   - test: Required for running tests
#   - scan: Required for security scanning
#   - lint: Required for linting/static analysis

dependencies:
  # OS Platform dependencies (used for @deps:linux, @deps:windows, @deps:darwin tags)
  # These filter tests by the current OS at runtime
  - moniker: linux
    name: "Linux"
    description: "Linux operating system"
    version: "any"
    verify:
      os_platform: linux

  - moniker: windows
    name: "Windows"
    description: "Windows operating system"
    version: "any"
    verify:
      os_platform: windows

  - moniker: darwin
    name: "macOS"
    description: "macOS (Darwin) operating system"
    version: "any"
    verify:
      os_platform: darwin

  # Alias for darwin (specs may use @deps:macos)
  - moniker: macos
    name: "macOS"
    description: "macOS operating system (alias for darwin)"
    version: "any"
    verify:
      os_platform: darwin

  - moniker: go
    name: "Go"
    description: "Go programming language compiler and toolchain"
    version: ">=1.21"
    phases: [command, build, test, lint]
    verify:
      command: "go version"
      pattern: "go version go(\\d+\\.\\d+\\.\\d+)"

  - moniker: git
    name: "Git"
    description: "Distributed version control system"
    version: ">=2.30"
    phases: [command, build, test]
    verify:
      command: "git --version"
      pattern: "git version (\\d+\\.\\d+)"

  - moniker: docker
    name: "Docker"
    description: "Container runtime for building and running containers"
    version: ">=20.10"
    phases: [command, build, test]
    verify:
      command: "docker info"
      pattern: "Server Version: (\\d+\\.\\d+)"

  - moniker: buildx
    name: "Docker Buildx"
    description: "Docker buildx for multi-platform container image builds"
    version: ">=0.10"
    phases: [command, build]
    verify:
      command: "docker buildx version"
      pattern: "github.com/docker/buildx v(\\d+\\.\\d+)"

  - moniker: npm
    name: "Node.js"
    description: "JavaScript runtime providing npm package manager"
    version: ">=18.0"
    phases: [build, test, lint]
    verify:
      command: "node --version"
      pattern: "v(\\d+\\.\\d+)"

  - moniker: gh-cli
    name: "GitHub CLI"
    description: "GitHub command-line interface"
    version: ">=2.0"
    phases: [command, test]
    verify:
      command: "gh --version"
      pattern: "gh version (\\d+\\.\\d+)"

  - moniker: actionlint
    name: "actionlint"
    description: "Static checker for GitHub Actions workflow files"
    version: ">=1.6"
    phases: [lint]
    verify:
      command: "actionlint --version"
      pattern: "(\\d+\\.\\d+\\.\\d+)"

  - moniker: bash
    name: "Bash"
    description: "Bourne Again SHell for running shell scripts"
    version: ">=4.0"
    phases: [command, build, test]
    verify:
      command: "bash --version"
      pattern: "version (\\d+\\.\\d+)"

  - moniker: pwsh
    name: "PowerShell"
    description: "PowerShell 7+ cross-platform shell"
    version: ">=7.0"
    phases: [command, build, test]
    verify:
      command: "pwsh --version"
      pattern: "PowerShell (\\d+\\.\\d+)"

  - moniker: curl
    name: "cURL"
    description: "Command-line tool for transferring data with URLs"
    version: ">=7.0"
    phases: [test]
    verify:
      command: "curl --version"
      pattern: "curl (\\d+\\.\\d+)"

  # Environment-based dependencies (credentials, secrets, etc.)
  - moniker: gh-token
    name: "GitHub Credentials"
    description: "GitHub authentication credentials for registry access"
    version: "any"
    verify:
      env_vars:
        - GITHUB_TOKEN
        - GITHUB_USERNAME
      require: "all"

# Capability to system dependency mappings
# Used by get build-deps to resolve module capabilities to actual deps
capability_requirements:
  go_module: [go]
  buildx: [docker, buildx]
  npm_package: [npm]
  typescript: [npm]
  documentation: [docker]
  container: [docker]
