# Gherkin Specification Structure Contract
# Version: 0.1.0
# Formal specification for Gherkin feature files

version: "0.1.0"
name: "Gherkin Specification Structure"
description: "Formal contract defining Gherkin specification requirements for ATDD/BDD"

# EXTERNAL REFERENCES
# These files are loaded by the specs command to provide tag definitions
external_references:
  tags:
    path: "contracts/testing/0.1.0/tags.yml"
    description: "Test tagging system with verification types and dependencies"

  taxonomy:
    path: "contracts/testing/0.1.0/taxonomy.yml"
    description: "Testing taxonomy (L0-L4) for test environment classification"

# ATDD/BDD PRINCIPLES
principles:
  atdd:
    purpose: "Define acceptance criteria BEFORE development begins"
    question: "What does 'done' mean for this feature?"
    representation: "Rule blocks in Gherkin"
    audience: ["Product owners", "Stakeholders", "QA"]
    focus: "WHAT the system must do"
    rules:
      - "Each Rule represents one acceptance criterion"
      - "Rules must be measurable and concrete"
      - "Rules define business value and success conditions"
      - "Avoid subjective criteria (bad: 'user-friendly', good: 'creates 3 directories')"

  bdd:
    purpose: "Describe user-facing behavior through concrete examples"
    question: "How does the system behave from the user's perspective?"
    representation: "Scenario blocks under Rules"
    audience: ["Developers", "QA", "Automation engineers"]
    focus: "HOW the system behaves (observable behavior)"
    rules:
      - "Each Scenario represents one concrete example"
      - "Use Given/When/Then structure"
      - "Focus on observable behavior, not implementation"
      - "Use Ubiquitous Language (domain terms), not technical jargon"
      - "Write from user perspective"

# STRUCTURE SPECIFICATION
structure:
  - section: "feature_declaration"
    required: true
    format: "Feature: <module>_<feature-name>"
    naming_convention:
      pattern: "^[a-z][a-z0-9-]*_[a-z][a-z0-9-]*$"
      examples:
        - "src-commands_commit-ai"
        - "src-cli_init-command"
        - "src-core_repository-scanner"
    description: "Feature name MUST follow module_feature-name convention"

  - section: "feature_description"
    required: true
    format: |
      As a [role]
      I want [capability]
      So that [business value]
    description: "User story following the standard role/capability/value format"

  - section: "background"
    required: false
    format: |
      Background:
        Given [common precondition]
        And [additional setup]
    description: "Optional common setup shared across scenarios in a feature"

  - section: "rule_blocks"
    required: true
    minimum: 1
    format: "Rule: [Acceptance Criterion]"
    description: "ATDD acceptance criteria"
    guidelines:
      - "Rules should be measurable acceptance criteria"
      - "Avoid subjective statements (bad: 'user-friendly', good: 'creates 3 directories')"
      - "Each Rule groups related scenarios"

  - section: "scenarios"
    required: true
    minimum_per_rule: 1
    format: |
      Scenario: [Concrete example]
        Given [precondition]
        When [action]
        Then [outcome]
        And [additional outcome]
    description: "BDD scenarios"
    guidelines:
      - "Use Given/When/Then structure"
      - "Focus on WHAT the system does, not HOW"
      - "Use domain language (Ubiquitous Language), not technical jargon"
      - "Write from user perspective, not internal implementation"
      - "Keep scenarios independent and executable"

# TAGGING REQUIREMENTS
tagging:
  required_tags:
    verification:
      description: "EVERY scenario MUST have at least one verification tag"
      tags:
        - "@ov"   # Operational Verification (functional tests)
        - "@iv"   # Installation Verification (deployment validation)
        - "@pv"   # Performance Verification (load tests)
        - "@piv"  # Production Installation Verification
        - "@ppv"  # Production Performance Verification
      rule: "At least one verification tag is mandatory per scenario"

  optional_tags:
    test_levels:
      description: "Test environment complexity - usually inferred, rarely specified"
      tags: ["@L0", "@L1", "@L2", "@L3", "@L4"]
      defaults:
        - "Gherkin scenarios without level tag → @L2"
        - "Scenarios with @iv or @pv → @L3"
        - "Scenarios with @piv or @ppv → @L4"

    system_dependencies:
      description: "External system requirements"
      pattern: "@deps:<system>"
      examples: ["@deps:docker", "@deps:git", "@deps:go", "@deps:claude"]

    module_dependencies:
      description: "Internal module requirements"
      pattern: "@depm:<module>"
      examples: ["@depm:src-cli", "@depm:src-commands"]

    risk_control:
      description: "Link to compliance/security requirements"
      pattern: "@risk-control:<name>-<id>"
      examples: ["@risk-control:auth-mfa-01", "@risk-control:gxp-audit-trail"]

    execution_control:
      description: "Control test execution behavior"
      tags:
        - "@skip:<reason>"  # Temporarily excluded (pattern: @skip:wip, @skip:broken)
        - "@Manual"         # Manual test (cannot be automated)

  tag_inheritance:
    feature_level: "Tags applied to Feature apply to all Rules and Scenarios"
    rule_level: "Tags applied to Rule apply to all nested Scenarios"
    scenario_level: "Tags at Scenario level override Feature/Rule tags for test levels only"
    accumulation: "Dependencies and verification tags accumulate (additive)"

# FORMATTING RULES
formatting:
  indentation: 2  # 2 spaces per level
  max_line_length: 100  # Gherkin lines can be longer than commit messages
  step_keywords: ["Given", "When", "Then", "And", "But"]
  comment_prefix: "#"

# COMMON PATTERNS
common_patterns:
  functional_test:
    example: |
      @ov
      Scenario: User performs successful action
        Given a precondition exists
        When the user performs an action
        Then the expected outcome occurs

  error_handling:
    example: |
      @ov
      Scenario: User provides invalid input
        Given a precondition exists
        When the user provides invalid data
        Then an error message is displayed
        And the system state remains unchanged

  deployment_validation:
    example: |
      @iv
      Scenario: Service deploys successfully to PLTE
        Given the service package is built
        When the deployment runs
        Then the health check passes
        And monitoring shows service is running

  performance_test:
    example: |
      @pv
      Scenario: API meets SLA under load
        Given the service is deployed
        When 1000 requests per second are sent
        Then 95th percentile response time is under 200ms
        And no errors occur

  compliance_test:
    example: |
      @ov @risk-control:auth-mfa-01
      Scenario: Multi-factor authentication is enforced
        Given a user with MFA enabled
        When they attempt to login with password only
        Then access is denied
        And MFA prompt is displayed