# Version: 0.1.0

moniker: "ext-eac"
name: "EAC Extension for R2R CLI"
type: "go-r2r-extension"
description: "Docker-based extension providing EAC (Everything as Code) for R2R CLI integration"

parent: "."

source:
  root: "src/commands/ext"
  includes:
    - "*.go"
    - "go.mod"
    - "go.sum"
    - "README.md"
    - "/containers/ext-eac/Dockerfile"
    # Own the CI workflow file - triggers rebuild when ext-eac or dependencies change
    - "/.github/workflows/ci-ext-eac.yaml"
    - "/.github/workflows/release-ext-eac.yml"

depends_on:
  - "src-commands"
