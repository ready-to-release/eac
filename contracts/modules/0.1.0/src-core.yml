# Version: 0.1.0

moniker: "src-core"
name: "Core Domain Libraries"
type: "go-library"
description: "Core library containing contracts and repository operations"

source:
  root: "src/core"
  includes:
    - "go.mod"
    - "go.sum"
    - "**.go"
    - "/src/core/ai/**"
    - "/src/core/markdown/**"
    - "/src/core/module-deps/**"
    - "/src/core/environments/**"
    - "/src/.template/**"
    # Own the CI workflow file - triggers rebuild when src-core or dependencies change
    - "/.github/workflows/src-core.yaml"
  excludes:
    - "repository/tests/**"
  exclude_children_owned_source: true

parent: "."

depends_on: []

used_by:
  - "repository"
  - "src-cli"
  - "src-commands"
  - "src-mcp-commands"
  - "ext-eac"
