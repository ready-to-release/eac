# Version: 0.1.0

moniker: "github"
name: "GitHub Configuration"
type: "configuration"
description: "GitHub workflows, actions, and CI/CD configuration - owns change-trigger orchestration only"

source:
  root: ".github"
  changelog_path: ".github/CHANGELOG.md"
  includes:
    # CI configuration variables (image versions, etc.)
    - "variables/**"
  excludes:
    # All workflows are owned by their respective modules or repository module
    - "workflows/*.yaml"
    - "workflows/*.yml"

parent: "."

depends_on: []
used_by: []
