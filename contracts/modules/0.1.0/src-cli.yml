# Version: 0.1.0

moniker: "src-cli"
name: "The Cli of Cli's cli"
type: "go-cli"
description: "The extendable go-based cli tool"
deployable_unit: true

source:
  changelog_path: "src/cli/CHANGELOG.md"
  root: "src/cli"
  specs_root: "specs/src-cli"
  includes:
    - "go.sum"
    - "go.mod"
    - "**.go"
    - "*.go"
    - "r2r-cli.examples.yml"
    - "r2r.example.yml"
    - "/src/cli/r2r-example.yml"
    # Own the CI workflow file - triggers rebuild when src-cli or dependencies change
    - "/.github/workflows/ci-src-cli.yaml"
    - "/.github/workflows/release-src-cli.yml"

depends_on:
  - "src-core"
used_by: []