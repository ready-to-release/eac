# Version: 0.1.0

moniker: "repo-config"
name: "Repository Configuration"
type: "config"
description: "Root-level repository configuration files including package management, build tools, and git settings"

source:
  root: "/"
  includes:
    - "LICENSE"
    - ".gitignore"
    - ".gitattributes"
    - ".markdownlint.yml" #markdown lint rules
    - "cspell.config.yml" #global spelling rules
    - "go.work"
    - "go.work.sum"
    - "r2r-cli.yml"
    - ".r2r/agent-config.yml" #AI provider configuration (team default)

depends_on: []
