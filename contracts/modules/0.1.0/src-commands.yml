# Version: 0.1.0

moniker: "src-commands"
name: "Go library to contain .sh and .ps1 -like, directly invocable, go shell scripts"
type: "go-commands"
description: "Go library to contain shell scripts"

source:
  root: "src/commands"
  includes:
    - "go.sum"
    - "go.mod"
    - "**.go"
    - "*.go"
    - "**/README.md"
    - "**/assets/**"
    - "/specs/src-commands/**/*"

depends_on:
  - "src-core"
  - "src-core-logging"
used_by:
  - "implicit-cli-sh"
  - "implicit-cli-pwsh"
  - "ext-eac"
