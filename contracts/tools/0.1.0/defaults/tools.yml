# Tool Configuration - Namespace-based Lazy Loading
# yaml-language-server: $schema=../tool-config.schema.json
#
# Structure:
#   namespaces: Tool groupings for lazy loading
#   system-tools: Host-installed tools
#   container-tools: Docker-based tools
#   tool-bindings: Override auto resolution (auto/system/container)
#   component-tools: Map component types to tools
#   environments: Environment-specific overrides
#   caches: Cache configurations

#---------------------------------------------------------------------------
# Namespaces - Control what loads when
# Only 'bootstrap' is loaded at startup; others load on-demand
#---------------------------------------------------------------------------
namespaces:
  bootstrap: [go, docker, git]
  go: [golangci-lint, gcc, go-build, go-test-race, go-oci]
  docs: [mkdocs-build, mkdocs-live, mkdocs-dev-oci, site-render-oci, pdf-oci, mkdocs-preprocess, drawio, structurizr-cli, structurizr-lite, static-site, plantuml, markdownlint]
  node: [npm, tsc, npm-build, npm-test, eslint]
  security: [trivy-sbom, trivy-vuln, trivy-secrets, trivy-iac, trivy-compliance, semgrep, zap]

#---------------------------------------------------------------------------
# System Tools (host-installed)
#---------------------------------------------------------------------------
system-tools:
  go:
    description: "Go compiler and toolchain"
    binary: go
    verify:
      command: "go version"
      pattern: "go version go(\\d+\\.\\d+)"
    version: ">=1.21"

  docker:
    description: "Container runtime"
    binary: docker
    verify:
      command: "docker info"
      pattern: "Server Version: (\\d+\\.\\d+)"
    version: ">=20.10"

  git:
    description: "Version control"
    binary: git
    verify:
      command: "git --version"
      pattern: "git version (\\d+\\.\\d+)"
    version: ">=2.0"

  gcc:
    description: "C compiler for CGO support"
    binary: gcc
    verify:
      command: "gcc --version"
      pattern: "gcc.*?(\\d+\\.\\d+)"
    version: ">=8.0"
    platforms: [windows, linux, darwin]

  buildx:
    description: "Docker buildx for multi-platform builds"
    binary: docker
    args: ["buildx", "build"]
    verify:
      command: "docker buildx version"
      pattern: "github.com/docker/buildx v(\\d+\\.\\d+)"
    version: ">=0.10"
    resources:
      cpus: 4
    requirements: [docker]

  npm:
    description: "Node.js package manager"
    binary: npm
    verify:
      command: "node --version"
      pattern: "v(\\d+\\.\\d+)"
    version: ">=18.0"

  tsc:
    description: "TypeScript compiler"
    binary: tsc
    verify:
      command: "tsc --version"
      pattern: "Version (\\d+\\.\\d+)"
    version: ">=5.0"
    requirements: [npm]

  npm-build:
    description: "NPM build (runs 'npm run build')"
    binary: npm
    args: ["run", "build"]
    verify:
      command: "node --version"
      pattern: "v(\\d+\\.\\d+)"
    version: ">=18.0"
    requirements: [npm, tsc]

  gh:
    description: "GitHub CLI"
    binary: gh
    verify:
      command: "gh --version"
      pattern: "gh version (\\d+\\.\\d+)"
    version: ">=2.0"

  python:
    description: "Python interpreter"
    binary: python
    verify:
      command: "python --version"
      pattern: "Python (\\d+\\.\\d+)"
    version: ">=3.8"

  cargo:
    description: "Rust package manager"
    binary: cargo
    verify:
      command: "cargo --version"
      pattern: "cargo (\\d+\\.\\d+)"
    version: ">=1.70"

  dotnet:
    description: ".NET SDK"
    binary: dotnet
    verify:
      command: "dotnet --version"
      pattern: "(\\d+\\.\\d+)"
    version: ">=8.0"

  bash:
    description: "Bash shell"
    binary: bash
    verify:
      command: "bash --version"
      pattern: "version (\\d+\\.\\d+)"
    version: ">=4.0"

  pwsh:
    description: "PowerShell"
    binary: pwsh
    platforms: [windows, linux, darwin]
    verify:
      command: "pwsh --version"
      pattern: "PowerShell (\\d+\\.\\d+)"
    version: ">=7.0"

  curl:
    description: "HTTP client"
    binary: curl
    verify:
      command: "curl --version"
      pattern: "curl (\\d+\\.\\d+)"
    version: ">=7.0"

  mkdocs:
    description: "Documentation generator"
    binary: mkdocs
    verify:
      command: "mkdocs --version"
      pattern: "mkdocs, version (\\d+\\.\\d+)"
    version: ">=1.5"

  mkdocs-preprocess:
    description: "MkDocs preprocessing (native handler)"
    binary: eac

#---------------------------------------------------------------------------
# Container Tools (Docker-based)
#---------------------------------------------------------------------------
container-tools:
  # Go
  go-build:
    description: "Go build with CGO and race detection support"
    localPath: containers/cgo-tool
    command: ["go", "build", "./..."]
    mounts:
      - source: "{module}"
        target: /app
      - source: "{workspace}/.cache/go"
        target: /go/pkg
      - source: "{workspace}/.cache/go-build"
        target: /root/.cache/go-build
    workdir: /app
    environment:
      CGO_ENABLED: "1"
    resources:
      cpus: 4
    requirements: [docker]

  go-test-race:
    description: "Go test with race detector"
    localPath: containers/cgo-tool
    command: ["go", "test", "-race", "./..."]
    mounts:
      - source: "{module}"
        target: /app
      - source: "{workspace}/.cache/go"
        target: /go/pkg
      - source: "{workspace}/.cache/go-build"
        target: /root/.cache/go-build
    workdir: /app
    environment:
      CGO_ENABLED: "1"
    resources:
      cpus: 4
    requirements: [docker]

  go-oci:
    description: "Go toolchain in container (CI, CGO, cross-compilation)"
    localPath: containers/go-oci
    entrypoint: ["go"]
    # NO fixed command - args come entirely from ArgsOverrides at runtime
    mounts:
      - source: "{module}"
        target: /app
      - source: "{workspace}/.cache/go"
        target: /go/pkg
      - source: "{workspace}/.cache/go-build"
        target: /root/.cache/go-build
    workdir: /app
    environment:
      GOPROXY: "https://proxy.golang.org,direct"
    resources:
      cpus: 4
      memory: "4g"
    requirements: [docker]

  # Node.js / TypeScript
  npm-build:
    description: "NPM build in container"
    image: node
    tag: "22-alpine"
    command: ["sh", "-c", "npm install && npm run build"]
    mounts:
      - source: "{module}"
        target: /app
    workdir: /app
    requirements: [docker]

  npm-test:
    description: "NPM test in container"
    image: node
    tag: "22-alpine"
    command: ["sh", "-c", "npm install && npm test"]
    mounts:
      - source: "{module}"
        target: /app
    workdir: /app
    requirements: [docker]

  # Linters
  golangci-lint:
    description: "Go linter aggregator"
    image: golangci/golangci-lint
    tag: "v1.62.2"
    command: ["golangci-lint", "run", "--out-format=json"]
    mounts:
      - source: "{module}"
        target: /app
      - source: "{workspace}/.cache/golangci-lint"
        target: /root/.cache/golangci-lint
    workdir: /app
    resources:
      cpus: 2
    requirements: [docker]

  eslint:
    description: "JavaScript/TypeScript linter"
    image: node
    tag: "22-alpine"
    entrypoint: ["npx"]
    command: ["eslint", "--format=json", "."]
    mounts:
      - source: "{module}"
        target: /app
    workdir: /app
    resources:
      cpus: 2
    requirements: [docker]

  ruff:
    description: "Python linter"
    image: ghcr.io/astral-sh/ruff
    tag: "0.8.6"
    command: ["check", "."]
    mounts:
      - source: "{module}"
        target: /app
    workdir: /app
    requirements: [docker]

  clippy:
    description: "Rust linter"
    image: rust
    tag: "1.84.0"
    command: ["cargo", "clippy", "--", "-D", "warnings"]
    mounts:
      - source: "{module}"
        target: /app
    workdir: /app
    requirements: [docker]

  markdownlint:
    description: "Markdown linter"
    image: davidanson/markdownlint-cli2
    tag: "v0.17.2"
    mounts:
      - source: "{module}"
        target: /workdir
    workdir: /workdir
    requirements: [docker]

  # Test runners
  pytest:
    description: "Python test runner"
    image: python
    tag: "3.12-slim"
    command: ["python", "-m", "pytest"]
    mounts:
      - source: "{module}"
        target: /app
    workdir: /app
    requirements: [docker]

  pester:
    description: "PowerShell test runner"
    image: mcr.microsoft.com/powershell
    tag: "7.4-alpine-3.20"
    command:
      ["pwsh", "-NoLogo", "-NoProfile", "-Command", "Invoke-Pester -EnableExit"]
    mounts:
      - source: "{module}"
        target: /scripts
      - source: "{workspace}"
        target: /workspace
    workdir: /scripts
    resources:
      cpus: 1
      memory: "2g"
    requirements: [docker]

  # Documentation
  mkdocs-build:
    description: "MkDocs build"
    localPath: containers/site-render-oci
    resources:
      cpus: 4
      memory: "4g"
    command:
      [
        "sh",
        "-c",
        "mkdocs build --strict --site-dir /output/site 2>&1 | tee /tmp/mkdocs.log; if grep -q 'Aborted' /tmp/mkdocs.log; then exit 1; fi",
      ]
    mounts:
      - source: "{workspace}"
        target: /workspace
      - source: "{output}"
        target: /output
    workdir: /docs
    requirements: [docker]

  mkdocs-live:
    description: "MkDocs live server"
    image: squidfunk/mkdocs-material
    tag: "9.5.49"
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    mounts:
      - source: "{module}"
        target: /docs
    workdir: /docs
    requirements: [docker]
    serve:
      container_port: 8000
      host_port_range: "9000-9999"
      restart_policy: unless-stopped
      auto_open_browser: true
      watch_enabled: true
      watch_paths: ["docs/", "mkdocs.yml"]

  site-render-oci:
    description: "MkDocs site rendering from preprocessed content"
    localPath: containers/site-render-oci
    command: ["mkdocs", "build", "-f", "/output/mkdocs.yml", "--site-dir", "/output/site", "--clean"]
    mounts:
      - source: "{workspace}"
        target: /docs
      - source: "{staging}"
        target: /staging
        readonly: true
      - source: "{output}"
        target: /output
    workdir: /docs
    requirements: [docker]
    resources:
      cpus: 4
      memory: "4g"

  mkdocs-dev-oci:
    description: "MkDocs development server with polling-based live reload"
    localPath: containers/mkdocs-dev-oci
    mounts:
      - source: "{workspace}"
        target: /workspace
    workdir: /docs
    requirements: [docker]
    serve:
      container_port: 8000
      host_port_range: "9000-9999"
      restart_policy: unless-stopped
      auto_open_browser: true

  pdf-oci:
    description: "MkDocs PDF generation with Playwright"
    localPath: containers/pdf-oci
    command: ["mkdocs", "build", "-f", "/output/mkdocs.yml", "--site-dir", "/output/site", "--clean"]
    mounts:
      - source: "{workspace}"
        target: /docs
      - source: "{staging}"
        target: /staging
        readonly: true
      - source: "{output}"
        target: /output
    workdir: /docs
    environment:
      ENABLE_PDF_EXPORT: "true"
    requirements: [docker]
    resources:
      cpus: 4
      memory: "8g"

  # Diagram tools
  drawio:
    description: "DrawIO CLI"
    localPath: containers/drawio-tool
    command: ["python", "/app/drawio_cli.py"]
    mounts:
      - source: "{workspace}"
        target: /docs
    workdir: /docs
    requirements: [docker]

  plantuml:
    description: "PlantUML renderer"
    image: plantuml/plantuml
    tag: "1.2024.8"
    mounts:
      - source: "{output}"
        target: /data
    requirements: [docker]

  # Architecture tools
  structurizr-cli:
    description: "Structurizr CLI for export/validation"
    image: structurizr/cli
    tag: "2024.12.07"
    mounts:
      - source: "{workspace}"
        target: /workspace
    workdir: /workspace
    requirements: [docker]

  structurizr-lite:
    description: "Structurizr diagram server"
    image: structurizr/lite
    tag: "2024.12.07"
    mounts:
      - source: "{content}"
        target: /usr/local/structurizr
    requirements: [docker]
    serve:
      container_port: 8080
      host_port_range: "9000-9999"
      restart_policy: unless-stopped
      auto_open_browser: true

  # Servers
  static-site:
    description: "Static site server (nginx)"
    localPath: containers/nginx-oci
    mounts:
      - source: "{content}"
        target: /usr/share/nginx/html
        readonly: true
    requirements: [docker]
    serve:
      container_port: 8000
      host_port_range: "9000-9999"
      restart_policy: unless-stopped
      auto_open_browser: true

  # Security scanners
  trivy-sbom:
    description: "SBOM generator"
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command:
      [
        "fs",
        "--scanners",
        "vuln",
        "--format",
        "cyclonedx",
        "--list-all-pkgs",
        "--quiet",
        "/scan",
      ]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  trivy-vuln:
    description: "Vulnerability scanner"
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command:
      ["fs", "--scanners", "vuln", "--format", "json", "--quiet", "/scan"]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  trivy-secrets:
    description: "Secrets scanner"
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command:
      ["fs", "--scanners", "secret", "--format", "json", "--quiet", "/scan"]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  trivy-iac:
    description: "IaC scanner"
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command:
      ["fs", "--scanners", "misconfig", "--format", "json", "--quiet", "/scan"]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  trivy-compliance:
    description: "Compliance scanner"
    image: ghcr.io/aquasecurity/trivy
    tag: "0.68.2"
    command:
      ["fs", "--compliance", "all", "--format", "json", "--quiet", "/scan"]
    mounts:
      - source: "{module}"
        target: /scan
        readonly: true
    output_format: json
    requirements: [docker]

  semgrep:
    description: "SAST scanner"
    image: semgrep/semgrep
    tag: "1.145.1"
    command: ["semgrep", "scan", "--config", "auto", "--json", "/src"]
    mounts:
      - source: "{module}"
        target: /src
        readonly: true
    output_format: json
    requirements: [docker]

  zap:
    description: "DAST scanner"
    image: zaproxy/zap-stable
    tag: "2.14.0"
    command: ["zap-baseline.py", "-t", "{target_url}", "-J", "report.json"]
    mounts:
      - source: "{output}"
        target: /zap/wrk
    output_format: json
    requirements: [docker]

#---------------------------------------------------------------------------
# Tool Bindings (override auto resolution)
# Default is "auto" - tries system first, falls back to container
#---------------------------------------------------------------------------
bindings:
  # Explicitly use system for bootstrap tools
  go: system
  docker: system
  git: system

#---------------------------------------------------------------------------
# Component-to-Tool Assignments
#---------------------------------------------------------------------------
component-tools:
  go:
    builder: go
    linter: golangci-lint
    tester: go
    scanners: [trivy-sbom, trivy-vuln, trivy-secrets, semgrep]

  typescript:
    builder: npm-build
    linter: eslint
    tester: npm-test
    scanners: [trivy-sbom, trivy-vuln, trivy-secrets]

  javascript:
    builder: npm-build
    linter: eslint
    tester: npm-test
    scanners: [trivy-sbom, trivy-vuln, trivy-secrets]

  python:
    builder: python
    linter: ruff
    tester: pytest
    scanners: [trivy-sbom, trivy-vuln, trivy-secrets, semgrep]

  rust:
    builder: cargo
    linter: clippy
    tester: cargo
    scanners: [trivy-sbom, trivy-vuln, trivy-secrets, semgrep]

  dotnet:
    builder: dotnet
    linter: dotnet
    tester: dotnet
    scanners: [trivy-sbom, trivy-vuln, trivy-secrets, semgrep]

  dockerfile:
    builder: buildx
    scanners: [trivy-sbom, trivy-vuln, trivy-iac]

  book:
    builder: mkdocs-build
    server: static-site
    servers: [static-site, mkdocs-live]

  base-site:
    builder: mkdocs-preprocess
    server: static-site

  site-render:
    builder: site-render-oci

  pdf-render:
    builder: pdf-oci

  design:
    server: structurizr-lite

  markdown:
    linter: markdownlint

  structurizr:
    builder: structurizr-cli
    linter: structurizr-cli

  pwsh:
    tester: pester

#---------------------------------------------------------------------------
# Environment Overrides
#---------------------------------------------------------------------------
environments:
  ci:
    description: "CI - containers for reproducibility"
    component-tools:
      book:
        builder: mkdocs-build

  local:
    description: "Local - system tools preferred"

#---------------------------------------------------------------------------
# Caches
#---------------------------------------------------------------------------
caches:
  go:
    path: ".cache/go"
    description: "Go module cache"

  go-build:
    path: ".cache/go-build"
    description: "Go build cache"

  npm:
    path: ".cache/npm"
    description: "NPM download cache and isolated work directories (work/{moniker})"

  lint:
    path: ".cache/lint"
    description: "Linter caches"
