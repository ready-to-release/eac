# golangci-lint v2 configuration
# Legend:
#   [default]  = explicitly set to golangci-lint default value
#   [override] = custom value overriding default
#   [required] = must be set for v2
version: "2" # [required]

run:
  # [override] default: 1m
  # Why: Large monorepo with many modules needs more time for full analysis
  timeout: 5m
  tests: true # [default]

issues:
  max-same-issues: 50 # [default]

formatters:
  enable:
    # [override] none enabled by default
    # Why: Enforce consistent formatting across all contributors
    - gofmt
    - goimports
    # Why: Stricter formatting rules than gofmt for consistency
    - gofumpt
  settings:
    gofumpt:
      # [override] default: false
      # Why: Apply all gofumpt rules for maximum consistency
      extra-rules: true
      # [override] default: ""
      # Why: Required for correct import grouping (std, external, internal)
      module-path: github.com/ready-to-release/eac
  exclusions:
    paths:
      # [override] Why: Build output, not source code
      - out
      # [override] Why: Third-party code, not ours to format
      - vendor
      # [override] Why: Test fixtures, intentionally varied formatting
      - testdata
      # [override] Why: Build cache, not source code
      - .cache

linters:
  # [override] default: standard
  # Why: Explicit control over exactly which linters run; avoid surprises when golangci-lint updates
  default: none
  enable:
    # Standard linters - explicitly listed for visibility
    - errcheck     # Why: Unchecked errors are a common source of bugs in Go
    - govet        # Why: Catches subtle bugs the compiler misses
    - ineffassign  # Why: Dead assignments indicate logic errors
    - staticcheck  # Why: Most comprehensive static analyzer for Go (includes gosimple + stylecheck in v2)
    - unused       # Why: Dead code increases maintenance burden

    # Additional quality linters
    - misspell   # Why: Typos in user-facing strings and docs look unprofessional
    - revive     # Why: Enforces Go idioms and best practices
    - unconvert  # Why: Unnecessary conversions add noise and hide intent
    - unparam    # Why: Unused params suggest incomplete refactoring or API issues
    - errorlint  # Why: Go 1.13 error wrapping requires careful handling
    - gosec      # Why: Security scanning for CLI tool that handles user input
    - prealloc   # Why: Preallocating slices improves performance in hot paths
    - gocyclo    # Why: High complexity correlates with bugs and maintenance cost
    - maintidx   # Why: Tracks overall code health and maintainability
    - gocritic   # Why: Catches bugs, performance issues, and style problems
    - godot      # Why: Consistent comment formatting for godoc
    - nilnil     # Why: Returning nil error with invalid value is a common bug pattern
    - nolintlint # Why: Ensures nolint directives are justified and specific
    - whitespace # Why: Consistent whitespace improves readability

  settings:
    errcheck:
      # [override] default: false
      # Why: Unchecked type assertions can panic at runtime
      check-type-assertions: true
      # [override] default: false
      # Why: Blank identifier hides errors intentionally - require explicit handling
      check-blank: true
      # [override] default: []
      # Why: These Close() calls rarely fail and clutter code with unactionable error handling
      exclude-functions:
        - (*os.File).Close
        - (*database/sql.Rows).Close

    govet:
      # [override] default: false
      # Why: Enable all analyzers for maximum bug detection
      enable-all: true
      disable:
        # [override] Why: Struct field alignment is micro-optimization that hurts readability
        - fieldalignment
        # [override] Why: Shadow warnings are too noisy; err shadowing is idiomatic Go
        - shadow

    revive:
      # [override] default: []
      # Why: Explicit rule list ensures consistent checks across golangci-lint versions
      rules:
        - name: blank-imports      # Why: Blank imports should have comments explaining why
        - name: context-as-argument # Why: Context must be first param per Go conventions
        - name: context-keys-type  # Why: Context keys should be typed to avoid collisions
        - name: dot-imports        # Why: Dot imports make code harder to read
        - name: error-return       # Why: Error should be last return value
        - name: error-strings      # Why: Error messages should not be capitalized
        - name: error-naming       # Why: Error variables should be named errFoo
        - name: exported           # Why: Exported symbols need documentation
        - name: increment-decrement # Why: Use i++ not i += 1
        - name: var-naming         # Why: Follow Go naming conventions (ID not Id)
        - name: var-declaration    # Why: Use short declaration where appropriate
        - name: package-comments   # Why: Packages need documentation
        - name: range              # Why: Use range correctly
        - name: receiver-naming    # Why: Receiver names should be consistent
        - name: time-naming        # Why: Time variables should indicate unit
        - name: unexported-return  # Why: Exported funcs shouldn't return unexported types
        - name: indent-error-flow  # Why: Happy path should not be indented
        - name: errorf             # Why: Use fmt.Errorf not fmt.Sprintf + errors.New
        - name: empty-block        # Why: Empty blocks usually indicate incomplete code
        - name: superfluous-else   # Why: Don't use else after return
        - name: unused-parameter   # Why: Unused params suggest incomplete refactoring
        - name: unreachable-code   # Why: Dead code should be removed
        - name: redefines-builtin-id # Why: Shadowing builtins causes confusion

    staticcheck:
      # [override] default: ["all"]
      # Why: Disable overly strict comment format rules that don't improve code quality
      checks:
        - all
        - -ST1000 # Why: Package comment format too strict for internal packages
        - -ST1003 # Why: Underscores needed for some generated code and test names
        - -ST1016 # Why: Receiver name consistency not worth enforcement cost
        - -ST1020 # Why: "FooError ..." comment format too pedantic
        - -ST1021 # Why: "FooType ..." comment format too pedantic
        - -ST1022 # Why: "FooMethod ..." comment format too pedantic

    gosec:
      severity: medium   # [default]
      confidence: medium # [default]
      # [override] default: []
      excludes:
        # Why: Already covered by errcheck linter
        - G104
        # Why: CLI tools legitimately use variable file paths; too many false positives
        - G304
        # Why: Temp files sometimes need specific permissions
        - G306

    gocyclo:
      # [override] default: 10
      # Why: 10 is too strict for real-world code; 15 catches genuinely complex functions
      min-complexity: 15

    maintidx:
      # [override] default: 20
      # Why: 20 is too strict; 60 flags only seriously unmaintainable code
      under: 60

    gocritic:
      # [override] default: [diagnostic]
      # Why: Enable all tag categories for comprehensive analysis
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
      # [override] default: []
      disabled-checks:
        # Why: Commented code is useful during active development
        - commentedOutCode
        # Why: if-else chains are sometimes clearer than switch for complex conditions
        - ifElseChain
        # Why: Single-case switch is clearer when more cases are expected
        - singleCaseSwitch
        # Why: Already covered by nolintlint linter
        - whyNoLint

    misspell:
      # [override] default: ""
      # Why: Standardize on US English spelling for consistency
      locale: US

    whitespace:
      multi-if: false   # [default]
      multi-func: false # [default]

    nolintlint:
      allow-unused: false # [default]
      # [override] default: false
      # Why: Force developers to explain why linter is disabled
      require-explanation: true
      # [override] default: false
      # Why: Prevent blanket nolint that hides multiple issues
      require-specific: true

  exclusions:
    # [override] default: []
    # Why: Use built-in presets for common exclusions instead of custom rules
    presets:
      - std-error-handling    # Why: Standard library error handling patterns
      - common-false-positives # Why: Known false positives across linters
    # [override] default: []
    paths:
      - out      # Why: Build output
      - vendor   # Why: Third-party code
      - testdata # Why: Test fixtures
      - .cache   # Why: Build cache
    # [override] default: []
    rules:
      # Why: Test code prioritizes readability over strict linting
      - path: _test\.go
        linters: [gocyclo, gosec, errcheck, gocritic, maintidx]
      # Why: Generated protobuf code should not be linted
      - path: '.*\.pb\.go$'
        linters: [all]
      # Why: Test helpers have relaxed error handling requirements
      - path: testing/
        linters: [errcheck, gosec]
      # Why: Gherkin step files use dot imports for DSL readability
      - path: '.*_steps\.go$'
        linters: [revive, staticcheck]
        text: dot imports

severity:
  # [override] default: warning
  # Why: Treat all lint issues as errors to enforce fixing them
  default: error
