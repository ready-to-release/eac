# golangci-lint configuration for Go ≥1.21
# Documentation: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  go: '1.21'
  tests: true
  skip-dirs:
    - out
    - vendor
    - testdata
    - .cache
  skip-files:
    - ".*_test\\.go$"  # Test files are checked but with relaxed rules

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  enable:
    # Default linters
    - errcheck        # Check for unchecked errors
    - gosimple        # Simplify code
    - govet           # Reports suspicious constructs
    - ineffassign     # Detect ineffectual assignments
    - staticcheck     # Advanced Go linter
    - typecheck       # Type checking
    - unused          # Checks for unused code

    # Additional code quality linters
    - gofmt           # Check code formatting
    - goimports       # Check import formatting
    - misspell        # Fix commonly misspelled English words
    - revive          # Fast, configurable, extensible, flexible, and beautiful linter for Go (drop-in replacement for golint)
    - stylecheck      # Stylecheck is a replacement for golint
    - unconvert       # Remove unnecessary type conversions
    - unparam         # Reports unused function parameters

    # Error handling
    - errorlint       # Find code that will cause problems with Go 1.13 error wrapping

    # Security
    - gosec           # Inspects source code for security problems

    # Performance
    - prealloc        # Find slice declarations that could potentially be preallocated

    # Code complexity
    - gocyclo         # Computes and checks cyclomatic complexity
    - maintidx        # Measures maintainability index

    # Best practices
    - gocritic        # Provides diagnostics that check for bugs, performance, and style issues
    - godot           # Check if comments end in a period
    - gofumpt         # Stricter gofmt
    - nilnil          # Checks that there is no simultaneous return of nil error and invalid value
    - nolintlint      # Reports ill-formed or insufficient nolint directives
    - whitespace      # Detection of leading and trailing whitespace

  disable:
    - exhaustive      # Too strict for CLI tools
    - exhaustruct     # Too strict for practical use
    - forbidigo       # Not needed unless specific functions need banning
    - funlen          # Function length is subjective
    - gochecknoglobals # Global state is sometimes acceptable
    - gochecknoinits  # Init functions are sometimes necessary
    - gocognit        # Covered by gocyclo
    - godox           # TODO/FIXME comments are acceptable during development
    - gomnd           # Magic numbers are sometimes clearer than named constants
    - lll             # Line length is subjective
    - nestif          # Covered by complexity metrics
    - nlreturn        # Too opinionated on blank lines
    - testpackage     # Internal testing is preferred
    - wrapcheck       # Too strict, wrapping is contextual
    - wsl             # Too opinionated on whitespace

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - (*os.File).Close
      - (*database/sql.Rows).Close

  govet:
    enable-all: true
    disable:
      - fieldalignment  # Micro-optimization, not worth the readability cost
      - shadow          # Too noisy

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

  stylecheck:
    checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    # ST1000: Incorrect or missing package comment
    # ST1003: Underscores in package names (sometimes necessary)
    # ST1016: methods on the same type should have the same receiver name
    # ST1020: Comment should be of the form "FooError ..." (too strict)
    # ST1021: Comment should be of the form "FooType ..." (too strict)
    # ST1022: Comment should be of the form "FooMethod ..." (too strict)

  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104  # Covered by errcheck
      - G304  # File path from variable (too many false positives in CLI tools)
      - G306  # Poor file permissions (sometimes needed for temp files)

  gocyclo:
    min-complexity: 15  # Reasonable complexity limit

  maintidx:
    under: 60  # Maintainability index threshold

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
      - opinionated
    disabled-checks:
      - commentedOutCode  # Sometimes useful during development
      - ifElseChain       # Sometimes clearer than switch
      - singleCaseSwitch  # Sometimes clearer for future extensibility
      - whyNoLint         # Covered by nolintlint

  gofumpt:
    extra-rules: true
    module-path: github.com/ready-to-release/eac

  misspell:
    locale: US

  whitespace:
    multi-if: false
    multi-func: false

  nolintlint:
    allow-unused: false
    require-explanation: true
    require-specific: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - gosec
        - errcheck
        - gocritic
        - maintidx

    # Exclude linters for generated files
    - path: ".*\\.pb\\.go$"
      linters:
        - all

    # Exclude linters for test helper files
    - path: "testing/"
      linters:
        - errcheck
        - gosec

    # Allow dot imports in Gherkin step files
    - path: ".*_steps\\.go$"
      linters:
        - revive
        - stylecheck
      text: "dot imports"

    # Allow init functions in main packages
    - path: "main\\.go$"
      linters:
        - gochecknoinits

  # Show only new issues created in git changes
  new: false

  # Fix found issues (if supported by linter)
  fix: false

severity:
  default-severity: error
  case-sensitive: false
