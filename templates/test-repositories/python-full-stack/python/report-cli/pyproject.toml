[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "report-cli"
version = "1.0.0"
description = "Report generation CLI"
requires-python = ">=3.9"
dependencies = ["mathlib"]

[project.scripts]
report = "report_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "behave>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
