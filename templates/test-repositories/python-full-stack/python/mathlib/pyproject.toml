[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mathlib"
version = "1.0.0"
description = "Math utilities library"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-json-report>=1.5", "behave>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
