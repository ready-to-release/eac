modules:
  - moniker: core
    components:
      - type: dotnet
        name: dotnet
        root: src/Core

  - moniker: web-api
    depends_on:
      - core
    components:
      - type: dotnet
        name: dotnet
        root: src/WebApi
      - type: gherkin
        name: gherkin
        root: specs/web-api
    build:
      artifacts:
        - id: linux-x64
          type: executable
          pattern: web-api-linux-x64
        - id: win-x64
          type: executable
          pattern: web-api-win-x64.exe
