site_name: Ready-to-Release Documentation
site_description: Everything-as-Code (EAC) platform for managing software delivery flows with integrated MCP servers and VSCode extension
site_author: Ready-to-Release Team
site_url: ""

repo_name: eac
repo_url: https://github.com/ready-to-release/eac
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.footnote.tooltips

plugins:
  - search
  - awesome-nav
  # Mermaid diagram rendering for web (JavaScript-based)
  - mermaid2:
      version: '9.4.3'
  # Mermaid to SVG conversion for PDF generation
  # Pre-renders mermaid diagrams to SVG images before PDF generation
  # Only active when ENABLE_PDF_EXPORT=1 (same trigger as exporter)
  # Requires mermaid-cli: npm install -g @mermaid-js/mermaid-cli
  - mermaid-to-svg:
      enabled_if_env: ENABLE_PDF_EXPORT
      # Output SVG files to rendered assets directory (gitignored)
      # Path is relative to docs_dir, so assets/ maps to docs/assets/
      output_dir: assets/rendered/mermaid
      # Use dark theme to match PDF template
      theme: dark
      # Puppeteer configuration for Docker environments
      puppeteer_config: containers/mkdocs-pdf/puppeteer-config.json
      # Disable htmlLabels for PDF compatibility
      # When enabled, mermaid generates <foreignObject> HTML elements
      # that PDF tools cannot render, causing text to disappear
      mermaid_config:
        htmlLabels: false
        flowchart:
          htmlLabels: false
        class:
          htmlLabels: false
  # PDF export plugin - Playwright-based, better scaling for large docs
  # Use: build docs --pdf (or set ENABLE_PDF_EXPORT=true manually)
  - exporter:
      formats:
        pdf:
          # Conditional enable via environment variable
          enabled: !ENV [ENABLE_PDF_EXPORT, false]
          # Use concurrent PDF generation for speed (max 16)
          concurrency: 8
          # Custom stylesheet for PDF (dark theme with proper colors)
          stylesheets:
            - docs/assets/templates/pdf-dark/styles.css
          # Aggregation disabled - we'll merge PDFs via post-processing
          # mkdocs-exporter's aggregator has bugs with certain page paths

markdown_extensions:
  - footnotes
  - attr_list
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: false  # Disabled for PDF compatibility (anchor links break WeasyPrint)
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

extra_css:
  - assets/templates/web-light/styles.css
  - assets/templates/web-dark/styles.css

extra_javascript:
  # Draw.io viewer - enables interactive/clickable .drawio diagrams
  - https://viewer.diagrams.net/js/viewer-static.min.js
  # Note: Mermaid.js is loaded by mermaid2 plugin

dev_addr: '0.0.0.0:8000'

# Validation settings - treat omitted nav files as warnings (caught by --strict)
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
