books:
  - name: docs
    description: Test book with custom pattern
    sources:
      - type: copy
        from: "docs/**/*.md"
        to: ""
      - type: inline
        target: "index.md"
        marker_pattern: "\\{\\{BOOK_INSERT:([a-zA-Z0-9_-]+)\\}\\}"
        inserts:
          - marker: "test-marker"
            command: "show modules"
