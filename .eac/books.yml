# yaml-language-server: $schema=../contracts/core/0.1.0/schemas/books.schema.json
# Local Book Configuration

book-generators:
  diataxis-pdfs:
    template: diataxis-pdf
    site_url: "https://ready-to-release.github.io/eac/"
    categories:
      - {
          name: explanation,
          title: "Explanation",
          description: "Conceptual documentation - Everything as Code, CD practices, and methodology",
        }
      - {
          name: how-to-guides,
          path: howto,
          title: "How-to Guides",
          description: "Practical how-to guides for common tasks",
        }
      - {
          name: tutorials,
          title: "Tutorials",
          description: "Step-by-step learning tutorials",
        }
      - {
          name: reference,
          title: "Technical Reference",
          description: "Complete technical reference",
        }

  release-evidence:
    template: release-evidence
    site_url: "https://ready-to-release.github.io/eac/"
    from_modules: true

books:
  # Bundle evidence book (unchanged)
  - name: release-evidence-clie-eac-bundle
    title: "clie-eac-bundle Release Evidence Package"
    description: "Complete release evidence for clie-eac bundle with all module releases"
    output: pdf-dark
    site_url: "https://ready-to-release.github.io/eac/"
    sources:
      - { type: snippet, name: common-assets }
      - {
          type: snippet,
          name: module-evidence,
          parameters:
            { moniker: eac-ext, prefix: "eac-ext-", prefix_title: "eac-ext " },
        }
      - {
          type: snippet,
          name: module-evidence,
          parameters:
            { moniker: clie-cli, prefix: "clie-cli-", prefix_title: "clie-cli " },
        }
