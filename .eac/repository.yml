# yaml-language-server: $schema=../contracts/core/0.1.0/schemas/repository.schema.json
#
# Unified Repository Configuration
# Contains repository settings, paths, conventions, and module contracts
#

# Repository settings
repository:
  type: mono
  # Remote VCS repository configuration (type defaults to github, URLs derived from owner+repo)
  remote:
    owner: ready-to-release
    repo: eac

# Module Contracts
# Component defaults (files.source, files.tests, files.config) loaded from component-types
# Ordered by dependency layer (Layer 0 first, then Layer 1, etc.)
#
# One module per go.mod / container / script bundle.
# Module groups (module_group) allow depends_on to reference a group name
# which expands to all modules in that group.
modules:
  - moniker: contracts-core
    name: Core Contracts
    description: Core domain contracts including ports, schemas, and defaults
    template: go-contracts
    module_group: contracts
    components:
      go: contracts/core/0.1.0
      assets: contracts/core/0.1.0
      # Shared contracts architecture design (covers all contract modules)
      structurizr: specs/contracts/.design

  - moniker: contracts-scanner
    name: Scanner Contracts
    description: Security scanner contracts and default policies
    template: go-contracts
    module_group: contracts
    components:
      go: contracts/scanner/0.1.0
      assets: contracts/scanner/0.1.0

  - moniker: contracts-runtime
    name: Container Runtime Contract
    description: OCI container runtime port interfaces
    template: go-contracts
    module_group: contracts
    components:
      go: contracts/container-runtime/0.1.0

  - moniker: contracts-ai
    name: AI Provider Contract
    description: AI provider port interfaces
    template: go-contracts
    module_group: contracts
    components:
      go: contracts/ai-provider/0.1.0

  - moniker: contracts-tui
    name: TUI Contract
    description: TUI port interfaces
    template: go-contracts
    module_group: contracts
    components:
      go: contracts/tui/0.1.0

  - moniker: contracts-runner
    name: Runner Contracts
    description: Test runner port interfaces for build, test, lint, and scan adapters
    template: go-contracts
    module_group: contracts
    components:
      go: contracts/runner/0.1.0

  - moniker: contracts-docs
    name: Documentation Contracts
    description: Documentation contract schemas and embedded defaults
    template: go-contracts
    module_group: contracts
    components:
      go: contracts/docs/0.1.0

  - moniker: contracts-clie
    name: CLIE CLI Contracts
    description: CLIE CLI contract schemas, EBNF grammar, and embedded defaults
    template: go-contracts
    module_group: contracts
    components:
      go: contracts/clie/0.1.0
      assets: contracts/clie/0.1.0

  - moniker: mkdocs-render-oci
    name: MkDocs Render Container
    description: MkDocs documentation rendering container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:

  - moniker: mkdocs-dev-oci
    name: MkDocs Dev Container
    description: MkDocs development live serve container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        root: containers/mkdocs-dev-oci
        docker_build:
          push: false

  - moniker: drawio-oci
    name: DrawIO Container
    description: DrawIO diagram rendering container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:

  - moniker: mermaid-oci
    name: Mermaid Container
    description: Mermaid diagram rendering container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:

  - moniker: pdf-oci
    name: PDF Container
    description: PDF rendering container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:

  - moniker: pdf-cli-oci
    name: PDF CLI Container
    description: PDF CLI rendering container (local only)
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        docker_build:
          push: false

  - moniker: cgo-oci
    name: CGo Container
    description: CGo cross-compilation container (local only)
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        docker_build:
          push: false

  - moniker: go-oci
    name: Go Container
    description: Go build container (local only)
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        docker_build:
          push: false

  - moniker: gource-oci
    name: Gource Container
    description: Gource repository visualization container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:

  - moniker: nginx-oci
    name: Nginx Container
    description: Nginx static file serving container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:

  - moniker: git-oci
    name: Git Container
    description: Git utility container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:

  - moniker: repository
    name: Repository Root Module
    description: Repository root module including configuration files, build tools, and git settings
    depends_on: [oci-tools]
    components:
      # Text/config files without typed extensions
      repo-config:
        type: repository
      assets:
        root: /
        patterns:
          source:
            - "*.md"
            - ".claude/**/*.md"
            - ".github/**/*.md"
            - ".junie/**/*.md"
            - "scripts/**/*.md"
            - "release/*.md"
            - "release/eac/**/*.md"
            - "release/eac-ext/**/*.md"
            - "release/clie/**/*.md"
            - ".eac/**/*.yml"
            - ".eac/**/*.yaml"
            - ".clie/**/*.yml"
            - ".clie/**/*.yaml"
            - ".claude/**/*.yml"
            - ".claude/**/*.yaml"
            - ".github/**/*.yml"
            - ".github/**/*.yaml"
            - ".golangci.yml"
            - ".markdownlint.yml"
            - ".markdownlint-cli2.yaml"
            - "cspell.config.yml"
            - "clie.yml"
            - ".mcp.json"
            - ".eac/**/*.json"
            - ".vscode/**/*.json"
            - ".vscode/**/*.css"
            - ".vscode/**/*.template"
            - ".claude/**/*.json"
            - "specs/.risk-controls/*.json"
            - "LICENSE"
            - "LICENSE.*"
      workflows: {}
      bash:
        root: /
        patterns:
          source:
            - "scripts/sh/claude/**/*.sh"
            - "scripts/sh/vscode/**/*.sh"
            - "importer.sh"
      pwsh:
        root: /
        patterns:
          source:
            - "scripts/pwsh/claude/**/*.ps1"
            - "scripts/pwsh/local-dev/**/*.ps1"
            - "importer.ps1"
      go: go/specs/repository
      godog: go/specs/repository
      go-assets:
        type: assets
        root: go/specs/repository
      # gherkin, structurizr auto-inferred from specs/repository/

      # Pre-built markdown command fragments for report book
      markdown-commands:
        type: docs-markdown-commands
        config:
          book: report

      # Repository report PDF
      report:
        type: docs-pdf
        config:
          book: report

  - moniker: core
    name: Core Domain Library
    description: Core domain libraries for configuration, modules, scheduling, and tools
    template: go-library
    depends_on: [contracts-core, contracts-scanner]
    components:
      go: go/core
      # Auto-discovered: assets, godog, gherkin, structurizr

  - moniker: godog-eac
    name: Godog Adapter
    description: BDD test infrastructure adapter for Godog integration
    template: go-library
    depends_on: [core]
    components:
      go: go/adapters/godog

  - moniker: clibase
    name: CLI Base Framework
    description: Shared CLI framework for orchestration, flags, and command execution
    template: go-library
    depends_on: [core]
    components:
      go: go/clibase

  - moniker: templates
    name: Project Templates
    description: Templates for e2e testing, repository initialization, reports etc.
    components:
      templates: templates

  - moniker: ai-eac
    name: AI Adapter
    description: AI service integration adapter
    template: go-library
    depends_on: [contracts-ai, core]
    components:
      go: go/adapters/ai

  - moniker: docker-eac
    name: Docker Adapter
    description: Docker container runtime adapter
    template: go-library
    depends_on: [contracts-runtime, core]
    components:
      go: go/adapters/docker

  - moniker: eac-to-eac
    name: EAC Command Adapter
    description: EAC command execution adapter
    template: go-library
    depends_on: [contracts-runtime, core]
    components:
      go: go/adapters/eac

  - moniker: tui-eac
    name: TUI Adapter
    description: Terminal UI adapter for console rendering
    template: go-library
    depends_on: [contracts-tui, core, clibase]
    components:
      go: go/adapters/tui

  - moniker: cucumber-eac
    name: Cucumber Test Runner
    description: Cucumber/Gherkin test runner adapter for TypeScript BDD execution
    template: go-library
    depends_on: [core, clibase]
    components:
      go: go/adapters/cucumber

  - moniker: gotest-eac
    name: Go Test Runner
    description: Go test runner adapter for unit and integration test execution
    template: go-library
    depends_on: [core, clibase]
    components:
      go: go/adapters/gotest

  - moniker: mocha-eac
    name: Mocha Test Runner
    description: Mocha test runner adapter for TypeScript unit test execution
    template: go-library
    depends_on: [core, clibase]
    components:
      go: go/adapters/mocha

  - moniker: npm-eac
    name: NPM Adapter
    description: NPM package manager adapter for dependency isolation
    template: go-library
    depends_on: [core, clibase]
    components:
      go: go/adapters/npm

  - moniker: docs
    name: Documentation Site
    description: MkDocs HTML documentation site for GitHub Pages
    template: docs-site
    versioning:
      scheme: CalVer
      release_type: published
    depends_on: [contracts-docs, repository, oci-tools, vscode-commit, eac-mcp-server]
    components:
      site:
        type: docs-site
        amp:
          build: 1.25
      # docs-assets, structurizr: auto-discovered by docs-site template
      drawio:
        type: docs-drawio
      mermaid:
        type: docs-mermaid
      tutorials:
        type: docs-pdf
      howto:
        type: docs-pdf
      explanation:
        type: docs-pdf
      reference:
        type: docs-pdf

  - moniker: eac
    name: Go Commands Library
    description: Go library containing CLI command implementations
    template: go-exe
    depends_on: [core, clibase, godog-eac, ai-eac, docker-eac, eac-to-eac, tui-eac, cucumber-eac, gotest-eac, mocha-eac, npm-eac, oci-tools]
    artifact_matrix: cross-platform-upx
    components:
      go:
        root: go/cli/eac
        build:
          binary_name: eac
      # godog: explicit (no godog_test.go at go/cli/eac/specs yet)
      godog: go/cli/eac/specs
      # Absorbed from eac-installer:
      bash-installer:
        type: bash
        root: scripts/sh/eac
      pwsh-installer:
        type: pwsh
        root: scripts/pwsh/eac
      godog-installer:
        type: godog
        root: go/cli/eac/specs/installer
      # Absorbed from implicit-cli:
      bash-invoker:
        type: bash
        root: scripts/sh/go-invoker
        patterns:
          source: ["**/*.sh", "../../../importer.sh"]
      pwsh-invoker:
        type: pwsh
        root: scripts/pwsh/go-invoker
        patterns:
          source: ["**/*.ps1", "**/*.psm1", "../../../importer.ps1"]
      godog-invoker:
        type: godog
        root: go/cli/eac/specs/implicit-cli
      # Absorbed from implicit-cli specs:
      gherkin-invoker:
        type: gherkin
        root: specs/eac/implicit-cli
      structurizr-invoker:
        type: structurizr
        root: specs/eac/implicit-cli/.design
      # gherkin, structurizr, assets: auto-discovered

  - moniker: clie
    name: The CLI of CLIs
    description: The extendable go-based CLI tool
    template: go-exe
    versioning:
      scheme: SemVer
      changelog: release/clie/CHANGELOG.md
      release_type: published
    depends_on: [contracts-clie, oci-tools]
    artifact_matrix: cross-platform-upx
    evidence_books: [release-evidence-clie]
    components:
      go:
        root: go/cli/clie
        build:
          binary_name: clie
      bash: scripts/sh/cli
      pwsh: scripts/pwsh/cli
      godog: go/cli/clie/specs/installer
      gherkin: specs/clie/installer
      structurizr: specs/clie/.design
      structurizr-installer:
        type: structurizr
        root: specs/clie/installer/.design

  - moniker: vscode-commit
    name: VSCode Extension - Git Commit
    description: VSCode extension providing Git toolbar and Claude MCP integration UI
    template: vscode-extension
    depends_on: [eac, oci-tools]
    components:
      typescript:
        root: typescript/vscode-commit
        build:
          post_build:
            copy_to: ".vscode/extensions/vscode-commit/out"
            copy_files:
              - from: package.json
                to: ".vscode/extensions/vscode-commit/package.json"

  - moniker: eac-mcp-server
    name: EAC MCP Server
    description: MCP server exposing EAC commands for AI assistant integration
    template: go-internal
    depends_on: [eac, oci-tools]
    artifact_matrix: single-platform
    components:
      go: go/mcp/commands

  - moniker: eac-ext
    name: EAC Extension for CLIE CLI
    description: Docker-based extension providing EAC (Everything as Code) for CLIE CLI integration
    template: container-multiarch
    versioning:
      scheme: SemVer
      changelog: release/eac-ext/CHANGELOG.md
      release_type: published
    evidence_books: [release-evidence-eac-ext]
    depends_on: [eac, oci-tools]
    depends_on_ci: [clie]
    components:
      dockerfile:
        root: containers/eac-ext
        docker_build:
          context: "out/build/eac/go-go"
          dockerfile: "containers/eac-ext/Dockerfile"

  - moniker: clie-eac-bundle
    name: Release Bundle
    description: Aggregated release bundle with links to all module releases
    versioning:
      scheme: SemVer
      changelog: release/clie-eac-bundle/CHANGELOG.md
      release_type: bundle
    depends_on: [eac, clie, eac-ext, docs, repository, oci-tools]
    evidence_books: [release-evidence-clie-eac-bundle]
    release_bundle:
      title_format: "clie-({clie_version}) ∞ eac-({eac_version}) ∞ eac-({eac-ext_version})"
      headline:
        clie: clie
        eac: eac
        eac-ext: eac-ext
      categories:
        - name: Core Tools
          description: CLI tools and extensions
          modules:
            - eac
            - clie
            - eac-ext
        - name: Documentation
          description: Documentation and guides
          modules:
            - docs
            - repository
    components:
      assets: release/clie-eac-bundle
