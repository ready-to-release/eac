# yaml-language-server: $schema=../contracts/core/0.1.0/schemas/repository.schema.json
#
# Unified Repository Configuration
# Contains repository settings, paths, conventions, and module contracts
#

# Repository settings
repository:
  type: mono
  # Remote VCS repository configuration (type defaults to github, URLs derived from owner+repo)
  remote:
    owner: ready-to-release
    repo: eac

modules:
  - moniker: contracts
    description: Domain contracts including ports, schemas, and defaults for all contract modules
    depends_on_ci: [oci-tools]
    components:
      - type: go
        root: contracts/core/0.1.0
        name: core
        patterns:
          config:
            - "**/*.json"
            - "**/*.yml"
            - "go.mod"
      - type: go
        root: contracts/scanner/0.1.0
        name: scanner
        patterns:
          config:
            - "**/*.json"
            - "**/*.yml"
            - "go.mod"
      - type: go
        root: contracts/clie/0.1.0
        name: clie
        patterns:
          config:
            - "**/*.json"
            - "**/*.yml"
            - "**/*.ebnf"
            - "**/*.yml.md"
            - "go.mod"
      - type: go
        root: contracts/container-runtime/0.1.0
        name: container-runtime
      - type: go
        root: contracts/ai-provider/0.1.0
        name: ai-provider
      - type: go
        root: contracts/tui/0.1.0
        name: tui
      - type: go
        root: contracts/runner/0.1.0
        name: runner
      - type: go
        root: contracts/docs/0.1.0
        name: docs

  - moniker: oci-tools
    description: Container images for documentation, build, and development tooling
    depends_on: [root]
    components:
      - type: container
        name: mkdocs-render-oci
      - type: container
        name: mkdocs-dev-oci
        docker_build:
          push: false
      - type: container
        name: drawio-oci
      - type: container
        name: mermaid-oci
      - type: container
        name: pdf-oci
      - type: container
        name: pdf-cli-oci
        docker_build:
          push: false
      - type: container
        name: cgo-oci
        docker_build:
          push: false
      - type: container
        name: go-oci
        docker_build:
          push: false
      - type: container
        name: gource-oci
      - type: container
        name: nginx-oci
      - type: container
        name: git-oci
      - type: container
        name: dotnet-oci

  - moniker: repository
    description: Repository root module including configuration files, build tools, and git settings
    depends_on: [oci-tools]
    components:
      - type: repository
        name: repo-config
      - type: assets
        root: /
        patterns:
          source:
            - "*.md"
            - "go/tech-debt-register.md"
            - ".claude/**/*.md"
            - ".github/**/*.md"
            - ".junie/**/*.md"
            - "scripts/**/*.md"
            - "release/*.md"
            - "release/eac/**/*.md"
            - "release/eac-ext/**/*.md"
            - "release/clie/**/*.md"
            - ".eac/**/*.md"
            - ".eac/**/*.yml"
            - ".eac/**/*.yaml"
            - ".clie/**/*.yml"
            - ".clie/**/*.yaml"
            - ".claude/**/*.yml"
            - ".claude/**/*.yaml"
            - ".github/**/*.yml"
            - ".github/**/*.yaml"
            - ".golangci.yml"
            - ".markdownlint.yml"
            - ".markdownlint-cli2.yaml"
            - "cspell.config.yml"
            - "clie.yml"
            - ".mcp.json"
            - ".eac/**/*.json"
            - ".vscode/**/*.json"
            - ".vscode/**/*.css"
            - ".vscode/**/*.template"
            - ".claude/**/*.json"
            - "specs/.risk-controls/*.json"
            - "LICENSE"
            - "LICENSE.*"
      - type: workflows
      - type: bash
        root: /
        patterns:
          source:
            - "scripts/sh/claude/**/*.sh"
            - "scripts/sh/vscode/**/*.sh"
            - "importer.sh"
      - type: pwsh
        root: /
        patterns:
          source:
            - "scripts/pwsh/claude/**/*.ps1"
            - "scripts/pwsh/local-dev/**/*.ps1"
            - "importer.ps1"
      - type: go
        root: go/specs/repository
      - type: assets
        root: go/specs/repository
        name: go-assets
      - type: markdown
        root: go/specs/repository
        name: markdown
      - type: yaml
        root: go/specs/repository
        name: yaml
      - type: docs-markdown-commands
        name: markdown-commands
        config:
          book: report
      - type: docs-pdf
        name: report
        config:
          book: report

  - moniker: core
    description: Core domain libraries for configuration, modules, scheduling, and tools
    depends_on: [contracts]
    components:
      - type: go
        root: go/core

  - moniker: clibase
    description: Shared CLI framework for orchestration, flags, and command execution
    depends_on: [core]
    components:
      - type: go
        root: go/clibase

  - moniker: templates
    description: Templates for e2e testing, repository initialization, reports etc.
    depends_on_ci: [oci-tools]
    components:
      - type: templates
        root: templates
        design:
          root: specs/templates/.design
          patterns:
            - "workspace.dsl"
            - "**/*.dsl"

  - moniker: adapters
    description: All adapter modules for test runners, package managers, and runtime integrations
    depends_on: [contracts, core, clibase]
    components:
      - type: go
        root: go/adapters/godog
      - type: go
        root: go/adapters/ai
      - type: go
        root: go/adapters/docker
      - type: go
        root: go/adapters/eac
      - type: go
        root: go/adapters/tui
      - type: go
        root: go/adapters/cucumber
      - type: go
        root: go/adapters/gotest
      - type: go
        root: go/adapters/mocha
      - type: go
        root: go/adapters/npm
      - type: go
        root: go/adapters/pip
      - type: go
        root: go/adapters/pytest
      - type: go
        root: go/adapters/behave
      - type: go
        root: go/adapters/nuget
      - type: go
        root: go/adapters/dotnet
      - type: go
        root: go/adapters/reqnroll
      - type: go
        root: go/adapters/gh
      - type: assets
        root: go/adapters/ai
        name: assets

  - moniker: commands
    description: CLI command modules for repository, build, test, scan, lint, and update operations
    depends_on: [core, clibase, adapters]
    components:
      - type: go
        root: go/commands/base
      - type: go
        root: go/commands/repository
      - type: go
        root: go/commands/build
      - type: go
        root: go/commands/test
      - type: go
        root: go/commands/scan
      - type: go
        root: go/commands/lint
      - type: go
        root: go/commands/update
      - type: assets
        root: go/commands/repository
        name: repository-cmds-assets
      - type: assets
        root: go/commands/test
        name: test-cmds-assets
      - type: assets
        root: go/commands/base
        name: assets

  - moniker: docs
    description: MkDocs HTML documentation site for GitHub Pages
    versioning:
      scheme: CalVer
      release_type: published
    depends_on: [contracts, repository, oci-tools, vscode-commit, eac-mcp-server, adapters]
    components:
      - type: docs-site
        name: site
        amp:
          build: 1.25
        design:
          root: specs/docs/.design
          patterns:
            - "workspace.dsl"
            - "**/*.dsl"
        with: [docs-assets, docs-drawio, docs-mermaid]
      - type: docs-pdf
        name: tutorials
      - type: docs-pdf
        name: howto
      - type: docs-pdf
        name: explanation
      - type: docs-pdf
        name: reference

  - moniker: eac
    description: Go library containing CLI command implementations
    versioning:
      scheme: SemVer
      changelog: release/eac/CHANGELOG.md
      release_type: published
    depends_on: [commands, oci-tools]
    components:
      - type: go
        root: go/cli/eac
        build:
          binary_name: eac
          artifact_matrix: cross-platform-upx
        patterns:
          data:
            - "specs/assets/**"
            - "**/testdata/**"

  - moniker: clie
    description: The extendable go-based CLI tool
    versioning:
      scheme: SemVer
      changelog: release/clie/CHANGELOG.md
      release_type: published
    depends_on: [contracts, oci-tools]
    components:
      - type: go
        root: go/cli/clie
        build:
          binary_name: clie
          artifact_matrix: cross-platform-upx
        patterns:
          exclude:
            - "specs/installer/**"
      - type: evidence-book
        name: release-evidence-clie
        config:
          book: release-evidence-clie

  - moniker: implicit-cli
    description: Go-invoker scripts and specs for implicit CLI integration
    depends_on: [eac]
    components:
      - type: bash
        root: scripts/sh/go-invoker
        name: bash
        patterns:
          source: ["**/*.sh"]
        design:
          root: specs/implicit-cli/.design
          patterns:
            - "workspace.dsl"
            - "**/*.dsl"
      - type: pwsh
        root: scripts/pwsh/go-invoker
        name: pwsh
        patterns:
          source: ["**/*.ps1", "**/*.psm1"]

  - moniker: cli-installers
    description: Cross-platform installer scripts and specs for the EAC and CLIE CLI tools
    depends_on: [eac, clie]
    depends_on_ci: [eac]
    components:
      - type: bash
        root: scripts/sh/eac
        name: bash-eac
      - type: pwsh
        root: scripts/pwsh/eac
        name: pwsh-eac
      - type: bash
        root: scripts/sh/cli
        name: bash-clie
      - type: pwsh
        root: scripts/pwsh/cli
        name: pwsh-clie
      - type: markdown
        root: go/cli/clie/specs/installer
        name: markdown-clie-installer

  - moniker: vscode-commit
    description: VSCode extension providing Git toolbar and Claude MCP integration UI
    versioning:
      scheme: Implicit
      release_type: internal
    depends_on: [eac, oci-tools]
    components:
      - type: typescript
        root: typescript/vscode-commit
        build:
          post_build:
            copy_to: ".vscode/extensions/vscode-commit/out"
            copy_files:
              - from: package.json
                to: ".vscode/extensions/vscode-commit/package.json"
        design:
          root: specs/vscode-commit/.design
          patterns:
            - "workspace.dsl"
            - "**/*.dsl"

  - moniker: eac-mcp-server
    description: MCP server exposing EAC commands for AI assistant integration
    versioning:
      scheme: SemVer
      changelog: "{go_root}/CHANGELOG.md"
      release_type: internal
    depends_on: [eac, oci-tools]
    components:
      - type: go
        root: go/mcp/commands
        build:
          artifact_matrix: single-platform

  - moniker: eac-ext
    description: Docker-based extension providing EAC (Everything as Code) for CLIE CLI integration
    versioning:
      scheme: SemVer
      changelog: release/eac-ext/CHANGELOG.md
      release_type: published
    depends_on: [eac, oci-tools]
    depends_on_ci: [clie, eac]
    components:
      - type: container
        docker_build:
          context: "out/build/eac/eac_go"
          dockerfile: "containers/eac-ext/Dockerfile"
          platforms: [linux/amd64, linux/arm64]
        design:
          root: specs/eac-ext/.design
          patterns:
            - "workspace.dsl"
            - "**/*.dsl"
      - type: evidence-book
        name: release-evidence-eac-ext
        config:
          book: release-evidence-eac-ext

  - moniker: clie-eac-bundle
    description: Aggregated release bundle with links to all module releases
    versioning:
      scheme: SemVer
      changelog: release/clie-eac-bundle/CHANGELOG.md
      release_type: bundle
    depends_on: [eac, clie, eac-ext, docs, repository, oci-tools]
    components:
      - type: release-bundle
        bundle:
          title_format: "clie {clie_version} + eac {eac_version} + eac-ext {eac-ext_version}"
          headline:
            clie: clie
            eac: eac
            eac-ext: eac-ext
          categories:
            - name: Core Tools
              description: CLI tools and extensions
              modules:
                - eac
                - clie
                - eac-ext
            - name: Documentation
              description: Documentation and guides
              modules:
                - docs
                - repository
      - type: assets
        root: release/clie-eac-bundle
        name: assets
      - type: evidence-book
        name: release-evidence-clie-eac-bundle
        config:
          book: release-evidence-clie-eac-bundle
