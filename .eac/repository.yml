# yaml-language-server: $schema=../../contracts/core/0.1.0/repository.schema.json
#
# Unified Repository Configuration
# Contains repository settings, paths, conventions, and module contracts
#

# Repository settings
repository:
  type: mono
  # Remote VCS repository configuration (type defaults to github, URLs derived from owner+repo)
  remote:
    owner: ready-to-release
    repo: eac

# Module Contracts
# Component defaults (files.source, files.tests, files.config) loaded from component-types
# Ordered by dependency layer (Layer 0 first, then Layer 1, etc.)
modules:
  # ============================================================================
  # LAYER 0 - Root modules (no dependencies)
  # ============================================================================

  - moniker: repository
    name: Repository Root Module
    description: Repository root module including configuration files, build tools, and git settings
    depends_on: [pdf-oci]
    components:
      # Text/config files without typed extensions
      repo-config:
        type: repository
        root: /
      markdown:
        root: /
        patterns:
          source: ["*.md", "*.markdown", ".claude/**/*.md", "scripts/**/*.md", "release/README.md", "release/r2r-cli/*.md", "release/ext-eac/*.md", "release/docs/*.md", ".github/**/*.md", "junie/**/*.md"]
      yaml:
        root: /
        patterns:
          source: [.r2r/**/*.yml, .r2r/**/*.yaml, .golangci.yml, .markdownlint.yml, .markdownlint-cli2.yaml, cspell.config.yml, .claude/**/*.yml, .claude/**/*.yaml, r2r-cli.yml, .github/**/*.yml, .github/**/*.yaml, .eac/**/*.yml, .eac/**/*.yaml]
      workflows:
        root: .github/workflows
      json:
        root: /
        patterns:
          source: [.mcp.json, .vscode/**/*.json, .claude/**/*.json, specs/.risk-controls/*.json, .eac/**/*.json]
      testdata:
        type: testdata
        root: /
        patterns:
          source: [".vscode/*.css", ".vscode/*.template"]
      bash:
        root: /
        patterns:
          source: [test-repository-validations.sh, scripts/sh/claude/**/*.sh, scripts/sh/vscode/**/*.sh, importer.sh]
      pwsh:
        root: /
        patterns:
          source: [scripts/pwsh/claude/**/*.ps1, scripts/pwsh/local-dev/**/*.ps1, importer.ps1]
      go:
        root: go/specs/repository
        patterns:
          config: [go.mod, go.sum]
      gherkin-steps:
        root: go/specs/repository
      # gherkin, structurizr auto-inferred from specs/repository/

      # Repository report PDF
      report:
        type: docs-pdf
        config:
          book: report

  - moniker: contracts-bundle
    name: Contract Files Module
    description: Go module providing embedded contract files (schemas, EBNF, defaults) for consumption by other modules
    template: go-library-template
    parameters:
      go_root: contracts
    components:
      go:
        root: contracts
        patterns:
          config: [go.mod, go.sum, "**/go.mod"]
      testdata:
        type: testdata
        root: contracts
        patterns:
          source: ["**/*.ebnf"]
      yaml:
        root: contracts
        patterns:
          source:
            - security/**/*.yml
            - testing/**/*.yml
            - tools/**/*.yml

  - moniker: core
    name: Core Domain Libraries
    description: Core library containing contracts and repository operations
    components:
      go:
        root: go/core
        patterns:
          source: ["**/*.go", "**/*.json"]
          tests: ["**/*_test.go"]
          config: [go.mod, go.sum]
      markdown: go/core
      json: contracts/core
      yaml:
        root: contracts/core
        patterns:
          source: ["**/*.yml", "**/*.yaml"]
      testdata:
        type: testdata
        root: go/core
        patterns:
          source: ["testing/testdata/**/*", "specs/gherkin/testdata/**/*.feature", "github/cli_fixtures/**/*"]
      gherkin-steps:
        root: go/core/specs
      # gherkin, structurizr auto-inferred

  - moniker: pdf-oci
    name: MkDocs PDF Container
    description: Pre-built Docker container for MkDocs PDF generation (Chromium, Playwright)
    template: container-template
    components:
      json: containers/pdf-oci
      testdata:
        type: testdata
        root: containers/pdf-oci
        patterns:
          source: ["*.txt", "overrides/**/*.html"]
      mkdocs-plugin:
        type: containercode
        root: containers/pdf-oci/mkdocs-exporter-fork
        patterns:
          source:
            - "**/*.py"
            - "**/*.css"
            - pyproject.toml
            - LICENSE

  - moniker: site-render-oci
    name: MkDocs Site Container
    description: Pre-built Docker container for MkDocs HTML site generation
    template: container-template
    components:
      testdata:
        type: testdata
        root: containers/site-render-oci
        patterns:
          source: ["*.txt"]
      scripts:
        type: containercode
        root: containers/site-render-oci
        patterns:
          source: ["*.py"]

  - moniker: mkdocs-dev-oci
    name: MkDocs Dev Server Container
    description: Development server container with polling-based file watching for live reload
    template: container-template
    components:
      testdata:
        type: testdata
        root: containers/mkdocs-dev-oci
        patterns:
          source: ["*.txt"]
      scripts:
        type: containercode
        root: containers/mkdocs-dev-oci
        patterns:
          source: ["*.py", "*.sh"]

  - moniker: mermaid-oci
    name: Mermaid CLI Container
    description: Container for Mermaid diagram rendering
    template: container-template
    components:
      json: containers/mermaid-oci
      scripts:
        type: containercode
        root: containers/mermaid-oci
        patterns:
          source: ["*.js"]

  # pdf-cli-oci: auto-discovered from containers/pdf-cli-oci/Dockerfile

  - moniker: nginx-oci
    name: Static Site Container
    description: Container for static site serving with nginx
    template: container-template
    components:
      testdata:
        type: testdata
        root: containers/nginx-oci
        patterns:
          source: ["*.conf"]

  - moniker: git-oci
    name: Git Filter Repo Container
    description: Container for git-filter-repo operations
    template: container-template
    components:
      testdata:
        type: testdata
        root: containers/git-oci
        patterns:
          source: ["*.sh"]

  - moniker: gource-oci
    name: Gource Container
    description: Container for Gource visualization rendering
    template: container-template
    components:
      testdata:
        type: testdata
        root: containers/gource-oci
        patterns:
          source: ["*.sh", "*.html", "*.conf"]

  # ============================================================================
  # LAYER 1 - Depends on Layer 0
  # ============================================================================

  - moniker: docs
    name: Documentation Site
    description: MkDocs HTML documentation site for GitHub Pages
    versioning:
      scheme: CalVer
      changelog: release/docs/CHANGELOG.md
      release_type: published
    depends_on: [repository, site-render-oci, pdf-oci]
    components:
      # HTML site (tool chain: preprocess -> site-render-oci)
      site:
        type: docs-site
        root: docs
        config:
          book: site
        amp:
          build: 1.25
      markdown: docs
      yaml:
        root: docs
        patterns:
          source: ["**/.nav.yml", "mkdocs.yml"]
      assets:
        type: docs-assets
        root: docs/assets
        patterns:
          source: ["**/*.png", "**/*.jpg", "**/*.svg", "**/*.css", "**/*.scss", "**/*.js", "**/*.pdf", "**/*.drawio", "*.json", "*.yml"]
      json: contracts/docs
      testdata:
        type: testdata
        root: docs
        patterns:
          source: ["LICENSE"]
      # structurizr auto-inferred

      # Diataxis PDF components (tool chain: preprocess -> pdf-oci)
      tutorials:
        type: docs-pdf
        config:
          book: tutorials
      howto:
        type: docs-pdf
        config:
          book: howto
      explanation:
        type: docs-pdf
        config:
          book: explanation
      reference:
        type: docs-pdf
        config:
          book: reference

  - moniker: eac-cli
    name: Go Commands Library
    description: Go library containing CLI command implementations
    depends_on: [core, clibase]
    components:
      go:
        root: go/cli/eac
        build:
          artifacts:
            - id: linux-amd64
              type: executable
              pattern: "eac-linux-amd64"
            - id: linux-arm64
              type: executable
              pattern: "eac-linux-arm64"
            - id: darwin-amd64
              type: executable
              pattern: "eac-darwin-amd64"
            - id: darwin-arm64
              type: executable
              pattern: "eac-darwin-arm64"
            - id: windows-amd64
              type: executable
              pattern: "eac-windows-amd64.exe"
            - id: linux-amd64-upx
              type: executable
              pattern: "eac-linux-amd64-upx"
              compression: upx
              derive_from: "eac-linux-amd64"
            - id: windows-amd64-upx
              type: executable
              pattern: "eac-windows-amd64-upx.exe"
              compression: upx
              derive_from: "eac-windows-amd64.exe"
      markdown: go/cli/eac
      gherkin-steps:
        root: go/cli/eac/specs
      # gherkin, structurizr auto-inferred
      testdata:
        type: testdata
        root: go/cli/eac/testdata
        patterns:
          source: ["**/*.txt", "**/*.yml", "**/*.yaml"]
      test-assets:
        type: testdata
        root: go/cli/eac/specs/assets
        patterns:
          source: ["**/*.txt", "**/*.json", "**/*.md"]
      dockerfile:
        root: containers/drawio-tool
        docker_build:
          container: "drawio-tool"
          context: "containers/drawio-tool"
          dockerfile: "containers/drawio-tool/Dockerfile"
          platforms: [linux/amd64]
          push: false
      cgo:
        type: dockerfile
        root: containers/cgo-tool
      drawio-scripts:
        type: testdata
        root: containers/drawio-tool
        patterns:
          source: ["**/*.py", "requirements.txt", "templates/*.xml"]
      impl-assets:
        type: testdata
        root: go/cli/eac/impl
        patterns:
          source:
            - "**/assets/**/*.txt"
            - "**/assets/**/*.json"

  - moniker: godog
    name: Godog Test Infrastructure
    description: Shared godog BDD test infrastructure (context, cache, helpers, fixtures)
    template: go-library-template
    parameters:
      go_root: go/godog
    depends_on: [core]

  - moniker: ai-adapter
    name: AI Adapter
    description: LLM integration abstraction with multi-provider support (Anthropic, OpenAI, Gemini, Claude CLI)
    template: go-library-template
    parameters:
      go_root: go/adapters/ai
    depends_on: [core]

  - moniker: docker-adapter
    name: Docker Adapter
    description: Docker SDK wrapper for container lifecycle, image operations, port allocation, and serve functionality
    template: go-library-template
    parameters:
      go_root: go/adapters/docker
    depends_on: [core]
    components:
      containerruntime:
        type: go
        root: go/adapters/containerruntime

  - moniker: tui-adapter
    name: TUI Adapter
    description: Terminal UI implementations with registry-based binding for parallel and basic console modes
    template: go-library-template
    parameters:
      go_root: go/adapters/tui
    depends_on: [core]

  - moniker: clibase
    name: CLI Base Framework
    description: Shared CLI framework providing command execution, orchestration, flags, rendering, and TUI integration
    template: go-library-template
    parameters:
      go_root: go/clibase
    depends_on: [core, tui-adapter]

  - moniker: r2r-cli
    name: The CLI of CLIs
    description: The extendable go-based CLI tool
    versioning:
      scheme: SemVer
      changelog: release/r2r-cli/CHANGELOG.md
      release_type: published
    evidence_books: [release-evidence-r2r-cli]
    depends_on: [contracts-bundle]
    components:
      go:
        root: go/cli/r2r
        patterns:
          source: ["**/*.go", "**/*.json"]
        build:
          artifacts:
            - id: linux-amd64
              type: executable
              pattern: "r2r-linux-amd64"
            - id: linux-arm64
              type: executable
              pattern: "r2r-linux-arm64"
            - id: darwin-amd64
              type: executable
              pattern: "r2r-darwin-amd64"
            - id: darwin-arm64
              type: executable
              pattern: "r2r-darwin-arm64"
            - id: windows-amd64
              type: executable
              pattern: "r2r-windows-amd64.exe"
            - id: linux-amd64-upx
              type: executable
              pattern: "r2r-linux-amd64-upx"
              compression: upx
              derive_from: "r2r-linux-amd64"
            - id: windows-amd64-upx
              type: executable
              pattern: "r2r-windows-amd64-upx.exe"
              compression: upx
              derive_from: "r2r-windows-amd64.exe"
      markdown: go/cli/r2r
      json: contracts/r2r-cli
      yaml: contracts/r2r-cli
      testdata:
        type: testdata
        root: go/cli/r2r
        patterns:
          source: ["internal/validator/config/**/*.json"]
      # gherkin, structurizr auto-inferred from specs/r2r-cli/

  - moniker: templates
    name: Project Templates
    description: Template files for documentation, specifications, and design records
    depends_on: [repository]
    components:
      markdown: templates
      yaml: templates
      gherkin: templates
      json: templates
      testdata:
        type: testdata
        root: templates
        patterns:
          source: ["**/*.template"]
      # structurizr auto-inferred

  - moniker: vscode-commit
    name: VSCode Extension - Git Commit
    description: VSCode extension providing Git toolbar and Claude MCP integration UI
    depends_on: [repository]
    components:
      typescript:
        root: typescript/vscode-commit
        patterns:
          source: ["**/*.ts", "**/*.tsx", "**/*.js"]
          tests: [test/**/*.test.ts]
          config: ["*.json", ".mocharc.json", ".vscodeignore"]
        build:
          post_build:
            copy_to: ".vscode/extensions/vscode-commit/out"
            copy_files:
              - from: package.json
                to: ".vscode/extensions/vscode-commit/package.json"
      markdown: typescript/vscode-commit
      json: contracts/vscode-commit
      # gherkin, structurizr auto-inferred

  # ============================================================================
  # LAYER 2 - Depends on Layer 1
  # ============================================================================

  - moniker: mcp-server
    name: Go Commands MCP Server
    description: Internal MCP server for Commands
    template: go-internal-template
    parameters:
      go_root: go/mcp/commands
    depends_on: [eac-cli]
    components:
      # Override go component to add build artifacts
      go:
        build:
          artifacts:
            - id: mcp-server
              type: executable
              pattern: "{moniker}{ext}"
      # Custom testdata not covered by template
      testdata:
        type: testdata
        root: templates/test-repositories
        patterns:
          source: ["**/*.go", "**/*.txt", "**/*.mod", "**/*.ts", "**/*.py", "**/*.toml", "**/*.cs", "**/*.csproj", "**/*.rs", "**/*.html", "**/*.conf", "**/Dockerfile"]
            
  - moniker: ext-eac
    name: EAC Extension for R2R CLI
    description: Docker-based extension providing EAC (Everything as Code) for R2R CLI integration
    template: container-multiarch-template
    versioning:
      scheme: SemVer
      changelog: release/ext-eac/CHANGELOG.md
      release_type: published
    evidence_books: [release-evidence-ext-eac]
    depends_on: [eac-cli]
    depends_on_ci: [r2r-cli]
    components:
      dockerfile:
        build:
          artifacts:
            - id: image
              type: image
              pattern: "{moniker}:latest"
      # structurizr auto-inferred

  - moniker: r2r-installer
    name: R2R CLI Installer Scripts
    description: Cross-platform installer scripts for R2R CLI
    depends_on_ci: [r2r-cli]
    components:
      pwsh:
        root: scripts/pwsh/cli
      bash:
        root: scripts/sh/cli
      go:
        root: go/specs/r2r-installer
        patterns:
          config: [go.mod, go.sum]
      gherkin-steps:
        root: go/specs/r2r-installer
      # gherkin, structurizr auto-inferred from specs/r2r-installer/

  - moniker: implicit-cli
    name: Go Command Invoker Scripts
    description: Cross-shell wrappers with tab completion for Go commands
    depends_on: [eac-cli]
    depends_on_ci: [r2r-cli]
    components:
      pwsh:
        root: scripts/pwsh/go-invoker
        patterns:
          source: ["**/*.ps1", "**/*.psm1", "../../../importer.ps1"]
      bash:
        root: scripts/sh/go-invoker
        patterns:
          source: ["**/*.sh", "../../../importer.sh"]
      go:
        root: go/specs/implicit-cli
        patterns:
          config: [go.mod, go.sum]
      gherkin-steps:
        root: go/specs/implicit-cli
      # gherkin, structurizr auto-inferred from specs/implicit-cli/

  # ============================================================================
  # LAYER 3 - Depends on Layer 2
  # ============================================================================

  - moniker: r2r-eac-bundle
    name: Release Bundle
    description: Aggregated release bundle with links to all module releases
    versioning:
      scheme: CalVer
      changelog: release/r2r-eac-bundle/CHANGELOG.md
      release_type: bundle
    depends_on: [r2r-cli, ext-eac, docs, repository]
    evidence_books: [release-evidence-r2r-eac-bundle]
    release_bundle:
      title_format: "r2r-({r2r_version}) ∞ eac-({eac_version})"
      headline:
        r2r: r2r-cli
        eac: ext-eac
      categories:
        - name: Core Tools
          description: CLI tools and extensions
          modules:
            - r2r-cli
            - ext-eac
        - name: Documentation
          description: Documentation and guides
          modules:
            - docs
            - repository
    components:
      markdown: release/r2r-eac-bundle
