# yaml-language-server: $schema=../contracts/core/0.1.0/schemas/repository.schema.json
#
# Unified Repository Configuration
# Contains repository settings, paths, conventions, and module contracts
#

# Repository settings
repository:
  type: mono
  # Remote VCS repository configuration (type defaults to github, URLs derived from owner+repo)
  remote:
    owner: ready-to-release
    repo: eac

# Module Contracts
#
# One module per go.mod / container / script bundle.
# Module groups (module_group) allow depends_on to reference a group name
# which expands to all modules in that group.
modules:
  - moniker: contracts
    name: Contracts
    description: Domain contracts including ports, schemas, and defaults for all contract modules
    components:
      core:
        type: go
        root: contracts/core/0.1.0
        patterns:
          config:
            - "**/*.json"
            - "**/*.yml"
            - "go.mod"
      design:
        type: structurizr
        root: specs/contracts/.design
      scanner:
        type: go
        root: contracts/scanner/0.1.0
        patterns:
          config:
            - "**/*.json"
            - "**/*.yml"
            - "go.mod"
      clie:
        type: go
        root: contracts/clie/0.1.0
        patterns:
          config:
            - "**/*.json"
            - "**/*.yml"
            - "**/*.ebnf"
            - "**/*.yml.md"
            - "go.mod"
    component_roots:
      go:
        name_pattern: "^contracts/(.+?)/[\\d.]+$"
        roots:
          - contracts/container-runtime/0.1.0
          - contracts/ai-provider/0.1.0
          - contracts/tui/0.1.0
          - contracts/runner/0.1.0
          - contracts/docs/0.1.0

