# yaml-language-server: $schema=../contracts/core/0.1.0/schemas/repository.schema.json
#
# Unified Repository Configuration
# Contains repository settings, paths, conventions, and module contracts
#

# Repository settings
repository:
  type: mono
  # Remote VCS repository configuration (type defaults to github, URLs derived from owner+repo)
  remote:
    owner: ready-to-release
    repo: eac

# Module Contracts
# Component defaults (files.source, files.tests, files.config) loaded from component-types
# Ordered by dependency layer (Layer 0 first, then Layer 1, etc.)
#
# One module per go.mod / container / script bundle.
# Module groups (module_group) allow depends_on to reference a group name
# which expands to all modules in that group.
modules:
  - moniker: contracts-core
    name: Core Contracts
    description: Core domain contracts including ports, schemas, and defaults
    template: go-contracts
    module_group: contracts
    components:
      go:
        root: contracts/core/0.1.0
        patterns:
          source: ["**/*.go"]
          config: ["go.mod", "go.sum"]
      assets:
        root: contracts/core/0.1.0/schemas
        patterns:
          source: ["**/*.json", "defaults/**/*.yml"]

  - moniker: contracts-scanner
    name: Scanner Contracts
    description: Security scanner contracts and default policies
    template: go-contracts
    module_group: contracts
    components:
      go:
        root: contracts/scanner/0.1.0
        patterns:
          source: ["**/*.go"]
          config: ["go.mod"]
      assets:
        root: contracts/scanner/0.1.0/schemas
        patterns:
          source: ["defaults/**/*.yml"]

  - moniker: contracts-runtime
    name: Container Runtime Contract
    description: OCI container runtime port interfaces
    template: go-contracts
    module_group: contracts
    components:
      go:
        root: contracts/container-runtime/0.1.0
        patterns:
          source: ["**/*.go"]
          config: ["go.mod"]

  - moniker: contracts-ai
    name: AI Provider Contract
    description: AI provider port interfaces
    template: go-contracts
    module_group: contracts
    components:
      go:
        root: contracts/ai-provider/0.1.0
        patterns:
          source: ["**/*.go"]
          config: ["go.mod"]

  - moniker: contracts-tui
    name: TUI Contract
    description: TUI port interfaces
    template: go-contracts
    module_group: contracts
    components:
      go:
        root: contracts/tui/0.1.0
        patterns:
          source: ["**/*.go"]
          config: ["go.mod"]

  - moniker: contracts-docs
    name: Documentation Contracts
    description: Documentation contract schemas and embedded defaults
    template: go-contracts
    module_group: contracts
    components:
      go:
        root: contracts/docs/0.1.0
        patterns:
          source: ["**/*.go"]
          config: ["go.mod"]

  - moniker: contracts-r2r-cli
    name: R2R CLI Contracts
    description: R2R CLI contract schemas, EBNF grammar, and embedded defaults
    template: go-contracts
    module_group: contracts
    components:
      go:
        root: contracts/r2r-cli/0.1.0
        patterns:
          source: ["**/*.go"]
          config: ["go.mod"]
      assets:
        root: contracts/r2r-cli/0.1.0/schemas

  - moniker: mkdocs-render-oci
    name: MkDocs Render Container
    description: MkDocs documentation rendering container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        root: containers/mkdocs-render-oci

  - moniker: mkdocs-dev-oci
    name: MkDocs Dev Container
    description: MkDocs development live serve container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        root: containers/mkdocs-dev-oci

  - moniker: drawio-oci
    name: DrawIO Container
    description: DrawIO diagram rendering container (local only)
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        root: containers/drawio-oci
        docker_build:
          push: false
      assets:
        root: containers/drawio-oci
        patterns:
          source: ["*.py", "*.js", "templates/**/*.xml"]

  - moniker: mermaid-oci
    name: Mermaid Container
    description: Mermaid diagram rendering container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        root: containers/mermaid-oci
      assets:
        root: containers/mermaid-oci

  - moniker: pdf-oci
    name: PDF Container
    description: PDF rendering container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        root: containers/pdf-oci
      assets:
        root: containers/pdf-oci

  - moniker: pdf-cli-oci
    name: PDF CLI Container
    description: PDF CLI rendering container (local only)
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        root: containers/pdf-cli-oci
        docker_build:
          push: false

  - moniker: cgo-oci
    name: CGo Container
    description: CGo cross-compilation container (local only)
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        root: containers/cgo-oci
        docker_build:
          push: false

  - moniker: go-oci
    name: Go Container
    description: Go build container (local only)
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        root: containers/go-oci
        docker_build:
          push: false

  - moniker: gource-oci
    name: Gource Container
    description: Gource repository visualization container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        root: containers/gource-oci

  - moniker: nginx-oci
    name: Nginx Container
    description: Nginx static file serving container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        root: containers/nginx-oci

  - moniker: git-oci
    name: Git Container
    description: Git utility container
    template: container
    module_group: oci-tools
    depends_on: [root]
    components:
      dockerfile:
        root: containers/git-oci

  - moniker: repository
    name: Repository Root Module
    description: Repository root module including configuration files, build tools, and git settings
    depends_on: [oci-tools]
    components:
      # Text/config files without typed extensions
      repo-config:
        type: repository
        root: /
      assets:
        root: /
        patterns:
          source:
            - "*.md"
            - ".claude/**/*.md"
            - ".github/**/*.md"
            - ".junie/**/*.md"
            - "scripts/**/*.md"
            - "release/*.md"
            - "release/eac-cli/**/*.md"
            - "release/ext-eac/**/*.md"
            - "release/r2r-cli/**/*.md"
            - ".eac/**/*.yml"
            - ".eac/**/*.yaml"
            - ".r2r/**/*.yml"
            - ".r2r/**/*.yaml"
            - ".claude/**/*.yml"
            - ".claude/**/*.yaml"
            - ".github/**/*.yml"
            - ".github/**/*.yaml"
            - ".golangci.yml"
            - ".markdownlint.yml"
            - ".markdownlint-cli2.yaml"
            - "cspell.config.yml"
            - "r2r-cli.yml"
            - ".mcp.json"
            - ".eac/**/*.json"
            - ".vscode/**/*.json"
            - ".vscode/**/*.css"
            - ".vscode/**/*.template"
            - ".claude/**/*.json"
            - "specs/.risk-controls/*.json"
            - "LICENSE"
            - "LICENSE.*"
      workflows: {}
      bash:
        root: /
        patterns:
          source:
            - "scripts/sh/claude/**/*.sh"
            - "scripts/sh/vscode/**/*.sh"
            - "importer.sh"
      pwsh:
        root: /
        patterns:
          source:
            - "scripts/pwsh/claude/**/*.ps1"
            - "scripts/pwsh/local-dev/**/*.ps1"
            - "importer.ps1"
      go:
        root: go/specs/repository
        patterns:
          config: [go.mod, go.sum]
      godog:
        root: go/specs/repository
      # gherkin, structurizr auto-inferred from specs/repository/

      # Pre-built markdown command fragments for report book
      markdown-commands:
        type: docs-markdown-commands
        config:
          book: report

      # Repository report PDF
      report:
        type: docs-pdf
        config:
          book: report

  - moniker: core
    name: Core Domain Library
    description: Core domain libraries for configuration, modules, scheduling, and tools
    template: go-library
    depends_on: [contracts-core, contracts-scanner]
    components:
      go:
        root: go/core
        patterns:
          source: ["**/*.go", "**/*.json"]
          data:
            - "testing/testdata/**/*"
            - "specs/gherkin/testdata/**/*.feature"
            - "github/cli_fixtures/**/*"
      # Auto-discovered: assets, godog, gherkin, structurizr

  - moniker: godog-lib
    name: Godog BDD Library
    description: BDD test infrastructure library for Godog integration
    template: go-library
    depends_on: [core]
    components:
      go:
        root: go/adapters/godog

  - moniker: clibase
    name: CLI Base Framework
    description: Shared CLI framework for orchestration, flags, and command execution
    template: go-library
    depends_on: [core]
    components:
      go:
        root: go/clibase

  - moniker: templates
    name: Project Templates
    description: Project templates for repository initialization
    components:
      templates:
        root: templates

  - moniker: ai-adapter
    name: AI Adapter
    description: AI service integration adapter
    template: go-library
    depends_on: [contracts-ai, core]
    components:
      go:
        root: go/adapters/ai

  - moniker: docker-adapter
    name: Docker Adapter
    description: Docker container runtime adapter
    template: go-library
    depends_on: [contracts-runtime, core]
    components:
      go:
        root: go/adapters/docker

  - moniker: eac-adapter
    name: EAC Command Adapter
    description: EAC command execution adapter
    template: go-library
    depends_on: [contracts-runtime, core]
    components:
      go:
        root: go/adapters/eac

  - moniker: tui-adapter
    name: TUI Adapter
    description: Terminal UI adapter for console rendering
    template: go-library
    depends_on: [contracts-tui, core, clibase]
    components:
      go:
        root: go/adapters/tui

  - moniker: cucumber-adapter
    name: Cucumber Test Runner
    description: Cucumber/Gherkin test runner adapter for TypeScript BDD execution
    template: go-library
    depends_on: [core, clibase]
    components:
      go:
        root: go/adapters/cucumber

  - moniker: gotest-adapter
    name: Go Test Runner
    description: Go test runner adapter for unit and integration test execution
    template: go-library
    depends_on: [core, clibase]
    components:
      go:
        root: go/adapters/gotest

  - moniker: mocha-adapter
    name: Mocha Test Runner
    description: Mocha test runner adapter for TypeScript unit test execution
    template: go-library
    depends_on: [core, clibase]
    components:
      go:
        root: go/adapters/mocha

  - moniker: npm-adapter
    name: NPM Adapter
    description: NPM package manager adapter for dependency isolation
    template: go-library
    depends_on: [core, clibase]
    components:
      go:
        root: go/adapters/npm

  - moniker: docs
    name: Documentation Site
    description: MkDocs HTML documentation site for GitHub Pages
    versioning:
      scheme: CalVer
      release_type: published
    depends_on: [contracts-docs, repository, oci-tools]
    components:
      # HTML site (tool chain: preprocess -> mkdocs-render-oci)
      site:
        type: docs-site
        root: docs
        config:
          book: site
        amp:
          build: 1.25
      assets:
        root: docs
        patterns:
          source:
            - "**/*.md"
            - "**/*.markdown"
            - "**/.nav.yml"
            - "mkdocs.yml"
            - "assets/**/*.drawio.png"
            - "assets/**/*.png"
            - "assets/**/*.jpg"
            - "assets/**/*.svg"
            - "assets/**/*.css"
            - "assets/**/*.scss"
            - "assets/**/*.js"
            - "assets/**/*.pdf"
            - "assets/**/*.drawio"
            - "assets/*.json"
            - "assets/*.yml"
            - "LICENSE"
            - "LICENSE.*"
      # structurizr auto-inferred

      # Diagram rendering components (build before site/PDFs via build_after)
      drawio:
        type: docs-drawio
        root: docs/assets
      mermaid:
        type: docs-mermaid
        root: docs
        # source patterns now come from component-type default: ["**/*.md"]

      # Diataxis PDF components (tool chain: preprocess -> pdf-oci)
      tutorials:
        type: docs-pdf
        config:
          book: tutorials
      howto:
        type: docs-pdf
        config:
          book: howto
      explanation:
        type: docs-pdf
        config:
          book: explanation
      reference:
        type: docs-pdf
        config:
          book: reference

  - moniker: eac-cli
    name: Go Commands Library
    description: Go library containing CLI command implementations
    template: go-exe
    depends_on: [core, clibase, godog-lib, ai-adapter, docker-adapter, eac-adapter, tui-adapter, cucumber-adapter, gotest-adapter, mocha-adapter, npm-adapter, oci-tools]
    artifact_matrix: cross-platform-upx
    components:
      go:
        root: go/cli/eac
        build:
          binary_name: eac
        patterns:
          data:
            - "testdata/**/*.txt"
            - "testdata/**/*.yml"
            - "testdata/**/*.yaml"
            - "specs/assets/**/*.txt"
            - "specs/assets/**/*.json"
            - "specs/assets/**/*.md"
            - "impl/**/assets/**/*.txt"
            - "impl/**/assets/**/*.json"
      # godog: explicit (no godog_test.go at go/cli/eac/specs yet)
      godog:
        root: go/cli/eac/specs
      # Absorbed from eac-installer:
      bash-installer:
        type: bash
        root: scripts/sh/eac
      pwsh-installer:
        type: pwsh
        root: scripts/pwsh/eac
      godog-installer:
        type: godog
        root: go/cli/eac/specs/installer
      # Absorbed from implicit-cli:
      bash-invoker:
        type: bash
        root: scripts/sh/go-invoker
        patterns:
          source: ["**/*.sh", "../../../importer.sh"]
      pwsh-invoker:
        type: pwsh
        root: scripts/pwsh/go-invoker
        patterns:
          source: ["**/*.ps1", "**/*.psm1", "../../../importer.ps1"]
      godog-invoker:
        type: godog
        root: go/cli/eac/specs/implicit-cli
      # Absorbed from implicit-cli specs:
      gherkin-invoker:
        type: gherkin
        root: specs/eac-cli/implicit-cli
      structurizr-invoker:
        type: structurizr
        root: specs/eac-cli/implicit-cli/.design
      # gherkin, structurizr, assets: auto-discovered

  - moniker: r2r-cli
    name: The CLI of CLIs
    description: The extendable go-based CLI tool
    template: go-exe
    depends_on: [contracts-r2r-cli, oci-tools]
    artifact_matrix: cross-platform-upx
    evidence_books: [release-evidence-r2r-cli]
    components:
      # go: override source to include embedded JSON
      go:
        root: go/cli/r2r
        build:
          binary_name: r2r
        patterns:
          source: ["**/*.go", "**/*.json"]
          data: ["internal/validator/config/**/*.json"]
      # Absorbed from r2r-installer:
      bash:
        root: scripts/sh/cli
      pwsh:
        root: scripts/pwsh/cli
      godog-installer:
        type: godog
        root: go/cli/r2r/specs/installer
      # Absorbed from r2r-installer specs:
      gherkin-installer:
        type: gherkin
        root: specs/r2r-cli/installer
      structurizr-installer:
        type: structurizr
        root: specs/r2r-cli/installer/.design
      # gherkin, structurizr: auto-discovered from specs/r2r-cli/

  - moniker: vscode-commit
    name: VSCode Extension - Git Commit
    description: VSCode extension providing Git toolbar and Claude MCP integration UI
    template: vscode-extension
    depends_on: [eac-cli, oci-tools]
    components:
      typescript:
        root: typescript/vscode-commit
        patterns:
          config: ["package.json", "tsconfig.json", "*.config.js", "cucumber.js", ".mocharc.json", ".vscodeignore"]
        build:
          post_build:
            copy_to: ".vscode/extensions/vscode-commit/out"
            copy_files:
              - from: package.json
                to: ".vscode/extensions/vscode-commit/package.json"

  - moniker: eac-mcp-server
    name: EAC MCP Server
    description: MCP server exposing EAC commands for AI assistant integration
    template: go-internal
    depends_on: [eac-cli, oci-tools]
    artifact_matrix: single-platform
    components:
      go: go/mcp/commands

  - moniker: ext-eac
    name: EAC Extension for R2R CLI
    description: Docker-based extension providing EAC (Everything as Code) for R2R CLI integration
    template: container-multiarch
    versioning:
      scheme: SemVer
      changelog: release/ext-eac/CHANGELOG.md
      release_type: published
    evidence_books: [release-evidence-ext-eac]
    depends_on: [eac-cli, oci-tools]
    depends_on_ci: [r2r-cli]
    components:
      dockerfile:
        root: containers/ext-eac
        docker_build:
          context: "."
        build:
          artifacts:
            - id: image
              type: image
              pattern: "{moniker}:latest"
      # structurizr auto-inferred

  - moniker: r2r-eac-bundle
    name: Release Bundle
    description: Aggregated release bundle with links to all module releases
    versioning:
      scheme: SemVer
      changelog: release/r2r-eac-bundle/CHANGELOG.md
      release_type: bundle
    depends_on: [eac-cli, r2r-cli, ext-eac, docs, repository, oci-tools]
    evidence_books: [release-evidence-r2r-eac-bundle]
    release_bundle:
      title_format: "r2r-({r2r_version}) ∞ eac-({eac_version}) ∞ eac-({ext-eac_version})"
      headline:
        r2r: r2r-cli
        eac: eac
        ext-eac: ext-eac
      categories:
        - name: Core Tools
          description: CLI tools and extensions
          modules:
            - eac-cli
            - r2r-cli
            - ext-eac
        - name: Documentation
          description: Documentation and guides
          modules:
            - docs
            - repository
    components:
      assets: release/r2r-eac-bundle
