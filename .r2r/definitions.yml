# Repository-wide definitions and constraints
# This file controls versioning behavior across all modules

versioning:
  # Global constraint on version bumping
  # Options: "unrestricted", "patch-only", "calver-only"
  #
  # - unrestricted: Allow major, minor, and patch bumps based on conventional commits
  # - patch-only: For semver modules, only allow patch bumps (0.0.x → 0.0.x+1)
  # - calver-only: Force all modules to use calendar versioning
  #
  # This is a stop-block for early development phases where we want to
  # avoid accidental major/minor version bumps until the project is mature.
  constraint: "patch-only"

  # When constraint is "patch-only", breaking changes and features
  # are still recorded in the changelog but don't trigger version bumps
  # beyond patch level. This preserves commit history while controlling versions.
  #
  # Set to "unrestricted" when ready to start semantic versioning properly.
