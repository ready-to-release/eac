# Agent AI Provider Configuration
#
# This file configures which AI provider the agent CLI commands will use.
# It is safe to commit to version control as it contains no secrets.
#
# Default provider: claude-cli
# - Uses Claude Pro subscription authentication via the Claude CLI
# - Requires Claude Pro subscription and `claude` CLI to be installed
# - No API keys required
#
# To change the provider, run: r2r agent init --ai <provider>
# Supported providers: claude-cli, claude-api, openai, gemini

provider:
  name: claude-cli
  model: claude-3-5-sonnet-20241022
