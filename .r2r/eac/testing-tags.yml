# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/testing-tags.schema.json
# Test Tagging System Specification
# Contract for test classification and dependency management

# ============================================================================
# Tag Definitions
# ============================================================================

tags:
  # System Dependency Pattern
  - tag: "@deps:<system-dependency>"
    description: "Requires specific system dependency or OS platform"
    type: system_dependency
    pattern: "^@deps:(?P<system_dependency>[a-z0-9-]+)$"
    example: "@deps:docker"
    note: "Valid names: system-dependencies.yml entries or OS platforms (linux, macos, windows)"

  - tag: "@depm:<module-name>"
    description: "Requires specific module dependency from module contracts"
    type: module_dependency
    pattern: "^@depm:(?P<module_name>[a-z0-9-]+)$"
    example: "@depm:r2r-cli"
    note: "Valid module names are loaded from module contracts at runtime"

  - tag: "@env:<env-moniker>"
    description: "Requires specific test environment"
    type: environment
    pattern: "^@env:(?P<env_moniker>[a-z0-9-]+)$"
    example: "@env:isolated-test-project"
    note: "Valid environment monikers are defined in environment_monikers section"

  - tag: "@L0"
    name: "Very Fast Unit Tests with direct access to source files and build artifacts"
    type: taxonomy-level

  - tag: "@L1"
    name: "Fast Unit Tests with direct access to source files and build artifacts"
    type: taxonomy-level

  - tag: "@L2"
    name: "Emulated System Tests with access to emulator and build artifacts"
    type: taxonomy-level

  - tag: "@L3"
    name: "Production-like System Tests with access to in-situ environment and build artifacts deployed to it"
    type: taxonomy-level

  - tag: "@L4"
    name: "Production System Tests with access to in-situ environment and build artifacts deployed to it"
    type: taxonomy-level

  - tag: "@HE2E"
    name: "Horizontal end-to-end tests spanning multiple systems and services"
    type: taxonomy-level

  - tag: "@ov"
    name: "Operational Verification"
    description: "Functional tests verifying feature behavior"
    type: verification

  - tag: "@iv"
    name: "Installation Verification"
    type: verification

  - tag: "@pv"
    name: "Performance Verification"
    description: "Load tests and performance benchmarks"
    type: verification

  - tag: "@piv"
    name: "Production Installation Verification"
    description: "Smoke tests in production post-deployment"
    type: verification

  - tag: "@ppv"
    name: "Production Performance Verification"
    description: "Production monitoring and performance validation"
    type: verification

  - tag: "@skip:<reason>"
    description: "Exclude from test suite runs with documented reason"
    type: execution_control
    level: feature-or-scenario
    pattern: "^@skip:(?P<reason>[a-z]+)$"
    example: "@skip:wip"

  - tag: "@skip"
    description: "Exclude from test suite runs (simple form without reason)"
    type: execution_control
    level: feature-or-scenario

  - tag: "@pending"
    description: "Test is pending implementation or review"
    type: execution_control
    level: feature-or-scenario

  - tag: "@Manual"
    description: "Manual test requiring human execution and evidence collection (cannot have L0-L4 taxonomy tags)"
    type: execution_control
    level: scenario
    constraint: "mutually_exclusive_with_taxonomy_levels"

  # ============================================================================
  # OSCAL Control Traceability
  # ============================================================================

  - tag: "@control:<control-id>"
    description: "Link to OSCAL control from risk profile (enables evidence collection)"
    type: oscal_control
    level: scenario
    pattern: "^@control:(?P<family>[a-z]{2,4})-(?P<number>[0-9]+)(?:\\((?P<enhancement>[0-9]+)\\))?$"
    examples:
      - "@control:ac-2"
      - "@control:au-3"
      - "@control:ia-5(1)"
      - "@control:cis-5.1"
    note: |
      Links scenario to OSCAL control for automated compliance evidence collection.
      When create risk-assess runs, it will collect test results for tagged scenarios
      and link them to controls in assessment-results.json. Control IDs must exist
      in the catalog and should align with the module's risk profile.

  - tag: "@controls:<id1>,<id2>"
    description: "Multiple OSCAL controls (comma-separated, no spaces)"
    type: oscal_control_multi
    level: scenario
    pattern: "^@controls:(?P<ids>(?:[a-z]{2,4}-[0-9]+(?:\\([0-9]+\\))?,)*[a-z]{2,4}-[0-9]+(?:\\([0-9]+\\))?)$"
    examples:
      - "@controls:ac-2,au-3,ia-5"
      - "@controls:ac-6(1),ac-6(2)"
    note: "Use when a single scenario provides evidence for multiple controls"

  - tag: "@gxp"
    description: "GxP-related requirement (should have @control: tag linking to relevant control)"
    type: gxp_regulatory
    level: feature-or-scenario
    note: "GxP scenarios should link to OSCAL controls using @control: tags"

  - tag: "@gmp-critical-aspect"
    description: "GmP Critical Aspect (GmP products only, must be used with @gxp)"
    type: gxp_regulatory
    level: scenario

# ============================================================================
# Tag Type Definitions
# ============================================================================

types:
  - type: system_dependency
    description: "External system dependencies required for test execution (e.g., docker, git, go, linux, macos, windows)"

  - type: module_dependency
    description: "Internal module dependencies required for test execution (e.g., r2r-cli, eac-commands, eac-core)"

  - type: environment
    description: "Test environment requirements (e.g., isolated test projects, specific configurations)"

  - type: taxonomy-level
    description: "Test environment complexity and isolation level (L0-L4)"

  - type: verification
    description: "What aspect of the system is being verified (operational, installation, performance)"

  - type: safety
    description: "Tags related to test isolation, cleanup, and risk tracking"

  - type: execution_control
    description: "Control test execution behavior (ignore, manual, skip)"

  - type: test_behavior
    description: "Test behavior and isolation characteristics"

  - type: oscal_control
    description: "Link scenarios to OSCAL security controls for compliance evidence collection"

  - type: oscal_control_multi
    description: "Link scenarios to multiple OSCAL controls (comma-separated)"

  - type: gxp_regulatory
    description: "GxP regulatory classification and critical aspects"

# ============================================================================
# Skip Reason Codes
# ============================================================================

skip_reasons:
  - code: wip
    name: "Work In Progress"
    description: "Test implementation not yet complete"

  - code: broken
    name: "Broken Test"
    description: "Test is broken and needs fixing"

  - code: flaky
    name: "Flaky Test"
    description: "Test intermittently fails, needs stabilization"

  - code: deprecated
    name: "Deprecated Feature"
    description: "Feature deprecated, test kept for reference"

  - code: blocked
    name: "Blocked"
    description: "Blocked by external dependency or decision"
