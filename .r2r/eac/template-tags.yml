# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/template-tags.schema.json
# Template Tagging System Specification
# Contract for risk control template classification and metadata

# ============================================================================
# Tag Definitions
# ============================================================================

tags:
  # Industry Classification
  - tag: "@industry:<industry-code>"
    description: "Industry vertical this control applies to"
    type: industry
    pattern: "^@industry:(?P<industry_code>[A-Z]+)$"
    example: "@industry:PHARMA"
    context: comment

  # Severity Classification
  - tag: "@severity:<level>"
    description: "Severity level of the risk if control is not implemented"
    type: severity
    pattern: "^@severity:(?P<level>[a-z]+)$"
    example: "@severity:critical"
    context: comment

  # Risk Type Classification
  - tag: "@risk-type:<type>"
    description: "Category of risk the control mitigates"
    type: risk_type
    pattern: "^@risk-type:(?P<type>[a-z-]+)$"
    example: "@risk-type:security"
    context: comment

  # Control Type Classification
  - tag: "@control-type:<type>"
    description: "Type of control mechanism"
    type: control_type
    pattern: "^@control-type:(?P<type>[a-z]+)$"
    example: "@control-type:preventive"
    context: comment

  # Implementation Status
  - tag: "@implementation:<status>"
    description: "Implementation requirement level"
    type: implementation
    pattern: "^@implementation:(?P<status>[a-z]+)$"
    example: "@implementation:required"
    context: comment

  # Automation Level
  - tag: "@automation:<level>"
    description: "Degree of automation possible for this control"
    type: automation
    pattern: "^@automation:(?P<level>[a-z]+)$"
    example: "@automation:full"
    context: comment

  # Risk Control Identifiers (Gherkin tags)
  - tag: "@risk-control:<name>"
    description: "Feature-level risk control identifier"
    type: risk_control
    pattern: "^@risk-control:(?P<name>[a-z0-9-]+)$"
    example: "@risk-control:auth-mfa"
    context: gherkin

  - tag: "@risk-control:<name>-<id>"
    description: "Scenario-level risk control with numeric identifier"
    type: risk_control_scenario
    pattern: "^@risk-control:(?P<name>[a-z0-9-]+)-(?P<id>[0-9]{2})$"
    example: "@risk-control:auth-mfa-01"
    context: gherkin

  # Compliance Standards (standalone tags)
  - tag: "@iso27001"
    description: "ISO/IEC 27001 Information Security"
    type: compliance_standard
    context: comment

  - tag: "@hipaa"
    description: "Health Insurance Portability and Accountability Act"
    type: compliance_standard
    context: comment

  - tag: "@pci-dss"
    description: "Payment Card Industry Data Security Standard"
    type: compliance_standard
    context: comment

  - tag: "@fda-21cfr11"
    description: "FDA 21 CFR Part 11 Electronic Records"
    type: compliance_standard
    context: comment

  - tag: "@nist-800-53"
    description: "NIST Special Publication 800-53 Security Controls"
    type: compliance_standard
    context: comment

  - tag: "@sox"
    description: "Sarbanes-Oxley Act"
    type: compliance_standard
    context: comment

  - tag: "@owasp"
    description: "OWASP Security Guidelines"
    type: compliance_standard
    context: comment

  - tag: "@gdpr"
    description: "General Data Protection Regulation"
    type: compliance_standard
    context: comment

  - tag: "@ccpa"
    description: "California Consumer Privacy Act"
    type: compliance_standard
    context: comment

  - tag: "@fedramp"
    description: "Federal Risk and Authorization Management Program"
    type: compliance_standard
    context: comment

  - tag: "@soc2"
    description: "Service Organization Control 2"
    type: compliance_standard
    context: comment

  # Medical Device Regulations
  - tag: "@mdr"
    description: "EU Medical Device Regulation"
    type: compliance_standard
    context: comment

  - tag: "@ivdr"
    description: "EU In Vitro Diagnostic Regulation"
    type: compliance_standard
    context: comment

  - tag: "@iso13485"
    description: "ISO 13485 Medical Device Quality Management"
    type: compliance_standard
    context: comment

  - tag: "@iec62304"
    description: "IEC 62304 Medical Device Software Lifecycle"
    type: compliance_standard
    context: comment

  - tag: "@fda-premarket"
    description: "FDA Premarket Submission Requirements"
    type: compliance_standard
    context: comment

  - tag: "@imdrf"
    description: "International Medical Device Regulators Forum"
    type: compliance_standard
    context: comment

  - tag: "@iso14971"
    description: "ISO 14971 Medical Device Risk Management"
    type: compliance_standard
    context: comment

  # GxP and Pharmaceutical
  - tag: "@gxp"
    description: "Good Practice (GxP) Regulatory Requirements"
    type: gxp_regulatory
    context: comment

  - tag: "@gmp-critical-aspect"
    description: "GMP Critical Quality Aspect"
    type: gxp_regulatory
    context: comment

  - tag: "@gamp5"
    description: "GAMP 5 Computer System Validation"
    type: compliance_standard
    context: comment

  - tag: "@alcoa-plus"
    description: "ALCOA+ Data Integrity Principles"
    type: compliance_standard
    context: comment

  # AI/ML Governance
  - tag: "@eu-ai-act"
    description: "EU Artificial Intelligence Act"
    type: compliance_standard
    context: comment

  - tag: "@nist-ai-rmf"
    description: "NIST AI Risk Management Framework"
    type: compliance_standard
    context: comment

  - tag: "@iso42001"
    description: "ISO 42001 AI Management System"
    type: compliance_standard
    context: comment

  # Privacy Regulations
  - tag: "@lgpd"
    description: "Lei Geral de Proteção de Dados (Brazil)"
    type: compliance_standard
    context: comment

  - tag: "@eidas"
    description: "eIDAS Electronic Identification Regulation"
    type: compliance_standard
    context: comment

  - tag: "@esign-act"
    description: "US ESIGN Act Electronic Signatures"
    type: compliance_standard
    context: comment

  # Security Frameworks
  - tag: "@csa-ccm"
    description: "Cloud Security Alliance Cloud Controls Matrix"
    type: compliance_standard
    context: comment

  - tag: "@fips-140-2"
    description: "FIPS 140-2 Cryptographic Module Validation"
    type: compliance_standard
    context: comment

  - tag: "@fips-140-3"
    description: "FIPS 140-3 Cryptographic Module Validation"
    type: compliance_standard
    context: comment

  - tag: "@iso27017"
    description: "ISO 27017 Cloud Security Controls"
    type: compliance_standard
    context: comment

  - tag: "@iso27018"
    description: "ISO 27018 Cloud Privacy"
    type: compliance_standard
    context: comment

  - tag: "@slsa"
    description: "Supply Chain Levels for Software Artifacts"
    type: compliance_standard
    context: comment

  - tag: "@nist-ssdf"
    description: "NIST Secure Software Development Framework"
    type: compliance_standard
    context: comment

  - tag: "@nist-sp800-124"
    description: "NIST SP 800-124 Mobile Device Security"
    type: compliance_standard
    context: comment

  - tag: "@owasp-masvs"
    description: "OWASP Mobile Application Security Verification Standard"
    type: compliance_standard
    context: comment

  # Risk Management
  - tag: "@iso31000"
    description: "ISO 31000 Risk Management"
    type: compliance_standard
    context: comment

# ============================================================================
# Tag Type Definitions
# ============================================================================

types:
  - type: industry
    description: "Industry vertical classification for filtering relevant controls"

  - type: severity
    description: "Risk severity level if control is not implemented"

  - type: risk_type
    description: "Category of risk the control addresses"

  - type: control_type
    description: "Type of control mechanism (preventive, detective, corrective)"

  - type: implementation
    description: "Implementation requirement level"

  - type: automation
    description: "Degree of automation possible"

  - type: risk_control
    description: "Feature-level risk control identifier"

  - type: risk_control_scenario
    description: "Scenario-level risk control with test case ID"

  - type: compliance_standard
    description: "Regulatory compliance standard or framework"

# ============================================================================
# Valid Values for Parameterized Tags
# ============================================================================

industry_codes:
  - code: PHARMA
    name: "Pharmaceutical"
    description: "Pharmaceutical industry (FDA, EMA regulated)"

  - code: MEDDEV
    name: "Medical Devices"
    description: "Medical device industry (FDA, MDR regulated)"

  - code: HEALTH
    name: "Healthcare"
    description: "Healthcare and hospital systems (HIPAA)"

  - code: FINANCE
    name: "Financial Services"
    description: "Banking and financial services (SOX, PCI-DSS)"

  - code: GENERAL
    name: "General"
    description: "General industry, no specific regulatory requirements"

  - code: GOVCLOUD
    name: "Government Cloud"
    description: "Government cloud services (FedRAMP)"

severity_levels:
  - code: critical
    name: "Critical"
    description: "Immediate business impact, regulatory violation"

  - code: high
    name: "High"
    description: "Significant business impact within days"

  - code: medium
    name: "Medium"
    description: "Moderate business impact"

  - code: low
    name: "Low"
    description: "Minor business impact"

risk_types:
  - code: security
    name: "Security"
    description: "Information security and access control"

  - code: compliance
    name: "Compliance"
    description: "Regulatory compliance requirements"

  - code: operational
    name: "Operational"
    description: "Operational continuity and availability"

  - code: data
    name: "Data"
    description: "Data integrity and privacy"

  - code: financial
    name: "Financial"
    description: "Financial reporting and controls"

control_types:
  - code: preventive
    name: "Preventive"
    description: "Prevents violations from occurring"

  - code: detective
    name: "Detective"
    description: "Detects violations after occurrence"

  - code: corrective
    name: "Corrective"
    description: "Corrects violations after detection"

implementation_levels:
  - code: required
    name: "Required"
    description: "Must be implemented for compliance"

  - code: recommended
    name: "Recommended"
    description: "Should be implemented for best practices"

  - code: optional
    name: "Optional"
    description: "Nice to have, not required"

automation_levels:
  - code: full
    name: "Full Automation"
    description: "Can be fully automated"

  - code: partial
    name: "Partial Automation"
    description: "Some manual steps required"

  - code: manual
    name: "Manual"
    description: "Requires manual execution"
