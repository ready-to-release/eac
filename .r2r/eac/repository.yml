# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/repository.schema.json
#
# Unified Repository Configuration
# Contains repository settings, paths, conventions, and module contracts
#

# Repository settings
repository:
  type: mono
  # Remote VCS repository configuration (type defaults to github, URLs derived from owner+repo)
  remote:
    owner: ready-to-release
    repo: eac
  # Parallelism limits for build and test commands
  # CI uses lower limits to avoid resource contention on shared GitHub Actions runners
  parallelism:
    ci: 4 # Max parallel workers in CI (GitHub Actions)
    devbox: 8 # Max parallel workers in local development

# Module Contracts
# Component defaults (files.source, files.tests, files.config) loaded from component-types
# Ordered by dependency layer (Layer 0 first, then Layer 1, etc.)
modules:
  # ============================================================================
  # LAYER 0 - Root modules (no dependencies)
  # ============================================================================

  - moniker: repository
    name: Repository Root Module
    description: Repository root module including configuration files, build tools, and git settings
    components:
      # Text/config files without typed extensions
      repo-config:
        type: repository
        root: /
      markdown:
        root: /
        patterns:
          source: ["*.md", "*.markdown", ".claude/**/*.md", "scripts/**/*.md", "release/README.md", "release/r2r-cli/*.md", "release/ext-eac/*.md", "release/docs/*.md", "release/books/*.md"]
      yaml:
        root: /
        patterns:
          source: [.r2r/**/*.yml, .r2r/**/*.yaml, .golangci.yml, .markdownlint.yml, .markdownlint-cli2.yaml, cspell.config.yml, .claude/**/*.yml, .claude/**/*.yaml, r2r-cli.yml]
      json:
        root: /
        patterns:
          source: [.mcp.json, .vscode/**/*.json, .claude/**/*.json, specs/.risk-controls/*.json]
      testdata:
        type: testdata
        root: /
        patterns:
          source: [".vscode/*.css", ".vscode/*.template"]
      bash:
        root: /
        patterns:
          source: [test-repository-validations.sh, scripts/sh/claude/**/*.sh, scripts/sh/vscode/**/*.sh, importer.sh]
      pwsh:
        root: /
        patterns:
          source: [scripts/pwsh/claude/**/*.ps1, scripts/pwsh/local-dev/**/*.ps1, importer.ps1]
      test-impl: ~
      gherkin: ~
      structurizr: ~

  - moniker: contracts
    name: Contract Files Module
    description: Go module providing embedded contract files (schemas, EBNF, defaults) for consumption by other modules
    template: go-library
    parameters:
      go_root: contracts
    components:
      testdata:
        type: testdata
        root: contracts
        patterns:
          source: ["**/*.ebnf"]

  - moniker: eac-core
    name: Core Domain Libraries
    description: Core library containing contracts and repository operations
    versioning:
      scheme: Implicit
      release_type: none
    components:
      go:
        root: go/eac/core
        patterns:
          source: ["**/*.go", "specs/gherkin/testdata/**/*.feature"]
          tests: ["**/*_test.go"]
          config: [go.mod, go.sum, contracts/schema/schemas/*.json]
      markdown: go/eac/core
      json: contracts/eac-core
      yaml:
        root: contracts/eac-core
        patterns:
          source: ["**/*.yml", "**/*.yaml"]
      testdata:
        type: testdata
        root: go/eac/core/testing/testdata
      gherkin: ~
      structurizr: ~
      test-impl: ~

  - moniker: mkdocs-pdf
    name: MkDocs PDF Container
    description: Pre-built Docker container for MkDocs PDF generation (Chromium, Playwright)
    template: container
    components:
      json: containers/mkdocs-pdf
      testdata:
        type: testdata
        root: containers/mkdocs-pdf
        patterns:
          source: ["*.txt", "overrides/**/*.html"]

  - moniker: mkdocs-site
    name: MkDocs Site Container
    description: Pre-built Docker container for MkDocs HTML site generation
    template: container
    components:
      testdata:
        type: testdata
        root: containers/mkdocs-site
        patterns:
          source: ["*.txt", "*.py"]

  - moniker: mermaid-cli
    name: Mermaid CLI Container
    description: Container for Mermaid diagram rendering
    template: container
    components:
      json: containers/mermaid-cli

  - moniker: pdf-tools
    name: PDF Tools Container
    description: Container for PDF processing tools
    template: container

  - moniker: static-site
    name: Static Site Container
    description: Container for static site serving with nginx
    template: container
    components:
      testdata:
        type: testdata
        root: containers/static-site
        patterns:
          source: ["*.conf"]

  - moniker: git-filter-repo
    name: Git Filter Repo Container
    description: Container for git-filter-repo operations
    template: container
    components:
      testdata:
        type: testdata
        root: containers/git-filter-repo
        patterns:
          source: ["*.sh"]

  - moniker: gource
    name: Gource Container
    description: Container for Gource visualization rendering
    template: container
    components:
      testdata:
        type: testdata
        root: containers/gource
        patterns:
          source: ["*.sh", "*.html", "*.conf"]

  # ============================================================================
  # LAYER 1 - Depends on Layer 0
  # ============================================================================

  - moniker: docs
    name: Documentation Site
    description: MkDocs HTML documentation site for GitHub Pages
    versioning:
      scheme: CalVer
      changelog: release/docs/CHANGELOG.md
      release_type: published
    depends_on: [repository, mkdocs-site]
    components:
      site:
        type: book
        root: docs
        amp:
          build: 1.25
      markdown: docs
      yaml:
        root: docs
        patterns:
          source: ["**/.nav.yml", "mkdocs.yml"]
      assets:
        type: docs-assets
        root: docs/assets
        patterns:
          source: ["**/*.png", "**/*.jpg", "**/*.svg", "**/*.css", "**/*.scss", "**/*.js", "**/*.pdf", "**/*.drawio", "*.json", "*.yml"]
      json: contracts/eac-docs
      testdata:
        type: testdata
        root: docs
        patterns:
          source: ["LICENSE"]
      structurizr: ~

  - moniker: eac-commands
    name: Go Commands Library
    description: Go library containing CLI command implementations
    versioning:
      scheme: SemVer
      changelog: go/eac/commands/CHANGELOG.md
      release_type: internal
    depends_on: [eac-core]
    components:
      go:
        root: go/eac/commands
        build:
          artifacts:
            - id: commands
              type: executable
              pattern: "commands{ext}"
      markdown: go/eac/commands
      gherkin: ~
      structurizr: ~
      test-impl: ~
      testdata:
        type: testdata
        root: go/eac/commands/testdata
        patterns:
          source: ["**/*.txt", "**/*.yml", "**/*.yaml"]
      test-assets:
        type: testdata
        root: go/eac/specs/impl/eac-commands/assets
        patterns:
          source: ["**/*.txt", "**/*.json", "**/*.md"]
      dockerfile:
        root: containers/drawio-cli
        docker_build:
          container: "drawio-cli"
          context: "containers/drawio-cli"
          dockerfile: "containers/drawio-cli/Dockerfile"
          platforms: [linux/amd64]
          push: false
      drawio-scripts:
        type: testdata
        root: containers/drawio-cli
        patterns:
          source: ["**/*.py", "requirements.txt", "templates/*.xml"]

  - moniker: eac-specs
    name: Test Infrastructure
    description: Shared godog test infrastructure (internal utilities only)
    depends_on: [eac-core]
    components:
      go:
        root: go/eac/specs
        patterns:
          source: [internal/**/*.go]
          tests: [internal/**/*_test.go]
          config: [go.mod, go.sum]

  - moniker: r2r-cli
    name: The CLI of CLIs
    description: The extendable go-based CLI tool
    versioning:
      scheme: SemVer
      changelog: release/r2r-cli/CHANGELOG.md
      release_type: published
    evidence_books: [release-evidence-r2r-cli]
    depends_on: [contracts]
    components:
      go:
        root: go/r2r/cli
        build:
          artifacts:
            - id: linux-amd64
              type: executable
              pattern: "r2r-linux-amd64"
            - id: linux-arm64
              type: executable
              pattern: "r2r-linux-arm64"
            - id: darwin-amd64
              type: executable
              pattern: "r2r-darwin-amd64"
            - id: darwin-arm64
              type: executable
              pattern: "r2r-darwin-arm64"
            - id: windows-amd64
              type: executable
              pattern: "r2r-windows-amd64.exe"
            - id: linux-amd64-upx
              type: executable
              pattern: "r2r-linux-amd64-upx"
              compression: upx
              derive_from: "r2r-linux-amd64"
            - id: windows-amd64-upx
              type: executable
              pattern: "r2r-windows-amd64-upx.exe"
              compression: upx
              derive_from: "r2r-windows-amd64.exe"
      markdown: go/r2r/cli
      json: contracts/r2r-cli
      yaml: contracts/r2r-cli
      testdata: ~
      gherkin: ~
      structurizr: ~
      test-impl: ~

  - moniker: templates
    name: Project Templates
    description: Template files for documentation, specifications, and design records
    depends_on: [repository]
    components:
      markdown: templates
      yaml: templates
      gherkin: templates
      json: templates
      testdata:
        type: testdata
        root: templates
        patterns:
          source: ["**/*.template"]
      structurizr: ~

  - moniker: vscode-ext-commit
    name: VSCode Extension - Git Commit
    description: VSCode extension providing Git toolbar and Claude MCP integration UI
    versioning:
      scheme: SemVer
      changelog: typescript/vscode-ext-commit/CHANGELOG.md
      release_type: internal
    depends_on: [repository]
    components:
      typescript:
        root: typescript/vscode-ext-commit
        patterns:
          source: ["**/*.ts", "**/*.tsx", "**/*.js"]
          tests: [test/**/*.test.ts]
          config: ["*.json", ".mocharc.json", ".vscodeignore"]
        build:
          post_build:
            copy_to: ".vscode/extensions/vscode-ext-commit/out"
      markdown: typescript/vscode-ext-commit
      json: contracts/vscode-commit
      gherkin: ~
      structurizr: ~

  # ============================================================================
  # LAYER 2 - Depends on Layer 1
  # ============================================================================

  - moniker: books
    name: PDF Books
    description: PDF documentation books for offline reading and distribution
    versioning:
      scheme: CalVer
      changelog: release/books/CHANGELOG.md
      release_type: published
    depends_on: [docs, eac-commands, mkdocs-pdf]
    components:
      tutorials:
        type: book
      howto:
        type: book
      explanation:
        type: book
      reference:
        type: book
      reference-eac:
        type: book
      reference-r2r:
        type: book
      repository-report:
        type: book
      markdown:

  - moniker: eac-mcp-commands
    name: Go Commands MCP Server
    description: Internal MCP server for Commands
    versioning:
      scheme: SemVer
      changelog: go/eac/mcp/commands/CHANGELOG.md
      release_type: internal
    depends_on: [eac-commands]
    components:
      go:
        root: go/eac/mcp/commands
        build:
          artifacts:
            - id: mcp-server
              type: executable
              pattern: "{moniker}{ext}"
      markdown: go/eac/mcp/commands
      structurizr: ~
      testdata:
        type: testdata
        root: templates/test-repositories
        patterns:
          source:
            - "**/*.go"
            - "**/*.txt"
            - "**/*.mod"
            - "**/*.ts"
            - "**/*.py"
            - "**/*.toml"
            - "**/*.cs"
            - "**/*.csproj"
            - "**/*.rs"
            - "**/*.html"
            - "**/*.conf"
            - "**/Dockerfile"
            
  - moniker: ext-eac
    name: EAC Extension for R2R CLI
    description: Docker-based extension providing EAC (Everything as Code) for R2R CLI integration
    template: container-multiarch
    versioning:
      scheme: SemVer
      changelog: release/ext-eac/CHANGELOG.md
      release_type: published
    evidence_books: [release-evidence-ext-eac]
    depends_on: [eac-commands]
    depends_on_ci: [r2r-cli]
    components:
      dockerfile:
        build:
          artifacts:
            - id: image
              type: image
              pattern: "{moniker}:latest"
      structurizr: ~

  - moniker: github
    name: GitHub Configuration
    description: GitHub cross-cutting workflows, shared custom actions, and CI/CD configuration
    depends_on: [eac-commands]
    components:
      yaml: .github
      markdown: .github
      workflows:
      gherkin: ~
      structurizr: ~

  - moniker: r2r-installer
    name: R2R CLI Installer Scripts
    description: Cross-platform installer scripts for R2R CLI
    versioning:
      scheme: SemVer
      changelog: scripts/CHANGELOG.md
      release_type: internal
    depends_on_ci: [r2r-cli]
    components:
      pwsh:
        root: scripts/pwsh/cli
      bash:
        root: scripts/sh/cli
      test-impl: ~
      gherkin: ~
      structurizr: ~

  - moniker: implicit-r2r-cli
    name: Go Command Invoker Scripts
    description: Cross-shell wrappers with tab completion for Go commands
    depends_on: [eac-commands]
    depends_on_ci: [r2r-cli]
    components:
      pwsh:
        root: scripts/pwsh/go-invoker
        patterns:
          source: ["**/*.ps1", "**/*.psm1", "../../../importer.ps1"]
      bash:
        root: scripts/sh/go-invoker
        patterns:
          source: ["**/*.sh", "../../../importer.sh"]
      gherkin: ~
      structurizr: ~
      test-impl: ~

  # ============================================================================
  # LAYER 3 - Depends on Layer 2
  # ============================================================================

  - moniker: r2r-eac-bundle
    name: Release Bundle
    description: Aggregated release bundle with links to all module releases
    versioning:
      scheme: CalVer
      changelog: release/r2r-eac-bundle/CHANGELOG.md
      release_type: bundle
    depends_on: [r2r-cli, ext-eac, docs, books]
    evidence_books: [release-evidence-r2r-eac-bundle]
    release_bundle:
      title_format: "r2r-({r2r_version}) ∞ eac-({eac_version})"
      headline:
        r2r: r2r-cli
        eac: ext-eac
      categories:
        - name: Core Tools
          description: CLI tools and extensions
          modules:
            - r2r-cli
            - ext-eac
        - name: Documentation
          description: Documentation and guides
          modules:
            - docs
            - books
    components:
      markdown: release/r2r-eac-bundle
