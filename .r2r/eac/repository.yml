# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/repository.schema.json
#
# Unified Repository Configuration
# Contains repository settings, paths, conventions, and module contracts
#

# Repository settings
repository:
  type: mono
  # Parallelism limits for build and test commands
  # CI uses lower limits to avoid resource contention on shared GitHub Actions runners
  parallelism:
    ci: 4 # Max parallel workers in CI (GitHub Actions)
    devbox: 8 # Max parallel workers in local development

# Path configuration (overrides defaults)
paths:
  test_impl_root: go/eac/specs/impl

# Module Contracts
# Component defaults (files.source, files.tests, files.config) loaded from component-types
# Ordered by dependency layer (Layer 0 first, then Layer 1, etc.)
modules:
  # ============================================================================
  # LAYER 0 - Root modules (no dependencies)
  # ============================================================================

  - moniker: repository
    name: Repository Root Module
    description: Repository root module including configuration files, build tools, and git settings
    components:
      # Text/config files without typed extensions
      repo-config:
        type: static
        root: /
        patterns:
          config:
            - LICENSE
            - .gitignore
            - .gitattributes
            - go.work
            - go.work.sum
      markdown: /
      yaml:
        root: /
        patterns:
          source:
            - .r2r/**/*.yml
            - .r2r/**/*.yaml
            - .golangci.yml
            - .markdownlint.yml
            - .markdownlint-cli2.yaml
            - cspell.config.yml
            - .claude/**/*.yml
            - .claude/**/*.yaml
      json:
        root: /
        patterns:
          source:
            - .mcp.json
            - .vscode/**/*.json
      bash:
        root: /
        patterns:
          source:
            - test-repository-validations.sh
            - scripts/sh/claude/**/*.sh
            - scripts/sh/vscode/**/*.sh
      pwsh:
        root: /
        patterns:
          source:
            - scripts/pwsh/claude/**/*.ps1
            - scripts/pwsh/local-dev/**/*.ps1
      test-impl:
        type: go
        root: go/eac/specs/impl/repository
      testdata:
        type: static
        root: go/eac/core/testing/testdata/meta-tests
      workflows:
        type: yaml
        root: .github/workflows

  - moniker: eac-core
    name: Core Domain Libraries
    description: Core library containing contracts and repository operations
    versioning:
      scheme: SemVer
    components:
      go:
        root: go/eac/core
        patterns:
          config:
            - go.mod
            - go.sum
            - contracts/schema/schemas/*.json
      markdown: go/eac/core
      json: contracts/eac-core
      workflows:
        type: yaml
        root: .github/workflows

  - moniker: release-docs
    name: Release Documentation
    description: Release notes and changelogs for published artifacts
    versioning:
      scheme: CalVer
    components:
      markdown: release

  - moniker: mkdocs-pdf
    name: MkDocs PDF Container
    description: Pre-built Docker container for MkDocs PDF generation (Chromium, Playwright)
    components:
      dockerfile:
        root: containers/mkdocs-pdf
        docker_build:
          container: "{moniker}"
          context: "containers/mkdocs-pdf"
          dockerfile: "containers/mkdocs-pdf/Dockerfile"
          platforms:
            - linux/amd64
          tags:
            - "ghcr.io/ready-to-release/{moniker}:latest"
            - "ghcr.io/ready-to-release/{moniker}:sha-{short_sha}"
          push: true
          registry: ghcr.io
          cache:
            type: gha
      markdown: containers/mkdocs-pdf
      workflows:
        type: yaml
        root: .github/workflows

  - moniker: mkdocs-site
    name: MkDocs Site Container
    description: Pre-built Docker container for MkDocs HTML site generation
    components:
      dockerfile:
        root: containers/mkdocs-site
        docker_build:
          container: "{moniker}"
          context: "containers/mkdocs-site"
          dockerfile: "containers/mkdocs-site/Dockerfile"
          platforms:
            - linux/amd64
          tags:
            - "ghcr.io/ready-to-release/{moniker}:latest"
            - "ghcr.io/ready-to-release/{moniker}:sha-{short_sha}"
          push: true
          registry: ghcr.io
          cache:
            type: gha
      markdown: containers/mkdocs-site
      workflows:
        type: yaml
        root: .github/workflows

  # ============================================================================
  # LAYER 1 - Depends on Layer 0
  # ============================================================================

  - moniker: docs
    name: Documentation Site
    description: MkDocs HTML documentation site for GitHub Pages
    versioning:
      scheme: CalVer
      changelog: release/docs/CHANGELOG.md
    depends_on:
      - repository
      - mkdocs-site
    components:
      site:
        type: book
        root: docs
      markdown: docs
      yaml:
        root: docs
        patterns:
          source:
            - "**/.nav.yml"
            - mkdocs.yml
      assets:
        type: static
        root: docs/assets
      workflows:
        type: yaml
        root: .github/workflows

  - moniker: eac-commands
    name: Go Commands Library
    description: Go library containing CLI command implementations
    versioning:
      scheme: SemVer
    depends_on:
      - eac-core
    components:
      go:
        root: go/eac/commands
        build:
          artifacts:
            - id: commands
              type: executable
              pattern: "commands{ext}"
      markdown: go/eac/commands
      workflows:
        type: yaml
        root: .github/workflows

  - moniker: eac-specs
    name: Test Infrastructure
    description: Shared godog test infrastructure (internal utilities only)
    depends_on:
      - eac-core
    components:
      go:
        root: go/eac/specs
        patterns:
          source:
            - internal/**/*.go
      gherkin: go/eac/specs

  - moniker: r2r-cli
    name: The CLI of CLIs
    description: The extendable go-based CLI tool
    versioning:
      scheme: SemVer
    evidence_books:
      - release-evidence-r2r-cli
    depends_on:
      - eac-core
    changelog: ../../../release/r2r-cli/CHANGELOG.md
    components:
      go:
        root: go/r2r/cli
        build:
          artifacts:
            - id: linux-amd64
              type: executable
              pattern: "r2r-linux-amd64"
            - id: linux-arm64
              type: executable
              pattern: "r2r-linux-arm64"
            - id: darwin-amd64
              type: executable
              pattern: "r2r-darwin-amd64"
            - id: darwin-arm64
              type: executable
              pattern: "r2r-darwin-arm64"
            - id: windows-amd64
              type: executable
              pattern: "r2r-windows-amd64.exe"
            - id: linux-amd64-upx
              type: executable
              pattern: "r2r-linux-amd64-upx"
              compression: upx
              derive_from: "r2r-linux-amd64"
            - id: windows-amd64-upx
              type: executable
              pattern: "r2r-windows-amd64-upx.exe"
              compression: upx
              derive_from: "r2r-windows-amd64.exe"
      markdown: go/r2r/cli
      json: contracts/r2r-cli
      workflows:
        type: yaml
        root: .github/workflows

  - moniker: templates
    name: Project Templates
    description: Template files for documentation, specifications, and design records
    depends_on:
      - repository
    components:
      markdown: templates
      yaml: templates
      gherkin: templates
      json: templates

  - moniker: vscode-ext-commit
    name: VSCode Extension - Git Commit
    description: VSCode extension providing Git toolbar and Claude MCP integration UI
    versioning:
      scheme: SemVer
    depends_on:
      - repository
    components:
      typescript: typescript/vscode-ext-commit
      markdown: typescript/vscode-ext-commit
      json: contracts/vscode-commit
      specs:
        type: gherkin
        root: specs/vscode-ext-commit
      workflows:
        type: yaml
        root: .github/workflows

  # ============================================================================
  # LAYER 2 - Depends on Layer 1
  # ============================================================================

  - moniker: books
    name: PDF Books
    description: PDF documentation books for offline reading and distribution
    versioning:
      scheme: CalVer
      changelog: release/books/CHANGELOG.md
    depends_on:
      - docs
      - eac-commands
      - mkdocs-pdf
    components:
      tutorials:
        type: book
      howto:
        type: book
      explanation:
        type: book
      specifications:
        type: book
      repository-report:
        type: book
      markdown:
      workflows:
        type: yaml
        root: .github/workflows

  - moniker: eac-mcp-commands
    name: Go Commands MCP Server
    description: Internal MCP server for Commands
    versioning:
      scheme: SemVer
    depends_on:
      - eac-commands
    components:
      go:
        root: go/eac/mcp/commands
        build:
          artifacts:
            - id: mcp-server
              type: executable
              pattern: "{moniker}{ext}"
      markdown: go/eac/mcp/commands
      workflows:
        type: yaml
        root: .github/workflows

  - moniker: ext-eac
    name: EAC Extension for R2R CLI
    description: Docker-based extension providing EAC (Everything as Code) for R2R CLI integration
    versioning:
      scheme: SemVer
    evidence_books:
      - release-evidence-ext-eac
    depends_on:
      - eac-commands
    depends_on_ci:
      - r2r-cli
    changelog: ../../release/ext-eac/CHANGELOG.md
    components:
      dockerfile:
        root: containers/ext-eac
        build:
          artifacts:
            - id: image
              type: image
              pattern: "{moniker}:latest"
        docker_build:
          container: "{moniker}"
          context: "."
          dockerfile: "containers/{moniker}/Dockerfile"
          platforms:
            - linux/amd64
            - linux/arm64
          tags:
            - "ghcr.io/ready-to-release/{moniker}:ci"
            - "ghcr.io/ready-to-release/{moniker}:sha-{short_sha}"
          push: true
          registry: ghcr.io
          cache:
            type: registry
            from: "ghcr.io/ready-to-release/{moniker}:buildcache"
            to: "ghcr.io/ready-to-release/{moniker}:buildcache"
            mode: max
          sbom: true
          provenance: true
      markdown: containers/ext-eac
      workflows:
        type: yaml
        root: .github/workflows

  - moniker: github
    name: GitHub Configuration
    description: GitHub cross-cutting workflows, shared custom actions, and CI/CD configuration
    depends_on:
      - eac-commands
    components:
      yaml: .github
      markdown: .github

  - moniker: r2r-installer
    name: R2R CLI Installer Scripts
    description: Cross-platform installer scripts for R2R CLI
    versioning:
      scheme: SemVer
    depends_on_ci:
      - r2r-cli
    components:
      pwsh:
        root: scripts/pwsh/cli
      bash:
        root: scripts/sh/cli
      test-impl:
        type: go
        root: go/eac/specs/impl/r2r-installer
      workflows:
        type: yaml
        root: .github/workflows

  - moniker: implicit-r2r-cli
    name: Go Command Invoker Scripts
    description: Cross-shell wrappers with tab completion for Go commands
    versioning:
      scheme: SemVer
    depends_on:
      - eac-commands
    depends_on_ci:
      - r2r-cli
    components:
      pwsh:
        root: scripts/pwsh/go-invoker
        patterns:
          source:
            - "**/*.ps1"
            - "**/*.psm1"
            - "../../../importer.ps1"
      bash:
        root: scripts/sh/go-invoker
        patterns:
          source:
            - "**/*.sh"
            - "../../../importer.sh"
      workflows:
        type: yaml
        root: .github/workflows

  # ============================================================================
  # LAYER 3 - Depends on Layer 2
  # ============================================================================

  - moniker: r2r-eac-bundle
    name: Release Bundle
    description: Aggregated release bundle with links to all module releases
    versioning:
      scheme: CalVer
    depends_on:
      - r2r-cli
      - ext-eac
      - docs
      - books
    evidence_books:
      - release-evidence-r2r-eac-bundle
    release_bundle:
      title_format: "r2r-({r2r_version}) ∞ eac-({eac_version})"
      headline:
        r2r: r2r-cli
        eac: ext-eac
      categories:
        - name: Core Tools
          description: CLI tools and extensions
          modules:
            - r2r-cli
            - ext-eac
        - name: Documentation
          description: Documentation and guides
          modules:
            - docs
            - books
    components:
      markdown: release/r2r-eac-bundle
      workflows:
        type: yaml
        root: .github/workflows
