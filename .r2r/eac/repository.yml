# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/repository.schema.json
#
# Unified Repository Configuration
# Contains repository settings, paths, conventions, and module contracts
#

# Repository settings
repository:
  type: mono
  # Parallelism limits for build and test commands
  # CI uses lower limits to avoid resource contention on shared GitHub Actions runners
  parallelism:
    ci: 4      # Max parallel workers in CI (GitHub Actions)
    devbox: 8  # Max parallel workers in local development

# Path configuration (overrides defaults)
paths:
  test_impl_root: go/eac/specs/impl

# Module Contracts
# Type defaults (files.source, files.tests, files.config) loaded from contract defaults
# Ordered by dependency layer (Layer 0 first, then Layer 1, etc.)
modules:
  # ============================================================================
  # LAYER 0 - Root modules (no dependencies)
  # ============================================================================

  - moniker: repository
    name: Repository Root Module
    type: static
    description: Repository root module including configuration files, build tools, and git settings
    files:
      root: /
      config:
        - LICENSE
        - .gitignore
        - .gitattributes
        - .markdownlint.yml
        - cspell.config.yml
        - go.work
        - go.work.sum
        - test-repository-validations.sh
        - CHANGELOG.md
        - SECURITY.md
        - .r2r/**
        - .vscode/**
        - .claude/**
        - .mcp.json
        - agent.md
        - "**/agent.md"
      ignore:
        - "**/README.md"
        - CHANGELOG.md
        - .claude/**
        - .vscode/**
      repo:
        test_impl: go/eac/specs/impl/repository
        design: ""
        other:
          - scripts/pwsh/claude/*.*
          - scripts/sh/claude/*.*
          - scripts/sh/vscode/*.*
          - .github/workflows/_module-ci.yaml
          - .github/workflows/change-trigger.yaml
          - .github/workflows/release-trigger.yaml
          - .github/workflows/ci-repository.yaml
          - .github/workflows/cron-full-trigger.yaml
          - .github/workflows/codeql.yaml
          - scripts/pwsh/claude/env-setup.ps1
          - scripts/pwsh/local-dev/**
          - scripts/sh/claude/env-setup.sh
          - scripts/sh/vscode/**
          - go/eac/core/testing/testdata/meta-tests/**

  - moniker: eac-core
    name: Core Domain Libraries
    type: go
    description: Core library containing contracts and repository operations
    versioning:
      scheme: SemVer
    flags:
      explicit_ownership: true
    files:
      root: go/eac/core
      source:
        - "**/*.go"
      config:
        - go.mod
        - go.sum
        - contracts/schema/schemas/*.json
      workflows:
        ci: .github/workflows/ci-eac-core.yaml
      repo:
        other:
          - contracts/eac-core/**

  - moniker: release-docs
    name: Release Documentation
    type: static
    description: Release notes and changelogs for published artifacts
    versioning:
      scheme: CalVer
    files:
      root: release
      assets:
        - README.md
        - "**/*.md"
      exclude:
        # Changelogs owned by their respective modules (books has no root, so path is from repo root)
        - books/CHANGELOG.md

  # ============================================================================
  # LAYER 1 - Depends on Layer 0
  # ============================================================================

  - moniker: docs
    name: Documentation Site
    type: container
    description: MkDocs HTML documentation site for GitHub Pages
    versioning:
      scheme: CalVer
    depends_on:
      - repository
    books:
      - site
    files:
      root: docs
      assets:
        - "**/*.md"
        - "**/.nav.yml"
        - assets/**
        - LICENSE
        - reference/**
      ignore:
        - "../release/docs/CHANGELOG.md"
        - ".github/workflows/release-docs.yaml"
      changelog: ../release/docs/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-docs.yaml
        release: .github/workflows/release-docs.yaml
      repo:
        other:
          - mkdocs.yml
          - containers/mkdocs-site/**
          - containers/static-site/**

  - moniker: eac-commands
    name: Go Commands Library
    type: go
    description: Go library containing CLI command implementations
    versioning:
      scheme: SemVer
    depends_on:
      - eac-core
    build:
      artifacts:
        - id: commands
          type: executable
          pattern: "commands{ext}"
    files:
      root: go/eac/commands
      exclude:
        - ext/**
      workflows:
        ci: .github/workflows/ci-eac-commands.yaml
      assets:
        - "README.md"
        - "**/README.md"
        - "testdata/**/*.yml"
      repo:
        other:
          - containers/mermaid-cli/Dockerfile
          - containers/mermaid-cli/*.json
          - containers/pdf-tools/Dockerfile

  - moniker: eac-specs
    name: Test Infrastructure
    type: go
    description: Shared godog test infrastructure (internal utilities only - impl/ owned by respective modules via test_impl)
    depends_on:
      - eac-core
    files:
      root: go/eac/specs
      source:
        - internal/**/*.go
      config:
        - go.mod
        - go.sum
      exclude:
        - impl/**

  - moniker: r2r-cli
    name: The CLI of CLIs
    type: go
    description: The extendable go-based CLI tool
    versioning:
      scheme: SemVer
    evidence_books:
      - release-evidence
    depends_on:
      - eac-core
    build:
      artifacts:
        # Cross-platform executables (r2r-* naming for CLI distribution)
        - id: linux-amd64
          type: executable
          pattern: "r2r-linux-amd64"
        - id: linux-arm64
          type: executable
          pattern: "r2r-linux-arm64"
        - id: darwin-amd64
          type: executable
          pattern: "r2r-darwin-amd64"
        - id: darwin-arm64
          type: executable
          pattern: "r2r-darwin-arm64"
        - id: windows-amd64
          type: executable
          pattern: "r2r-windows-amd64.exe"
        # UPX-compressed variants
        - id: linux-amd64-upx
          type: executable
          pattern: "r2r-linux-amd64-upx"
          compression: upx
          derive_from: "r2r-linux-amd64"
        - id: windows-amd64-upx
          type: executable
          pattern: "r2r-windows-amd64-upx.exe"
          compression: upx
          derive_from: "r2r-windows-amd64.exe"
    files:
      root: go/r2r/cli
      ignore:
        - "../../../release/r2r-cli/CHANGELOG.md"
        - ".github/workflows/release-r2r-cli.yaml"
      changelog: ../../../release/r2r-cli/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-r2r-cli.yaml
        release: .github/workflows/release-r2r-cli.yaml
      repo:
        other:
          - contracts/r2r-cli/**

  - moniker: templates
    name: Project Templates
    type: static
    description: Template files for documentation, specifications, and design records
    depends_on:
      - repository
    files:
      root: templates
      assets:
        - "**/*.json"
        - "**/*.md"
        - "**/*.feature"
        - "**/*.yml"
        - "**/*.go"
      repo:
        other:
          - specs/.risk-controls/**

  - moniker: vscode-ext-commit
    name: VSCode Extension - Git Commit
    type: typescript
    description: VSCode extension providing Git toolbar and Claude MCP integration UI
    versioning:
      scheme: SemVer
    depends_on:
      - repository
    files:
      root: typescript/vscode-ext-commit
      source:
        - "**/*.ts"
      tests:
        - "**/*.test.ts"
      config:
        - package.json
        - package-lock.json
        - tsconfig.json
        - cucumber.js
        - ".mocharc.json"
        - ".vscodeignore"
      assets:
        - README.md
      workflows:
        ci: .github/workflows/ci-vscode-ext-commit.yaml
      repo:
        specs:
          - specs/vscode-ext-commit/**
        other:
          - contracts/vscode-commit/**

  # ============================================================================
  # LAYER 2 - Depends on Layer 1
  # ============================================================================

  - moniker: books
    name: PDF Books
    type: container
    description: PDF documentation books for offline reading and distribution
    versioning:
      scheme: CalVer
    depends_on:
      - docs
      - eac-commands
    books:
      - tutorials
      - howto
      - explanation
      - specifications
      - repository-report
    files:
      ignore:
        - "release/books/CHANGELOG.md"
        - ".github/workflows/release-books.yaml"
      changelog: release/books/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-books.yaml
        release: .github/workflows/release-books.yaml
      repo:
        other:
          - containers/mkdocs-pdf/**

  - moniker: eac-mcp-commands
    name: Go Commands MCP Server
    type: go
    description: Internal MCP server for Commands
    versioning:
      scheme: SemVer
    depends_on:
      - eac-commands
    build:
      artifacts:
        - id: mcp-server
          type: executable
          pattern: "{moniker}{ext}"
    files:
      root: go/eac/mcp/commands
      workflows:
        ci: .github/workflows/ci-eac-mcp-commands.yaml

  - moniker: ext-eac
    name: EAC Extension for R2R CLI
    type: container
    description: Docker-based extension providing EAC (Everything as Code) for R2R CLI integration
    versioning:
      scheme: SemVer
    evidence_books:
      - release-evidence
    depends_on:
      - eac-commands
    depends_on_ci:
      - r2r-cli
    build:
      artifacts:
        - id: image
          type: image
          pattern: "{moniker}:latest"
    docker_build:
      container: "{moniker}"
      context: "."
      dockerfile: "containers/{moniker}/Dockerfile"
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - "ghcr.io/ready-to-release/{moniker}:ci"
        - "ghcr.io/ready-to-release/{moniker}:sha-{short_sha}"
      push: true
      registry: ghcr.io
      cache:
        type: registry
        from: "ghcr.io/ready-to-release/{moniker}:buildcache"
        to: "ghcr.io/ready-to-release/{moniker}:buildcache"
        mode: max
      sbom: true
      provenance: true
    files:
      root: containers/ext-eac
      ignore:
        - "../../release/ext-eac/CHANGELOG.md"
        - ".github/workflows/release-ext-eac.yaml"
      changelog: ../../release/ext-eac/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-ext-eac.yaml
        release: .github/workflows/release-ext-eac.yaml

  - moniker: github
    name: GitHub Configuration
    type: static
    description: GitHub workflows, actions, and CI/CD configuration
    depends_on:
      - eac-commands
    files:
      root: .github
      config:
        - "**/*"
      assets:
        - README.md
      exclude:
        - workflows/*.yaml

  - moniker: r2r-installer
    name: R2R CLI Installer Scripts
    type: static
    description: Cross-platform installer scripts for downloading and installing the R2R CLI from GitHub releases
    versioning:
      scheme: SemVer
    depends_on_ci:
      - r2r-cli
    build:
      handler: scripts
    files:
      root: scripts
      source:
        - "*/cli/**"
      exclude:
        - CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-r2r-installer.yaml
        release: ""
      repo:
        test_impl: go/eac/specs/impl/r2r-installer

  - moniker: implicit-r2r-cli
    name: Go Command Invoker Scripts
    type: static
    description: Cross-shell wrappers with tab completion for running Go commands from go/eac/commands/
    versioning:
      scheme: SemVer
    depends_on:
      - eac-commands
    depends_on_ci:
      - r2r-cli
    build:
      handler: scripts
    files:
      root: scripts
      source:
        - "*/go-invoker/**"
      workflows:
        ci: .github/workflows/ci-implicit-r2r-cli.yaml
        release: ""
      repo:
        other:
          - importer.ps1
          - importer.sh

  # ============================================================================
  # LAYER 3 - Depends on Layer 2
  # ============================================================================

  - moniker: r2r-eac-bundle
    name: Release Bundle
    type: static
    description: Aggregated release bundle with links to all module releases - this becomes the "Latest" GitHub release
    versioning:
      scheme: CalVer
    depends_on:
      - r2r-cli
      - ext-eac
      - docs
      - books
    evidence_books:
      - release-evidence
    release_bundle:
      title_format: "r2r-({r2r_version}) ∞ eac-({eac_version})"
      headline:
        r2r: r2r-cli
        eac: ext-eac
      categories:
        - name: Core Tools
          description: CLI tools and extensions
          modules:
            - r2r-cli
            - ext-eac
        - name: Documentation
          description: Documentation and guides
          modules:
            - docs
            - books
    files:
      root: release/bundle
      ignore:
        - ".github/workflows/release-r2r-eac-bundle.yaml"
      workflows:
        release: .github/workflows/release-r2r-eac-bundle.yaml
