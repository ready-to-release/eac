# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/repository.schema.json
#
# Unified Repository Configuration
# Contains repository settings, paths, conventions, and module contracts
#

# Repository settings
repository:
  type: mono

# Path configuration (overrides defaults)
paths:
  test_impl_root: go/eac/specs/impl

# Module Contracts
# Type defaults (files.source, files.tests, files.config) loaded from contract defaults
modules:
  # ============================================================================
  # R2R Configuration
  # ============================================================================
  - moniker: r2r-config
    name: EAC Repository Configuration
    type: static
    description: Everything as Code configuration including modules, environments, AI prompts, and test suites
    files:
      root: .r2r
      config:
        - r2r-cli.yml
        - "eac/**/*.yml"
        - "eac/**/*.yaml"
      assets:
        - "eac/**/*.md"

  # ============================================================================
  # Claude Code Configuration
  # ============================================================================
  - moniker: claude
    name: Claude Code Configuration
    type: static
    description: Claude Code CLI configuration including agents, hooks, commands, and settings
    files:
      root: .claude
      source:
        - hooks/*.sh
        - hooks/*.ps1
      config:
        - "*.json"
        - "*.md"
        - agents/*.md
        - commands/*.md
        - logs/README.md
      repo:
        other:
          - .mcp.json
          - agent.md
          - "**/agent.md"
          - scripts/pwsh/claude/env-setup.ps1
          - scripts/sh/claude/env-setup.sh

  # ============================================================================
  # Documentation - HTML Site + PDF Books
  # ============================================================================
  - moniker: docs
    name: Documentation
    type: container
    description: MkDocs documentation - HTML site (default) and PDF books (with --all)
    versioning:
      scheme: CalVer
    depends_on:
      - eac-commands
    # Books define what this module builds - artifacts derived automatically
    # First book is default, others require --all flag
    books:
      - site # HTML site (output: site)
      - tutorials
      - howto
      - explanation
    # Container selection is automatic based on book output:
    #   output: site    → containers/mkdocs-site
    #   output: pdf-*   → containers/mkdocs-pdf
    files:
      root: docs
      assets:
        - "**/*.md"
        - "**/.nav.yml"
        - assets/**
        - LICENSE
        - reference/**
      changelog: ../release/docs/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-docs.yaml
        release: .github/workflows/release-docs.yaml
      repo:
        other:
          - mkdocs.yml
          - containers/mkdocs-site/**
          - containers/mkdocs-pdf/**
          - scripts/mkdocs_macros.py

  # ============================================================================
  # EAC Extension
  # ============================================================================
  - moniker: ext-eac
    name: EAC Extension for R2R CLI
    type: container
    description: Docker-based extension providing EAC (Everything as Code) for R2R CLI integration
    versioning:
      scheme: SemVer
    depends_on:
      - eac-commands
    build:
      artifacts:
        - id: image
          type: image
          pattern: "{moniker}:latest"
    docker_build:
      container: "{moniker}"
      context: "."
      dockerfile: "containers/{moniker}/Dockerfile"
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - "ghcr.io/ready-to-release/{moniker}:ci"
        - "ghcr.io/ready-to-release/{moniker}:sha-{short_sha}"
      push: true
      registry: ghcr.io
      cache:
        type: registry
        from: "ghcr.io/ready-to-release/{moniker}:buildcache"
        to: "ghcr.io/ready-to-release/{moniker}:buildcache"
        mode: max
      sbom: true
      provenance: true
    files:
      root: containers/ext-eac
      changelog: ../../release/ext-eac/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-ext-eac.yaml
        release: .github/workflows/release-ext-eac.yaml

  # ============================================================================
  # GitHub Configuration
  # ============================================================================
  - moniker: github
    name: GitHub Configuration
    type: static
    description: GitHub workflows, actions, and CI/CD configuration
    files:
      root: .github
      config:
        - "**/*"
      assets:
        - README.md
      exclude:
        - workflows/*.yaml

  # ============================================================================
  # Scripts: Go Command Invoker
  # ============================================================================
  - moniker: scripts-implicit-cli
    name: Go Command Invoker Scripts
    type: static
    description: Cross-shell wrappers with tab completion for running Go commands from go/eac/commands/
    versioning:
      scheme: SemVer
    depends_on:
      - eac-commands
    build:
      handler: scripts
    files:
      root: scripts
      source:
        - "*/go-invoker/**"
      workflows:
        ci: .github/workflows/ci-scripts-implicit-cli.yaml
        release: ""
      repo:
        other:
          - importer.ps1
          - importer.sh

  # ============================================================================
  # Repository Root
  # ============================================================================
  - moniker: repository
    name: Repository Root Module
    type: static
    description: Repository root module including configuration files, build tools, and git settings
    depends_on:
      - eac-core
      - r2r-config
    books:
      - repository-report # PDF (output: pdf-dark)
      - risk-evidence-package # PDF (output: pdf-dark)
    files:
      root: /
      config:
        - LICENSE
        - .gitignore
        - .gitattributes
        - .markdownlint.yml
        - cspell.config.yml
        - go.work
        - go.work.sum
        - test-repository-validations.sh
        - CHANGELOG.md
      repo:
        test_impl: go/eac/specs/impl/repository
        design: ""
        other:
          - .github/workflows/change-trigger.yaml
          - .github/workflows/cron-full-trigger.yaml
          - .github/workflows/codeql.yaml
          - .github/workflows/trigger-ci.yaml
          - .github/workflows/trigger-release.yaml
          - go/eac/core/testing/testdata/meta-tests/**

  # ============================================================================
  # Source: CLI
  # ============================================================================
  - moniker: r2r-cli
    name: The CLI of CLIs
    type: go
    description: The extendable go-based CLI tool
    versioning:
      scheme: SemVer
    depends_on:
      - eac-core
    build:
      artifacts:
        # Cross-platform executables (r2r-* naming for CLI distribution)
        - id: linux-amd64
          type: executable
          pattern: "r2r-linux-amd64"
        - id: linux-arm64
          type: executable
          pattern: "r2r-linux-arm64"
        - id: darwin-amd64
          type: executable
          pattern: "r2r-darwin-amd64"
        - id: darwin-arm64
          type: executable
          pattern: "r2r-darwin-arm64"
        - id: windows-amd64
          type: executable
          pattern: "r2r-windows-amd64.exe"
        # UPX-compressed variants
        - id: linux-amd64-upx
          type: executable
          pattern: "r2r-linux-amd64-upx"
          compression: upx
          derive_from: "r2r-linux-amd64"
        - id: windows-amd64-upx
          type: executable
          pattern: "r2r-windows-amd64-upx.exe"
          compression: upx
          derive_from: "r2r-windows-amd64.exe"
    files:
      root: go/r2r/cli
      changelog: ../../../release/r2r-cli/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-r2r-cli.yaml
        release: .github/workflows/release-r2r-cli.yaml
      repo:
        other:
          - contracts/r2r-cli/**

  # ============================================================================
  # Scripts: CLI Installer
  # ============================================================================
  - moniker: scripts-cli-installer
    name: R2R CLI Installer Scripts
    type: static
    description: Cross-platform installer scripts for downloading and installing the R2R CLI from GitHub releases
    versioning:
      scheme: SemVer
    depends_on:
      - r2r-cli
    build:
      handler: scripts
    files:
      root: scripts
      source:
        - "*/cli/**"
      exclude:
        - CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-scripts-cli-installer.yaml
        release: ""
      repo:
        test_impl: go/eac/specs/impl/scripts-cli-installer

  # ============================================================================
  # Source: Commands Library
  # ============================================================================
  - moniker: eac-commands
    name: Go Commands Library
    type: go
    description: Go library containing CLI command implementations
    versioning:
      scheme: SemVer
    depends_on:
      - eac-core
    build:
      artifacts:
        - id: commands
          type: executable
          pattern: "commands{ext}"
    files:
      root: go/eac/commands
      exclude:
        - ext/**
      workflows:
        ci: .github/workflows/ci-eac-commands.yaml
      assets:
        - "README.md"
        - "**/README.md"
      repo:
        other:
          - containers/mermaid-cli/Dockerfile
          - containers/mermaid-cli/*.json
          - containers/pdf-tools/Dockerfile

  # ============================================================================
  # Source: Core Domain Libraries
  # ============================================================================
  - moniker: eac-core
    name: Core Domain Libraries
    type: go
    description: Core library containing contracts and repository operations
    versioning:
      scheme: SemVer
    flags:
      explicit_ownership: true
    files:
      root: go/eac/core
      source:
        - "**/*.go"
      config:
        - go.mod
        - go.sum
        - contracts/schema/schemas/*.json
      workflows:
        ci: .github/workflows/ci-eac-core.yaml
      repo:
        other:
          - contracts/eac-core/**

  # ============================================================================
  # Source: Test Infrastructure
  # ============================================================================
  - moniker: eac-specs
    name: Test Infrastructure
    type: go
    description: Shared godog test infrastructure (internal utilities only - impl/ owned by respective modules via test_impl)
    depends_on:
      - eac-core
    files:
      root: go/eac/specs
      source:
        - internal/**/*.go
      config:
        - go.mod
        - go.sum
      exclude:
        - impl/**

  # ============================================================================
  # Source: MCP Commands Server
  # ============================================================================
  - moniker: eac-mcp-commands
    name: Go Commands MCP Server
    type: go
    description: Internal MCP server for Commands
    versioning:
      scheme: SemVer
    depends_on:
      - eac-core
    build:
      artifacts:
        - id: mcp-server
          type: executable
          pattern: "{moniker}{ext}"
    files:
      root: go/eac/mcp/commands
      workflows:
        ci: .github/workflows/ci-eac-mcp-commands.yaml

  # ============================================================================
  # Templates
  # ============================================================================
  - moniker: templates
    name: Project Templates
    type: static
    description: Template files for documentation, specifications, and design records
    files:
      root: templates
      assets:
        - "**/*.json"
        - "**/*.md"
        - "**/*.feature"
        - "**/*.yml"
        - "**/*.go"
      repo:
        other:
          - specs/.risk-controls/**

  # ============================================================================
  # VSCode Configuration
  # ============================================================================
  - moniker: vscode
    name: VSCode Repository Configuration
    type: static
    description: VSCode repository configuration
    files:
      root: .vscode
      exclude:
        - extensions/**
      repo:
        other:
          - scripts/sh/vscode/**

  - moniker: vscode-ext-commit
    name: VSCode Extension - Git Commit
    type: typescript
    description: VSCode extension providing Git toolbar and Claude MCP integration UI
    versioning:
      scheme: SemVer
    files:
      root: typescript/vscode-ext-commit
      workflows:
        ci: .github/workflows/ci-vscode-ext-commit.yaml
      repo:
        other:
          - contracts/vscode-commit/**
          - "typescript/vscode-ext-commit/*"
          - "typescript/vscode-ext-commit/test/*"

  # ============================================================================
  # Release Documentation
  # ============================================================================
  - moniker: release-docs
    name: Release Documentation
    type: static
    description: Release notes and changelogs for published artifacts
    versioning:
      scheme: CalVer
    files:
      root: release
      assets:
        - README.md
        - "**/*.md"
