# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/security-tools.schema.json

# Security Scanning Tool Docker Image Configuration
#
# This file pins Docker image versions for security scanning tools to ensure
# predictable behavior and compliance evidence tied to specific tool versions.
#
# Upgrading versions:
# 1. Check release notes for breaking changes
# 2. Update the tag and description below
# 3. Test with: scan <module> --scanner sbom or scan <module> --scanner vuln
# 4. Commit with explanation of version change

docker_images:
  trivy:
    image: "ghcr.io/aquasecurity/trivy"
    tag: "0.68.2"
    description: "Trivy v0.68.2 - comprehensive vulnerability and misconfiguration scanner"

  semgrep:
    image: "semgrep/semgrep"
    tag: "1.145.1"
    description: "Semgrep v1.145.1 - static application security testing (SAST) tool"

  zap:
    image: "zaproxy/zap-stable"
    tag: "2.14.0"
    description: "OWASP ZAP v2.14.0 - dynamic application security testing (DAST) tool"

# Default scanners to run per module type when no --scanner flag is provided.
# Running `scan <module>` will execute these scanners for the module's type.
# To run specific scanners: `scan <module> --scanner sbom,vuln`
#
# Available scanners: sbom, vuln, secrets, iac, compliance, sast, zap
default_scanners:
  # Standard Go modules - SBOM, vulnerability, and secrets scanning
  go-module:
    - sbom
    - vuln
    - secrets
    - sast

  # Go feature modules (part of larger module)
  go-feature-module:
    - sbom
    - vuln
    - secrets

  # Container modules - add IaC scanning for Dockerfiles
  container:
    - sbom
    - vuln
    - secrets
    - iac

  # Documentation modules - minimal scanning
  docs:
    - secrets

  # Static modules (config files, scripts, documentation) - secrets only
  # These modules contain no code or dependencies to scan for vulnerabilities
  static:
    - secrets

  # Default for any unspecified module type
  default:
    - sbom
    - vuln
    - secrets

# Modules to skip by default when scanning
# Can be overridden with CLI using --skip flag
skip_modules:
  - repository  # Skip repository module (large workspace root scan)
