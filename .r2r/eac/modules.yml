# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/modules.schema.json
#
# Repository Module Contracts
# Type defaults (files.source, files.tests, files.config) loaded from contract defaults
#

# Project-specific path overrides
defaults:
  paths:
    # Override: Go-specific test implementation location
    test_impl_root: "go/eac/specs/impl"

modules:
  # ============================================================================
  # R2R Configuration
  # ============================================================================
  - moniker: r2r-config
    name: EAC Repository Configuration
    type: static
    description: Everything as Code configuration including modules, environments, AI prompts, and test suites
    files:
      root: .r2r
      config:
        - r2r-cli.yml
        - "eac/**/*.yml"
        - "eac/**/*.yaml"
      assets:
        - "eac/**/*.md"

  # ============================================================================
  # Claude Code Configuration
  # ============================================================================
  - moniker: claude
    name: Claude Code Configuration
    type: static
    description: Claude Code CLI configuration including agents, hooks, commands, and settings
    files:
      root: .claude
      source:
        - hooks/*.sh
        - hooks/*.ps1
      config:
        - "*.json"
        - "*.md"
        - agents/*.md
        - commands/*.md
        - logs/README.md
      repo:
        other:
          - .mcp.json
          - agent.md
          - "**/agent.md"
          - scripts/pwsh/claude/env-setup.ps1
          - scripts/sh/claude/env-setup.sh

  # ============================================================================
  # Documentation - GitHub Pages Site
  # ============================================================================
  - moniker: docs
    name: Documentation Site
    type: container
    description: MkDocs documentation site for GitHub Pages (HTML only, no PDF)
    versioning:
      scheme: CalVer
    depends_on:
      - eac-commands
    build:
      handler: mkdocs
      artifacts:
        - id: site
          type: directory
          pattern: "site"
    docker_build:
      container: "mkdocs-site"
      context: "containers/mkdocs-site"
      dockerfile: "containers/mkdocs-site/Dockerfile"
      tags:
        - "cli-mkdocs-site:latest"
      load: true
      cache:
        type: gha
        scope: "mkdocs-site"
    files:
      root: docs
      assets:
        - "**/*.md"
        - assets/**
        - LICENSE
        - reference/**
      changelog: ../release/docs/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-docs.yaml
        release: .github/workflows/release-docs.yaml
      repo:
        other:
          - mkdocs.yml
          - containers/mkdocs-site/**

  # ============================================================================
  # Documentation Books - PDF with Generated Content
  # ============================================================================
  - moniker: books
    name: Documentation Books
    type: container
    description: PDF documentation books with generated reference content from EAC commands
    versioning:
      scheme: CalVer
    depends_on:
      - eac-commands
    build:
      handler: mkdocs
      artifacts:
        - id: pdf
          type: file
          pattern: "*.pdf"
    docker_build:
      container: "mkdocs-pdf"
      context: "containers/mkdocs-pdf"
      dockerfile: "containers/mkdocs-pdf/Dockerfile"
      tags:
        - "cli-mkdocs-pdf:latest"
      load: true
      cache:
        type: gha
        scope: "mkdocs-pdf"
    files:
      root: containers/mkdocs-pdf
      assets:
        - "**/*"
      changelog: ../../release/books/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-books.yaml
        release: .github/workflows/release-books.yaml

  # ============================================================================
  # EAC Extension
  # ============================================================================
  - moniker: ext-eac
    name: EAC Extension for R2R CLI
    type: container
    description: Docker-based extension providing EAC (Everything as Code) for R2R CLI integration
    versioning:
      scheme: SemVer
    depends_on:
      - eac-commands
    build:
      artifacts:
        - id: image
          type: image
          pattern: "{moniker}:latest"
    docker_build:
      container: "{moniker}"
      context: "."
      dockerfile: "containers/{moniker}/Dockerfile"
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - "ghcr.io/ready-to-release/{moniker}:ci"
        - "ghcr.io/ready-to-release/{moniker}:sha-{short_sha}"
      push: true
      registry: ghcr.io
      cache:
        type: registry
        from: "ghcr.io/ready-to-release/{moniker}:buildcache"
        to: "ghcr.io/ready-to-release/{moniker}:buildcache"
        mode: max
      sbom: true
      provenance: true
    files:
      root: containers/ext-eac
      source:
        - Dockerfile
      changelog: ../../release/ext-eac/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-ext-eac.yaml
        release: .github/workflows/release-ext-eac.yaml

  # ============================================================================
  # GitHub Configuration
  # ============================================================================
  - moniker: github
    name: GitHub Configuration
    type: static
    description: GitHub workflows, actions, and CI/CD configuration
    files:
      root: .github
      config:
        - "**/*"
      assets:
        - README.md
      exclude:
        - workflows/*.yaml

  # ============================================================================
  # Scripts: Go Command Invoker
  # ============================================================================
  - moniker: scripts-implicit-cli
    name: Go Command Invoker Scripts
    type: static
    description: Cross-shell wrappers with tab completion for running Go commands from go/eac/commands/
    versioning:
      scheme: SemVer
    depends_on:
      - eac-commands
    build:
      handler: scripts
    files:
      root: scripts
      source:
        - "*/go-invoker/**"
      workflows:
        ci: .github/workflows/ci-scripts-implicit-cli.yaml
        release: ""
      repo:
        specs:
          - "specs/scripts-implicit-cli/**"
        other:
          - importer.ps1
          - importer.sh

  # ============================================================================
  # Repository Root
  # ============================================================================
  - moniker: repository
    name: Repository Root Module
    type: static
    description: Repository root module including configuration files, build tools, and git settings
    depends_on:
      - eac-core
      - r2r-config
    files:
      root: /
      config:
        - LICENSE
        - .gitignore
        - .gitattributes
        - .markdownlint.yml
        - cspell.config.yml
        - go.work
        - go.work.sum
        - test-repository-validations.sh
        - CHANGELOG.md
      repo:
        design: ""
        other:
          - .github/workflows/change-trigger.yaml
          - .github/workflows/cron-full-trigger.yaml
          - .github/workflows/codeql.yaml
          - .github/workflows/trigger-ci.yaml
          - .github/workflows/trigger-release.yaml

  # ============================================================================
  # Source: AI Provider Libraries
  # ============================================================================
  - moniker: eac-ai
    name: AI Provider Libraries
    type: go
    description: AI/LLM provider integrations (Claude, OpenAI, Gemini) for code generation and analysis
    versioning:
      scheme: SemVer
    depends_on:
      - r2r-config
    files:
      root: go/eac/ai
      workflows:
        ci: .github/workflows/ci-eac-ai.yaml
        release: ""

  # ============================================================================
  # Source: CLI
  # ============================================================================
  - moniker: r2r-cli
    name: The CLI of CLIs
    type: go
    description: The extendable go-based CLI tool
    versioning:
      scheme: SemVer
    depends_on:
      - eac-core
    build:
      artifacts:
        # Cross-platform executables
        - id: linux-amd64
          type: executable
          pattern: "{moniker}-linux-amd64"
        - id: linux-arm64
          type: executable
          pattern: "{moniker}-linux-arm64"
        - id: darwin-amd64
          type: executable
          pattern: "{moniker}-darwin-amd64"
        - id: darwin-arm64
          type: executable
          pattern: "{moniker}-darwin-arm64"
        - id: windows-amd64
          type: executable
          pattern: "{moniker}-windows-amd64.exe"
        # UPX-compressed variants
        - id: linux-amd64-upx
          type: executable
          pattern: "{moniker}-linux-amd64-upx"
          compression: upx
          derive_from: "{moniker}-linux-amd64"
        - id: windows-amd64-upx
          type: executable
          pattern: "{moniker}-windows-amd64-upx.exe"
          compression: upx
          derive_from: "{moniker}-windows-amd64.exe"
    files:
      root: go/r2r/cli
      changelog: ../../../release/r2r-cli/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-r2r-cli.yaml
        release: .github/workflows/release-r2r-cli.yaml
      repo:
        other:
          - contracts/r2r-cli/**
    metadata:
      executable-linux-amd64: r2r-linux-amd64
      executable-linux-arm64: r2r-linux-arm64
      executable-darwin-amd64: r2r-darwin-amd64
      executable-darwin-arm64: r2r-darwin-arm64
      executable-windows-amd64: r2r-windows-amd64.exe

  # ============================================================================
  # Scripts: CLI Installer
  # ============================================================================
  - moniker: scripts-cli-installer
    name: R2R CLI Installer Scripts
    type: static
    description: Cross-platform installer scripts for downloading and installing the R2R CLI from GitHub releases
    versioning:
      scheme: SemVer
    depends_on:
      - r2r-cli
    build:
      handler: scripts
    files:
      root: scripts
      source:
        - "*/cli/**"
      exclude:
        - CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-scripts-cli-installer.yaml
        release: ""

  # ============================================================================
  # Source: Commands Library
  # ============================================================================
  - moniker: eac-commands
    name: Go Commands Library
    type: go
    description: Go library containing CLI command implementations
    versioning:
      scheme: SemVer
    depends_on:
      - eac-ai
      - eac-core
    build:
      artifacts:
        - id: commands
          type: executable
          pattern: "commands{ext}"
      options:
        commands_binary: true
    files:
      root: go/eac/commands
      exclude:
        - ext/**
      workflows:
        ci: .github/workflows/ci-eac-commands.yaml
        release: ""
      assets:
        - "README.md"
        - "**/README.md"
      repo:
        other:
          - containers/mermaid-cli/Dockerfile
          - containers/mermaid-cli/*.json

  # ============================================================================
  # Source: Core Domain Libraries
  # ============================================================================
  - moniker: eac-core
    name: Core Domain Libraries
    type: go
    description: Core library containing contracts and repository operations
    versioning:
      scheme: SemVer
    files:
      root: go/eac/core
      config:
        - go.mod
        - go.sum
        - contracts/schema/schemas/*.json
      workflows:
        ci: .github/workflows/ci-eac-core.yaml
        release: ""
      repo:
        other:
          - contracts/eac-core/**
          - go/eac/core/ai/**
          - go/eac/core/markdown/**
          - go/eac/core/module-deps/**
          - go/eac/core/environments/**

  # ============================================================================
  # Source: MCP Commands Server
  # ============================================================================
  - moniker: eac-mcp-commands
    name: Go Commands MCP Server
    type: go
    description: Internal MCP server for Commands
    versioning:
      scheme: SemVer
    depends_on:
      - eac-core
    build:
      artifacts:
        - id: mcp-server
          type: executable
          pattern: "{moniker}{ext}"
    files:
      root: go/eac/mcp/commands
      workflows:
        ci: .github/workflows/ci-eac-mcp-commands.yaml
        release: ""

  # ============================================================================
  # Source: Specs Shared Infrastructure
  # ============================================================================
  - moniker: eac-specs
    name: Specs Shared Infrastructure
    type: go
    description: Shared godog test runner, context, and common steps for BDD specs
    depends_on:
      - eac-core
    build:
      artifacts:
        - id: tests
          type: test
          pattern: "results.json"
    files:
      root: go/eac/specs
      source:
        - "internal/**/*.go"
      exclude:
        - impl/**

  # ============================================================================
  # Templates
  # ============================================================================
  - moniker: templates
    name: Project Templates
    type: static
    description: Template files for documentation, specifications, and design records
    files:
      root: templates
      assets:
        - "**/*.json"
        - "**/*.md"
        - "**/*.feature"
      repo:
        other:
          - specs/.risk-controls/**

  # ============================================================================
  # VSCode Configuration
  # ============================================================================
  - moniker: vscode
    name: VSCode Repository Configuration
    type: static
    description: VSCode repository configuration
    files:
      root: .vscode
      exclude:
        - extensions/**
      repo:
        other:
          - scripts/sh/vscode/**

  - moniker: vscode-ext-commit
    name: VSCode Extension - Git Commit
    type: typescript
    description: VSCode extension providing Git toolbar and Claude MCP integration UI
    versioning:
      scheme: SemVer
    files:
      root: typescript/vscode-ext-commit
      workflows:
        ci: .github/workflows/ci-vscode-ext-commit.yaml
        release: ""
      repo:
        specs:
          - "specs/vscode-ext-commit/**"
        other:
          - contracts/vscode-commit/**
          - "typescript/vscode-ext-commit/*"
          - "typescript/vscode-ext-commit/test/*"

  # ============================================================================
  # Release Documentation
  # ============================================================================
  - moniker: release-docs
    name: Release Documentation
    type: static
    description: Release notes and changelogs for published artifacts
    versioning:
      scheme: CalVer
    files:
      root: release
      assets:
        - README.md
        - "**/*.md"
