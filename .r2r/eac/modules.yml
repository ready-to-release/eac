# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/modules.schema.json
# Repository Module Contracts

# Module-level defaults (inherited by all modules)
defaults:
  paths:
    # Test implementation root directory
    # Used in type defaults as: {test_impl_root}/{moniker}
    test_impl_root: "go/eac/specs/impl"

    # Specs root directory
    # Used in type defaults as: {specs_root}/{moniker}
    specs_root: "specs"

    # Templates directory
    templates: "templates"

    # Output directory structure
    out:
      root: "out"
      build: "out/build"
      test: "out/test"
      logs: "out/logs"
      security: "out/security"
      tools: "out/tools"

  conventions:
    godog_test: "godog_test.go"
    package_json: "package.json"
    changelog: "CHANGELOG.md"

# Module definitions
modules:
  # ============================================================================
  # R2R Configuration
  # ============================================================================
  - moniker: r2r-config
    name: EAC Repository Configuration
    type: r2r-config
    description: Everything as Code configuration including modules, environments, AI prompts, and test suites
    files:
      root: .r2r
      config:
        - r2r-cli.yml
        - "eac/**/*.yml"
        - "eac/**/*.yaml"
      assets:
        - "eac/**/*.md"

  # ============================================================================
  # Claude Code Configuration
  # ============================================================================
  - moniker: claude
    name: Claude Code Configuration
    type: claude-config
    description: Claude Code CLI configuration including agents, hooks, commands, and settings
    files:
      root: .claude
      source:
        - hooks/*.sh
        - hooks/*.ps1
      config:
        - "*.json"
        - "*.md"
        - agents/*.md
        - commands/*.md
        - logs/README.md
      repo:
        other:
          - .mcp.json
          - agent.md
          - "**/agent.md"
          - scripts/pwsh/claude/env-setup.ps1
          - scripts/sh/claude/env-setup.sh

  # ============================================================================
  # Documentation - GitHub Pages Site
  # ============================================================================
  - moniker: docs
    name: Documentation Site
    type: mkdocs-site
    description: MkDocs documentation site for GitHub Pages (HTML only, no PDF)
    versioning:
      scheme: CalVer
    depends_on:
      - eac-commands
    files:
      root: docs
      assets:
        - "**/*.md"
        - assets/**
        - LICENSE
        - reference/**
      changelog: ../release/docs/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-docs.yaml
        release: .github/workflows/release-docs.yml
      repo:
        other:
          - mkdocs.yml
          - .github/workflows/ci-docs.yaml
          - .github/workflows/release-docs.yml
          - containers/mkdocs-site/**

  # ============================================================================
  # Documentation Books - PDF with Generated Content
  # ============================================================================
  - moniker: books
    name: Documentation Books
    type: mkdocs-site
    description: PDF documentation books with generated reference content from EAC commands
    versioning:
      scheme: CalVer
    depends_on:
      - eac-commands
    files:
      root: containers/mkdocs-pdf
      assets:
        - "**/*"  # All files in mkdocs-pdf container
      changelog: ../../release/books/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-books.yaml
        release: .github/workflows/release-books.yaml
      repo:
        other:
          - .github/workflows/ci-books.yaml
          - .github/workflows/release-books.yaml

  # ============================================================================
  # EAC Extension
  # ============================================================================
  - moniker: ext-eac
    name: EAC Extension for R2R CLI
    type: r2r-extension
    description: Docker-based extension providing EAC (Everything as Code) for R2R CLI integration
    versioning:
      scheme: SemVer
    depends_on:
      - eac-commands
    files:
      root: containers/ext-eac
      source:
        - Dockerfile
      changelog: ../../release/ext-eac/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-ext-eac.yaml
        release: .github/workflows/release-ext-eac.yml
      repo:
        other:
          - .github/workflows/ci-ext-eac.yaml
          - .github/workflows/release-ext-eac.yml

  # ============================================================================
  # GitHub Configuration
  # ============================================================================
  - moniker: github
    name: GitHub Configuration
    type: configuration
    description: GitHub workflows, actions, and CI/CD configuration
    files:
      root: .github
      config:
        - "**/*"
      assets:
        - README.md
      exclude:
        - workflows/*.yaml
        - workflows/*.yml

  # ============================================================================
  # Scripts: Go Command Invoker
  # ============================================================================
  - moniker: scripts-implicit-cli
    name: Go Command Invoker Scripts
    type: scripts-package
    description: Cross-shell wrappers with tab completion for running Go commands from go/eac/commands/
    versioning:
      scheme: SemVer
    depends_on:
      - eac-commands
    files:
      root: scripts
      source:
        - "*/go-invoker/**"
      workflows:
        ci: .github/workflows/ci-scripts-implicit-cli.yaml
        release: ""
      repo:
        specs:
          - "specs/scripts-implicit-cli/**"
        other:
          - importer.ps1
          - importer.sh
          - .github/workflows/ci-scripts-implicit-cli.yaml

  # ============================================================================
  # Repository Root
  # ============================================================================
  - moniker: repository
    name: Repository Root Module
    type: repository-root
    description: Repository root module including configuration files, build tools, and git settings
    depends_on:
      - eac-core
      - r2r-config
    files:
      root: /
      config:
        - LICENSE
        - .gitignore
        - .gitattributes
        - .markdownlint.yml
        - cspell.config.yml
        - go.work
        - go.work.sum
        - test-repository-validations.sh
        - CHANGELOG.md
      repo:
        design: ""
        other:
          - .github/workflows/change-trigger.yaml
          - .github/workflows/cron-full-trigger.yaml
          - .github/workflows/codeql.yml
          - .github/workflows/trigger-ci.yaml
          - .github/workflows/trigger-release.yml

  # ============================================================================
  # Source: AI Provider Libraries
  # ============================================================================
  - moniker: eac-ai
    name: AI Provider Libraries
    type: go-library
    description: AI/LLM provider integrations (Claude, OpenAI, Gemini) for code generation and analysis
    versioning:
      scheme: SemVer
    depends_on:
      - r2r-config
    files:
      root: go/eac/ai
      source:
        - "**.go"
      tests:
        - "**/*_test.go"
      workflows:
        ci: .github/workflows/ci-eac-ai.yaml
        release: ""
      repo:
        other:
          - .github/workflows/ci-eac-ai.yaml

  # ============================================================================
  # Source: CLI
  # ============================================================================
  - moniker: r2r-cli
    name: The CLI of CLIs
    type: go-cli
    description: The extendable go-based CLI tool
    versioning:
      scheme: SemVer
    depends_on:
      - eac-core
    files:
      root: go/r2r/cli
      config:
        - go.mod
        - go.sum
      changelog: ../../../release/r2r-cli/CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-r2r-cli.yaml
        release: .github/workflows/release-r2r-cli.yml
      repo:
        other:
          - contracts/r2r-cli/**
          - .github/workflows/ci-r2r-cli.yaml
          - .github/workflows/release-r2r-cli.yml
    metadata:
      exe-linux-amd64: r2r-linux-amd64
      exe-linux-arm64: r2r-linux-arm64
      exe-darwin-amd64: r2r-darwin-amd64
      exe-darwin-arm64: r2r-darwin-arm64
      exe-windows-amd64: r2r-windows-amd64.exe

  # ============================================================================
  # Scripts: CLI Installer
  # ============================================================================
  - moniker: scripts-cli-installer
    name: R2R CLI Installer Scripts
    type: scripts-package
    description: Cross-platform installer scripts for downloading and installing the R2R CLI from GitHub releases
    versioning:
      scheme: SemVer
    depends_on:
      - eac-core
    files:
      root: scripts
      source:
        - "*/cli/**"
      exclude:
        - CHANGELOG.md
      workflows:
        ci: .github/workflows/ci-scripts-cli-installer.yaml
        release: ""
      repo:
        other:
          - .github/workflows/ci-scripts-cli-installer.yaml

  # ============================================================================
  # Source: Commands Library
  # ============================================================================
  - moniker: eac-commands
    name: Go Commands Library
    type: go-commands
    description: Go library containing CLI command implementations
    versioning:
      scheme: SemVer
    depends_on:
      - eac-ai
      - eac-core
    files:
      root: go/eac/commands
      config:
        - go.mod
        - go.sum
      exclude:
        - ext/**
      workflows:
        ci: .github/workflows/ci-eac-commands.yaml
        release: ""
      assets:
        - "README.md"
        - "**/README.md"
      repo:
        other:
          - .github/workflows/ci-eac-commands.yaml

  # ============================================================================
  # Source: Core Domain Libraries
  # ============================================================================
  - moniker: eac-core
    name: Core Domain Libraries
    type: go-library
    description: Core library containing contracts and repository operations
    versioning:
      scheme: SemVer
    files:
      root: go/eac/core
      config:
        - go.mod
        - go.sum
        - contracts/schema/schemas/*.json
      workflows:
        ci: .github/workflows/ci-eac-core.yaml
        release: ""
      repo:
        other:
          - contracts/eac-core/**
          - go/eac/core/ai/**
          - go/eac/core/markdown/**
          - go/eac/core/module-deps/**
          - go/eac/core/environments/**
          - .github/workflows/ci-eac-core.yaml

  # ============================================================================
  # Source: MCP Commands Server
  # ============================================================================
  - moniker: eac-mcp-commands
    name: Go Commands MCP Server
    type: go-mcp
    description: Internal MCP server for Commands
    versioning:
      scheme: SemVer
    depends_on:
      - eac-core
    files:
      root: go/eac/mcp/commands
      workflows:
        ci: .github/workflows/ci-eac-mcp-commands.yaml
        release: ""
      repo:
        other:
          - .github/workflows/ci-eac-mcp-commands.yaml

  # ============================================================================
  # Source: Specs Shared Infrastructure
  # ============================================================================
  - moniker: eac-specs
    name: Specs Shared Infrastructure
    type: go-tests
    description: Shared godog test runner, context, and common steps for BDD specs
    depends_on:
      - eac-core
    files:
      root: go/eac/specs
      source:
        - "internal/**/*.go"
      exclude:
        - impl/**

  # ============================================================================
  # Templates
  # ============================================================================
  - moniker: templates
    name: Project Templates
    type: templates
    description: Template files for documentation, specifications, and design records
    files:
      root: templates
      assets:
        - "**/*.json"
        - "**/*.md"
        - "**/*.feature"
      repo:
        other:
          - specs/.risk-controls/**

  # ============================================================================
  # VSCode Configuration
  # ============================================================================
  - moniker: vscode
    name: VSCode Repository Configuration
    type: vscode-config
    description: VSCode repository configuration
    files:
      root: .vscode
      exclude:
        - extensions/**
      repo:
        other:
          - scripts/sh/vscode/**

  - moniker: vscode-ext-commit
    name: VSCode Extension - Git Commit
    type: vscode-ext
    description: VSCode extension providing Git toolbar and Claude MCP integration UI
    versioning:
      scheme: SemVer
    files:
      root: typescript/vscode-ext-commit
      source:
        - "src/**/*.ts"
      tests:
        - "test/**/*.ts"
        - "features/**/*.ts"
      workflows:
        ci: .github/workflows/ci-vscode-ext-commit.yaml
        release: ""
      repo:
        specs:
          - "specs/vscode-ext-commit/**"
        other:
          - contracts/vscode-commit/**
          - "typescript/vscode-ext-commit/*"
          - "typescript/vscode-ext-commit/test/*"
          - .github/workflows/ci-vscode-ext-commit.yaml

  # ============================================================================
  # Release Documentation
  # ============================================================================
  - moniker: release-docs
    name: Release Documentation
    type: documentation
    description: Release notes and changelogs for published artifacts
    versioning:
      scheme: CalVer
    files:
      root: release
      assets:
        - README.md
        - "**/*.md"
