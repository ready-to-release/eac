# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/ai-config.schema.json
version: "0.1.0"
name: "AI Configuration"
description: "Configuration for AI-assisted generation - AI generates structured output, commands handle formatting"

defaults: {}

types:
  # Supported formats: json, gherkin, oscal-catalog, oscal-profile, structurizr, plaintext

  commit-message:
    name: "Commit Message Format"
    description: "Conventional commit message generation"
    output_format: json        # AI generates JSON, command formats to conventional commit text
    retry_strategy:
      type: "escalating"
      max_attempts: 3

  squash-message:
    name: "Squash Commit Message"
    description: "PR squash commit message generation"
    output_format: json        # AI generates JSON, command formats to squash commit text
    retry_strategy:
      type: "escalating"
      max_attempts: 3

  design:
    name: "Structurizr DSL Architecture"
    description: "C4 architecture diagram generation"
    output_format: structurizr # AI generates Structurizr DSL directly
    retry_strategy:
      type: "standard"
      max_attempts: 3

  specs:
    name: "Gherkin Specifications"
    description: "BDD feature file generation"
    output_format: gherkin     # AI generates Gherkin directly
    retry_strategy:
      type: "focused"
      focus_categories:
        - semantic
        - structure
      max_attempts: 4

  risk-profile:
    name: "OSCAL Risk Profile"
    description: "Security control mapping from risk assessment"
    output_format: json        # AI generates control mapping JSON, command formats to OSCAL profile
    retry_strategy:
      type: "standard"
      max_attempts: 3

