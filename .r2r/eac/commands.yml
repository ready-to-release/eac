$schema: ../../contracts/eac-core/0.1.0/commands.schema.json

# Default settings for command documentation mapping
defaults:
  docs_base: docs/reference/eac/commands

# Allowed command categories (verbs)
# - Commands starting with these words map to: {category}/{subcommand}.md
# - Single-word commands matching a category map to: {category}/{category}.md
categories:
  build:
    description: Build modules and their dependencies
  create:
    description: Generate new artifacts using AI or templates
  drawio:
    description: Edit DrawIO diagram files embedded in PNG images
  get:
    description: Retrieve data in structured format (YAML/JSON output)
  help:
    description: Display help information
  init:
    description: Initialize EAC project configuration
  pipeline:
    description: CI/CD orchestration, dispatching, and diagnostics
  release:
    description: Version management, changelog, and tagging operations
  scan:
    description: Security scanning, SBOM generation, and compliance
  serve:
    description: Start local development servers
  show:
    description: Display data in human-readable format (tables, summaries)
  templates:
    description: Project template installation and management
  test:
    description: Execute test suites and view results
  update:
    description: Modify or regenerate existing artifacts
  validate:
    description: Check correctness against contracts and schemas
  work:
    description: Git worktree and workspace management

# Per-command explicit overrides
# Maps commands that don't fit the standard category pattern
overrides:
  "extension-meta":
    path: docs/reference/eac/commands/extension-meta.md
  "template command":
    path: docs/reference/eac/commands/templates/template-command.md
