# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/books.schema.json
# Book Definitions
# Books aggregate static content with dynamically-generated content from EAC commands
# Books are referenced by modules via the `books:` field in modules.yml

books:
  # ==============================================================================
  # GitHub Pages Site (HTML)
  # ==============================================================================
  - name: site
    title: "Everything-as-Code Documentation"
    description: "GitHub Pages documentation site with module overview"
    output: site
    site_url: "https://ready-to-release.github.io/eac/"
    default: true

    sources:
      # Static content from docs/
      - type: copy
        from: "docs/**/*.md"
        to: "./"

      - type: copy
        from: "docs/**/.nav.yml"
        to: "./"

      - type: copy
        from: "docs/assets/**"
        to: "assets/"

      # Inline generated content at markers
      - type: inline
        target: "index.md"
        inserts:
          - marker: "modules-overview"
            command: "show modules"

  # ==============================================================================
  # Repository Report PDF
  # ==============================================================================
  - name: repository-report
    title: "Repository Structure Report"
    description: "Complete repository structure report with all generated content"
    output: pdf-dark
    site_url: "https://ready-to-release.github.io/eac/"

    sources:
      # Assets for PDF rendering (required for stylesheets)
      - type: copy
        from: "docs/assets/**"
        to: "assets/"

      # All show commands for complete repository documentation
      - type: command
        command: "show modules"
        target: "modules.md"
        frontmatter:
          title: "Repository Modules"
          description: "Complete inventory of all modules in the repository"
        order: 1

      - type: command
        command: "show dependencies"
        target: "dependencies.md"
        frontmatter:
          title: "Module Dependencies"
          description: "Dependency relationships between modules"
        order: 2

      - type: command
        command: "show moduletypes"
        target: "module-types.md"
        frontmatter:
          title: "Module Types"
          description: "Available module type definitions"
        order: 3

      - type: command
        command: "show files"
        target: "files.md"
        frontmatter:
          title: "File Ownership"
          description: "Repository files with module ownership"
        order: 4

      - type: command
        command: "show environments"
        target: "environments.md"
        frontmatter:
          title: "Environments"
          description: "Environment contract definitions"
        order: 5

      - type: command
        command: "show tests"
        target: "tests.md"
        frontmatter:
          title: "Test Suites"
          description: "All test suites in the repository"
        order: 6

  # ==============================================================================
  # Explanation PDF
  # ==============================================================================
  - name: explanation
    title: "Continuous Delivery Practices & Everything-as-Code"
    description: "Conceptual documentation - Everything as Code, CD practices, and methodology"
    output: pdf-dark
    site_url: "https://ready-to-release.github.io/eac/"

    sources:
      # Explanation content (conceptual docs)
      - type: copy
        from: "docs/explanation/**/*.md"
        to: "./"

      - type: copy
        from: "docs/explanation/**/.nav.yml"
        to: "./"

      # Assets for PDF rendering
      - type: copy
        from: "docs/assets/**"
        to: "assets/"

  # ==============================================================================
  # Risk Evidence Package - comprehensive audit evidence bundle
  # ==============================================================================
  - name: risk-evidence-package
    title: "Risk Assessment Evidence Package"
    description: "Comprehensive risk assessment evidence package with all supporting artifacts"
    output: pdf-dark

    sources:
      # Assets for PDF rendering (required for stylesheets)
      - type: copy
        from: "docs/assets/**"
        to: "assets/"

      # ==========================================================================
      # 00 - Risk Assessment Report
      # ==========================================================================
      - type: copy
        from: "out/risk/**/risk-assessment-*.md"
        to: "00-risk-assessment/"

      # ==========================================================================
      # 01 - OSCAL Evidence
      # ==========================================================================
      - type: copy
        from: "specs/.risk-controls/risk-profile.json"
        to: "01-oscal-evidence/risk-profile.json"

      - type: copy
        from: "out/risk/**/assessment-results.json"
        to: "01-oscal-evidence/"

      # ==========================================================================
      # 02 - Test Evidence
      # ==========================================================================
      - type: copy
        from: "out/test/acceptance/**/*.json"
        to: "02-test-evidence/acceptance/"

      - type: copy
        from: "out/test/commit/**/*.json"
        to: "02-test-evidence/commit/"

      - type: command
        command: "show tests"
        target: "02-test-evidence/test-suite-summary.md"
        frontmatter:
          title: "Test Suite Summary"
          description: "Overview of all test suites and their status"
        order: 1

      # ==========================================================================
      # 03 - Security Evidence
      # ==========================================================================
      - type: copy
        from: "out/security/**/*.json"
        to: "03-security-evidence/"

      # ==========================================================================
      # 04 - Specifications
      # ==========================================================================
      - type: copy
        from: "specs/**/*.feature"
        to: "04-specifications/"

      # ==========================================================================
      # 05 - Module Contracts
      # ==========================================================================
      - type: command
        command: "show modules"
        target: "05-module-contracts/modules.md"
        frontmatter:
          title: "Module Contracts"
          description: "All module contracts in the repository"
        order: 1

      - type: command
        command: "show dependencies"
        target: "05-module-contracts/dependencies.md"
        frontmatter:
          title: "Module Dependencies"
          description: "Dependency relationships between modules"
        order: 2
