# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/module-types.schema.json
#
# Project-specific module type overrides
# Base types (go, container, typescript, static) are loaded from contract defaults
#
types:
  # TypeScript - add project-specific build behavior
  - name: typescript
    test_framework: mocha
    bdd_framework: tscucumber
    build:
      post_build:
        - action: copy
          target: ".vscode/extensions/{moniker}/out/"
          include: ["**/*.js", "**/*.js.map"]
        - action: copy
          target: ".vscode/extensions/{moniker}/"
          include: ["package.json"]
