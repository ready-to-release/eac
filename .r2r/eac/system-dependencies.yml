# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/system-dependencies.schema.json
#
# Project-specific system dependency overrides
# Base dependencies (go, git, docker, npm, gh-cli, curl) loaded from contract defaults
#
dependencies:
  # Override: pin to specific Go version for this project
  - moniker: go
    version: "1.24.4"

  # Override: require Node.js 20+
  - moniker: npm
    version: "20.0"

  # Project-specific: Azure CLI for cloud deployments
  - moniker: az-cli
    name: "Azure CLI"
    description: "Azure command-line interface"
    version: "2.50"
    verify:
      command: "az --version"
      pattern: "azure-cli\\s+(\\d+\\.\\d+)"

  # Project-specific: UPX for binary compression
  - moniker: upx
    name: "UPX"
    description: "Ultimate Packer for eXecutables - binary compression tool"
    version: "3.96"
    verify:
      command: "upx --version"
      pattern: "UPX (\\d+\\.\\d+)"

  # Project-specific: golangci-lint for Go linting
  - moniker: golangci-lint
    name: "golangci-lint"
    description: "Fast Go linters runner"
    version: "2.0"
    verify:
      command: "golangci-lint version --short"
      pattern: "^(\\d+\\.\\d+)"

  # Project-specific: markdownlint-cli2 for markdown linting
  # Same engine as VSCode markdownlint extension for consistency
  # Config: .markdownlint.yml (rules), .markdownlint-cli2.yaml (ignores)
  - moniker: markdownlint-cli2
    name: "markdownlint-cli2"
    description: "Markdown linter CLI2 (same engine as VSCode extension)"
    version: "any"
    verify:
      command: "npm list -g markdownlint-cli2 --depth=0"
      pattern: "markdownlint-cli2@(\\d+\\.\\d+)"

  # Project-specific: prettier for markdown table formatting
  # Formats tables to aligned style (MD060 compliance)
  # Config: .prettierrc
  - moniker: prettier
    name: "Prettier"
    description: "Code formatter for markdown table alignment"
    version: "any"
    verify:
      command: "npm list -g prettier --depth=0"
      pattern: "prettier@(\\d+\\.\\d+)"

# Capability to system dependency mappings (project overrides)
capability_requirements:
  markdown: [markdownlint-cli2]
