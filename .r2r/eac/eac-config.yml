# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/eac-config.schema.json

# EAC Configuration (Team/Shared)
# Generated by: eac init command
# SAFE TO COMMIT: Contains environment variable placeholders
#
# This file is committed and shared across the team.
# Used by eac CLI, CI/CD, and production workflows.
#
# For local development with Claude CLI (no API costs):
# - Run: .\importer.ps1
# - This creates: .r2r/eac/eac-config.personal.yml (gitignored)
# - Personal config takes precedence over this team config

ai:
  provider: claude-api
  model: claude-3-haiku-20240307
  endpoint: https://api.anthropic.com/v1
  api_key: ${ANTHROPIC_API_KEY}  # Loaded from personal config or env var

git:
  token: ${GIT_TOKEN}  # Loaded from personal config or env var
