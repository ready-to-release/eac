# yaml-language-server: $schema=../../contracts/eac-core/0.1.0/eac-config.schema.json

# Team AI Configuration (Base Settings)
# Generated by: init command
# SAFE TO COMMIT: Contains only base configuration, no secrets
#
# This file defines the default provider settings for the team.
# API key comes from:
#   1. Personal config (.r2r/eac/eac-config.personal.yml) - gitignored
#   2. Environment variable: ANTHROPIC_API_KEY
#
# Personal config can override any setting (model, provider, endpoint)
provider:
  name: claude-api
  model: claude-3-haiku-20240307
  endpoint: https://api.anthropic.com/v1
  # api_key loaded from personal config or ${ANTHROPIC_API_KEY} env var

git:
  token: ${GIT_TOKEN}  # Loaded from personal config or env var
