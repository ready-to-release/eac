version: "0.1.0"
name: "Risk Assessment Anti-Corruption Rules"

rules:
  noise_patterns:
    - pattern: "\\*\\*Initialized"
      description: "Agent initialization messages"

    - pattern: "I'll help|I'll create|I'll analyze"
      description: "Agent response preamble"

    - pattern: "```markdown"
      description: "Markdown code fences"

    - pattern: "```"
      description: "Generic code fences"

  content_start_marker: "# Risk Assessment Report"

  preserve_structure:
    - "##"
    - "###"
    - "- "
    - "**"
    - "|"
