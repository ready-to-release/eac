# Version: 0.2.0

moniker: src-cli
name: The CLI of CLIs
type: go-cli
description: The extendable go-based cli tool

parent: "."
depends_on:
  - src-core

files:
  root: src/cli
  source:
    - "**.go"
  config:
    - go.mod
    - go.sum
    - r2r-cli.examples.yml
    - r2r.example.yml
    - r2r-example.yml
  assets: []
  tests: []
  exclude: []
  changelog: CHANGELOG.md
  repo:
    specs:
      - specs/src-cli/**
    other:
      - .github/workflows/ci-src-cli.yaml
      - .github/workflows/release-src-cli.yml
    exclude: []

flags:
  catch_all: false
  own_children_files: false
