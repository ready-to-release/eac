# MkDocs Fallback Config (bundled in container image)
# Used when a repository does not provide its own mkdocs.yml.
# For EAC builds, the source of truth is docs/mkdocs.yml.

site_name: Documentation
site_description: Generated documentation site
site_url: ""
docs_dir: /workspace/docs

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: light blue
  features:
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - macros:
      on_error_fail: true
  - awesome-nav

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

dev_addr: '0.0.0.0:8000'
