# MkDocs PDF Template
# This template is used for generating PDF documentation
# Dynamic values are injected by the Go build layer:
#   - site_name, site_url, docs_dir, extra_css are set at build time
#   - extra_css is set based on theme (pdf-dark or pdf-light)
#   - pdf.concurrency is set based on environment (CI: 4, devbox: 8)

site_name: Documentation
site_description: Generated PDF documentation
site_url: ""
docs_dir: staging
use_directory_urls: false

theme:
  name: material
  custom_dir: /opt/mkdocs-overrides  # Theme override for mkdocs-exporter compatibility (absolute path in container)
  palette:
    - scheme: slate
      primary: indigo
      accent: light blue

plugins:
  - search
  - awesome-nav
  # Mermaid rendering is handled by Go preprocessing (Step 9b)
  # Diagrams are pre-rendered to SVG with caching, then replaced with img tags
  # This approach is faster (caching) and doesn't require a plugin
  # - mermaid-to-svg:
  #     output_dir: assets/rendered/mermaid
  #     theme: dark
  #     cleanup_generated_images: false
  #     puppeteer_config: /docs/containers/mkdocs-pdf/puppeteer-config.json
  #     mermaid_config:
  #       htmlLabels: false
  #       flowchart:
  #         htmlLabels: false
  #       class:
  #         htmlLabels: false
  # PDF export plugin - Playwright-based
  - exporter:
      formats:
        pdf:
          enabled: true
          # Concurrency: 6 pages parallel (uses ~2.4GB per instance)
          concurrency: 6
          # Custom stylesheet for PDF - injected at build time based on theme
          stylesheets:
            - assets/templates/pdf-dark/styles.css
          # Browser settings for Playwright
          browser:
            timeout: 60000   # 60s - fail fast on hung pages
            headless: true
            debug: false
            pool_size: 6    # Match concurrency
            args:
              - "--disable-background-timer-throttling"
              - "--disable-backgrounding-occluded-windows"
              - "--disable-renderer-backgrounding"
          # Generate combined PDF output with parallel merge
          aggregator:
            enabled: true
            output: pdf/combined.pdf
            covers: limits  # Reduce cover overhead (was: all)
            merge_batch_size: 75   # 300/75 = 4 batches
            merge_workers: 4       # Match CPU budget per instance

markdown_extensions:
  - footnotes
  - attr_list
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: false  # Disabled for PDF compatibility
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          # For PDF, mermaid-to-svg handles rendering, so just pass through
          format: !!python/name:pymdownx.superfences.fence_div_format

# PDF-specific CSS - injected at build time based on theme
extra_css:
  - assets/templates/pdf-dark/styles.css

# Validation settings
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
