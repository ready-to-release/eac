server {
    listen 8000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Development mode: disable all caching so background rebuilds are served fresh
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;

    # Serve static files with directory listing fallback (for PDF directories)
    location / {
        try_files $uri $uri/ =404;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # PDF files - serve with correct mime type and inline display
    location ~* \.pdf$ {
        add_header Content-Type application/pdf always;
        add_header Content-Disposition inline always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/pdf;
    gzip_min_length 1000;

    # Ensure nginx doesn't cache file metadata (serves fresh content on rebuild)
    open_file_cache off;
    sendfile off;
}
